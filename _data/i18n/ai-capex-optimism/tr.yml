title: "Piyasa, Çin teknoloji şirketlerinin AI harcamalarından neden gereksiz yere korkuyor"
description: "Alibaba ve Tencent AI'a milyarlarca dolar akıtıyor ve serbest nakit akışları negatife döndü. Piyasa onları cezalandırıyor. Bence piyasa, bu şirketlerin gerçekten sahip olduklarını ve AI pazarının ne hale gelebileceğini gözden kaçırıyor."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  Çin internet şirketlerinin hisseleri bir süredir kötü görünüyor. Önce yemek teslimatında fiyat savaşı başladı. Ardından piyasa, bu şirketlerin AI'a ne kadar harcadığından endişelenmeye başladı; öyle ki en kârlı olanları bile serbest nakit akışlarının artıdan eksiye döndüğünü gördü.

  Piyasa fazla mı karamsar?

  Harcama gerçek. AI'ı sıfırdan kurmak, önce onu taşıyan fiziksel katmanı inşa etmek anlamına gelir: veri merkezleri, çipler, elektrik, soğutma. Talep arzın önünde koşuyor, bu yüzden inşaat maliyetleri artmaya devam ediyor. Bu şirketlerin yatırım planları yüzlerce milyar yuan ile ölçülüyor. Tek başına Alibaba, önümüzdeki üç yılda 380 milyar yuan'dan (yaklaşık 53 milyar dolar) fazla yatırım yapmayı taahhüt etti; bu, önceki on yılda bulut ve AI altyapısına harcadığından daha fazla.

  Ama bu düzeyde bir harcama sonsuza dek sürmez. Her inşaat patlamasının bir sonu vardır. Arz talebi yakalar, tesisler tamamlanır ve yıllık harcama bakım ile sınırlı yenilemeye düşer. Yüzlerce milyar yuanlık rakam bir aşamadır, kalıcı bir gider kalemi değil.

  Ancak bir koşul var. Bu sav yalnızca tesisler yıllarca kullanılabilirse geçerli. AI donanımı iki yılda bir eskirse, bugünün veri merkezi amortismanı bekleyen bir varlıktan başka bir şey değildir ve söylediklerimin hiçbiri geçerli olmaz. Bunu doğrulayamam, bu yüzden soruyu açık bırakıyorum.

  Peki şirketler paralarının karşılığında ne alıyor?

  Uzun vadeli getiriyi yargılamaya cesaret edemem. Belki bu hesaplama gücü çok kârlı bir işe dönüşür, belki dönüşmez. Kısa vadeli getiri ise şimdiden görülüyor: AI ile bağlantılı bulut hizmetleri şu anda gelir getiriyor.

  Bu gelir hiç sayılmasa bile donanım orada duruyor. Veri merkezlerinde gerçek, fiziksel varlıklara dönüştü; yok olup giden para değil. Bu tür ekipmanların fiyatları düşmedi, aksine yükseldi. Bu şirketler satmak zorunda kalsalar, yatırdıkları parayı geri almak imkânsız değil. Fiyatın korunup korunmayacağını ise açıkçası bilmiyorum. Yarın değişebilir.

  Harcama gürültüsü arasında eski iş sessize kaldı.

  Bu şirketler büyümenin tavanına çarptı, kötü bir iş modeline değil. WeChat hâlâ WeChat. İnsanlar oyun oynamaya devam ediyor. Bir ağın kullanıcısı arttıkça, yeni gelenlerin onu yakalaması zorlaşır; bu Çin'de de her yerde olduğu gibi geçerli.

  Alibaba'dan Joe Tsai, ana e-ticaret işinin yılda yaklaşık 25 milyar dolar serbest nakit akışı ürettiğini (yaklaşık 180 milyar yuan) ve AI yatırımının bununla finanse edildiğini söyledi. Tencent'tan Martin Lau aynı şeyi farklı sözcüklerle dile getirdi: istikrarlı ana işler, AI'a yatırım yapmaya devam etme güvenini veriyor. Böyle bir işin bugünkü değerlemeyi hak edeceğini düşünüyorum.

  AI onlar için ne ifade ediyor? Yeni bir pazar. Eski iş para kazanmaya devam ediyor ve üstünde yeni bir pazar açılıyor. Piyasa harcama sütununa bakıp büyümekte olan kısmı kaçırıyor.

  O pazarın sonunda ne kadar büyüyeceğini söyleyemem. Bu sorunun yanıtı muhtemelen birkaç yıl sonra ortaya çıkacak.
