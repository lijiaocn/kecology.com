title: "中国テック企業のAI投資を、市場はなぜ警戒しすぎているのか"
description: "アリババとテンセントはAIに巨額を投じ、フリーキャッシュフローはマイナスに転落した。市場は両社を売り浴びせている。だが市場は、これらの企業が本当に持っているものと、AI市場が成長しうる姿を見落としている。"
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  中国のネット株が売り込まれている。きっかけはフードデリバリーの価格競争だった。次に市場が警戒し始めたのは、各社のAI投資の規模だ。その額はあまりに大きく、最も儲かっている企業でさえ、フリーキャッシュフローがプラスからマイナスに転じた。

  市場は過剰反応しているのだろうか。

  投資は本物だ。ゼロからAIを構築するには、その下支えとなる物理的な基盤——データセンター、チップ、電力、冷却設備——を先に作る必要がある。需要が供給を先行するので、建設コストは上がり続けている。各社が発表する設備投資計画は、数千億元単位だ。アリババ一社でさえ、今後3年間に3800億元（約530億ドル）以上を投じると約束した。これは過去10年間にクラウドとAIインフラに投じた額の合計を上回る。

  だが、この水準の投資が永遠に続くわけではない。建設ラッシュには必ず終わりが来る。供給が需要に追いつき、設備が完成すれば、翌年以降の支出は保守と限定的な更新に落ち着く。千億元という数字は一時的な段階であり、恒久的な費用項目ではない。

  ただし、前提がある。この議論が成り立つのは、設備が何年も使える場合だけだ。AI用ハードウェアが1、2年で陳腐化するなら、今日のデータセンターは減損を待つ資産にすぎず、これまでの話はすべて崩れる。その点は私には確認できない。だから留保しておく。

  では、企業はこの支出と引き換えに何を得るのか。

  長期的な見返りは判断できない。この計算能力が大きな利益を生む事業に育つかどうかは、わからない。だが短期的な見返りは、すでに目に見えている。AI関連のクラウドサービスは、今まさに収益を生んでいる。

  その収益をゼロと見なしても、ハードウェアは残っている。それは消えた金ではなく、データセンター内の実体ある資産になった。こうした機器の価格は下がっておらず、むしろ上昇している。もし売却する日が来ても、元の投資を回収できないとは限らない。ただ、その価格が続くかどうかは本当にわからない。明日には変わるかもしれない。

  支出の話ばかりが騒がれる中、元々の事業は誰も語らなくなった。

  これらの企業は成長の天井に突き当たっただけであって、ビジネスモデルが壊れたわけではない。WeChatは相変わらずWeChatだ。人々はゲームを続けている。ネットワークの利用者が増えるほど、新参者が追いつくのが難しくなる——この法則は中国でも変わらない。

  アリババのジョー・ツァイ（蔡崇信）は、中核のEC事業が年間約250億ドル（約1800億元）のフリーキャッシュフローを生み、それがAI投資の原資だと語った。テンセントのマーティン・ラウ（劉熾平）も、同じことを別の言い方で述べている。安定した本業があるからこそ、AIへの投資を続けられるのだと。そのような事業は、今の時価総額に見合うと私は考える。

  AIにとって、これら企業は何を得るのか。新しい市場だ。既存の事業は稼ぎ続け、その上に新しい市場が開こうとしている。市場は支出の欄ばかりに目を奪われ、成長している部分を見落としている。

  その市場が最終的にどれだけ大きくなるかは、私にはわからない。答えが出るには、まだ数年かかりそうだ。
