title: "Mengapa Pasar Salah Khawatir soal Belanja AI Perusahaan Teknologi China"
description: "Alibaba dan Tencent menuangkan miliaran dolar ke AI, dan arus kas bebas mereka berubah negatif. Pasar menghukum mereka. Saya rasa pasar melewatkan apa yang sebenarnya dimiliki perusahaan-perusahaan ini — dan seperti apa pasar AI kelak."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  Saham perusahaan internet China sedang buruk belakangan ini. Awalnya karena perang harga pengiriman makanan. Lalu pasar mulai khawatir soal seberapa besar mereka mengeluarkan uang untuk AI — sampai-sampai perusahaan yang paling menguntungkan pun melihat arus kas bebasnya berubah dari positif ke negatif.

  Apakah pasar terlalu pesimistis?

  Pengeluarannya nyata. Membangun AI dari nol berarti membangun dulu lapisan fisik di bawahnya: pusat data, chip, listrik, pendinginan. Permintaan mendahului pasokan, sehingga biaya konstruksi terus naik. Rencana belanja modal perusahaan-perusahaan ini diukur dalam ratusan miliar yuan. Alibaba saja berjanji menanamkan lebih dari 380 miliar yuan (sekitar 53 miliar dolar) dalam tiga tahun, lebih besar daripada yang ia keluarkan untuk infrastruktur cloud dan AI dalam dekade sebelumnya.

  Tetapi tingkat pengeluaran seperti ini tidak akan bertahan selamanya. Setiap gelombang konstruksi punya akhir. Pasokan mengejar permintaan, fasilitas selesai dibangun, dan pengeluaran tahunan turun menjadi pemeliharaan serta penambahan terbatas. Angka ratusan miliar itu adalah sebuah fase, bukan pos biaya permanen.

  Ada satu syarat. Argumen ini hanya berlaku kalau fasilitasnya benar-benar bisa dipakai bertahun-tahun. Kalau perangkat AI usang dalam dua tahun, pusat data hari ini hanyalah aset yang menunggu untuk dihapusbukukan, dan semua yang saya katakan jadi tidak berlaku. Saya tidak bisa memastikan hal ini, jadi saya biarkan terbuka.

  Lalu, apa yang perusahaan dapat sebagai ganti uang itu?

  Hasil jangka panjangnya saya tidak berani menilai. Mungkin daya komputasi ini tumbuh menjadi bisnis yang sangat menguntungkan, mungkin tidak. Hasil jangka pendeknya sudah terlihat: layanan cloud yang terkait AI sudah menghasilkan pendapatan sekarang.

  Dan sekalipun pendapatan itu tidak dihitung, perangkatnya tetap ada. Ia telah berubah menjadi aset fisik nyata di dalam pusat data, bukan uang yang menguap. Harga perangkat seperti ini tidak turun, malah cenderung naik. Kalau suatu hari perusahaan menjualnya, mendapatkan kembali modal awal bukan hal yang mustahil. Apakah harga itu akan bertahan, saya sungguh tidak tahu. Bisa berubah besok.

  Di tengah gaduh soal pengeluaran, bisnis lama jadi tidak banyak dibicarakan.

  Perusahaan-perusahaan ini baru saja menyentuh batas pertumbuhan, bukan mengalami model bisnis yang rusak. WeChat tetap WeChat. Orang tetap bermain game. Makin banyak pengguna sebuah jaringan, makin sulit pendatang baru mengejarnya — itu berlaku di China seperti di tempat lain.

  Joe Tsai dari Alibaba pernah mengatakan bahwa bisnis e-commerce intinya menghasilkan sekitar 25 miliar dolar arus kas bebas per tahun (kurang lebih 180 miliar yuan), dan dari situlah biaya pembangunan AI dibiayai. Martin Lau dari Tencent mengatakan hal yang sama dengan kata berbeda: bisnis inti yang stabil yang memberi mereka keyakinan untuk terus berinvestasi dalam AI. Bisnis seperti itu, menurut saya, mampu menopang valuasi saat ini.

  Bagi mereka, AI berarti apa? Pasar baru. Bisnis lama tetap menghasilkan uang, dan di atasnya sebuah pasar baru sedang terbuka. Pasar memandang kolom pengeluaran dan melewatkan bagian yang sedang tumbuh.

  Seberapa besar pasar itu nantinya, saya tidak bisa mengatakan. Pertanyaan itu barangkali butuh beberapa tahun lagi sampai ada jawabannya.
