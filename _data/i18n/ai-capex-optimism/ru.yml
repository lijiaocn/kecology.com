title: "Почему рынок неправ, паникуя из-за расходов китайских технокомпаний на ИИ"
description: "Alibaba и Tencent вливают миллиарды в ИИ, и их свободный денежный поток ушёл в минус. Рынок наказывает их за это. Я думаю, он упускает из виду то, что эти компании действительно имеют — и чем может стать рынок ИИ."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  Акции китайских интернет-компаний последнее время выглядят плохо. Сначала сказалась ценовая война в доставке еды. Потом рынок начал беспокоиться о том, сколько эти компании тратят на ИИ — настолько много, что даже самые прибыльные увидели, как их свободный денежный поток ушёл из плюса в минус.

  Не слишком ли рынок пессимистичен?

  Расходы реальны. Строить ИИ с нуля — значит сначала возвести физический фундамент под ним: дата-центры, чипы, электричество, охлаждение. Спрос опережает предложение, поэтому стоимость строительства продолжает расти. Планы капитальных вложений этих компаний измеряются сотнями миллиардов юаней. Одна только Alibaba пообещала вложить более 380 миллиардов юаней (около 53 миллиардов долларов) за три года — больше, чем она потратила на облачную инфраструктуру и ИИ за предыдущее десятилетие.

  Но такой уровень расходов не будет вечным. Любой строительный бум заканчивается. Предложение догоняет спрос, объекты достраиваются, и ежегодные траты сводятся к обслуживанию и ограниченному обновлению. Цифра в сотни миллиардов — это этап, а не постоянная статья расходов.

  Правда, есть одно условие. Этот довод работает только если объекты будут служить годами. Если оборудование для ИИ устаревает каждые два года, то сегодняшний дата-центр — это актив, ожидающий списания, и всё сказанное выше перестаёт действовать. Я не могу это проверить, поэтому оставляю вопрос открытым.

  Что же компании получают за свои деньги?

  Долгосрочную отдачу я не берусь оценить. Возможно, эти вычислительные мощности вырастут в очень прибыльный бизнес, а может и нет. Ближайшая отдача уже видна: облачные сервисы, связанные с ИИ, уже сейчас приносят выручку.

  И даже если бы этой выручки не было, оборудование остаётся. Оно превратилось в реальные физические активы в дата-центрах, а не в деньги, которые просто исчезли. Цены на такое оборудование не падали, скорее наоборот, росли. Если бы этим компаниям пришлось продать его, вернуть вложенные средства было бы вполне возможно. Сохранится ли эта цена — честно говоря, не знаю. Завтра она может измениться.

  Шум вокруг расходов заглушил разговор о прежнем бизнесе.

  Эти компании упёрлись в потолок роста, а не в плохую бизнес-модель. WeChat остаётся WeChat. Люди продолжают играть. Чем больше пользователей у сети, тем сложнее новичку её догнать — это верно в Китае так же, как и где бы то ни было.

  Джо Цай из Alibaba говорил, что основной бизнес электронной коммерции даёт около 25 миллиардов долларов свободного денежного потока в год (примерно 180 миллиардов юаней), и именно на эти деньги ведётся строительство ИИ. Мартин Лау из Tencent сказал то же самое другими словами: стабильный основной бизнес даёт им уверенность продолжать инвестировать в ИИ. Такой бизнес способен поддержать нынешнюю оценку, думаю я.

  Что ИИ значит для них? Новый рынок. Прежний бизнес продолжает зарабатывать, а поверх него открывается новый рынок. Рынок смотрит на графу расходов и не замечает того, что растёт.

  Насколько большим станет этот рынок, я сказать не могу. На этот вопрос, вероятно, ответ появится лишь через несколько лет.
