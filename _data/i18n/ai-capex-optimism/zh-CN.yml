title: "市场不该为中国科技公司的 AI 支出恐慌"
description: "阿里和腾讯正把大把钱投进 AI，自由现金流由正转负，股价随之下跌。我觉得市场的恐慌忽略了这些公司真正拥有的东西，以及 AI 市场可能长成的样子。"
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  中国互联网公司的股价最近很难看。先是外卖大战，接着市场开始担心它们在 AI 上的投入太大，大到连最赚钱的公司，自由现金流都由正转负。

  市场是不是反应过度了？

  投入是实打实的。从零搭建 AI，意味着要把底下那一层实体先建起来：数据中心、芯片、电力、散热。需求跑在供给前面，建设成本一路上涨。这些公司抛出来的资本开支计划，都是以千亿为单位。光阿里一家，就承诺三年投入超过 3800 亿元（约合 530 亿美元），比它过去十年在云和 AI 基础设施上的投入加起来还多。

  但这样强度的开支不会一直持续。任何建设热潮都有尽头。供给追上需求，设施建完，之后每年的花费就降成维护和有限的更新。千亿这个数字是一个阶段，不是一条永久的支出线。

  不过这里有个前提。这套说法要成立，得是这些设施真能用上好几年。要是 AI 硬件隔一两年就淘汰，那今天的数据中心就等于等着减记的资产，前面说的就全不算数。这件事我没法证实，只能先搁在那儿。

  那钱花出去，换回了什么？

  长期的回报我判断不了。也许这批算力会长成一个利润丰厚的业务，也许不会。眼前的回报已经看得见：跟 AI 相关的云服务，现在就在往回收钱。

  就算这点收入不算数，硬件也还在那儿。它变成了数据中心里实实在在的资产，不是凭空蒸发掉的钱。这类设备的价格这些年没见跌，反倒还在往上走。真到要出手的时候，把投进去的钱收回来，未必做不到。当然这价格能撑多久，我确实不知道，可能明天就变。

  在一片关于支出的噪音里，原来那摊生意反倒没人提了。

  这些公司是撞上了增长的天花板，不是商业模式坏了。微信还是那个微信，游戏该玩的人还在玩。用的人越多，后来者越难追，这条规律在中国跟在别处一样成立。

  阿里的蔡崇信说过，核心电商业务每年产生约 250 亿美元自由现金流（约合 1800 亿元人民币），AI 的钱就是这么来的。腾讯的刘炽平也表达过类似的意思：核心业务稳，才有底气持续投 AI。这样的生意，我认为撑得起现在的市值。

  那 AI 对它们意味着什么？一个新市场。原来那摊生意还在赚钱，这之上又打开了一个新市场。市场盯着支出那一栏看，把正在长的那块给漏掉了。

  这个市场最后能长多大，我说不清楚。这个问题，可能得几年以后回头看才有答案。
