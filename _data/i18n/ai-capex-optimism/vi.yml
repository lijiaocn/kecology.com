title: "Vì sao thị trường lo lắng thái quá về chi phí AI của các công ty công nghệ Trung Quốc"
description: "Alibaba và Tencent đang đổ hàng tỷ USD vào AI và dòng tiền tự do đã chuyển sang âm. Thị trường đang bán tháo cổ phiếu của họ. Tôi nghĩ thị trường đã bỏ qua những gì các công ty này thực sự có — và việc thị trường AI có thể trở thành gì."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  Cổ phiếu các công ty internet Trung Quốc đang diễn biến tệ hơn gần đây. Ban đầu là cuộc chiến giá trong giao đồ ăn. Sau đó thị trường bắt đầu lo ngại về mức độ chi tiêu cho AI của các công ty này — lớn đến mức ngay cả những công ty có lợi nhuận nhất cũng thấy dòng tiền tự do chuyển từ dương sang âm.

  Thị trường có đang quá bi quan?

  Khoản chi là có thật. Xây AI từ con số không có nghĩa là trước tiên phải dựng lên lớp hạ tầng vật lý bên dưới: trung tâm dữ liệu, chip, điện, làm mát. Cầu đi trước cung, nên chi phí xây dựng cứ tăng. Kế hoạch đầu tư của các công ty này được tính bằng hàng trăm tỷ nhân dân tệ. Riêng Alibaba đã cam kết đầu tư hơn 380 tỷ nhân dân tệ (khoảng 53 tỷ USD) trong ba năm, nhiều hơn tổng số tiền công ty này đã chi cho hạ tầng điện toán đám mây và AI trong thập kỷ trước.

  Nhưng mức chi tiêu này sẽ không kéo dài mãi. Mọi đợt xây dựng bùng nổ đều có điểm dừng. Cung đuổi kịp cầu, các cơ sở hoàn thành, và chi phí hằng năm giảm còn bảo trì cùng những lần nâng cấp giới hạn. Con số hàng trăm tỷ là một giai đoạn, không phải một khoản mục chi phí vĩnh viễn.

  Tuy nhiên có một điều kiện. Lập luận này chỉ đúng nếu các cơ sở thực sự dùng được nhiều năm. Nếu phần cứng AI lỗi thời sau mỗi hai năm, trung tâm dữ liệu hôm nay chỉ là một tài sản chờ được khấu hao, và mọi điều tôi vừa nói đều không còn đúng. Tôi không thể kiểm chứng điều đó, nên cứ để ngỏ câu hỏi.

  Vậy các công ty nhận được gì đổi lại số tiền đã bỏ ra?

  Tôi không dám đánh giá lợi nhuận dài hạn. Có thể sức mạnh tính toán này sẽ lớn thành một mảng kinh doanh rất lời, có thể không. Phần lợi nhuận trước mắt thì đã thấy rồi: các dịch vụ đám mây liên quan đến AI đang tạo doanh thu ngay bây giờ.

  Và dù không tính khoản doanh thu đó, phần cứng vẫn còn đó. Nó đã trở thành tài sản vật lý thực sự trong các trung tâm dữ liệu, không phải tiền bốc hơi. Giá của loại thiết bị này không giảm, mà có chiều tăng. Nếu các công ty phải bán, việc thu lại vốn ban đầu không phải là điều không tưởng. Còn giá đó có giữ được không thì thật lòng tôi không biết. Nó có thể thay đổi ngay ngày mai.

  Giữa tiếng ồn về chi tiêu, mảng kinh doanh cũ lại bị bỏ quên.

  Các công ty này chỉ mới chạm trần tăng trưởng, chứ mô hình kinh doanh không hư hỏng. WeChat vẫn là WeChat. Mọi người vẫn chơi game. Mạng lưới càng nhiều người dùng, người mới càng khó đuổi kịp — điều đó đúng ở Trung Quốc cũng như ở bất cứ nơi nào.

  Joe Tsai của Alibaba từng nói rằng mảng thương mại điện tử cốt lõi tạo ra khoảng 25 tỷ USD dòng tiền tự do mỗi năm (khoảng 180 tỷ nhân dân tệ), và chính số tiền này đang tài trợ cho việc xây dựng AI. Martin Lau của Tencent cũng nói cùng một điều bằng cách khác: chính mảng kinh doanh cốt lõi ổn định cho họ sự tự tin tiếp tục đầu tư vào AI. Một mảng kinh doanh như vậy, tôi nghĩ, đủ sức nâng đỡ mức định giá hiện tại.

  AI có nghĩa là gì với họ? Một thị trường mới. Mảng kinh doanh cũ vẫn kiếm tiền, và trên đó một thị trường mới đang mở ra. Thị trường thì cứ nhìn vào cột chi tiêu và bỏ lỡ phần đang lớn lên.

  Thị trường đó cuối cùng sẽ lớn đến đâu, tôi không nói được. Câu hỏi đó có lẽ cần vài năm nữa mới có câu trả lời.
