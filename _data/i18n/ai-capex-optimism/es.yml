title: "Por qué el mercado se equivoca al temer el gasto en IA de la tecnología china"
description: "Alibaba y Tencent están volcando miles de millones en IA y su flujo de caja libre se ha vuelto negativo. El mercado las está castigando. Creo que pasa por alto lo que estas empresas poseen de verdad y lo que podría llegar a ser el mercado de la IA."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  Las acciones de las empresas de internet chinas llevan tiempo cayendo. Primero fue la guerra de precios en el reparto de comida. Después, el mercado empezó a preocuparse por cuánto están gastando en IA, tanto que incluso las más rentables han visto cómo su flujo de caja libre pasaba de positivo a negativo.

  ¿Está exagerando el mercado?

  El gasto es real. Construir IA desde cero significa levantar primero la capa física que la sostiene: centros de datos, chips, electricidad, refrigeración. La demanda va por delante de la oferta, así que los costes de construcción siguen subiendo. Los planes de inversión de estas compañías se miden en cientos de miles de millones de yuanes. Solo Alibaba se ha comprometido a invertir más de 380.000 millones de yuanes (unos 53.000 millones de dólares) en tres años, más que lo que gastó en infraestructura de nube e IA en la década anterior.

  Pero este nivel de gasto no durará para siempre. Todo auge de la construcción llega a su fin. La oferta alcanza a la demanda, las instalaciones se terminan y el gasto anual se reduce al mantenimiento y a ampliaciones limitadas. La cifra de cientos de miles de millones es una fase, no una partida permanente.

  Aunque hay una condición. Este argumento solo se sostiene si las instalaciones siguen siendo útiles durante años. Si el hardware de IA queda obsoleto cada dos años, el centro de datos de hoy es un activo esperando a ser amortizado, y nada de lo que he dicho antes funciona. No puedo verificarlo, así que lo dejo abierto.

  Entonces, ¿qué reciben las empresas a cambio del dinero?

  El beneficio a largo plazo no sé juzgarlo. Quizá esta capacidad de cómputo se convierta en un negocio muy rentable, quizá no. El beneficio a corto plazo ya se ve: los servicios en la nube ligados a la IA están generando ingresos ahora mismo.

  Y aunque esos ingresos no contaran, el hardware sigue ahí. Se ha convertido en activos reales y físicos dentro de los centros de datos, no en dinero que se esfumó. Los precios de este tipo de equipos no han bajado; más bien han subido. Si estas empresas tuvieran que vender, recuperar la inversión inicial no sería impensable. Si ese precio se mantendrá, la verdad es que no lo sé. Puede cambiar mañana.

  En medio del ruido sobre el gasto, el negocio de siempre ha quedado en silencio.

  Estas empresas han topado con el techo del crecimiento, no con un modelo de negocio roto. WeChat sigue siendo WeChat. La gente sigue jugando. Cuantos más usuarios tiene una red, más difícil es para un recién llegado alcanzarla: eso es cierto en China y en cualquier otro lugar.

  Joe Tsai, de Alibaba, ha dicho que el negocio principal de comercio electrónico genera unos 25.000 millones de dólares de flujo de caja libre al año (unos 180.000 millones de yuanes), y que con eso se financia el despliegue de IA. Martin Lau, de Tencent, ha dicho lo mismo con otras palabras: unos negocios básicos estables son los que les dan confianza para seguir invirtiendo en IA. Un negocio así puede sostener la valoración actual, creo yo.

  ¿Qué significa la IA para ellas? Un mercado nuevo. El negocio de siempre sigue ganando dinero y, encima, se abre un mercado nuevo. El mercado mira la columna del gasto y pasa por alto lo que está creciendo.

  Cuánto llegue a crecer ese mercado, no lo sé. Esa pregunta probablemente necesite unos años para tener respuesta.
