title: "Pourquoi le marché a tort de paniquer face aux dépenses IA des entreprises technologiques chinoises"
description: "Alibaba et Tencent injectent des milliards dans l'IA et leur flux de trésorerie disponible est passé dans le rouge. Le marché les sanctionne. J'ai l'impression qu'il passe à côté de ce que ces entreprises possèdent vraiment — et de ce que le marché de l'IA pourrait devenir."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  Les valeurs internet chinoises sont malmenées depuis quelque temps. Ça a commencé par une guerre des prix dans la livraison de repas. Puis le marché s'est inquiété de l'ampleur de leurs dépenses en IA, au point que même les entreprises les plus rentables ont vu leur flux de trésorerie disponible passer du positif au négatif.

  Le marché exagère-t-il ?

  Les dépenses sont bien réelles. Construire une IA à partir de zéro suppose de bâtir d'abord la couche physique qui la porte : centres de données, puces, électricité, refroidissement. La demande devance l'offre, donc les coûts de construction ne cessent d'augmenter. Les plans d'investissement de ces sociétés se mesurent en centaines de milliards de yuans. Alibaba seule s'est engagée à investir plus de 380 milliards de yuans (environ 53 milliards de dollars) sur trois ans, soit plus que ce qu'elle a consacré aux infrastructures cloud et IA au cours de la décennie précédente.

  Mais un tel niveau de dépenses ne durera pas éternellement. Toute phase de construction touche à sa fin. L'offre rattrape la demande, les installations sont achevées, et les dépenses annuelles retombent à l'entretien et à des extensions limitées. Le chiffre de centaines de milliards est une étape, pas une ligne de coût permanente.

  Il y a toutefois une réserve. Ce raisonnement ne tient que si les installations restent utilisables pendant des années. Si le matériel IA devient obsolète en deux ans, le centre de données d'aujourd'hui n'est qu'un actif en attente de dépréciation, et rien de ce que je viens de dire ne tient. Je ne peux pas le vérifier, alors je laisse la question ouverte.

  Alors, qu'est-ce que les entreprises reçoivent en échange de cet argent ?

  Le rendement à long terme, je ne me hasarde pas à le juger. Peut-être que cette puissance de calcul deviendra une activité très profitable, peut-être pas. Le rendement à court terme, lui, est déjà visible : les services cloud liés à l'IA génèrent des revenus dès maintenant.

  Et même si ces revenus ne comptaient pas, le matériel est toujours là. Il s'est transformé en actifs physiques réels dans les centres de données, et non en argent évaporé. Les prix de ce type d'équipements n'ont pas baissé, ils ont plutôt augmenté. Si ces entreprises devaient vendre, récupérer leur mise de départ ne serait pas impensable. Que ce prix tienne, je l'ignore sincèrement. Il peut changer demain.

  Dans tout ce bruit autour des dépenses, l'activité d'origine est passée sous silence.

  Ces entreprises ont atteint un plafond de croissance, et non un modèle économique cassé. WeChat reste WeChat. Les gens continuent de jouer. Plus un réseau compte d'utilisateurs, plus il est difficile pour un nouvel arrivant de le rattraper — c'est vrai en Chine comme ailleurs.

  Joe Tsai, d'Alibaba, a dit que l'activité principale de e-commerce dégage environ 25 milliards de dollars de flux de trésorerie disponible par an (quelque 180 milliards de yuans), et que c'est avec cela que le déploiement de l'IA est financé. Martin Lau, de Tencent, a dit la même chose autrement : ce sont des activités de base stables qui leur donnent la confiance d'investir dans l'IA. Une telle activité peut justifier la valorisation actuelle, me semble-t-il.

  Que représente l'IA pour elles ? Un marché nouveau. L'activité d'origine continue de rapporter, et par-dessus s'ouvre un marché nouveau. Le marché fixe la colonne des dépenses et passe à côté de ce qui est en train de grandir.

  Jusqu'où ce marché peut-il aller ? Je ne saurais le dire. Il faudra probablement quelques années avant d'avoir une réponse.
