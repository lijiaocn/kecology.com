title: "시장은 중국 기술 기업의 AI 투자를 왜 이렇게 걱정하는가"
description: "알리바바와 텐센트가 AI에 막대한 돈을 쏟아붓고 있고, 잉여현금흐름은 적자로 돌아섰다. 시장은 이들 기업을 팔아치우고 있다. 하지만 시장은 이 기업들이 실제로 가진 것과, AI 시장이 어떻게 자랄 수 있는지를 놓치고 있다."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  중국 인터넷 기업들의 주가가 최근 좋지 않다. 처음에는 음식 배달 가격 전쟁이 원인이었다. 그러다 시장은 이 기업들이 AI에 쓰는 돈이 너무 많다는 걱정을 하기 시작했다. 가장 수익성이 좋은 기업조차 잉여현금흐름이 흑자에서 적자로 돌아섰을 정도다.

  시장이 지나치게 비관적인 것일까.

  지출은 실제다. AI를 처음부터 구축한다는 건 그 아래 물리적 기반—데이터센터, 칩, 전력, 냉각 시설—을 먼저 만들어야 한다는 뜻이다. 수요가 공급을 앞서가므로 건설 비용은 계속 오른다. 이 기업들이 내놓는 설비투자 계획은 수천 위안 단위로 측정된다. 알리바바 한 곳만 해도 향후 3년간 3800억 위안(약 530억 달러) 이상을 투입하겠다고 약속했다. 지난 10년간 클라우드와 AI 인프라에 쓴 돈을 모두 합친 것보다 많은 액수다.

  하지만 이 정도의 지출이 계속되지는 않는다. 건설 붐에는 언제나 끝이 온다. 공급이 수요를 따라잡고 시설이 지어지면, 이후 연간 지출은 유지 보수와 제한적인 업그레이드로 줄어든다. 수천억 위안이라는 숫자는 하나의 단계이지, 영구적인 비용 항목이 아니다.

  다만 전제가 있다. 이 논리가 성립하려면 시설이 몇 년은 쓸 수 있어야 한다. AI 하드웨어가 1, 2년 만에 구식이 된다면, 오늘의 데이터센터는 상각을 기다리는 자산일 뿐이고 앞선 이야기는 모두 무너진다. 나는 이걸 확인할 방법이 없다. 그러니 열어두기로 한다.

  그럼 이 돈으로 기업은 무엇을 얻는가.

  장기적인 보상은 판단할 수 없다. 이 컴퓨팅 성능이 큰 수익을 내는 사업으로 자랄지, 아닐지 모른다. 하지만 단기적인 보상은 이미 보인다. AI 관련 클라우드 서비스가 지금 돈을 벌어들이고 있다.

  그 수익을 아무것도 아니로 쳐도, 하드웨어는 그대로 남아 있다. 사라진 돈이 아니라 데이터센터 안의 실제 자산이 된 것이다. 이런 장비들의 가격은 떨어지지 않았고, 오히려 올라갔다. 매각하는 날이 오더라도 원래 투자한 돈을 회수하지 못하리라는 법은 없다. 다만 그 가격이 유지될지에 대해서는 정말 모르겠다. 내일은 바뀔 수도 있다.

  지출 이야기만 시끄러운 가운데, 원래 사업은 아무도 언급하지 않는다.

  이 기업들은 성장의 천장에 닿았을 뿐, 비즈니스 모델이 망가진 게 아니다. 위챗은 여전히 위챗이고, 사람들은 계속 게임을 한다. 네트워크를 쓰는 사람이 많을수록 후발 주자가 따라잡기 어려워진다. 이 법칙은 중국에서나 통하는 게 아니다.

  알리바바의 조 차이(Joe Tsai, 채숭신)는 핵심 전자상거래 사업이 매년 약 250억 달러(약 1800억 위안)의 잉여현금흐름을 내고, 그것이 AI 투자 재원이라고 말했다. 텐센트의 마틴 라우(Martin Lau, 유치평)도 다른 말로 같은 뜻을 전했다. 안정적인 본업이 있기에 AI 투자를 계속할 수 있다고. 그런 사업은 지금의 시가총액을 뒷받침한다고 나는 본다.

  AI는 이 기업들에 무엇을 의미하는가. 새로운 시장이다. 기존 사업은 계속 벌어들이고, 그 위에 새로운 시장이 열리고 있다. 시장은 지출 칸만 들여다보고 자라고 있는 부분을 놓치고 있다.

  그 시장이 최종적으로 얼마나 커질지는 말할 수 없다. 그 질문에 대한 답은 몇 년이 지나야 나올 것 같다.
