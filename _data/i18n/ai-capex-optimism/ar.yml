title: "لماذا يخطئ السوق في قلقه من إنفاق شركات التكنولوجيا الصينية على الذكاء الاصطناعي"
description: "تضخّ علي بابا وتنسنت مليارات الدولارات في الذكاء الاصطناعي، وتحولّ تدفّقها النقدي الحر إلى السالب. السوق يعاقبهما على ذلك. أعتقد أنه يغفل ما تملكه هذه الشركات فعلاً — وما قد يصبح عليه سوق الذكاء الاصطناعي."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  تبدو أسهم شركات الإنترنت الصينية سيئة منذ بعض الوقت. بدأ الأمر بحرب أسعار في توصيل الطعام. ثم بدأ السوق يقلق من حجم ما تنفقه هذه الشركات على الذكاء الاصطناعي، لدرجة أن حتى أكثرها ربحية رأت تدفّقها النقدي الحر يتحول من الموجب إلى السالب.

  هل السوق مفرط في التشاؤم؟

  الإنفاق حقيقي. بناء الذكاء الاصطناعي من الصفر يعني أولاً إقامة الطبقة المادية التي تحمله: مراكز البيانات، الرقائق، الكهرباء، التبريد. الطلب يتقدم على العرض، لذلك تستمر تكاليف البناء في الارتفاع. خطط الاستثمار لدى هذه الشركات تُقاس بمئات المليارات من اليوانات. علي بابا وحدها التزمت باستثمار أكثر من 380 مليار يوان (نحو 53 مليار دولار) على ثلاث سنوات، أي أكثر مما أنفقته على بنية الحوسبة السحابية والذكاء الاصطناعي في العقد السابق بأكمله.

  لكن هذا المستوى من الإنفاق لن يدوم إلى الأبد. لكل طفرة بناء نهاية. يلحق العرض بالطلب، وتُنجز المنشآت، وينخفض الإنفاق السنوي إلى الصيانة والتوسّع المحدود. رقم مئات المليارات هو مرحلة، وليس بنداً دائماً في الميزانية.

  مع ذلك، ثمة تحفّظ. هذا الاستدلال لا يصح إلا إذا بقيت المنشآت صالحة للاستخدام لسنوات. وإذا تقادمت عتاديات الذكاء الاصطناعي كل عامين، فإن مركز البيانات اليوم ليس سوى أصل ينتظر الإهلاك، ولا شيء مما قلته يعمل. لا أستطيع التحقق من ذلك، لذا أترك المسألة مفتوحة.

  إذن، ماذا تحصل عليه الشركات مقابل أموالها؟

  العائد طويل الأجل لا أجرؤ على الحكم عليه. ربما تنمو هذه القدرة الحوسبية إلى نشاط مربح جداً، وربما لا. أما العائد القريب فمرئي بالفعل: خدمات الحوسبة السحابية المرتبطة بالذكاء الاصطناعي تجني الإيرادات الآن.

  وحتى لو لم تُحسب هذه الإيرادات، فإن العتاد يبقى موجوداً. لقد تحوّل إلى أصول مادية حقيقية داخل مراكز البيانات، لا إلى أموال تلاشت. أسعار هذا النوع من المعدات لم تنخفض، بل كادت ترتفع. وإذا اضطرت هذه الشركات إلى البيع، فإن استرداد الاستثمار الأصلي ليس مستحيلاً. أما ما إذا كان السعر سيصمد، فأنا صراحةً لا أعرف. قد يتغير غداً.

  وسط كل هذا الصخب حول الإنفاق، صمت الحديث عن النشاط الأصلي.

  هذه الشركات بلغت سقف النمو، لا أن نموذج أعمالها قد فسد. وي تشات لا يزال وي تشات. والناس ما زالوا يلعبون. وكلما زاد مستخدمو الشبكة، زادت صعوبة اللحاق بها على الوافد الجديد — وهذا صحيح في الصين كما في أي مكان آخر.

  قال جو تساي من علي بابا إن نشاط التجارة الإلكترونية الأساسي يولّد نحو 25 مليار دولار من التدفق النقدي الحر سنوياً (نحو 180 مليار يوان)، وإن هذا هو ما يموّل التوسّع في الذكاء الاصطناعي. وقال مارتن لاو من تنسنت الشيء نفسه بكلمات أخرى: الأعمال الأساسية المستقرة هي التي تمنحهما الثقة لمواصلة الاستثمار في الذكاء الاصطناعي. مثل هذا النشاط، أعتقد، قادر على دعم التقييم الحالي.

  ماذا يعني الذكاء الاصطناعي لهما؟ سوقاً جديدة. النشاط الأصلي يواصل الربح، وفوقه تنفتح سوق جديدة. السوق يحدّق في خانة الإنفاق ويفتقد ما هو آخذ في النمو.

  وإلى أي مدى تكبر هذه السوق، لا أستطيع القول. على الأرجح يحتاج الجواب إلى بضع سنوات.
