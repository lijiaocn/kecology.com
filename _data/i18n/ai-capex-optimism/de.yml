title: "Warum der Markt die KI-Ausgaben chinesischer Tech-Konzerne falsch einschätzt"
description: "Alibaba und Tencent stecken Milliarden in KI, ihr freier Cashflow ist ins Negative gedreht. Der Markt bestraft sie dafür. Ich glaube, er übersieht, was diese Unternehmen tatsächlich besitzen — und was der KI-Markt werden könnte."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  Die Aktien chinesischer Internetkonzerne sehen seit einiger Zeit schlecht aus. Den Anfang machte ein Preiskrieg bei der Essenslieferung. Danach begann der Markt sich zu sorgen, wie viel diese Firmen in KI ausgeben — so viel, dass selbst die profitabelsten ihren freien Cashflow von positiv auf negativ drehen sahen.

  Überreagiert der Markt?

  Die Ausgaben sind echt. KI von Grund auf aufzubauen heißt, zuerst die physische Schicht darunter zu errichten: Rechenzentren, Chips, Strom, Kühlung. Die Nachfrage läuft der Versorgung voraus, deshalb steigen die Baukosten weiter. Die Investitionspläne dieser Firmen werden in hunderten Milliarden Yuan gemessen. Allein Alibaba hat zugesagt, in drei Jahren mehr als 380 Milliarden Yuan (rund 53 Milliarden Dollar) zu investieren — mehr als es in der gesamten vorangegangenen Dekade für Cloud- und KI-Infrastruktur ausgegeben hat.

  Aber dieses Ausgabenniveau wird nicht ewig anhalten. Jeder Bauboom endet irgendwann. Das Angebot holt die Nachfrage ein, die Anlagen sind fertig, und die jährlichen Ausgaben sinken auf Wartung und begrenzte Erweiterungen. Die Zahl von hunderten Milliarden Yuan ist eine Phase, keine dauerhafte Ausgabenposition.

  Allerdings gibt es einen Vorbehalt. Dieses Argument gilt nur, wenn die Anlagen mehrere Jahre nutzbar bleiben. Wenn KI-Hardware alle zwei Jahre veraltet, ist das heutige Rechenzentrum lediglich ein Vermögenswert, der auf die Abschreibung wartet, und nichts von dem bisher Gesagten gilt. Das kann ich nicht überprüfen, also lasse ich es offen.

  Was bekommen die Unternehmen also für das Geld?

  Den langfristigen Ertrag vermag ich nicht zu beurteilen. Vielleicht wächst diese Rechenleistung zu einem sehr lukrativen Geschäft, vielleicht auch nicht. Der kurzfristige Ertrag ist bereits sichtbar: Cloud-Dienste mit KI-Bezug verdienen jetzt schon Geld.

  Und selbst wenn dieser Ertrag nichts wert wäre, ist die Hardware immer noch da. Sie ist zu echten, physischen Vermögenswerten in den Rechenzentren geworden, nicht zu Geld, das einfach verschwand. Die Preise für solche Geräte sind nicht gefallen, sondern eher gestiegen. Wenn diese Firmen verkaufen müssten, wäre es durchaus möglich, die ursprüngliche Investition zurückzuholen. Ob dieser Preis hält, weiß ich ehrlich gesagt nicht. Er könnte morgen schon anders sein.

  Im ganzen Lärm um die Ausgaben ist das ursprüngliche Geschäft still geworden.

  Diese Unternehmen sind an die Wachstumsdecke gestoßen, nicht an ein kaputtes Geschäftsmodell. WeChat ist immer noch WeChat. Die Leute spielen weiter. Je mehr Nutzer ein Netzwerk hat, desto schwerer wird es für einen Neuling, es einzuholen — das gilt in China genauso wie anderswo.

  Joe Tsai von Alibaba hat gesagt, dass das Kerngeschäft mit E-Commerce jedes Jahr rund 25 Milliarden Dollar freien Cashflow erwirtschaftet (etwa 180 Milliarden Yuan), und dass damit der KI-Ausbau finanziert wird. Martin Lau von Tencent hat dasselbe mit anderen Worten gesagt: stabile Kerngeschäfte geben ihnen die Zuversicht, weiter in KI zu investieren. Ein solches Geschäft kann die heutige Bewertung rechtfertigen, finde ich.

  Was bedeutet KI für sie? Ein neuer Markt. Das alte Geschäft verdient weiter, und darüber hinaus öffnet sich ein neuer Markt. Der Markt starrt auf die Ausgabenspalte und übersieht das, was gerade wächst.

  Wie groß dieser Markt am Ende wird, kann ich nicht sagen. Diese Frage braucht wahrscheinlich noch ein paar Jahre, bis es eine Antwort gibt.
