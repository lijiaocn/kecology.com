title: "Perché il mercato ha torto a temere la spesa in IA delle aziende tecnologiche cinesi"
description: "Alibaba e Tencent stanno riversando miliardi nell'IA e il loro flusso di cassa libero è diventato negativo. Il mercato le sta punendo. Credo che il mercato trascuri ciò che queste aziende possiedono davvero — e ciò che il mercato dell'IA potrebbe diventare."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  Le azioni delle aziende internet cinesi sono messe male da un po'. È cominciato con la guerra dei prezzi nella consegna di cibo. Poi il mercato ha iniziato a preoccuparsi di quanto queste aziende spendono in IA, al punto che persino le più redditizie hanno visto il proprio flusso di cassa libero passare da positivo a negativo.

  Il mercato sta esagerando?

  La spesa è reale. Costruire IA da zero significa prima edificare lo strato fisico che la sostiene: centri dati, chip, energia, raffreddamento. La domanda corre davanti all'offerta, quindi i costi di costruzione continuano a salire. I piani di investimento di queste aziende si misurano in centinaia di miliardi di yuan. Solo Alibaba si è impegnata a investire oltre 380 miliardi di yuan (circa 53 miliardi di dollari) in tre anni, più di quanto abbia speso in infrastrutture cloud e IA nel decennio precedente.

  Ma questo livello di spesa non durerà per sempre. Ogni boom edilizio finisce. L'offerta raggiunge la domanda, gli impianti vengono completati e la spesa annua scende a manutenzione e ampliamenti limitati. La cifra di centinaia di miliardi è una fase, non una voce di costo permanente.

  Però c'è una condizione. Questo ragionamento regge solo se gli impianti restano utilizzabili per anni. Se l'hardware per IA diventa obsoleto ogni due anni, il centro dati di oggi è un asset in attesa di essere ammortizzato, e tutto quello che ho detto non vale. Non posso verificarlo, quindi lascio la questione aperta.

  Allora, cosa ottengono le aziende in cambio del denaro?

  Il rendimento a lungo termine non oso giudicarlo. Forse questa potenza di calcolo diventerà un'attività molto redditizia, forse no. Il rendimento a breve è già visibile: i servizi cloud legati all'IA stanno già generando ricavi.

  E anche se quei ricavi non contassero, l'hardware è ancora lì. È diventato veri asset fisici nei centri dati, non denaro svanito. I prezzi di questo tipo di apparecchiature non sono scesi, anzi sono saliti. Se queste aziende dovessero vendere, recuperare l'investimento iniziale non sarebbe impensabile. Che il prezzo regga, onestamente non lo so. Potrebbe cambiare domani.

  In mezzo al rumore sulla spesa, l'attività di sempre è rimasta in silenzio.

  Queste aziende hanno urtato il tetto della crescita, non un modello di business rotto. WeChat è ancora WeChat. La gente continua a giocare. Più utenti ha una rete, più difficile è per un nuovo arrivato raggiungerla: è vero in Cina come altrove.

  Joe Tsai di Alibaba ha detto che l'attività principale di e-commerce genera circa 25 miliardi di dollari di flusso di cassa libero all'anno (circa 180 miliardi di yuan), ed è con questo che viene finanziato lo sviluppo dell'IA. Martin Lau di Tencent ha detto la stessa cosa con altre parole: sono le attività di base stabili a dare loro la fiducia per continuare a investire in IA. Un'attività del genere può giustificare l'attuale valutazione, mi sembra.

  Che cosa significa l'IA per loro? Un mercato nuovo. L'attività di sempre continua a rendere, e sopra si apre un mercato nuovo. Il mercato guarda la colonna della spesa e perde di vista ciò che sta crescendo.

  Quanto diventerà grande questo mercato, non so. A quella domanda serviranno probabilmente qualche anno prima di avere una risposta.
