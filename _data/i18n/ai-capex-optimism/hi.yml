title: "बाज़ार चीनी टेक कंपनियों के AI खर्च को लेकर जो घबराहट दिखा रहा है, वो गलत है"
description: "अलीबाबा और टेनसेंट AI में अरबों डॉलर डाल रही हैं और उनका फ्री कैश फ्लो नेगेटिव हो गया है। बाज़ार उन्हें सजा दे रहा है। मेरा मानना है कि बाज़ार उन चीज़ों को नज़रअंदाज़ कर रहा है जो इन कंपनियों के पास वाकई हैं — और ये कि AI बाज़ार क्या बन सकता है।"
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  हाल ही में चीनी इंटरनेट कंपनियों के शेयर खराब लग रहे हैं। शुरुआत फूड डिलीवरी की कीमत जंग से हुई। फिर बाज़ार को चिंता हुई कि ये कंपनियां AI पर कितना खर्च कर रही हैं — इतना कि सबसे ज़्यादा मुनाफ़ा कमाने वाली कंपनियों का भी फ्री कैश फ्लो पॉज़िटिव से नेगेटिव हो गया।

  क्या बाज़ार ज़्यादा निराशावादी है?

  खर्च सच है। शून्य से AI बनाना मतलब पहले его नीचे की भौतिक परत खड़ी करना: डेटा सेंटर, चिप्स, बिजली, कूलिंग। मांग आपूर्ति से आगे है, इसलिए निर्माण लागत बढ़ती जा रही है। इन कंपनियों के निवेश प्लान सौ अरब युआन में मापे जाते हैं। अकेली अलीबाबा ने तीन साल में 380 अरब युआन (लगभग 53 अरब डॉलर) से ज़्यादा निवेश करने का वादा किया है, जो पिछले दशक में क्लाउड और AI इन्फ्रास्ट्रक्चर पर उसके कुल खर्च से ज़्यादा है।

  लेकिन इतने स्तर का खर्च हमेशा नहीं रहेगा। हर निर्माण बूम का अंत होता है। आपूर्ति मांग को पकड़ लेती है, सुविधाएँ बन कर तैयार होती हैं, और सालाना खर्च घट कर रखरखाव और सीमित अपग्रेड रह जाता है। सौ अरब वाला आंकड़ा एक चरण है, स्थायी खर्च की मद नहीं।

  फिर भी एक शर्त है। ये तर्क तभी चलता है जब सुविधाएँ सालों तक काम की रहें। अगर AI हार्डवेयर हर दो साल में पुराना हो जाता है, तो आज का डेटा सेंटर सिर्फ़ एक ऐसी संपत्ति है जो डिप्रिसिएशन का इंतज़ार कर रही है, और ऊपर वाली सब बातें गलत हो जाती हैं। मैं ये सत्यापित नहीं कर सकता, इसलिए सवाल खुला छोड़ता हूँ।

  तो कंपनियों को अपने पैसे के बदले क्या मिलता है?

  लंबे समय का रिटर्न मैं नहीं आंक पाता। हो सकता है ये कंप्यूटिंग पावर बहुत मुनाफ़े वाला कारोबार बन जाए, हो सकता है नहीं। छोटे समय का रिटर्न दिख चुका है: AI से जुड़ी क्लाउड सेवाएँ अभी कमाई कर रही हैं।

  और अगर ये कमाई नहीं भी गिनें, हार्डवेयर तो वहीं है। वो डेटा सेंटर की असली भौतिक संपत्ति बन चुका है, गायब हुआ पैसा नहीं। ऐसे उपकरणों की कीमतें गिरी नहीं, बल्कि बढ़ी हैं। अगर इन कंपनियों को बेचना पड़े, तो मूल निवेश वापस पाना असंभव नहीं है। कीमत टिकेगी या नहीं, ये मैं सच में नहीं जानता। कल ही बदल सकती है।

  खर्च के शोर के बीच पुराना कारोबार चुप्पी साध गया है।

  ये कंपनियाँ बढ़त की सीमा पर पहुँची हैं, बुरी बिज़नेस मॉडल वाली नहीं। WeChat वही WeChat है। लोग वही खेल खेल रहे हैं। किसी नेटवर्क के ज़्यादा उपयोगकर्ता होने पर नए आने वाले के लिए उसका पीछा करना मुश्किल होता है — ये चीन में वही है जो दूसरी जगह है।

  अलीबाबा के जो ट्साई ने कहा कि मुख्य ई-कॉमर्स कारोबार हर साल लगभग 25 अरब डॉलर का फ्री कैश फ्लो देता है (लगभग 180 अरब युआन), और AI का निर्माण इसी पैसे से हो रहा है। टेनसेंट के मार्टिन लाउ ने यही बात दूसरे शब्दों में कही: स्थिर मुख्य कारोबार ही उन्हें AI में निवेश जारी रखने का भरोसा देता है। ऐसा कारोबार आज का वैल्यूएशन संभाल सकता है, मेरा मानना है।

  इन कंपनियों के लिए AI का मतलब क्या है? एक नया बाज़ार। पुराना कारोबार कमाई करता रहता है, और ऊपर एक नया बाज़ार खुल रहा है। बाज़ार सिर्फ़ खर्च वाले कॉलम को देखता है और बढ़ते हिस्से को चूक जाता है।

  वो बाज़ार आख़िर कितना बड़ा होगा, मैं नहीं बता सकता। शायद इस सवाल का जवाब कुछ साल बाद मिले।
