title: "ทำไมตลาดถึงกังวลมากเกินไปกับการใช้จ่ายด้าน AI ของบริษัทเทคโนโลยีจีน"
description: "อาลีบาบาและเทนเซ็นต์กำลังลงเงินหลายพันล้านดอลลาร์ใน AI และกระแสเงินสดอิสระติดลบแล้ว ตลาดกำลังลงโทษหุ้นทั้งสอง แต่ผมคิดว่าตลาดมองข้ามสิ่งที่บริษัทเหล่านี้มีจริง ๆ และสิ่งที่ตลาด AI อาจกลายเป็น"
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  หุ้นบริษัทอินเทอร์เน็ตจีนดูไม่ดีในช่วงนี้ เริ่มจากสงครามราคาในธุรกิจส่งอาหาร แล้วตลาดก็เริ่มกังวลว่าบริษัทเหล่านี้ใช้เงินกับ AI มากแค่ไหน มากจนแม้แต่บริษัทที่ทำกำไรได้มากที่สุดยังเห็นกระแสเงินสดอิสระเปลี่ยนจากบวกเป็นลบ

  ตลาดมองแง่ร้ายเกินไปไหม?

  การใช้จ่ายเป็นเรื่องจริง การสร้าง AI ตั้งแต่ศูนย์หมายถึงต้องสร้างชั้นกายภาพที่รองรับก่อน ได้แก่ ศูนย์ข้อมูล ชิป ไฟฟ้า และระบบทำความเย็น อุปสงค์นำหน้าอุปทาน ค่าก่อสร้างจึงสูงขึ้นเรื่อย ๆ แผนการลงทุนของบริษัทเหล่านี้วัดเป็นหลายแสนล้านหยวน อาลีบาบาบริษัทเดียวให้สัญญาว่าจะลงทุนมากกว่า 380,000 ล้านหยวน (ราว 53,000 ล้านดอลลาร์) ในสามปี ซึ่งมากกว่าที่บริษัทใช้ไปกับโครงสร้างพื้นฐานคลาวด์และ AI ในทศวรรษก่อนหน้ารวมกันเสียอีก

  แต่การใช้จ่ายระดับนี้จะไม่คงอยู่ตลอดไป ทุกช่วงการก่อสร้างย่อมมีจุดจบ อุปทานตามทันอุปสงค์ สิ่งอำนวยความสะดวกสร้างเสร็จ และรายจ่ายต่อปีก็ลดลงเหลือเพียงการบำรุงรักษาและการขยายที่จำกัด ตัวเลขหลายแสนล้านหยวนเป็นเพียงช่วงหนึ่ง ไม่ใช่รายจ่ายถาวร

  แต่มีเงื่อนไขอยู่ ข้อโต้แย้งนี้จะใช้ได้ก็ต่อเมื่อสิ่งอำนวยความสะดวกยังใช้ได้อีกหลายปี ถ้าฮาร์ดแวร์ AI ล้าสมัยทุกสองปี ศูนย์ข้อมูลในวันนี้ก็คือสินทรัพย์ที่รอการตัดบัญชี และสิ่งที่ผมพูดมาก็ใช้ไม่ได้ทั้งหมด ผมตรวจสอบเรื่องนี้ไม่ได้ จึงขอทิ้งไว้เป็นคำถามปลายเปิด

  แล้วบริษัทได้อะไรจากเงินที่จ่ายไป?

  ผลตอบแทนระยะยาวผมไม่กล้าตัดสิน บางทีพลังการประมวลผลนี้อาจเติบโตเป็นธุรกิจที่ทำกำไรได้มาก หรืออาจไม่ก็ได้ ส่วนผลตอบแทนระยะสั้นเห็นได้ชัดแล้ว บริการคลาวด์ที่เกี่ยวข้องกับ AI กำลังสร้างรายได้อยู่ตอนนี้

  และแม้จะไม่นับรายได้นั้น ฮาร์ดแวร์ก็ยังอยู่ตรงนั้น มันกลายเป็นสินทรัพย์จริงที่เป็นรูปธรรมในศูนย์ข้อมูล ไม่ใช่เงินที่หายไป ราคาอุปกรณ์แบบนี้ไม่ได้ตกลง แต่กลับสูงขึ้น ถ้าจำเป็นต้องขาย การได้เงินที่ลงทุนไปคืนก็ไม่ใช่เรื่องที่เป็นไปไม่ได้ แต่ราคาจะคงอยู่หรือไม่ ผมไม่รู้จริง ๆ อาจเปลี่ยนได้พรุ่งนี้เลยก็ได้

  ท่ามกลางเสียงรบกวนเรื่องการใช้จ่าย ธุรกิจเดิมกลับเงียบไป

  บริษัทเหล่านี้แตะเพดานการเติบโตเฉย ๆ ไม่ใช่โมเดลธุรกิจเสียหาย WeChat ก็ยังเป็น WeChat ผู้คนยังเล่นเกมเหมือนเดิม ยิ่งผู้ใช้เครือข่ายมากเท่าไหร่ คนที่เข้ามาทีหลังก็ยิ่งตามได้ยากขึ้นเท่านั้น กฎนี้ใช้ได้ในจีนเหมือนที่อื่น

  โจ ไฉ่จากอาลีบาบาเคยบอกว่าธุรกิจอีคอมเมิร์ซหลักสร้างกระแสเงินสดอิสระราว 25,000 ล้านดอลลาร์ต่อปี (ประมาณ 180,000 ล้านหยวน) และนี่แหละคือเงินที่ใช้สร้าง AI มาร์ติน เล่าจากเทนเซ็นต์ก็พูดแบบเดียวกันคนละคำว่า ธุรกิจหลักที่มั่นคงคือสิ่งที่ทำให้พวกเขามั่นใจลงทุน AI ต่อไป ธุรกิจแบบนั้น ผมคิดว่ารองรับมูลค่าตลาดปัจจุบันได้

  AI หมายถึงอะไรสำหรับพวกเขา? ตลาดใหม่ ธุรกิจเดิมยังสร้างรายได้ และเหนือขึ้นไปนั้นตลาดใหม่กำลังเปิดกว้าง ตลาดจ้องอยู่ที่คอลัมน์รายจ่ายและมองข้ามสิ่งที่กำลังเติบโต

  ตลาดนั้นจะใหญ่แค่ไหน ผมบอกไม่ได้ คำถามนี้อาจต้องใช้เวลาหลายปีกว่าจะมีคำตอบ
