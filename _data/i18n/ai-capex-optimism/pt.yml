title: "Por que o mercado está errado ao temer os gastos com IA das empresas de tecnologia chinesas"
description: "Alibaba e Tencent estão despejando bilhões em IA e seu fluxo de caixa livre virou negativo. O mercado está penalizando as ações. Acho que ele deixa passar o que essas empresas realmente possuem — e o que o mercado de IA pode se tornar."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  As ações de empresas de internet chinesas estão feias há algum tempo. Começou com a guerra de preços na entrega de comida. Depois o mercado começou a se preocupar com quanto essas companhias estão gastando em IA — tanto que até as mais lucrativas viram seu fluxo de caixa livre sair do positivo para o negativo.

  O mercado está exagerando?

  O gasto é real. Construir IA do zero significa erguer primeiro a camada física que a sustenta: centros de dados, chips, energia, refrigeração. A demanda está à frente da oferta, então os custos de construção continuam subindo. Os planos de investimento dessas empresas são medidos em centenas de bilhões de yuans. Só a Alibaba se comprometeu a investir mais de 380 bilhões de yuans (cerca de 53 bilhões de dólares) em três anos, mais do que gastou em infraestrutura de nuvem e IA na década anterior.

  Mas esse nível de gasto não vai durar para sempre. Todo boom de construção chega ao fim. A oferta alcança a demanda, as instalações ficam prontas e o gasto anual cai para manutenção e ampliações limitadas. O número de centenas de bilhões é uma fase, não uma rubrica permanente.

  Só que há uma condição. Esse raciocínio só vale se as instalações continuarem úteis por anos. Se o hardware de IA ficar obsoleto a cada dois anos, o centro de dados de hoje é um ativo esperando para ser baixado, e nada do que disse antes funciona. Não consigo verificar isso, então deixo a questão em aberto.

  Então, o que as empresas recebem em troca do dinheiro?

  O retorno de longo prazo não me atrevo a julgar. Talvez essa capacidade de computação vire um negócio muito lucrativo, talvez não. O retorno de curto prazo já está visível: serviços em nuvem ligados à IA estão faturando agora.

  E mesmo que esse faturamento não contasse, o hardware continua lá. Ele se transformou em ativos físicos reais dentro dos centros de dados, não em dinheiro que sumiu. Os preços desse tipo de equipamento não caíram, pelo contrário, subiram. Se essas empresas precisassem vender, recuperar o investimento inicial não seria impensável. Se esse preço vai se manter, honestamente não sei. Pode mudar amanhã.

  Em meio ao barulho sobre os gastos, o negócio de sempre ficou em silêncio.

  Essas empresas bateram no teto do crescimento, não num modelo de negócio quebrado. O WeChat continua sendo o WeChat. As pessoas continuam jogando. Quanto mais usuários uma rede tem, mais difícil é para um recém-chegado alcançá-la — isso é verdade na China e em qualquer lugar.

  Joe Tsai, da Alibaba, disse que o negócio principal de comércio eletrônico gera cerca de 25 bilhões de dólares de fluxo de caixa livre por ano (uns 180 bilhões de yuans), e que é com isso que a expansão em IA é financiada. Martin Lau, da Tencent, disse a mesma coisa de outra forma: negócios centrais estáveis são o que lhes dá confiança para continuar investindo em IA. Um negócio assim pode sustentar a valorização atual, acho eu.

  O que a IA significa para elas? Um mercado novo. O negócio de sempre continua rendendo, e por cima se abre um mercado novo. O mercado olha só a coluna dos gastos e perde de vista o que está crescendo.

  Quão grande esse mercado vai ficar, não sei. Essa pergunta provavelmente precisa de alguns anos para ter resposta.
