title: "Why the Market Is Wrong to Panic Over Chinese Tech's AI Spending"
description: "Alibaba and Tencent are pouring billions into AI and their free cash flow has turned negative. The market is selling them off. I think that misses what these companies actually own — and what the AI market could become."
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  Chinese internet stocks have been getting hammered. First it was the food-delivery price war. Then the market started worrying about how much these companies are spending on AI — so much that even the most profitable ones have seen their free cash flow swing from positive to negative.

  Is the market overreacting?

  The spending is real. Building AI from scratch means building the physical layer underneath it — data centres, chips, power, cooling. Demand is running ahead of supply, so construction costs keep climbing. The capex plans coming out of these companies are measured in hundreds of billions of yuan. Alibaba alone has pledged more than 380 billion yuan (about $53 billion) over three years, more than it spent on cloud and AI infrastructure in the previous decade combined.

  But capital spending at this level won't last forever. Every building boom ends. Supply catches up with demand, and the facilities get built. Once they are, the annual spend drops to maintenance and incremental upgrades. The hundred-billion-yuan figure is a phase, not a permanent line item.

  There's a catch, though. This argument only holds if the infrastructure stays useful for years. If AI hardware goes obsolete every couple of years, then today's data centre is a write-off waiting to happen, and none of what I just said works. I can't verify that either way, so I'll leave it open.

  What do the companies get for the money?

  The long-term payoff I can't judge. Maybe this computing power grows into a wildly profitable business, maybe it doesn't. The near-term payoff is already visible: cloud services tied to AI are bringing in revenue now.

  And even if that revenue were worth nothing, the hardware is still sitting there. It has become real, physical assets in data centres, not money that vanished. Prices for this kind of equipment haven't been falling — if anything they've been rising. If these companies ever needed to sell, recovering the original investment wouldn't be unthinkable. Whether that price holds, I genuinely don't know. It could change tomorrow.

  In all the noise about spending, the original businesses have gone quiet.

  These companies have run into the ceiling on growth, not into a broken business model. WeChat is still WeChat. People still play games. The more people use a network, the harder it is for a newcomer to compete — that's as true in China as anywhere.

  Alibaba's Joe Tsai has said that the core e-commerce business throws off about $25 billion in free cash flow a year (roughly 180 billion yuan). That's what funds the AI build-out. Tencent's Martin Lau has said the same thing in different words: stable core businesses are what give them the confidence to keep investing in AI. A business like that can support today's valuation, I think.

  So what does AI mean for them? A new market. Their existing businesses keep earning, and on top of that a new market is opening up. The market is staring at the spending column and missing the part that's growing.

  How big that market gets, I can't say. That question probably needs a few years before there's an answer.
