title: "市場不該為中國科技公司的 AI 支出恐慌"
description: "阿里巴巴與騰訊正把大把錢投進 AI，自由現金流由正轉負，股價隨之下跌。我覺得市場的恐慌忽略了這些公司真正擁有的東西，以及 AI 市場可能長成的樣子。"
image: /assets/img/blog/ai-capex-optimism/ai-capex-optimism-cover.png

body: |
  中國網路公司的股價最近很難看。先是外送大戰，接著市場開始擔心它們在 AI 上的投入太大，大到連最賺錢的公司，自由現金流都由正轉負。

  市場是不是反應過度了？

  投入是實打實的。從零搭建 AI，意味著要把底下那一層實體先建起來：資料中心、晶片、電力、散熱。需求跑在供給前面，建設成本一路上升。這些公司拋出來的資本支出計畫，都是以千億為單位。光阿里巴巴一家，就承諾三年投入超過 3800 億元人民幣（約合 530 億美元），比它過去十年在雲端和 AI 基礎設施上的投入加起來還多。

  但這樣強度的支出不會一直持續。任何建設熱潮都有盡頭。供給追上需求，設施建完，之後每年的花費就降成維護和有限的更新。千億這個數字是一個階段，不是一條永久的支出線。

  不過這裡有個前提。這套說法要成立，得是這些設施真能用上好幾年。要是 AI 硬體隔一兩年就淘汰，那今天的資料中心就等於等著減記的資產，前面說的就全不算數。這件事我沒辦法證實，只能先擱著。

  那錢花出去，換回了什麼？

  長期的回報我判斷不了。也許這批算力會長成一個利潤豐厚的業務，也許不會。眼前的回報已經看得見：跟 AI 相關的雲端服務，現在就在往回收錢。

  就算這點收入不算數，硬體也還在那兒。它變成了資料中心裡實實在在的資產，不是憑空蒸發掉的錢。這類設備的價格這些年沒見跌，反倒還在往上走。真到要出手的時候，把投進去的錢收回來，未必做不到。當然這價格能撐多久，我確實不知道，可能明天就變。

  在一片關於支出的噪音裡，原來那攤生意反倒沒人提了。

  這些公司是撞上了成長的天花板，不是商業模式壞了。微信還是那個微信，遊戲該玩的人還在玩。用的人越多，後來者越難追，這條規律在台灣跟在別處一樣成立。

  阿里巴巴的蔡崇信說過，核心電商業務每年產生約 250 億美元自由現金流（約合 1800 億元人民幣），AI 的錢就是這麼來的。騰訊的劉熾平也表達過類似的意思：核心業務穩，才有底氣持續投資 AI。這樣的生意，我認為撐得起現在的市值。

  那 AI 對它們意味著什麼？一個新市場。原來那攤生意還在賺錢，這之上又打開了一個新市場。市場盯著支出那一欄看，把正在長的那一塊給漏掉了。

  這個市場最後能長多大，我說不清楚。這個問題，可能得幾年以後回頭看才有答案。
