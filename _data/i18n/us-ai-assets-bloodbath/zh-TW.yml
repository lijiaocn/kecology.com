title: "十天三記悶棍：美股的 AI 行情，是不是開始有裂縫了？"
description: "中期選舉、輝達執行長醜聞辭職、Anthropic 掛牌，一連串打向美國 AI 供應鏈。最後一個可能最要緊：產業忙著擴產，它的營收成長卻慢下來了。"
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  過去這兩週，美國 AI 供應鏈接連挨了三下。

  先是中期選舉。風向一變，市場對美國資料中心建設的前景就悲觀起來，跟這波擴建有關的硬體股跟著跌了一波。

  然後，就在大家對資料中心的期待剛開始回升的時候，整條鏈子裡最吃重的那根柱子被抽掉了——輝達。

  黃仁勳，輝達的執行長，先是被爆跟一名間諜有染，還被扣上威脅美國國家安全的帽子。他發了聲明承認那段關係，間諜的說法後來被否掉了。這邊剛要平息，又傳出跟下屬交往的消息。最後，他辭了。

  黃仁勳是輝達的核心。公司是他創辦的，三十多年來一直由他帶著。

  技術上，輝達今天這道護城河，靠的就是他的前瞻——一步接一步，好像每一步都走在前面。

  市場上，他這個背景也很難再找第二個：在中國台灣地區出生、華裔、持美國國籍，兩邊都能走得開，背後還有全球大部分先進晶片產地的支持。

  管理上也一樣難替代。多達 60 位高階主管直接向他匯報。輝達那種少見的扁平化組織，靠的就是他的精力和這麼多年的產業經驗在撐。

  中美關係、台海局勢都越來越敏感的時候，黃仁勳差不多就是當時最合適的人。結果因為一段私情被趕走了。

  市場還沒把他的辭職消化完，前沿模型龍頭 Anthropic 又補了第三刀。

  Anthropic 是這一輪 AI 週期裡最被看好的公司。它手上有最強的模型，也站在向用戶收錢的最前線。它的營收成長，正是把 AI 行情往上推的那台引擎。

  可這台引擎現在看起來快沒油了。招股書顯示，第二季季增營收 144%，第三季掉到 47%。照這個速度，成長很快就會接近零。

  供應鏈還在熱火朝天地擴產，而最強模型的營收好像開始走平了。

  黃仁勳辭職，最多把輝達一家拖下水。但要是 Anthropic 那個訊號被坐實——營收已經見頂——那麼整條忙著擴產的供應鏈，怕是要一起栽。
