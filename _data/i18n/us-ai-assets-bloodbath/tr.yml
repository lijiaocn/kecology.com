title: "On Günde Üç Şok: ABD Hisse Senetlerindeki AI Rallisi Çatlamaya mı Başlıyor?"
description: "Bir ara seçim, Nvidia CEO'sunun bir skandal yüzünden istifası ve Anthropic'in halka arzı, ABD AI tedarik zincirini peş peşe vurdu. Sonuncusu en önemlisi olabilir: sektör kapasite artırırken gelir büyümesi yavaşlıyor."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  Son iki haftada ABD AI tedarik zincirine üç büyük şok indi.

  İlk olarak ara seçim geldi. Siyasi rüzgâr değişti ve piyasa, ABD'de veri merkezi inşasının geleceği konusunda karamsarlığa düştü. Bu inşaatla bağlantılı donanım hisseleri satıldı.

  Ardından, veri merkezlerine dair umutlar toparlanmaya başlarken, tüm zincirin dayandığı ana direk kesildi: Nvidia.

  Nvidia CEO'su Jensen Huang hakkında önce bir casusla ilişkisi olduğu haberleri çıktı; bu, ABD ulusal güvenliğine yönelik bir tehdit gibi sunuldu. İlişkiyi kabul ettiği bir açıklama yayımladı ve casusluk iddiası çürütüldü. Bu yatışırken, bir astıyla ilişkisi olduğuna dair haberler ortaya çıktı. Sonunda istifa etti.

  Huang, Nvidia'nın kalbi. Şirketi kuran ve otuz yıldan fazla süredir yöneten kişi.

  Teknoloji tarafında, Nvidia'nın bugünkü kalesini onun öngörüsü kurdu; birbiri ardına, zamanının önünde alınmış kararlarla.

  Piyasada ise geçmişi işe yaradı: Çin'in Tayvan bölgesi doğduğu yerdi, Çinli kökenliydi, ABD vatandaşıydı; iki taraf arasında rahatça hareket edebiliyordu ve dünyanın gelişmiş çiplerinin çoğunu üreten yerin desteği vardı.

  Yönetimde de yerine koymak zor. 60'a kadar yönetici doğrudan ona rapor veriyor. Nvidia'nın alışılmadık derecede düz yapısı, onun enerjisi ve yıllara dayanan uzmanlığı üzerine kurulu.

  ABD-Çin ilişkilerinin ve Tayvan Boğazı'nın gittikçe hassaslaştığı bir dönemde Huang, o an için neredeyse ideal kişiydi. Ve bir ilişki yüzünden gönderildi.

  Piyasa istifasını henüz sindirememişken, öncü model şirketi Anthropic üçüncü darbeyi indirdi.

  Anthropic, bu AI dalgasının en çok beklenen şirketiydi. En güçlü model onlarda ve kullanıcılardan para toplamanın en ön saflarında duruyorlar. Gelir büyümesi, AI rallisini yukarı taşıyan motorun ta kendisiydi.

  O motor şimdi gücünü tüketiyor gibi görünüyor. Halka arz başvurusu, ikinci çeyrekte çeyrekten çeyreğe 144% olan gelir büyümesinin üçüncü çeyrekte 47%'ye düştüğünü gösteriyor. Bu tempoyla gelir büyümesi kısa sürede sıfıra yaklaşacak.

  Tedarik zinciri bir inşaat patlamasının ortasındayken, en iyi modelin geliri düzleşmeye başlıyor.

  Huang'ın istifası en fazla Nvidia'yı batırabilir. Ama Anthropic'ten gelen sinyal doğrulanırsa — gelirinin zirve yaptığı ortaya çıkarsa — kapasite artırmakla meşgul tüm tedarik zinciri de peşinden gider.
