title: "Trois chocs en dix jours : le pari sur l'IA dans la bourse américaine commence-t-il à se fissurer ?"
description: "Des élections législatives, la démission du patron de Nvidia pour un scandale et l'introduction en bourse d'Anthropic ont frappé coup sur coup la chaîne d'approvisionnement américaine de l'IA. La dernière compte sans doute le plus : sa croissance de chiffre d'affaires ralentit au moment précis où le secteur continue d'étendre ses capacités."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  Ces deux dernières semaines, trois gros événements ont secoué la chaîne d'approvisionnement de l'IA aux États-Unis.

  D'abord, les élections législatives. Le vent politique a tourné et le marché est devenu pessimiste sur l'avenir des centres de données aux États-Unis. Les actions de matériel informatique liées à cette expansion ont dévissé.

  Puis, juste quand l'espoir revenait du côté des centres de données, c'est le pilier porteur de toute la chaîne qui a été coupé : Nvidia.

  Jensen Huang, le patron de Nvidia, a d'abord été annoncé comme ayant une liaison avec une espionne, présentée comme une menace pour la sécurité nationale américaine. Il a publié un communiqué reconnaissant la liaison, et l'accusation d'espionnage a été démentie. Alors que l'affaire retombait, des rumeurs de relation avec une subordonnée ont circulé. Au bout du compte, il a démissionné.

  Huang est le cœur de Nvidia. Il l'a fondée et la dirige depuis plus de trente ans.

  Sur la technologie, c'est sa clairvoyance qui a bâti le fossé défensif dont Nvidia dispose aujourd'hui, décision après décision prise avant tout le monde.

  Sur les marchés, son parcours lui permettait de circuler avec aisance des deux côtés : né à Taïwan, Chine, d'origine chinoise et de nationalité américaine, il avait derrière lui le soutien du lieu qui fabrique la majeure partie des puces avancées de la planète.

  En management, il est tout aussi difficile à remplacer. Jusqu'à 60 cadres rapportent directement à lui. L'organisation étonnamment plate de Nvidia repose sur son énergie et ses années d'expérience du secteur.

  À une époque où les relations entre les États-Unis et la Chine deviennent plus sensibles, et avec elles la tension dans le détroit de Taïwan, Huang était presque la personne idéale pour ce moment-là. Et il a été poussé dehors pour une histoire de liaison.

  Avant même que le marché ait fini de digérer sa démission, Anthropic, la principale société de modèles de pointe, a porté le troisième coup.

  Anthropic était la société la plus attendue de ce cycle de l'IA. Elle a le modèle le plus solide disponible et se trouve en première ligne pour recevoir l'argent des utilisateurs. Sa croissance de chiffre d'affaires est le moteur qui a fait monter toute la vague IA.

  Ce moteur semble maintenant sur le point de caler. Son dossier d'introduction en bourse affiche une croissance du chiffre d'affaires de 144 % au deuxième trimestre par rapport au précédent, contre 47 % au troisième. À ce rythme, la croissance des revenus sera bientôt proche de zéro.

  La chaîne d'approvisionnement est en plein boom de construction, alors que les revenus du meilleur modèle commencent à plafonner.

  La démission de Huang peut, au grand maximum, faire tomber Nvidia. Mais si le signal d'Anthropic se confirme — celui d'un chiffre d'affaires qui a atteint son pic —, alors toute la chaîne occupée à construire des capacités tombera avec elle.
