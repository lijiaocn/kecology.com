title: "दस दिनों में तीन झटके: क्या अमेरिकी शेयरों में AI वाली तेजी टूटने लगी है?"
description: "मध्यावधि चुनाव, nvidia के सीईओ का विवाद में इस्तीफ़ा, और anthropic का IPO — इन तीनों ने अमेरिकी AI आपूर्ति श्रृंखला को लगातार चोट पहुँचाई। आख़िरी सबसे अहम हो सकता है: उसी समय जब उद्योग क्षमता बढ़ा रहा है, उनकी आय वृद्धि धीमी पड़ रही है।"
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  पिछले दो हफ़्तों में अमेरिकी AI आपूर्ति श्रृंखला को तीन बड़े झटके लगे हैं।

  सबसे पहले मध्यावधि चुनाव आया। राजनीतिक हवा बदली, और अमेरिका में डेटा सेंटर बनाने के भविष्य को लेकर बाज़ार निराश हो गया। इसी निर्माण से जुड़े हार्डवेयर शेयर गिरे।

  फिर, जैसे ही डेटा सेंटर की उम्मीदें सुधरने लगीं, पूरी श्रृंखला का सहारा तोड़ दिया गया: nvidia।

  जेनसन हुआंग, nvidia के सीईओ, पर पहले खबर आई कि उनका एक जासूस से अफ़ेयर रहा, जिसे अमेरिकी राष्ट्रीय सुरक्षा के लिए खतरा बताया गया। उन्होंने एक बयान जारी कर अफ़ेयर स्वीकार किया, और जासूसी वाला आरोप खारिज हो गया। जैसे ही यह बात थमी, एक अधीनस्थ कर्मचारी के साथ रिश्ते की खबरें आईं। आख़िरकार उन्होंने इस्तीफ़ा दे दिया।

  हुआंग nvidia की आत्मा हैं। उन्होंने इसे बनाया और तीस साल से अधिक समय तक इसका नेतृत्व किया।

  टेक्नोलॉजी में उनकी दूरदृष्टि ने ही nvidia की आज वाली मज़बूती खड़ी की, एक के बाद एक ऐसे फैसले जो समय से आगे निकले।

  बाज़ार में उनकी पृष्ठभूमि ने काम दिया — चीन का ताइवान क्षेत्र उनका जन्मस्थान है, वे चीनी मूल के हैं और अमेरिकी नागरिक हैं — इसने उन्हें दोनों तरफ़ सहजता से चलने दिया, साथ ही उस जगह का साथ मिला जो दुनिया की अधिकांश उन्नत चिप्स बनाती है।

  प्रबंधन में भी उन्हें बदलना आसान नहीं। 60 तक अधिकारी सीधे उनको रिपोर्ट देते हैं। nvidia का असामान्य रूप से समतल ढाँचा उनकी ऊर्जा और वर्षों के अनुभव पर चलता है।

  ऐसे समय जब अमेरिका-चीन संबंध और ताइवान जलडमरूमध्य अधिक संवेदनशील हो रहे हैं, हुआंग उस पल के लिए लगभग आदर्श व्यक्ति थे। और उन्हें एक अफ़ेयर के कारण बाहर होना पड़ा।

  बाज़ार अभी उनके इस्तीफ़े को पचा भी नहीं पाया था कि सबसे आगे चल रही AI मॉडल कंपनी anthropic ने तीसरा झटका दिया।

  इस AI दौर में anthropic सबसे ज़्यादा उम्मीद वाली कंपनी थी। उनके पास सबसे मज़बूत मॉडल है और वे उपयोगकर्ताओं से पैसा वसूलने की सबसे आगे की पंक्ति में खड़े हैं। आय वृद्धि ही वह इंजन है जिसने AI वाली तेजी को ऊपर उठाया।

  अब ये इंजन थकने लगता दिख रहा है। IPO फाइलिंग में दूसरी तिमाही में आय वृद्धि 144% दिखी, जो तीसरी तिमाही में घटकर 47% रह गई। इस रफ़्तार से आय वृद्धि जल्द ही शून्य के पास आ जाएगी।

  श्रृंखला निर्माण की तेज़ी के बीच में है, और सबसे अच्छे मॉडल की आय थमने लगी है।

  हुआंग के जाने से ज़्यादा से ज़्यादा nvidia को नुकसान हो सकता है। लेकिन अगर anthropic का संकेत सच निकला — कि उनकी आय ने चोटी पकड़ ली — तो क्षमता बढ़ाने में जुटी पूरी आपूर्ति श्रृंखला साथ ही गिर जाएगी।
