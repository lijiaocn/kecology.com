title: "十天三连击：美股的 AI 行情，是不是开始有裂缝了？"
description: "中期选举、英伟达 CEO 丑闻辞职、Anthropic IPO，一连串砸向美国 AI 产业链。最后一个可能最要紧：行业正忙着扩产，它的营收增速却慢下来了。"
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  过去这两周，美国 AI 产业链连着挨了三下。

  先是中期选举。风向一变，市场对美国数据中心的建设前景就悲观起来，跟这波扩建相关的硬件股跟着跌了一波。

  然后，就在大家对数据中心的预期刚开始回升的时候，整条链子里最吃重的那根柱子被抽掉了——英伟达。

  黄仁勋，英伟达的老大，先是被爆跟一名间谍有染，还被扣上威胁美国国家安全的帽子。他发了声明承认那段关系，间谍的说法后来被否掉了。这边刚要平息，又传出跟下属交往的消息。最后，他辞了。

  黄仁勋是英伟达的核心。公司是他创办的，三十多年来一直由他带着。

  技术上，英伟达今天这道护城河，靠的就是他的前瞻——一步接一步，好像每一步都走在了前面。

  市场上，他这个背景也难找第二个：在中国台湾地区出生、华裔、持美国国籍，两边都能走得开，背后还有全球大部分先进芯片产地的支持。

  管理上也一样难替代。多达 60 位高管直接向他汇报。英伟达那种少见的扁平架构，靠的就是他的精力和这么多年的行业经验在撑。

  中美关系、台海局势都越来越敏感的时候，黄仁勋差不多就是当时最合适的人。结果因为一段私情被赶走了。

  市场还没把他的辞职消化完，前沿模型龙头 Anthropic 又补了第三刀。

  Anthropic 是这一轮 AI 周期里最被看好的公司。它手上有最强的模型，也站在向用户收钱的最前线。它的营收增速，正是把 AI 行情往上推的那台发动机。

  可这台发动机现在看着快要没油了。招股书显示，二季度环比营收增长 144%，三季度掉到 47%。照这个速度，增速很快就会接近零。

  产业链还在热火朝天地扩产，而最强模型的营收好像开始走平了。

  黄仁勋辞职，最多把英伟达一家拖下水。但要是 Anthropic 那个信号被坐实——营收已经见顶——那么整条忙着扩产的产业链，怕是要一起栽。
