title: "Tiga Guncangan dalam Sepuluh Hari: Apakah Tren AI di Saham AS Mulai Retak?"
description: "Pemilu tengah masa jabatan, pengunduran diri CEO Nvidia karena skandal, dan IPO Anthropic menyentuh rantai pasok AI AS secara berurutan. Yang terakhir mungkin paling penting: pertumbuhan pendapatannya melambat tepat saat industri memperluas kapasitas."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  Dalam dua pekan terakhir, tiga peristiwa besar mengguncang rantai pasok AI di AS.

  Pertama, pemilu tengah. Arah politik berubah, dan pasar jadi pesimis terhadap masa depan pembangunan pusat data di AS. Saham-saham perangkat keras yang terkait dengan pembangunan itu pun turun.

  Kemudian, tepat saat harapan akan pusat data mulai pulih, penopang utama seluruh rantai diputus: Nvidia.

  Jensen Huang, CEO Nvidia, pertama kali diberitakan menjalin hubungan dengan seorang mata-mata, yang dibingkai sebagai ancaman terhadap keamanan nasional AS. Ia merilis pernyataan mengakui hubungan itu, dan tuduhan mata-mata dibantah. Saat kontroversi itu mereda, muncul laporan tentang hubungan dengan seorang bawahan. Akhirnya ia pun mengundurkan diri.

  Huang adalah jantung Nvidia. Ia yang mendirikan dan memimpinnya selama lebih dari tiga puluh tahun.

  Di sisi teknologi, visinya yang membangun keunggulan yang dimiliki Nvidia hari ini, keputusan demi keputusan yang diambil lebih awal dari zamannya.

  Di pasar, latar belakangnya — lahir di Taiwan, Tiongkok, berdarah Tionghoa, dan warga negara AS — memungkinkannya bergerak bebas di kedua belah pihak, dengan dukungan dari tempat yang memproduksi sebagian besar chip canggih dunia.

  Di manajemen juga sulit digantikan. Hingga 60 eksekutif melapor langsung kepadanya. Struktur Nvidia yang tidak biasa datar berjalan karena energi dan pengalaman bertahun-tahunnya di bidang ini.

  Saat hubungan AS-Tiongkok dan Selat Taiwan kian sensitif, Huang adalah orang yang hampir sempurna untuk momen itu. Dan ia dipaksa keluar karena sebuah hubungan.

  Sebelum pasar selesai mencerna pengunduran dirinya, Anthropic, perusahaan model terdepan, melancarkan pukulan ketiga.

  Anthropic adalah perusahaan yang paling dinanti dalam siklus AI ini. Mereka punya model terkuat yang tersedia dan berada di garis depan dalam menarik uang dari pengguna. Pertumbuhan pendapatannya adalah mesin yang mendorong perdagangan AI naik.

  Mesin itu kini terlihat hampir kehabisan tenaga. Dokumen IPO-nya menunjukkan pertumbuhan pendapatan kuartal-ke-kuartal 144% di kuartal kedua, turun menjadi 47% di kuartal ketiga. Dengan laju itu, pertumbuhan pendapatan segera mendekati nol.

  Rantai pasok sedang berada di tengah ledakan pembangunan, sementara pendapatan model terbaik mulai mendatar.

  Pengunduran diri Huang paling-paling bisa menjatuhkan Nvidia. Tapi jika sinyal dari Anthropic terbukti — bahwa pendapatannya sudah memuncak — maka seluruh rantai pasok yang sibuk membangun kapasitas akan ikut ambruk.
