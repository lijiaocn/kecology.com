title: "Drei Schocks in zehn Tagen: Bekommt der KI-Hype an der US-Börse erste Risse?"
description: "Eine Zwischenwahl, der Rücktritt des Nvidia-Chefs nach einem Skandal und der Börsengang von Anthropic haben die US-KI-Lieferkette nacheinander getroffen. Das letzte dürfte am meisten wiegen: Das Umsatzwachstum verlangsamt sich, gerade während die Branche ihre Kapazitäten ausbaut."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  In den letzten zwei Wochen haben drei einschneidende Ereignisse die US-KI-Lieferkette getroffen.

  Zuerst kam die Zwischenwahl. Der politische Wind drehte, und der Markt wurde pessimistisch, was die Zukunft des Rechenzentrumsbaus in den USA angeht. Die Hardware-Aktien, die an diesem Ausbau hängen, sind abverkauft worden.

  Dann, gerade als die Hoffnung bei den Rechenzentren wieder wuchs, wurde der tragende Pfeiler der ganzen Kette gekappt: Nvidia.

  Jensen Huang, der Chef von Nvidia, wurde zuerst mit einer Affäre mit einer Spionin in Verbindung gebracht, die als Bedrohung für die nationale Sicherheit der USA dargestellt wurde. Er veröffentlichte eine Erklärung, in der er die Affäre einräumte, und der Spionagevorwurf wurde widerlegt. Gerade als das abebbte, tauchten Berichte über eine Beziehung zu einer Untergebenen auf. Am Ende trat er zurück.

  Huang ist der Kern von Nvidia. Er hat das Unternehmen gegründet und führt es seit mehr als dreißig Jahren.

  Technologisch ist es seine Weitsicht, die den Burggraben gebaut hat, den Nvidia heute hat, Entscheidung für Entscheidung vor allen anderen getroffen.

  Bei den Märkten half ihm sein Hintergrund, sich auf beiden Seiten sicher zu bewegen: in Taiwan, China geboren, chinesischer Abstammung und US-amerikanischer Staatsbürger, hatte er den Rückhalt des Ortes, der den Großteil der weltweiten Spitzenchips herstellt.

  Auch als Manager ist er schwer zu ersetzen. Bis zu 60 Führungskräfte berichten direkt an ihn. Nvidias ungewöhnlich flache Organisation läuft auf seine Energie und seine jahrelange Erfahrung im Fachgebiet.

  Zu einer Zeit, da die Beziehungen zwischen den USA und China heikler werden und damit auch die Spannungen in der Taiwan-Straße, war Huang fast der ideale Mann für den Moment. Und er wurde wegen einer Affäre hinausgedrängt.

  Bevor der Markt seinen Rücktritt überhaupt verdaut hatte, setzte Anthropic, das führende Unternehmen für Spitzenmodelle, den dritten Schlag.

  Anthropic war das meist erwartete Unternehmen dieses KI-Zyklus. Es hat das stärkste verfügbare Modell und steht an vorderster Front, wenn es darum geht, Geld von Nutzern einzunehmen. Sein Umsatzwachstum ist der Motor, der die KI-Wette nach oben getrieben hat.

  Dieser Motor scheint jetzt fast leer zu laufen. Die Unterlagen zum Börsengang zeigen ein Umsatzwachstum von Quartal zu Quartal von 144 % im zweiten Quartal, das im dritten auf 47 % sinkt. In diesem Tempo liegt das Umsatzwachstum bald nahe bei null.

  Die Lieferkette steckt mitten in einem Bauboom, während die Umsätze des allerbesten Modells zu stagnieren beginnen.

  Huangs Rücktritt kann höchstens Nvidia mitreißen. Aber wenn das Signal von Anthropic bestätigt wird, dass der Umsatz seinen Höhepunkt erreicht hat, dann geht die ganze Kette, die gerade Kapazitäten aufbaut, mit unter.
