title: "Tre scossoni in dieci giorni: la scommessa sull'IA nella borsa americana sta iniziando a incrinarsi?"
description: "Elezioni di metà mandato, le dimissioni dell'amministratore delegato di Nvidia per uno scandalo e la quotazione in borsa di Anthropic hanno colpito in sequenza la catena di approvvigionamento dell'IA negli Stati Uniti. L'ultima conta forse di più: la crescita dei ricavi sta rallentando proprio mentre il settore amplia le capacità."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  Nelle ultime due settimane tre grossi eventi hanno investito la catena di approvvigionamento dell'IA negli Stati Uniti.

  Prima sono arrivate le elezioni di metà mandato. Il vento politico è cambiato e il mercato è diventato pessimista sul futuro della costruzione di data center negli USA. Le azioni hardware legate a quella crescita sono crollate.

  Poi, proprio quando la speranza sui data center cominciava a tornare, è stato tagliato il pilastro portante di tutta la catena: Nvidia.

  Jensen Huang, l'amministratore delegato di Nvidia, è finito prima sui giornali per una presunta relazione con una spia, presentata come una minaccia per la sicurezza nazionale americana. Ha pubblicato una dichiarazione in cui ammetteva la relazione, e l'accusa di spionaggio è stata smentita. Mentre quella storia si spegneva, sono emerse voci di un legame con una dipendente. Alla fine si è dimesso.

  Huang è il cuore di Nvidia. L'ha fondata e la guida da più di trent'anni.

  Sul piano tecnologico, è la sua lungimiranza ad aver costruito il fossato difensivo che Nvidia ha oggi, decisione dopo decisione presa prima di tutti.

  Sui mercati, il suo background gli permetteva di muoversi a suo agio da entrambe le parti: nato a Taiwan, Cina, di etnia cinese e con cittadinanza americana, aveva alle spalle il sostegno del luogo che produce la maggior parte dei chip avanzati del mondo.

  Anche come manager è difficilissimo da sostituire. Fino a 60 dirigenti riportano direttamente a lui. L'organizzazione insolitamente piatta di Nvidia si regge sulla sua energia e sui suoi anni di esperienza nel settore.

  In un momento in cui i rapporti tra Stati Uniti e Cina diventano più delicati, e con essi le tensioni nello stretto di Taiwan, Huang era quasi la persona ideale per il momento. Ed è stato estromesso per una vicenda sentimentale.

  Prima ancora che il mercato finisse di digerire le sue dimissioni, Anthropic, la principale azienda dei modelli all'avanguardia, ha inferto il terzo colpo.

  Anthropic era l'azienda più attesa di questo ciclo dell'IA. Ha il modello più forte disponibile ed è in prima linea quando si tratta di incassare i soldi degli utenti. La sua crescita dei ricavi è il motore che ha spinto in alto la scommessa sull'IA.

  Ora quel motore sembra essere vicino a esaurire la carica. I documenti per la quotazione mostrano una crescita dei ricavi su base trimestrale del 144% nel secondo trimestre, scesa al 47% nel terzo. A questo ritmo, la crescita dei ricavi sarà presto vicina a zero.

  La catena di approvvigionamento è in pieno boom edilizio, mentre i ricavi del modello migliore in assoluto iniziano a stabilizzarsi.

  Le dimissioni di Huang possono, al massimo, far cadere Nvidia. Ma se il segnale di Anthropic verrà confermato, e cioè che i ricavi hanno raggiunto il picco, allora tutta la catena impegnata a costruire capacità cadrà insieme a essa.
