title: "Три шока за десять дней: начинает ли трещать ставка на ИИ в акциях США?"
description: "Промежуточные выборы, отставка главы Nvidia из-за скандала и IPO Anthropic по очереди ударили по американской цепочке поставок ИИ. Последнее может оказаться важнее всего: рост выручки замедляется как раз тогда, когда отрасль наращивает мощности."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  За последние пару недель американскую цепочку поставок ИИ потрясли три крупных события.

  Сначала прошли промежуточные выборы. Политический ветер переменился, и рынок стал пессимистичнее смотреть на будущее строительства дата-центров в США. Акции компаний, поставляющих оборудование для этой стройки, просели.

  Потом, когда надежды на дата-центры начали было возвращаться, у всей цепочки выбили несущую опору: Nvidia.

  Про Дженсена Хуанга, главу Nvidia, сначала написали, что у него был роман со шпионкой — и это сразу подали как угрозу национальной безопасности США. Он выложил заявление, признав связь, а обвинение в шпионаже позже опровергли. Когда история стала утихать, всплыли сообщения об отношениях с подчинённой. В итоге он подал в отставку.

  Хуанг — это сама суть Nvidia. Он её основал и руководит уже больше тридцати лет.

  В технологиях именно его прозорливость создала тот ров, который есть у Nvidia сегодня: решение за решением, принятым с опережением.

  На рынках ему помогало происхождение — Тайвань, Китай, китайская кровь и американское гражданство. Он свободно чувствовал себя по обе стороны, а за ним стояло место, где производят большинство передовых чипов мира.

  В управлении его тоже непросто заменить. До 60 руководителей отчитываются напрямую перед ним. Необычно плоская структура Nvidia держится на его энергии и годах работы в отрасли.

  В момент, когда отношения между США и Китаем и Тайваньский пролив становятся всё более чувствительной темой, Хуанг был почти идеальным человеком для этого времени. И его выдавили из-за романа.

  Пока рынок ещё переваривал его отставку, Anthropic — ведущая компания в сфере передовых моделей — нанесла третий удар.

  Anthropic была самой ожидаемой компанией этого цикла ИИ. У неё сильнейшая из доступных моделей, и она стоит на переднем крае, собирая деньги с пользователей. Рост её выручки — тот двигатель, который гнал ставку на ИИ вверх.

  Этот двигатель теперь выглядит так, будто вот-вот выдохнется. Заявка на IPO показывает рост выручки на 144% во втором квартале по сравнению с предыдущим, а в третьем — уже 47%. При таком темпе рост выручки скоро будет около нуля.

  Цепочка поставок в середине строительного бума, а выручка у лучшей из моделей начинает выходить на плато.

  Отставка Хуанга может уронить разве что Nvidia. Но если сигнал от Anthropic подтвердится — что её выручка достигла пика, — тогда вся цепочка, занятая наращиванием мощностей, рухнет вместе с ней.
