title: "10일 새 세 번의 충격: 미국 주식 AI 랠리, 균열이 생기기 시작한 걸까?"
description: "중간선거, 엔비디아 CEO의 스캔들 사임, 앤트로픽의 IPO가 미국 AI 공급망을 잇달아 때렸다. 가장 중요할지는 마지막일지도 모른다. 업계가 설비를 늘리는 데 매출 성장세는 오히려 둔화되고 있으니까."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  지난 2주 남짓 미국 AI 공급망에 큰 일이 세 번이나 터졌다.

  먼저 중간선거였다. 정국 바람이 바뀌더니 미국 데이터센터 건설의 앞날을 시장이 비관적으로 보기 시작했고, 거기 얽힌 하드웨어 주식들이 떨어졌다.

  그다음, 데이터센터에 대한 기대가 겨우 살아나기 시작하던 참에 공급망 전체를 받치던 기둥이 잘려 나갔다. 엔비디아였다.

  엔비디아 CEO 젠슨 황은 처음에 간첩과 불륜이었다는 보도가 나왔고, 그게 미국 국가안보에 대한 위협으로 몰렸다. 그는 성명을 내어 불륜을 인정했고 간첩 의혹은 사실이 아닌 걸로 드러났다. 그게 가라앉을 무렵 이번엔 부하 직원과의 관계가 보도됐다. 결국 사임했다.

  황은 엔비디아의 핵심이다. 창업자이고, 30년 넘게 이끌어 왔다.

  기술 면에서 오늘의 엔비디아를 만든 건 그의 선견지명이다. 한 수 앞을 내다본 결정을 차곡차곡 쌓아 올린 결과다.

  시장 면에서 그의 출신도 한몫했다. 중국 타이완 지역 출생에 중국계, 미국 국적이다. 양쪽을 편하게 오갈 수 있었고, 세계 첨단 칩 대부분을 만드는 곳의 뒷받침까지 받았다.

  경영 면에서도 대체가 쉽지 않다. 60명이나 되는 임원이 그에게 직접 보고한다. 엔비디아의 이례적으로 수평적인 조직은 그의 에너지와 오랜 현장 경험으로 돌아간다.

  미중 관계와 타이완 해협이 점점 민감해지는 시점에서 황은 그야말로 딱 좋은 사람이었다. 그런데 불륜 때문에 밀려났다.

  시장이 사임을 다 소화하지도 않았을 때, 최첨단 모델 분야의 선두 주자 앤트로픽이 세 번째 일격을 날렸다.

  앤트로픽은 이번 AI 사이클에서 가장 기대를 모은 회사다. 가장 강력한 모델을 갖고 있고, 사용자에게 돈을 받는 최전선에 서 있다. 그 매출 성장이 AI 랠리를 끌어올린 엔진이었다.

  그 엔진이 지금 숨이 차기 시작한 것 같다. IPO 서류를 보면 2분기 매출이 전분기 대비 144% 늘었다가 3분기엔 47%로 떨어졌다. 이 속도라면 매출 증가세는 금세 제로에 가까워진다.

  공급망은 설비 증설 한창인데, 가장 뛰어난 모델의 매출은 이미 정체되기 시작한 듯하다.

  황이 사임해도 아마 엔비디아 한 회사만 무너지는 정도일 것이다. 하지만 앤트로픽이 보낸 신호가 사실이고 매출이 정점을 찍은 게 확인된다면, 증설에 바쁜 공급망 전체가 함께 무너질 것이다.
