title: "Three Shocks in Ten Days: Is the AI Trade in US Stocks Starting to Crack?"
description: "A midterm election, Nvidia's CEO resigning over a scandal, and Anthropic's IPO hit the US AI supply chain in sequence. The last one may matter most: its revenue growth is slowing just as the industry builds out capacity."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  Three big events have hit the US AI supply chain in the past couple of weeks.

  First came the midterm election. The political wind shifted, and the market grew pessimistic about the future of data centre construction in the US. The hardware stocks tied to that build-out sold off.

  Then, just as hopes for data centres started to recover, the load-bearing pillar of the whole chain was cut off: Nvidia.

  Jensen Huang, Nvidia's chief executive, was first reported to have had an affair with a spy, which was framed as a threat to US national security. He posted a statement admitting the affair, and the spy allegation was disproven. Just as that was dying down, reports surfaced of a relationship with a subordinate. In the end he resigned.

  Huang is the core of Nvidia. He founded it and has led it for more than thirty years.

  On technology, his foresight is what built the moat Nvidia has today, decision after decision made ahead of the curve.

  On markets, his background — born in Taiwan, China, ethnically Chinese, and American by citizenship — let him move comfortably between both sides, with the backing of the place that manufactures most of the world's advanced chips.

  On management he is just as hard to replace. As many as 60 executives report directly to him. Nvidia's unusually flat organisation runs on his energy and his years of domain experience.

  At a time when US-China relations and the Taiwan Strait are growing more sensitive, Huang was close to the ideal person for the moment. And he was forced out over an affair.

  Before the market had finished digesting his resignation, Anthropic, the leading frontier-model company, landed the third blow.

  Anthropic was the most anticipated company of this AI cycle. It has the strongest model available and sits on the front line of collecting money from users. Its revenue growth is the engine that has driven the AI trade higher.

  That engine now looks close to running out of power. Its IPO filing shows quarter-on-quarter revenue growth of 144% in the second quarter, falling to 47% in the third. At that pace, revenue growth will soon be close to zero.

  The supply chain is in the middle of a construction boom, while the revenue of the very best model is starting to plateau.

  Huang's resignation could take down Nvidia at most. But if the signal from Anthropic is confirmed — that its revenue has peaked — then the whole supply chain busy building capacity will go down with it.
