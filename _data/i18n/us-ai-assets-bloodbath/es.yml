title: "Tres sacudidas en diez días: ¿se está agrietando la apuesta por la IA en la bolsa de EE. UU.?"
description: "Unas elecciones legislativas, la dimisión del consejero delegado de Nvidia por un escándalo y la salida a bolsa de Anthropic han golpeado una tras otra la cadena de suministro de IA de Estados Unidos. La última quizá sea la que más importe: su crecimiento de ingresos se está frenando justo cuando el sector sigue ampliando capacidad."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  En las últimas dos semanas han caído tres golpes fuertes sobre la cadena de suministro de IA de Estados Unidos.

  Primero vinieron las elecciones legislativas. Cambió el viento político y el mercado empezó a ver con pesimismo el futuro de los centros de datos en el país. Las acciones de hardware ligadas a esa expansión se desplomaron.

  Después, justo cuando las esperanzas en los centros de datos empezaban a recuperarse, saltó el pilar que sostenía toda la cadena: Nvidia.

  Jensen Huang, el consejero delegado de Nvidia, salió primero en los periódicos por una supuesta aventura con una espía, presentada como una amenaza a la seguridad nacional de EE. UU. Publicó un comunicado admitiendo la relación y la acusación de espionaje se descartó. Cuando aquello aún se apagaba, aparecieron informes de otra relación con una subordinada. Al final, dimitió.

  Huang es el alma de Nvidia. La fundó y la ha dirigido durante más de treinta años.

  En tecnología, su visión es lo que construyó el foso defensivo que tiene hoy Nvidia, decisión tras decisión tomada antes que los demás.

  En los mercados, su trayectoria le permitía moverse con soltura a ambos lados: nacido en Taiwán, China, de etnia china y con ciudadanía estadounidense, contaba con el respaldo del lugar que fabrica la mayor parte de los chips avanzados del mundo.

  En gestión también es difícil de reemplazar. Hasta 60 directivos reportan directamente ante él. La estructura inusualmente plana de Nvidia se sostiene con su energía y sus años de experiencia en el sector.

  En un momento en que las relaciones entre Estados Unidos y China se vuelven más delicadas, y con ellas la tensión en el estrecho de Taiwán, Huang era casi la persona ideal para el momento. Y lo han sacado por una aventura.

  Antes de que el mercado terminara de digerir su dimisión, Anthropic, la principal empresa de modelos de vanguardia, asestó el tercer golpe.

  Anthropic era la empresa más esperada de este ciclo de IA. Tiene el modelo más potente disponible y está en primera línea a la hora de cobrar a los usuarios. Su crecimiento de ingresos es el motor que ha empujado al alza la apuesta por la IA.

  Ese motor ahora parece estar quedándose sin fuelle. Su documentación para la salida a bolsa muestra un crecimiento de ingresos intertrimestral del 144 % en el segundo trimestre, que cae al 47 % en el tercero. A ese ritmo, el crecimiento de ingresos pronto estará cerca de cero.

  La cadena de suministro está en pleno auge de construcción, mientras los ingresos del mejor modelo empiezan a estancarse.

  La dimisión de Huang, como mucho, puede hundir a Nvidia. Pero si se confirma la señal de Anthropic —que sus ingresos han tocado techo—, toda la cadena ocupada en ampliar capacidad caerá con ella.
