title: "สามแรงกระแทกในสิบวัน: การเทรด AI ในหุ้นสหรัฐกำลังเริ่มแตกร้าวไหม"
description: "การเลือกตั้งกลางเทอม การลาออกของผู้บริหารสูงสุดของ Nvidia จากเรื่องอื้อฉาว และ IPO ของ Anthropic โจมตีห่วงโซ่อุปทาน AI ของสหรัฐต่อเนื่องกัน โดยรายการหลังอาจสำคัญที่สุด เพราะการเติบโตของรายได้กำลังชะลอลงขณะที่อุตสาหกรรมกำลังเพิ่มกำลังการผลิต"
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  สามเหตุการณ์ใหญ่โจมตีห่วงโซ่อุปทาน AI ของสหรัฐในช่วงสองสามสัปดาห์ที่ผ่านมา

  มาก่อนคือการเลือกตั้งกลางเทอม กระแสการเมืองเปลี่ยนทิศ ตลาดเริ่มมองอนาคตการสร้างศูนย์ข้อมูลในสหรัฐในแง่ร้าย หุ้นฮาร์ดแวร์ที่เกี่ยวข้องกับการก่อสร้างนี้ก็ร่วงลงตาม

  แล้วก็ตอนที่ความหวังเรื่องศูนย์ข้อมูลเริ่มฟื้นขึ้น เสาหลักที่ค้ำอยู่ทั้งห่วงโซ่ก็ถูกตัดขาด นั่นคือ Nvidia

  เจนเซน ฮวง ผู้บริหารสูงสุดของ Nvidia ถูกสื่อรายงานก่อนหน้าว่าเคยมีสัมพันธ์กับสายลับ ซึ่งถูกตีความว่าเป็นภัยต่อความมั่นคงแห่งชาติของสหรัฐ เขาโพสต์แถลงการณ์ยอมรับความสัมพันธ์ดังกล่าว และข้อกล่าวหาเรื่องสายลับก็ถูกพิสูจน์ว่าไม่เป็นความจริง พอเรื่องนี้กำลังซาลง ก็มีรายงานเกี่ยวกับความสัมพันธ์กับพนักงานใต้สังกัดปรากฏขึ้น และท้ายที่สุดเขาก็ลาออก

  ฮวงคือแกนกลางของ Nvidia เขาเป็นผู้ก่อตั้งและบริหารบริษัทมามากกว่าสามสิบปี

  ด้านเทคโนโลยี วิสัยทัศน์ของเขาคือสิ่งที่สร้างคูน้ำทางธุรกิจที่ Nvidia มีอยู่ทุกวันนี้ การตัดสินใจทีแล้วมาทีทำให้บริษัทนำหน้าคู่แข่งอยู่เสมอ

  ด้านตลาด พื้นฐานของเขา — เกิดที่ไต้หวัน ประเทศจีน เชื้อสายจีน และมีสัญชาติอเมริกัน — ทำให้เขาเดินไปมาอย่างสบายใจระหว่างสองฝ่าย โดยมีสถานที่ที่ผลิตชิปขั้นสูงส่วนใหญ่ของโลกอยู่เบื้องหลัง

  ด้านการบริหารก็ยากจะหาคนมาแทนไม่แพ้กัน ผู้บริหารระดับสูงถึง 60 คนรายงานตรงต่อเขา โครงสร้างที่ค่อนข้างแบนราบของ Nvidia ทำงานได้ด้วยพลังงานของเขาและประสบการณ์หลายปีในสายงานนี้

  ในช่วงที่ความสัมพันธ์ระหว่างสหรัฐกับจีนและช่องแคบไต้หวันกำลังกลายเป็นเรื่องละเอียดอ่อนมากขึ้น ฮวงคือคนที่เหมาะสมกับจังหวะนี้มากที่สุด และเขาก็ถูกบีบให้ออกไปเพราะเรื่องสัมพันธ์

  ก่อนที่ตลาดจะย่อยข่าวการลาออกของเขาเสร็จ Anthropic บริษัทชั้นนำด้านโมเดลขั้นแนวหน้า ก็เข้าโจมตีครั้งที่สาม

  Anthropic คือบริษัทที่ถูกคาดหวังมากที่สุดในรอบ AI นี้ มีโมเดลที่แข็งแกร่งที่สุดเท่าที่มีอยู่ และอยู่แนวหน้าในการเก็บเงินจากผู้ใช้ การเติบโตของรายได้คือเครื่องยนต์ที่ดันให้การเทรด AI พุ่งขึ้นมา

  ตอนนี้เครื่องยนต์นั้นดูเหมือนใกล้หมดแรง เอกสารยื่น IPO ของบริษัทแสดงให้เห็นว่ารายได้เติบโต 144% ในไตรมาสที่สองเมื่อเทียบกับไตรมาสก่อน และลดลงมาเหลือ 47% ในไตรมาสที่สาม ถ้าเป็นไปตามจังหวะนี้ การเติบโตของรายได้จะใกล้ศูนย์ในไม่ช้า

  ห่วงโซ่อุปทานกำลังอยู่กลางช่วงการก่อสร้างที่คึกคัก ขณะที่รายได้ของโมเดลที่ดีที่สุดเริ่มทรงตัว

  การลาออกของฮวง อย่างมากก็แค่ดึง Nvidia ลงมาได้ครั้งเดียว แต่ถ้าสัญญาณจาก Anthropic ได้รับการยืนยันว่ารายได้ขึ้นถึงจุดสูงสุดแล้ว ห่วงโซ่อุปทานทั้งหมดที่กำลังเร่งสร้างกำลังการผลิตก็จะล่มตามไปด้วย
