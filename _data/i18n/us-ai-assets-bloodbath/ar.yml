title: "ثلاث صدمات في عشرة أيام: هل بدأت موجة الذكاء الاصطناعي في الأسهم الأمريكية بالتشقق؟"
description: "انتخابات نصفية، واستقالة رئيس nvidia على خلفية فضيحة، وطرح anthropic للاكتتاب — ضربت سلسلة توريد الذكاء الاصطناعي في أمريكا واحدة تلو الأخرى. والأخيرة قد تكون الأهم: نمو إيراداتها يتباطأ في الوقت الذي يوسّع فيه القطاع طاقته."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  ثلاثة أحداث كبيرة ضربت سلسلة توريد الذكاء الاصطناعي في أمريكا خلال الأسبوعين الماضيين.

  أولها الانتخابات النصفية. تغيّرت الريح السياسية، وصار السوق متشائماً بشأن مستقبل بناء مراكز البيانات في أمريكا. أسهم العتاد المرتبطة بهذا التوسع هوت.

  ثم، بعدما بدأت الآمال في مراكز البيانات تعود، جاء من يقطع الركيزة التي يحمل عليها كل السلسلة: nvidia.

  جينسن هوانغ، الرئيس التنفيذي لشركة nvidia، تناقلت التقارير أولاً أنه أقام علاقة مع جاسوس، وهو ما صُوِّر كتهديد للأمن القومي الأمريكي. نشر بياناً اعترف فيه بالعلاقة، ودُحضت مزاعم التجسس. وما إن هدأت الضجة حتى ظهرت تقارير عن علاقة مع مرؤوسة. وفي النهاية استقال.

  هوانغ هو قلب nvidia. هو من أسّسها وقادها لأكثر من ثلاثين عاماً.

  في التكنولوجيا، بُعد نظره هو الذي صنع الخندق التنافسي الذي تتمتع به nvidia اليوم، قراراً تلو قرار اتُّخذ قبل منحنى السوق.

  في الأسواق، خلفيته — وُلد في تايوان، الصين، من أصل صيني، وبجنسية أمريكية — أتاحت له التحرك بسهولة بين الجانبين، مدعوماً بالمكان الذي يصنع معظم الرقائق المتقدمة في العالم.

  في الإدارة يصعب تعويضه بالقدر نفسه. ما يصل إلى 60 مديراً يقدّمون له تقاريرهم مباشرة. هيكل nvidia المسطّح بشكل غير معتاد يقوم على طاقته وسنوات خبرته في المجال.

  في وقت تتزايد فيه حساسية العلاقات الأمريكية الصينية ومضيق تايوان، كان هوانغ أقرب ما يكون إلى الشخص المثالي لهذه اللحظة. ثم أُجبر على الرحيل بسبب علاقة.

  وقبل أن ينتهي السوق من هضم استقالته، جاءت anthropic، الشركة الرائدة في النماذج المتقدمة، بالضربة الثالثة.

  كانت anthropic أكثر الشركات انتظاراً في هذه الموجة. تملك أقوى نموذج متاح، وتقف في الخط الأمامي لتحصيل المال من المستخدمين. نمو إيراداتها هو المحرك الذي دفع تجارة الذكاء الاصطناعي إلى الأعلى.

  هذا المحرك يبدو الآن على وشك نفاد الزخم. أوراق اكتتابها تُظهر نمواً في الإيرادات ربعاً بعد ربع بنسبة 144% في الربع الثاني، تراجع إلى 47% في الربع الثالث. وعلى هذا المعدل، سيقترب نمو الإيرادات من الصفر قريباً.

  سلسلة التوريد في منتصف طفرة بناء، في حين بدأت إيرادات أفضل نموذج تصل إلى سقفها.

  استقالة هوانغ قد تُسقط nvidia على أكثر تقدير. أما إذا تأكدت إشارة anthropic — أن إيراداتها بلغت ذروتها — فإن سلسلة التوريد بأكملها، المنشغلة ببناء الطاقة، ستنهار معها.
