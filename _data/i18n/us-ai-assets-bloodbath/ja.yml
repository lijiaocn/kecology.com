title: "10日で三連撃：米国株のAI相場、ひびが入り始めた？"
description: "中間選挙、エヌビディアCEOのスキャンダル辞任、アンソロピックのIPO。米国のAIサプライチェーンを次々と襲った。一番効きそうなのは最後かもしれない——業界が設備増強を進める中、売上の伸びが鈍ってきているから。"
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  ここ2週間ほど、米国のAIサプライチェーンに大きな出来事が三つ続いた。

  まず中間選挙だ。風向きが変わって、米国のデータセンター建設の先行きを市場が悲観的に見始め、関連するハードウェア株が売られた。

  次に、データセンターへの期待がやっと戻りかけたところで、チェーン全体を支えてきた柱がポキリと折れた。エヌビディアのことだ。

  エヌビディアのCEO、ジェンセン・フアンは、最初にスパイと不倫していたと報じられ、それが米国の国家安全保障への脅威だと書き立てられた。本人は声明を出して不倫を認め、スパイ疑惑は否定された。それが沈静化しかけた矢先、今度は部下との関係が報じられた。結局、辞任に追い込まれた。

  フアンはエヌビディアそのものだ。創業者で、30年以上ずっと舵を握ってきた。

  技術の面では、今のエヌビディアの強さを作ったのは彼の先見性だ。先回りした判断をひとつまたひとつ重ねてきた結果だ。

  市場の面でも、この経歴は大きい。中国・台湾地区生まれで、中国系、米国国籍。両側に無理なく立てるうえに、世界の先進半導体の多くを生産する場所を後ろ盾にしていた。

  組織運営も同様で、代わりがなかなかいない。60人もの幹部が直接彼に報告する。エヌビディアの珍しいフラットな組織は、彼のエネルギーと長年の現場経験で回っている。

  米中関係も台湾海峡も敏感さを増している時期で、フアンはまさにそのときに一番ふさわしい人物だった。なのに、不倫で追いやられた。

  市場が辞任を消化しきらないうちに、フロンティアモデルの筆頭格、アンソロピックが三度目の一撃を落とした。

  アンソロピックはこのAIブームで最も期待されていた会社だ。最強のモデルを持ち、ユーザーからお金を集める最前線にいる。その売上成長が、AI相場を押し上げてきたエンジンだった。

  そのエンジンが、今にも息切れしそうだ。IPOの申請書類を見ると、第2四半期は前期比144%の成長だったのが、第3四半期には47%に落ちている。このペースだと、売上の伸びはすぐゼロに近づく。

  供給チェーンは設備増強の真っただ中なのに、いちばん優れたモデルの売上はもう頭打ちになりかけているような気がする。

  フアンが辞めたところで、せいぜいエヌビディア一社が沈むくらいだ。ただ、アンソロピックの信号が本物で、売上がピークを打ったと確認されれば、増強に忙しい供給チェーン全体が一緒に沈む。
