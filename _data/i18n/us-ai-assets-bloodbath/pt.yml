title: "Três choques em dez dias: a aposta em IA nas ações dos EUA está começando a rachar?"
description: "Uma eleição de meio de mandato, a renúncia do CEO da Nvidia por um escândalo e o IPO da Anthropic atingiram a cadeia de suprimentos de IA dos EUA em sequência. O último pode importar mais: o crescimento da receita está desacelerando justamente quando o setor amplia a capacidade."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  Três eventos grandes atingiram a cadeia de suprimentos de IA dos Estados Unidos nas últimas duas semanas.

  Primeiro veio a eleição de meio de mandato. O vento político mudou, e o mercado ficou pessimista quanto ao futuro da construção de centros de dados nos EUA. As ações de hardware ligadas a essa expansão caíram.

  Depois, justamente quando as esperanças com os centros de dados começavam a se recuperar, o pilar de sustentação de toda a cadeia foi cortado: a Nvidia.

  Jensen Huang, o CEO da Nvidia, primeiro foi noticiado como tendo tido um caso amoroso com uma espiã — isso foi tratado como ameaça à segurança nacional dos EUA. Ele publicou um comunicado admitindo o caso, e a acusação de espionagem acabou desmentida. Quando o assunto ainda esfriava, apareceram relatos de um relacionamento com uma subordinada. No fim, ele renunciou.

  Huang é o coração da Nvidia. Ele fundou a empresa e a lidera há mais de trinta anos.

  Na tecnologia, a visão dele construiu o fosso competitivo que a Nvidia tem hoje — decisão após decisão tomada à frente da curva.

  No mercado, sua origem — nascido em Taiwan, China, de etnia chinesa e cidadania americana — permitia que ele se movesse à vontade entre os dois lados, com o respaldo do lugar que fabrica a maior parte dos chips avançados do mundo.

  Na gestão, é igualmente difícil de substituir. Chegam a 60 executivos reportando diretamente a ele. A estrutura incomumente plana da Nvidia funciona graças à energia dele e aos anos de experiência no setor.

  Num momento em que as relações entre EUA e China e o Estreito de Taiwan ficam mais sensíveis, Huang era quase a pessoa ideal para o momento. E foi forçado a sair por causa de um caso amoroso.

  Antes de o mercado terminar de digerir a renúncia, a Anthropic, a principal empresa de modelos de fronteira, desferiu o terceiro golpe.

  A Anthropic era a empresa mais aguardada deste ciclo de IA. Tem o modelo mais forte disponível e está na linha de frente na hora de tirar dinheiro dos usuários. O crescimento da receita dela é o motor que vem empurrando a aposta em IA para cima.

  Esse motor agora parece estar ficando sem fôlego. O prospecto do IPO mostra crescimento de receita de 144% no segundo trimestre na comparação com o anterior, caindo para 47% no terceiro. Nesse ritmo, o crescimento da receita logo ficará perto de zero.

  A cadeia de suprimentos está no meio de um boom de construção, enquanto a receita do melhor modelo começa a estabilizar.

  A renúncia de Huang pode derrubar a Nvidia, no máximo. Mas se o sinal da Anthropic se confirmar — de que a receita já atingiu o pico —, então toda a cadeia ocupada em ampliar capacidade cai junto.
