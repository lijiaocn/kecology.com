title: "Ba cú sốc trong mười ngày: Thương vụ AI trong cổ phiếu Mỹ có bắt đầu nứt vỡ?"
description: "Một cuộc bầu cử giữa nhiệm kỳ, việc CEO Nvidia từ chức vì bê bối và đợt IPO của Anthropic đã lần lượt giáng vào chuỗi cung ứng AI của Mỹ. Cú cuối có thể quan trọng nhất: tăng trưởng doanh thu đang chậm lại đúng lúc ngành ồ ạt mở rộng công suất."
image: /assets/img/blog/us-ai-assets-bloodbath/us-ai-assets-bloodbath-cover.png

body: |
  Ba sự kiện lớn đã giáng vào chuỗi cung ứng AI của Mỹ trong vài tuần qua.

  Đầu tiên là cuộc bầu cử giữa nhiệm kỳ. Chiều gió chính trị đổi hướng, và thị trường trở nên bi quan về tương lai của việc xây dựng các trung tâm dữ liệu tại Mỹ. Cổ phiếu phần cứng gắn với đợt xây dựng đó đã bán tháo.

  Rồi, đúng lúc hy vọng vào các trung tâm dữ liệu bắt đầu hồi phục, trụ cột chịu lực của cả chuỗi bị chặt đứt: Nvidia.

  Jensen Huang, CEO của Nvidia, ban đầu bị đưa tin là từng có quan hệ với một điệp viên, và chuyện đó được dựng lên thành mối đe dọa với an ninh quốc gia Mỹ. Anh đã đăng tuyên bố thừa nhận mối quan hệ, còn cáo buộc gián điệp bị bác bỏ. Vừa lúc chuyện đó đang lắng xuống thì xuất hiện tin về một mối quan hệ với cấp dưới. Cuối cùng anh từ chức.

  Huang là hạt nhân của Nvidia. Anh sáng lập và điều hành công ty hơn ba mươi năm.

  Về công nghệ, chính tầm nhìn của anh đã tạo nên con hào phòng thủ mà Nvidia có ngày nay — quyết định này nối tiếp quyết định khác, luôn đi trước đường cong.

  Về thị trường, xuất thân của anh — sinh ra ở Đài Loan, Trung Quốc, gốc Hoa và mang quốc tịch Mỹ — giúp anh di chuyển thoải mái giữa hai phía, với sự hậu thuẫn từ nơi sản xuất phần lớn chip tiên tiến nhất thế giới.

  Về quản trị, anh cũng khó thay thế không kém. Có tới 60 giám đốc điều hành báo cáo trực tiếp với anh. Cấu trúc phẳng bất thường của Nvidia vận hành nhờ năng lượng của anh và nhiều năm kinh nghiệm trong ngành.

  Vào lúc quan hệ Mỹ - Trung và eo biển Đài Loan đang trở nên nhạy cảm hơn, Huang gần như là người hoàn hảo cho thời điểm này. Thế mà anh bị đẩy ra đi chỉ vì một mối quan hệ.

  Trước khi thị trường kịp tiêu hóa hết tin từ chức, Anthropic — công ty hàng đầu về mô hình tiên phong — đã giáng cú thứ ba.

  Anthropic là công ty được chờ đợi nhất trong chu kỳ AI này. Họ có mô hình mạnh nhất hiện có và đứng ở tuyến đầu trong việc thu tiền từ người dùng. Tăng trưởng doanh thu của họ là động cơ đã đẩy thương vụ AI đi lên.

  Giờ động cơ đó có vẻ sắp hết nhiên liệu. Hồ sơ IPO cho thấy tăng trưởng doanh thu 144% trong quý hai so với quý trước, giảm còn 47% ở quý ba. Với nhịp đó, tăng trưởng doanh thu sẽ sớm gần bằng không.

  Chuỗi cung ứng đang giữa thời kỳ xây dựng bùng nổ, trong khi doanh thu của mô hình tốt nhất bắt đầu đi ngang.

  Từ chức của Huang nhiều nhất cũng chỉ kéo Nvidia đi xuống. Nhưng nếu tín hiệu từ Anthropic được xác nhận — rằng doanh thu của họ đã đạt đỉnh — thì toàn bộ chuỗi đang bận mở rộng công suất sẽ sụp đổ theo.
