title: "La app que reduce de verdad el tiempo de pantalla del niño"
description: "Conoces los consejos, pero tu peque sigue arrebatándote el móvil. Baby Black Screen lo convierte en una pantalla negra que no responde; tras unos toques lo suelta. Qué debes hacer tú para que siga funcionando, y cuándo no sirve."

intro_p1: "Si tienes un niño menor de dos años, seguro que has buscado cómo reducir su tiempo de pantalla. Nada de pantallas antes de los dos. Nada en la mesa. No calmar llantos con el móvil. Nada de pantalla la hora antes de dormir. En teoría, todo cuadra."
intro_p2: "Luego llega el momento. Sacas el móvil. Se le iluminan los ojos. Viene corriendo, te lo quita y empieza a tocar a lo loco. ¿Se lo quitas? Llora. ¿Se lo dejas? Te preocupan los ojos y los malos hábitos. Sabes qué hacer en abstracto. En ese instante, no."

section_problem_title: "Por qué esos artículos no ayudan"
section_problem_p1: "Casi todo lo que lees se queda en consejos generales: haz esto, no hagas aquello. Casi nada sobre qué hacer en el momento."
section_problem_p2: "Un niño de dos o tres años no razona contigo. Solo sabe que el rectángulo brillante de tu mano pone dibujos y hace ruido al tocarlo, y gana a cualquier juguete. Cuando ya lo tiene, ningún juego alternativo funciona. El problema real suele ser: ya lo tiene. ¿Cómo consigues que lo suelte solo?"

section_solution_title: "Un truco sencillo que a menudo funciona"
section_solution_p1: "A padres en esta situación les recomiendo [Baby Black Screen](/es/app/baby-black-screen). La app Baby Black Screen es muy simple: un toque y el móvil muestra una pantalla negra como apagada. Pueden tocar y deslizar todo lo que quieran. No pasa nada. Sin animación, sin sonido, sin imágenes nuevas."
section_solution_p2: "Gran parte del interés del niño por el móvil viene del feedback instantáneo. Sin eso, tras tres o cuatro intentos, muchos lo dejan y vuelven a los bloques o coches de juguete."
section_solution_p3: "También es fácil de usar. Abre la app Baby Black Screen antes de que se lance al móvil. Un toque a pantalla completa. Interfaz limpia, difícil salir por error. Funciona mejor con niños menores de tres o cuatro que aún no distinguen un apagado real de una pantalla negra falsa."

section_parent_title: "Para que siga funcionando, tú también tienes que hacer tu parte"
section_parent_p1: "Una cosa clara: no esperes que una app lo arregle todo. La app Baby Black Screen resuelve el problema de que te quiten el móvil y no lo devuelvan. Pero si te ven scrollear vídeos, responder mensajes y sonreír a la pantalla cada día, pensarán que dentro hay algo bueno. Volverán a intentarlo."
section_parent_p2: "Para que funcione a largo plazo, intenta no usar mucho el móvil delante de ellos. No lo uses como chupete digital. No se lo des cada vez que quieres silencio. Baby Black Screen suele ir bien. Pero si tu peque descubre que le engañas con una pantalla negra falsa, buena suerte."

section_limitations_title: "Para quién no sirve"
section_limitations_p1: "Si lo que de verdad necesitas es un juguete que los entretenga solos muchas horas sin pantalla, porque vas a mil y no puedes jugar con ellos, Baby Black Screen no ayuda. No juega con el niño, no lo cuida, no sustituye al Lego."
section_limitations_p2: "Encaja mejor en otro caso: ya están enganchados al móvil, lo arrebatan en cuanto lo tocas y no sueltan. Ahí, hacer aburrido el móvil que ya tienen suele ganar a repetirles lo mismo cien veces."

cta_title: "Si estás harto de que te quiten el móvil"
cta_p1: "La próxima vez que lo intenten, abre primero la app Baby Black Screen y mira qué pasa. Busca \"Baby Black Screen\" en el App Store. 👉 [Descargar Baby Black Screen](https://apps.apple.com/app/baby-black-screen/id6758646187)"
