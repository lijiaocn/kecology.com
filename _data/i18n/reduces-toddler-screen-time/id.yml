title: "Aplikasi yang benar-benar mengurangi waktu layar balita"
description: "Kamu tahu saran-sarannya, tapi si kecil tetap merebut ponsel. Baby Black Screen mengubahnya jadi layar hitam tanpa respons; setelah beberapa ketuk, dia menaruhnya. Apa yang orang tua perlu lakukan agar tetap efektif, dan kapan tidak cocok."

intro_p1: "Kalau punya anak di bawah dua tahun, kamu pasti pernah cari cara mengurangi waktu layar. Tanpa layar sebelum usia dua. Tanpa layar saat makan. Jangan tenangkan tangisan dengan ponsel. Tanpa layar satu jam sebelum tidur. Di atas kertas, semua masuk akal."
intro_p2: "Lalu momen itu datang. Kamu keluarkan ponsel. Matanya langsung cerah. Dia lari, rebut, lalu mengetuk-ngetuk layar. Direbut balik? Menangis. Dibiarkan? Khawatir soal mata dan kebiasaan buruk. Saran kamu paham. Di saat itu, bingung."

section_problem_title: "Kenapa artikel-artikel itu tidak membantu"
section_problem_p1: "Kebanyakan berhenti di nasihat umum: lakukan ini, jangan itu. Hampir tidak ada tentang apa yang harus dilakukan saat itu juga."
section_problem_p2: "Anak dua atau tiga tahun belum bisa diajak berunding. Dia cuma tahu: kotak bercahaya di tanganmu menampilkan kartun dan bunyi saat disentuh, lebih seru dari mainan apa pun. Setelah ponsel direbut, mainan pengganti tidak ngefek. Masalah sebenarnya: sudah direbut. Bagaimana membuatnya menaruh sendiri?"

section_solution_title: "Trik sederhana yang sering jalan"
section_solution_p1: "Ke orang tua dalam situasi ini, saya sarankan [Baby Black Screen](/id/app/baby-black-screen). Aplikasi Baby Black Screen sangat sederhana: satu ketuk, layar jadi hitam seperti mati. Bisa ketuk dan geser sepuasnya. Tidak ada reaksi. Tanpa animasi, tanpa suara, tanpa gambar baru."
section_solution_p2: "Banyak minat balita pada ponsel datang dari umpan balik instan. Hilangkan itu, setelah tiga atau empat coba, banyak yang menaruh dan kembali ke balok atau mobil-mobilan."
section_solution_p3: "Cara pakainya juga mudah. Buka aplikasi Baby Black Screen sebelum si kecil menerkam ponsel. Satu ketuk layar penuh. Antarmuka bersih, jarang keluar karena salah sentuh. Paling cocok untuk balita di bawah tiga atau empat tahun yang belum bisa bedakan mati sungguhan dan layar hitam palsu."

section_parent_title: "Agar tetap efektif, orang tua juga harus ikut andil"
section_parent_p1: "Satu hal dulu: jangan harap satu aplikasi menyelesaikan semua. Aplikasi Baby Black Screen menangani masalah anak merebut ponsel dan tidak mengembalikannya. Tapi kalau setiap hari melihat kamu scroll video, balas pesan, dan senyum ke layar, dia akan mengira ada sesuatu yang seru di dalam. Dia akan coba lagi."
section_parent_p2: "Agar jangka panjang, coba jangan terlalu sering main ponsel di depannya. Jangan jadikan ponsel penenang. Jangan serahkan setiap kali butuh tenang. Baby Black Screen biasanya efektif. Tapi kalau si kecil sadar kamu menipu dengan layar hitam palsu, semoga beruntung."

section_limitations_title: "Untuk siapa ini tidak cocok"
section_limitations_p1: "Kalau yang kamu butuhkan sebenarnya mainan yang bisa menemani anak sendirian berjam-jam tanpa layar, karena kamu sibuk dan tidak bisa bermain, Baby Black Screen tidak membantu. Tidak bermain dengan anak, tidak mengawasi, tidak menggantikan Lego."
section_limitations_p2: "Lebih cocok untuk situasi lain: anak sudah ketagihan ponsel, rebut begitu kamu sentuh, dan tidak mau lepas. Dalam kasus itu, membuat ponsel yang sudah direbut jadi membosankan sering lebih cepat daripada mengulang nasihat seratus kali."

cta_title: "Kalau lelah ponsel direbut terus"
cta_p1: "Lain kali dia mengulurkan tangan, buka dulu aplikasi Baby Black Screen dan lihat hasilnya. Cari \"Baby Black Screen\" di App Store. 👉 [Unduh Baby Black Screen](https://apps.apple.com/app/baby-black-screen/id6758646187)"
