title: "两岁孩子抢手机没办法？直接黑屏变砖"
description: "道理都懂，娃一抢手机还是不知道怎么办。哄娃黑屏让手机变成点了没反应的黑屏，试几次就放下；也会说到家长需要配合的一点，以及它不适合什么情况。"

intro_p1: "如果家里有个两岁以下的孩子，你肯定尝试找过「怎么让孩子少玩手机」的方法。两岁前尽量别碰屏幕、吃饭时不开屏幕、哭闹别拿手机哄、睡前一小时别看屏幕……写得都挺像那么回事儿的。"
intro_p2: "可真到那一刻呢？你刚把手机掏出来，娃眼睛立马亮了，小脚蹬蹬蹬扑过来，一把拽走，小手开始狂点。你硬抢？嚎。你不抢？又担心眼睛，又担心养成瘾。道理你都懂，就是当下没辙。"

section_problem_title: "那些文章，为啥帮不上忙"
section_problem_p1: "说白了，绝大多数内容停在「指导意见」，告诉你应该这样、不应该那样的大原则，实际操作方法为零。"
section_problem_p2: "两三岁的孩子还不能理性沟通，他只知道：大人手里那个发光的小板子，一按就有动画、有声音，比什么玩具都好玩。一旦手机被抢走，啥替代游戏都不好使了。我们面临的问题通常是「手机已经被娃抢走了，怎么让他自己放下」。"

section_solution_title: "有个笨办法，但往往管用"
section_solution_p1: "推荐带娃的朋友下载一个名为 [哄娃黑屏](https://apps.apple.com/app/baby-black-screen/id6758646187) 的 app。这个 app 功能特别简单，点一下就把手机弄成全黑屏状态，看着像没电关机了。娃抢过去随便点、随便划，什么反应都没有——没动画、没声音、没新画面。"
section_solution_p2: "小孩对手机的兴趣，主要来自「按一下就有反馈」。反馈没了，试上三四次，就扔一边去玩积木小车了。"
section_solution_p3: "用法也简单：趁娃还没扑过来，先把哄娃黑屏这个 app 开好。一键全屏，界面干净，娃不容易误触退出去。对于三四岁以下、还分不清真关机和假黑屏的孩子来说，效果最好。"

section_parent_title: "想长期管用，你自己也得收着点"
section_parent_p1: "有一点得提前说清楚，别指望光靠一个 app 就万事大吉。哄娃黑屏这个 app 解决的是「孩子把手机抢走不还的问题」；可要是孩子天天看你刷视频、回消息、乐呵呵打字，他潜意识里会觉得——手机里肯定有宝藏，必须抢过来再试一下。"
section_parent_p2: "所以这个方法要长期有效，家长得尽量别在孩子面前玩手机，不要把手机当哄娃神器，别动不动就拿给他「安静一下」。哄娃黑屏通常很有效，但是如果孩子意识到你在用黑屏骗他，嘿嘿，那就难搞了。"

section_limitations_title: "不适合谁，我也直说"
section_limitations_p1: "要是你真正想要的是：忙得脱不开身，希望有个能让娃独自玩大半天、还没有电子屏的玩具——哄娃黑屏也帮不上忙。它既不能陪玩，也不能管孩子，更替代不了乐高。"
section_limitations_p2: "它更适合的是另一种情况：娃已经对手机上头了，一见你摸手机就抢，抢过去就不撒手。对于这种情况，把抢到手之后的那台手机变得无聊，往往比讲一百遍道理来得快。"

cta_title: "你要是也被抢惨了"
cta_p1: "下次娃伸手之前，先把哄娃黑屏这个 app 打开试试。在 App Store 中搜索「哄娃黑屏」即可找到。👉 [直接下载哄娃黑屏](https://apps.apple.com/app/baby-black-screen/id6758646187)"
