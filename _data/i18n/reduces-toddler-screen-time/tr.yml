title: "Bebeklerin ekran süresini gerçekten azaltan uygulama"
description: "Tavsiyeleri biliyorsun ama yürüme çağındaki çocuğun yine telefonu kapıyor. Baby Black Screen onu tepkisiz siyah ekrana çevirir; birkaç dokunuştan sonra bırakır. Kalıcı olması için ebeveynlerin yapması gerekenler ve ne zaman uygun değil."

intro_p1: "İki yaşından küçük bir çocuğun varsa, ekran süresini nasıl azaltacağını araştırmışsındır. İki yaşından önce ekran yok. Yemekte ekran yok. Ağlarken telefon verme. Uyumadan bir saat önce ekran yok. Kağıt üzerinde hepsi mantıklı."
intro_p2: "Sonra o an gelir. Telefonu çıkarırsın. Gözleri parlar. Koşarak gelir, kapar ve ekrana vurur. Geri alırsan? Ağlar. Bırakırsan? Gözler ve alışkanlıklar endişelendirir. Ne yapacağını biliyorsun. O anda bilmiyorsun."

section_problem_title: "Bu yazılar neden işe yaramıyor"
section_problem_p1: "Okuduklarının çoğu genel öğütlerde kalır: bunu yap, şunu yapma. O anda ne yapacağın neredeyse hiç yazılmaz."
section_problem_p2: "İki veya üç yaşındaki çocuk seninle mantıklı konuşamaz. Sadece elindeki parlayan dikdörtgenin dokununca çizgi film ve ses çıkardığını, odadaki her oyuncaktan iyi olduğunu bilir. Telefon kapıldıktan sonra yedek oyun işe yaramaz. Asıl sorun: zaten kapmış. Kendi kendine nasıl bıraktırırsın?"

section_solution_title: "Sık işe yarayan basit bir numara"
section_solution_p1: "Bu durumdaki ebeveynlere [Baby Black Screen](/tr/app/baby-black-screen) öneririm. Baby Black Screen uygulaması çok basit: bir dokunuşla ekran kapalı gibi siyah olur. İstediği kadar dokunup kaydırabilir. Hiçbir şey olmaz. Animasyon yok, ses yok, yeni görüntü yok."
section_solution_p2: "Küçük çocuğun telefona ilgisinin büyük kısmı anında geri bildirimden gelir. Onu kaldırınca, üç dört denemeden sonra birçoğu bırakıp bloklara veya oyuncak arabalara döner."
section_solution_p3: "Kullanımı da kolay. Telefona atılmadan önce Baby Black Screen uygulamasını aç. Tek dokunuşla tam ekran. Arayüz sade, yanlışlıkla çıkmak zor. Gerçek kapanmayla sahte siyah ekranı ayırt edemeyen üç dört yaş altı çocuklar için en iyi."

section_parent_title: "Uzun süre işe yaraması için sen de rol oyna"
section_parent_p1: "Baştan söyleyeyim: tek uygulama her şeyi çözmez. Baby Black Screen uygulaması, çocuğun telefonu kapıp geri vermeme sorununu çözer. Ama her gün video kaydırdığını, mesaj yazdığını ve ekrana gülümsediğini görürse, içinde güzel bir şey olduğunu sanır. Yine dener."
section_parent_p2: "Uzun vadede işe yaraması için, onun önünde telefonu az kullan. Sakinleştirici olarak verme. Her sessizlik istediğinde uzatma. Baby Black Screen genelde iyi çalışır. Ama sahte siyah ekranla kandırdığını anlarsa, kolay gelsin."

section_limitations_title: "Kimler için uygun değil"
section_limitations_p1: "Gerçekten ihtiyacın, meşgul olduğun için oynayamadığında çocuğu saatlerce ekransız meşgul edecek bir oyuncaksa, Baby Black Screen yardımcı olmaz. Çocukla oynamaz, gözetmez, Lego'nun yerini tutmaz."
section_limitations_p2: "Başka bir duruma daha uygun: çocuk zaten telefona bağımlı, dokunduğun an kapıyor ve bırakmıyor. Bu durumda, elindeki telefonu sıkıcı yapmak, aynı şeyi yüz kez anlatmaktan çoğu zaman daha hızlı."

cta_title: "Telefonun sürekli kapılmasından bıktıysan"
cta_p1: "Bir dahaki sefer uzandığında, önce Baby Black Screen uygulamasını aç ve bak. App Store'da \"Baby Black Screen\" ara. 👉 [Baby Black Screen indir](https://apps.apple.com/app/baby-black-screen/id6758646187)"
