title: "Приложение, которое реально сокращает экранное время малыша"
description: "Советы знаете, а ребёнок всё равно отбирает телефон. Baby Black Screen делает из него чёрный экран без реакции — после пары нажатий откладывает. Что нужно от родителей, чтобы это работало долго, и когда не подходит."

intro_p1: "Если у вас ребёнок младше двух лет, вы наверняка искали, как сократить экранное время. Никаких экранов до двух. Не за столом. Не успокаивать плач телефоном. Никаких экранов за час до сна. На бумаге всё логично."
intro_p2: "Потом наступает момент. Достаёте телефон. Глаза загораются. Бежит, вырывает и тыкает по экрану. Забрать обратно? Крик. Оставить? Тревога за глаза и привычки. Вы знаете, как правильно. В эту секунду — нет."

section_problem_title: "Почему статьи не помогают"
section_problem_p1: "Большинство текстов останавливаются на общих правилах: делай так, не делай так. Почти ничего о том, что делать прямо сейчас."
section_problem_p2: "Двух- или трёхлетний ребёнок не рассуждает с вами. Он знает лишь одно: светящийся прямоугольник в вашей руке показывает мультики и издаёт звуки, интереснее любой игрушки. Телефон уже в руках — запасная игра не работает. Реальная проблема: он уже забрал. Как заставить положить сам?"

section_solution_title: "Простой приём, который часто срабатывает"
section_solution_p1: "Родителям в такой ситуации советую [Baby Black Screen](/ru/tool/baby-black-screen). Приложение Baby Black Screen предельно простое: одно нажатие — и экран чёрный, как выключенный. Можно жать и свайпить сколько угодно. Ничего не происходит. Ни анимации, ни звука, ни новых картинок."
section_solution_p2: "Большая часть интереса малыша к телефону — мгновенная реакция на нажатие. Уберите её, и после трёх-четырёх попыток многие откладывают и идут к кубикам или машинкам."
section_solution_p3: "Пользоваться тоже просто. Откройте приложение Baby Black Screen, пока ребёнок не бросился на телефон. Одно нажатие — полный экран. Интерфейс пустой, случайно не выйти. Лучше всего для детей до трёх-четырёх лет, которые ещё не отличают настоящее выключение от фальшивого чёрного экрана."

section_parent_title: "Чтобы работало долго, родителям тоже нужно постараться"
section_parent_p1: "Сразу скажу: одно приложение не решит всё. Baby Black Screen решает проблему, когда ребёнок забрал телефон и не отдаёт. Но если каждый день видит, как вы листаете видео, пишете сообщения и улыбаетесь экрану, решит: там что-то интересное. Снова попробует отобрать."
section_parent_p2: "Чтобы это работало долго, старайтесь не сидеть в телефоне при ребёнке. Не используйте его как успокоитель. Не давайте каждый раз, когда нужна тишина. Baby Black Screen обычно помогает. Но если ребёнок поймёт, что вы обманываете чёрным экраном, удачи."

section_limitations_title: "Кому не подойдёт"
section_limitations_p1: "Если вам нужна игрушка, которая займёт ребёнка одного на много часов без экрана, потому что вы завалены и не можете играть, Baby Black Screen не поможет. Не играет с ребёнком, не присматривает, не заменит Lego."
section_limitations_p2: "Лучше подходит другой случай: ребёнок уже тянется к телефону, хватает, как только вы его достаёте, и не отпускает. Тогда скучный телефон в руках часто быстрее, чем сто раз одно и то же объяснять."

cta_title: "Если устали отбирать телефон обратно"
cta_p1: "В следующий раз, когда потянется к нему, сначала откройте приложение Baby Black Screen и посмотрите. В App Store найдите \"Baby Black Screen\". 👉 [Скачать Baby Black Screen](https://apps.apple.com/app/baby-black-screen/id6758646187)"
