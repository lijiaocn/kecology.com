title: "التطبيق الذي يقلل وقت الشاشة للطفل فعلاً"
description: "تعرف النصائح، لكن طفلك ما زال ينتزع هاتفك. Baby Black Screen يحوله إلى شاشة سوداء بلا استجابة؛ بعد عدة نقرات يتركه. ما يجب على الوالدين فعله لاستمرار النفع، ومتى لا يناسب."

intro_p1: "إذا كان لديك طفل دون سنّين، فقد بحثت عن كيفية تقليل وقت الشاشة. لا شاشات قبل سنّين. لا شاشات أثناء الأكل. لا تهدئة البكاء بالهاتف. لا شاشات قبل النوم بساعة. نظرياً، كل شيء منطقي."
intro_p2: "ثم تأتي اللحظة. تخرج هاتفك. تتألق عيناه. يركض، ينتزعه ويبدأ النقر بجنون. تسترده؟ صراخ. تتركه؟ قلق على العينين والعادات. تعرف النصيحة. في تلك اللحظة لا تعرف ماذا تفعل."

section_problem_title: "لماذا لا تفيد تلك المقالات"
section_problem_p1: "معظم ما تقرأه يتوقف عند إرشادات عامة: افعل كذا، لا تفعل كذا. تقريباً لا شيء عن ماذا تفعل في اللحظة."
section_problem_p2: "طفل في الثانية أو الثالثة لا يناقشك. يعرف فقط أن المستطيل المضيء في يدك يعرض رسوماً ويصدر أصواتاً عند اللمس، أمتع من أي لعبة. بعد انتزاع الهاتف، لا تنجح أي لعبة بديلة. المشكلة الحقيقية: سبق أن أخذه. كيف يضعه بنفسه؟"

section_solution_title: "حيلة بسيطة تنجح غالباً"
section_solution_p1: "أنصح الأهل في هذا الموقف بتجربة [Baby Black Screen](/ar/app/baby-black-screen). تطبيق Baby Black Screen بسيط جداً: نقرة واحدة ويصبح الشاشة سوداء كأن الهاتف مطفأ. يمكنه النقر والسحب كما يريد. لا شيء يحدث. لا رسوم، لا صوت، لا صور جديدة."
section_solution_p2: "جزء كبير من اهتمام الطفل بالهاتف يأتي من الاستجابة الفورية. أزلها، وبعد ثلاث أو أربع محاولات يرميه ويعود للمكعبات أو سيارات اللعب."
section_solution_p3: "الاستخدام سهل أيضاً. افتح تطبيق Baby Black Screen قبل أن ينقض على الهاتف. نقرة للشاشة الكاملة. واجهة بسيطة، يصعب الخروج بالخطأ. يناسب الأطفال دون ثلاث أو أربع سنوات الذين لا يميزون بعد بين الإطفاء الحقيقي والشاشة السوداء الوهمية."

section_parent_title: "لاستمرار النفع، عليك أنت أيضاً المساهمة"
section_parent_p1: "شيء واحد مسبقاً: لا تتوقع أن يحل تطبيق واحد كل شيء. تطبيق Baby Black Screen يعالج مشكلة أن الطفل ينتزع الهاتف ولا يعيده. لكن إذا رآك تتصفح الفيديو وترد على الرسائل وتبتسم للشاشة كل يوم، سيظن أن بداخلها شيء ممتع. سيعود للمحاولة."
section_parent_p2: "ليعمل على المدى الطويل، حاول ألا تستخدم الهاتف كثيراً أمامه. لا تجعله وسيلة لتهدئة كل بكاء. لا تسلمه كلما أردت هدوءاً. Baby Black Screen عادة ينجح. لكن إذا اكتشف أنك تخدعه بشاشة سوداء وهمية، حظاً موفقاً."

section_limitations_title: "لمن لا يناسب"
section_limitations_p1: "إذا كنت تحتاج حقاً لعبة تشغل الطفل وحده لساعات بلا شاشة، لأنك مشغول ولا تستطيع اللعب معه، Baby Black Screen لن يساعد. لا يلعب مع الطفل، لا يراقبه، ولا يستبدل Lego."
section_limitations_p2: "يناسب حالة أخرى: الطفل مدمن على الهاتف بالفعل، ينتزعه فور لمسك له ولا يتركه. في هذه الحالة، جعل الهاتف الممل بعد انتزاعه غالباً أسرع من تكرار نفس الكلام مئة مرة."

cta_title: "إذا سئمت من انتزاع هاتفك"
cta_p1: "في المرة القادمة التي يمد يده، افتح تطبيق Baby Black Screen أولاً وانظر. ابحث عن \"Baby Black Screen\" في App Store. 👉 [تحميل Baby Black Screen](https://apps.apple.com/app/baby-black-screen/id6758646187)"
