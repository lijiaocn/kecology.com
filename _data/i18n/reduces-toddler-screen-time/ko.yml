title: "유아 스크린 타임, 바로 줄이는 앱"
description: "조언은 알지만 아이가 폰을 뺏어간다. Baby Black Screen은 반응 없는 검은 화면으로 바꿔서 몇 번 누르면 내려놓게 한다. 오래 효과 보려면 부모가 할 일, 안 맞는 경우도 솔직히."

intro_p1: "두 살 아래 아이가 있으면 '스크린 타임 줄이는 법'을 검색해 봤을 거다. 두 살 전엔 화면 금지, 식사 중엔 화면 끄기, 울 때 폰으로 달래지 말기, 잠들기 한 시간 전엔 화면 끄기…… 다 맞는 말이다."
intro_p2: "근데 순간이 온다. 폰 꺼내는 순간 눈이 반짝. 아장아장 달려와 뺏고 화면 두드린다. 다시 뺏으면? 울음. 그냥 두면? 눈 걱정, 습관 걱정. 알면서도 그 자리에서 뭘 해야 할지 모른다."

section_problem_title: "글은 많은데 왜 도움이 안 되나"
section_problem_p1: "대부분 '이렇게 하라, 저렇게 하지 마라'는 일반론에서 끝난다. 정작 그 순간 뭘 할지는 거의 없다."
section_problem_p2: "두세 살 아이는 이성적으로 말이 통하지 않는다. 손에 든 빛나는 판을 누르면 영상과 소리가 나와, 어떤 장난감보다 재밌다. 한번 뺏기면 대체 놀이도 소용없다. 진짜 문제는 '이미 뺏겼을 때 스스로 내려놓게 하는 법'."

section_solution_title: "단순한데 잘 통하는 방법"
section_solution_p1: "같은 고민인 부모에게 [Baby Black Screen](/ko/app/baby-black-screen)을 추천한다. Baby Black Screen 앱은 정말 단순하다. 한 번 누르면 꺼진 것처럼 보이는 검은 전체 화면. 아무리 눌러도 스와이프해도 반응 없다. 애니메이션도 소리도 새 화면도 없다."
section_solution_p2: "유아가 폰에 끌리는 이유 상당 부분은 '누르면 바로 반응'이다. 그게 사라지면 서너 번 시도 후 블록이나 장난감 차로 돌아가는 경우가 많다."
section_solution_p3: "쓰기도 쉽다. 달려들기 전에 Baby Black Screen 앱을 켜 두면 된다. 한 번에 전체 화면, 버튼 거의 없어 실수로 나가기 어렵다. 진짜 꺼짐과 가짜 검은 화면을 아직 구분 못 하는 네 살 아래 아이에게 가장 잘 맞는다."

section_parent_title: "오래 쓰려면 부모도 조절해야"
section_parent_p1: "미리 말해 두자. 앱 하나로 다 해결되진 않는다. Baby Black Screen 앱이 다루는 건 '뺏어서 안 돌려주는' 문제다. 매일 눈앞에서 영상 보고 메시지 치면, 안에 재밌는 게 있다고 생각하고 또 뺏으러 온다."
section_parent_p2: "오래 효과 보려면 아이 앞에서 폰을 줄여라. 울음 달래는 도구로 쓰지 말고, 조용히 해 달라고 할 때마다 주지 말아라. Baby Black Screen은 보통 잘 된다. 근데 가짜 검은 화면으로 속이는 걸 알아채면, 솔직히 힘들어진다."

section_limitations_title: "안 맞는 경우도 말하겠다"
section_limitations_p1: "진짜 필요한 게 '바빠서 못 놀아줄 때, 화면 없이 오래 혼자 놀 장난감'이면 Baby Black Screen은 못 돕는다. 같이 놀아주거나 지켜주거나 레고 대신은 못 된다."
section_limitations_p2: "맞는 건 다른 상황: 이미 폰에 푹 빠져, 만지는 순간 뺏고 안 놓는 아이. 그럴 땐 뺏긴 후의 폰을 지루하게 만드는 게 같은 설교 백 번보다 빠를 때가 많다."

cta_title: "폰 뺏기는 데 지쳤다면"
cta_p1: "다음에 손 뻗으면 Baby Black Screen 앱부터 켜 봐라. App Store에서 \"Baby Black Screen\" 검색하면 찾을 수 있다. 👉 [Baby Black Screen 다운로드](https://apps.apple.com/app/baby-black-screen/id6758646187)"
