title: "L'app che riduce davvero il tempo schermo del bambino"
description: "Conosci i consigli, ma tuo figlio ti strappa ancora il telefono. Baby Black Screen lo trasforma in uno schermo nero che non risponde; dopo qualche tap lo molla. Cosa devono fare i genitori perché funzioni nel tempo, e quando non è adatto."

intro_p1: "Se hai un bambino sotto i due anni, avrai cercato come ridurre il tempo schermo. Niente schermi prima dei due. Niente a tavola. Non calmare i pianti con il telefono. Niente schermo un'ora prima di dormire. Sulla carta, tutto ha senso."
intro_p2: "Poi arriva il momento. Tiri fuori il telefono. Gli occhi si illuminano. Viene di corsa, te lo strappa e inizia a premere ovunque. Glielo riprendi? Piange. Glielo lasci? Ti preoccupi per gli occhi e per le abitudini. Sai cosa fare in teoria. In quel momento, no."

section_problem_title: "Perché quegli articoli non aiutano davvero"
section_problem_p1: "Quasi tutto si ferma ai consigli generali: fai così, non fare così. Quasi niente su cosa fare sul momento."
section_problem_p2: "Un bambino di due o tre anni non ragiona con te. Sa solo che il rettangolo luminoso in mano tua mostra cartoni e fa rumore se lo tocchi, e batte qualsiasi giocattolo. Una volta preso il telefono, nessun gioco alternativo funziona. Il vero problema: ce l'ha già. Come farglielo mollare da solo?"

section_solution_title: "Un trucco semplice che spesso funziona"
section_solution_p1: "Consiglio [Baby Black Screen](/it/tool/baby-black-screen) ai genitori in questa situazione. L'app Baby Black Screen è semplicissima: un tap e lo schermo diventa nero, come spento. Può toccare e scorrere quanto vuole. Non succede niente. Niente animazioni, niente suoni, niente immagini nuove."
section_solution_p2: "Gran parte dell'interesse del bambino per il telefono viene dal feedback immediato. Tolto quello, dopo tre o quattro tentativi molti lo mollano e tornano ai mattoncini o alle macchinine."
section_solution_p3: "Anche l'uso è facile. Apri l'app Baby Black Screen prima che si lanci sul telefono. Un tap a schermo intero. Interfaccia pulita, difficile uscire per sbaglio. Funziona meglio con bambini sotto i tre o quattro anni che non distinguono ancora uno spegnimento vero da uno schermo nero finto."

section_parent_title: "Perché funzioni a lungo, devi fare anche la tua parte"
section_parent_p1: "Una cosa chiara: non aspettarti che un'app risolva tutto. L'app Baby Black Screen gestisce il problema del bambino che prende il telefono e non lo restituisce. Ma se ti vede scrollare video, rispondere ai messaggi e sorridere allo schermo ogni giorno, penserà che dentro ci sia qualcosa di bello. Riproverà."
section_parent_p2: "Per farla durare, cerca di non usare troppo il telefono davanti a lui. Non usarlo come ciuccio digitale. Non darglielo ogni volta che vuoi silenzio. Baby Black Screen di solito funziona bene. Ma se capisce che lo stai ingannando con uno schermo nero finto, buona fortuna."

section_limitations_title: "Per chi non è adatto"
section_limitations_p1: "Se quello che ti serve davvero è un giocattolo che tenga il bambino occupato da solo per ore senza schermo, perché sei sommerso e non puoi giocare con lui, Baby Black Screen non aiuta. Non gioca con il bambino, non lo sorveglia, non sostituisce il Lego."
section_limitations_p2: "Va meglio in un altro caso: il bambino è già dipendente dal telefono, lo prende appena lo tocchi e non molla. Lì, rendere noioso il telefono che ha in mano batte spesso cento volte la stessa predica."

cta_title: "Se sei stanco che ti strappino il telefono"
cta_p1: "La prossima volta che allunga la mano, apri prima l'app Baby Black Screen e guarda cosa succede. Cerca \"Baby Black Screen\" sull'App Store. 👉 [Scarica Baby Black Screen](https://apps.apple.com/app/baby-black-screen/id6758646187)"
