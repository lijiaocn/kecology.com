title: "O app que reduz de verdade o tempo de tela do bebê"
description: "Você conhece os conselhos, mas seu filho ainda arranca o celular. Baby Black Screen vira uma tela preta que não responde; depois de alguns toques, ele larga. O que os pais precisam fazer para continuar funcionando, e quando não serve."

intro_p1: "Se você tem um filho menor de dois anos, já deve ter pesquisado como reduzir o tempo de tela. Nada de tela antes dos dois. Nada na hora das refeições. Não acalmar choro com o celular. Nada de tela uma hora antes de dormir. No papel, tudo faz sentido."
intro_p2: "Aí chega o momento. Você tira o celular. Os olhos brilham. Ele vem correndo, arranca e começa a apertar tudo. Pega de volta? Choro. Deixa? Preocupação com a vista e com vício. Você sabe o que fazer na teoria. Na hora, não."

section_problem_title: "Por que esses artigos não ajudam de verdade"
section_problem_p1: "Quase tudo para em conselhos gerais: faça isso, não faça aquilo. Quase nada sobre o que fazer na hora."
section_problem_p2: "Uma criança de dois ou três anos não raciocina com você. Ela só sabe que o retângulo brilhante na sua mão mostra desenhos e faz barulho quando toca, e ganha de qualquer brinquedo. Depois que pegou o celular, nenhum jogo alternativo funciona. O problema real: ela já pegou. Como fazer largar sozinha?"

section_solution_title: "Um truque simples que costuma funcionar"
section_solution_p1: "Recomendo [Baby Black Screen](/pt/tool/baby-black-screen) para pais nessa situação. O app Baby Black Screen é bem simples: um toque e a tela fica preta, como desligada. Pode tocar e deslizar à vontade. Nada acontece. Sem animação, sem som, sem imagem nova."
section_solution_p2: "Grande parte do interesse da criança pelo celular vem do retorno imediato ao toque. Sem isso, depois de três ou quatro tentativas, muitos largam e voltam pros blocos ou carrinhos."
section_solution_p3: "Também é fácil de usar. Abra o app Baby Black Screen antes que ele se lance no celular. Um toque em tela cheia. Interface limpa, difícil sair por engano. Funciona melhor com crianças menores de três ou quatro que ainda não distinguem desligamento real de tela preta falsa."

section_parent_title: "Para funcionar a longo prazo, você também precisa fazer sua parte"
section_parent_p1: "Uma coisa clara: não espere que um app resolva tudo. O app Baby Black Screen resolve quando a criança pega o celular e não devolve. Mas se ela vê você rolando vídeos, respondendo mensagens e sorrindo pra tela todo dia, vai achar que tem algo bom lá dentro. Vai tentar de novo."
section_parent_p2: "Para durar, tente não usar muito o celular na frente dela. Não use como chupeta digital. Não entregue toda vez que quiser silêncio. Baby Black Screen costuma funcionar bem. Mas se descobrirem o truque da tela preta falsa, boa sorte."

section_limitations_title: "Para quem não serve"
section_limitations_p1: "Se o que você realmente precisa é um brinquedo que mantenha a criança ocupada sozinha por horas sem tela, porque você está atolado e não pode brincar, Baby Black Screen não ajuda. Não brinca com a criança, não cuida dela, não substitui Lego."
section_limitations_p2: "Encaixa melhor em outro caso: a criança já está viciada no celular, pega no segundo em que você toca e não solta. Aí, deixar o celular que ela pegou chato costuma ser mais rápido do que repetir a mesma lição cem vezes."

cta_title: "Se você está cansado de ter o celular arrancado"
cta_p1: "Na próxima vez que estender a mão, abra primeiro o app Baby Black Screen e veja. Busque \"Baby Black Screen\" na App Store. 👉 [Baixar Baby Black Screen](https://apps.apple.com/app/baby-black-screen/id6758646187)"
