title: "Шампунь, который на самом деле не был японским, и почему Pangdonglai заслуживает второго шанса"
description: "Китайский ритейлер, известный тем, что хорошо относится к сотрудникам, продал шампунь с пометкой «импорт из Японии». Документы были настоящими, а вот история бренда — нет. Заслуживает ли он второго шанса?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  Pangdonglai (китайская сеть супермаркетов) снова на слуху в Китае — и всё из-за одного флакона шампуня.

  Pangdonglai — сеть супермаркетов в провинции Хэнань, прославившаяся тем, что необычайно хорошо обращается с сотрудниками: достойная зарплата, короткий рабочий день, щедрый отпуск. Ещё она заботится о покупателях так, как китайские покупатели редко где встречали. Благодаря этой репутации история и разошлась так широко.

  На её полках лежал шампунь CABELO с пометкой «импортировано из Японии». Кто-то проверил в Японии и выяснил: бренд не продаётся ни в одном крупном японском супермаркете.

  Ответ Pangdonglai был конкретным. Ещё в январе они, по их словам, услышали то же самое и отправили людей на фабрику в Японию: те прошли по цеху и сверили по очереди таможенные декларации, сертификат происхождения и протоколы проверок. Вывод: шампунь действительно произведён в Японии, а не сделан в Китае и выдан за импорт.

  По фактам это подтверждается. Бренд зарегистрирован и производится в Японии. Больше с Японией его почти ничего не связывает. Его создавали изначально под китайский рынок, с расчётом на то, что покупатель решит, будто это известный бренд, которым действительно пользуются в Японии. В Китае для этого есть своё название: «фальшивый иностранный бренд» — товар, который рядится в зарубежную идентичность, а на деле создан только для внутреннего рынка.

  Так что по фактам Pangdonglai ничего не подделал, и бренд тоже ничего не подделал.

  И всё же для покупателей это реальный ущерб.

  Они ждали товар лучшего качества с доказанным эффектом, популярный в Японии. А получили шампунь, о котором в Японии никто не слышал и который сделали специально для того, чтобы его приняли за то, чем он не является.

  Сотрудники Pangdonglai, вероятно, даже не предполагали, что продукт со всеми правильными документами может оказаться «сделанным только для китайских покупателей». Таможенные декларации, сертификат происхождения, протоколы проверок — всё сходится. Но ни один из этих документов не ответит на вопрос, значит ли что-то этот бренд в стране, которую он называет своей родиной.

  Я готов поверить, что это была честная ошибка.

  Дело не в том, что Pangdonglai хотел ввести людей в заблуждение. Просто его возможности пока не поспевают за ожиданиями, которые к нему теперь предъявляют. Проверять, как на самом деле воспринимают импортный товар у него на родине, — работа, которую Pangdonglai ещё не делает. Если этот эпизод заставит его углубить проверку импорта ещё на один слой, покупателям только польза.

  В том, почему Pangdonglai прославился, нет никакого секрета. Он взял очевидные идеи — хорошо относиться к сотрудникам, быть честным с покупателями — и на самом деле их воплотил. После более чем десяти лет такой практики вся страна наконец заметила.

  Но он не святой. Он ошибается. С новыми ситуациями ошибок будет больше. Это компания из обычных людей, как и любая другая.

  Пока она продолжает смотреть своим ошибкам в лицо и держаться тех идей, она заслуживает второго шанса.

  Компания, которую публика разбирает под лупой, заслуживает больше доверия, чем та, что при первой же неприятности всё заминает.
