title: "Shampo yang Sebenarnya Tak Juga Jepang, dan Kenapa Pangdonglai Masih Layak Diberi Kesempatan Kedua"
description: "Sebuah peritel Tiongkok yang dikenal memperlakukan karyawannya dengan baik menjual shampo berlabel 'impor dari Jepang'. Dokumennya asli, tapi kisah mereknya tidak. Apakah ia layak diberi kesempatan kedua?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  Pangdonglai (sebuah jaringan supermarket asal Tiongkok) kembali ramai dibicarakan di Tiongkok, dan satu botol shampo jadi alasannya.

  Jaringan supermarket asal provinsi Henan ini terkenal karena memperlakukan karyawannya dengan cara yang langka: gaji layak, jam kerja pendek, cuti murah hati. Caranya melayani pelanggan juga jarang ditemui pembeli Tiongkok. Reputasi itulah yang membuat kisah ini menyebar luas.

  Di raknya ada shampo bernama CABELO, berlabel 'impor dari Jepang'. Seseorang mengeceknya di Jepang dan mendapati merek itu tidak dijual di supermarket arus mana pun.

  Tanggapan Pangdonglai sangat spesifik. Katanya, klaim yang sama sudah mereka dengar pada Januari lalu. Mereka mengirim orang ke pabrik di Jepang, menelusuri lantai produksi, dan memeriksa satu per satu formulir kepabeanan, sertifikat asal, serta catatan pemeriksaan. Kesimpulannya: shampo itu benar-benar dibuat di Jepang, bukan diproduksi di Tiongkok lalu dipasarkan sebagai barang impor.

  Secara fakta, klaim itu bertahan. Merek ini didaftarkan dan diproduksi di Jepang. Selain itu, hubungannya dengan Jepang nyaris nol. Sejak awal ia dirancang untuk pasar Tiongkok, supaya pembeli mengira itu merek terkenal yang benar-benar dipakai orang Jepang. Di Tiongkok ada istilah untuk ini: 'merek asing palsu', yaitu produk yang memakai identitas asing padahal tidak pernah menjadi produk asing.

  Jadi, secara fakta Pangdonglai tidak memalsukan apa pun, dan merek itu juga tidak memalsukan apa pun.

  Meski begitu, kerugian bagi pelanggan tetap nyata.

  Mereka mengharapkan produk dengan kualitas lebih baik dan khasiat teruji, sesuatu yang populer di Jepang. Yang mereka dapatkan adalah shampo yang tak dikenal siapa pun di Jepang, diproduksi khusus agar dikira sebagai sesuatu yang bukan dia.

  Staf Pangdonglai mungkin tak pernah membayangkan bahwa produk dengan semua dokumen yang lengkap tetap bisa 'dibuat khusus untuk pembeli Tiongkok'. Formulir kepabeanan, sertifikat asal, catatan pemeriksaan, semuanya sah. Tetapi tak ada dokumen di antara itu yang bisa menjawab apakah sebuah merek punya arti di negeri yang diklaim sebagai asalnya.

  Saya bersedia percaya ini cuma kesalahan yang jujur.

  Bukan berarti Pangdonglai sengaja menyesatkan orang. Kemampuan mereka belum mengejar ekspektasi yang kini dipegang orang terhadapnya. Memeriksa seperti apa sebuah produk impor benar-benar dipandang di negara asalnya adalah pekerjaan yang belum dilakukan Pangdonglai. Kalau insiden ini membuat penyaringan barang impor mereka selangkah lebih dalam, itu bagus bagi pelanggan.

  Tak ada rahasia di balik ketenaran Pangdonglai. Ia mengambil ide yang sudah jelas: perlakukan karyawan dengan baik, jujurlah pada pelanggan. Lalu benar-benar mempraktikkannya. Setelah lebih dari satu dekade melakukan itu, seluruh negeri akhirnya melirik.

  Tapi ia bukan orang suci. Ia pernah salah. Saat menghadapi situasi baru, ia akan lebih banyak salah lagi. Ini perusahaan yang diisi orang-orang biasa, seperti perusahaan lainnya.

  Selama ia terus menghadapi kesalahannya dan berpegang pada ide-ide itu, ia layak mendapat kesempatan kedua.

  Perusahaan yang dibongkar satu per satu oleh publik di bawah kaca pembesar lebih bisa dipercaya daripada perusahaan yang langsung menutup-nutupi begitu ada masalah.
