title: "Aslında Japon Olmayan Şampuan ve Pangdonglai'nin Neden İkinci Bir Şansı Hak Ettiği"
description: "Personeline iyi davranmasıyla bilinen bir Çinli perakendeci, Japonya'dan ithal edildiği etiketlenmiş bir şampuan sattı. Evraklar gerçekti, markanın hikâyesi değil. İkinci bir şansı hak ediyor mu?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  Pangdonglai (Çinli bir süpermarket zinciri) yine Çin'in gündeminde, ve sebebi bir şişe şampuan.

  Pangdonglai, Henan eyaletinde çalışanlara alışılmadık derecede iyi davranmasıyla ünlenmiş bir süpermarket zinciri — iyi maaş, kısa çalışma saatleri, cömert izin — ve Çinli alışverişçilerin pek görmediği biçimde müşterilerini gözetmesiyle. Bu itibar, hikâyenin bu kadar yayılmasını sağladı.

  Raflarında CABELO adlı, «Japonya'dan ithal edildiği» belirtilen bir şampuan vardı. Biri Japonya'da kontrol etti ve markanın hiçbir ana akım Japon süpermarketinde satılmadığını gördü.

  Pangdonglai'nin yanıtı somuttu. Şirkete göre aynı iddiayı ocak ayında da duymuş, Japonya'daki fabrikaya adam göndermiş, atölyeyi dolaşmış ve gümrük belgelerini, menşe sertifikasını ve denetim kayıtlarını tek tek kontrol etmiş. Sonuç: şampuan gerçekten Japonya'da üretilmişti, Çin'de yapılıp ithalat diye satılmamıştı.

  Olgular açısından bu doğrulanıyor. Marka Japonya'da kayıtlı ve orada üretiliyor. Bunun ötesinde Japonya'yla neredeyse hiç ilgisi yok. Baştan itibaren Çin pazarı için kurulmuş, alışverişçinin bunu Japonya'da gerçekten kullanılan tanınmış bir marka sanması için tasarlanmış. Çin'de buna bir ad var: «sahte yabancı marka» — yabancı bir kimliğe bürünen, oysa hiçbir zaman o olmamış ve özellikle iç pazar için üretilmiş bir ürün.

  Yani olgulara bakarsak Pangdonglai bir şey uydurmadı, marka da bir şey uydurmadı.

  Buna karşın müşterilere verilen zarar gerçek.

  Daha iyi kalitede, etkisi kanıtlanmış, Japonya'da popüler bir ürün bekliyorlardı. Karşılarına Japonya'da kimsenin bilmediği, olmadığı bir şey sanılsın diye özel olarak üretilmiş bir şampuan çıktı.

  Pangdonglai çalışanları muhtemelen hiç düşünmemişti ki bütün doğru belgelere sahip bir ürün hâlâ «sadece Çinli alıcılar için yapılmış» olabilir. Gümrük belgeleri, menşe sertifikası, denetim kayıtlarının her biri tutuyor. Ama bu belgelerin hiçbiri, bir markanın geldiğini iddia ettiği ülkede bir anlamı olup olmadığını söyleyemez.

  Bunun dürüst bir hata olduğuna inanmaya hazırım.

  Mesele Pangdonglai'nin insanları yanıltmak istemesi değildi. Sadece yetkinliği, insanların artık kendisinden beklediği seviyeye yetişmemişti. İthal bir ürünün kendi ülkesinde gerçekte nasıl karşılandığını kontrol etmek, Pangdonglai'nin henüz yapmadığı bir iş. Bu olay, ithalat taramasını bir kat daha derine indirirse, müşteriler için iyi olur.

  Pangdonglai'nin ünlenmesinin sırrı yok. Açık fikirleri — çalışanlarına iyi davran, müşterilerine dürüst ol — aldı ve gerçekten hayata geçirdi. On yıldan fazla bunu yaptıktan sonra bütün ülke sonunda fark etti.

  Ama bir aziz değil. Hata yapıyor. Yeni durumlarla karşılaştıkça daha da fazla hata yapacak. Herhangi bir şirket gibi, sıradan insanlardan oluşan bir şirket.

  Hatalarıyla yüzleşmeye ve o fikirlere sarılmaya devam ettiği sürece, ikinci bir şansı hak ediyor.

  Herkesin büyüteç altında didik didik ettiği bir şirket, bir sorun çıkınca hemen üstünü örten bir şirketten daha güvenilirdir.
