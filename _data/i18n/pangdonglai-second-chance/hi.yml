title: "वो शैम्पू जो असल में जापानी नहीं था, और क्यों पांगडोंगलाई (Pangdonglai) को दूसरा मौका मिलना चाहिए"
description: "कर्मचारियों के साथ अच्छा व्यवहार करने के लिए जाने वाले एक चीनी रिटेलर ने जापान से आयातित बताए गए शैम्पू को बेचा। कागज़ सही थे, ब्रांड की कहानी सही नहीं थी। क्या उसे दूसरा मौका मिलना चाहिए?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  पांगडोंगलाई (एक चीनी सुपरमार्केट श्रृंखला) एक बार फिर चीन में चर्चा में है, और वजह एक शैम्पू की बोतल है।

  पांगडोंगलाई हेनान प्रांत की एक सुपरमार्केट श्रृंखला है, जो अपने कर्मचारियों के साथ असाधारण रूप से अच्छा व्यवहार करने के लिए मशहूर है — अच्छी तनख़्वाह, छोटे काम के घंटे, उदार छुट्टियाँ — और ग्राहकों की ऐसी देखभाल के लिए जो चीनी खरीदार कम ही देखते हैं। यही प्रतिष्ठा इस कहानी को इतनी दूर तक ले गई।

  उसकी शेल्फ़ पर CABELO नाम का एक शैम्पू था, जिस पर «जापान से आयातित» का लेबल लगा था। किसी ने जापान में जाँच की और पाया कि यह ब्रांड किसी भी मुख्यधारा के जापानी सुपरमार्केट में नहीं बिकता।

  पांगडोंगलाई का जवाब खासा ठोस था। उसके अनुसार उसे यही दावा जनवरी में भी सुनाई दिया था, उसने जापान स्थित फ़ैक्ट्री में लोग भेजे, कार्यशाला में घूमे और कस्टम फ़ॉर्म, मूल प्रमाणपत्र और जाँच के रिकॉर्ड एक-एक करके जाँचे। निष्कर्ष: शैम्पू सच में जापान में बना था, चीन में बनाकर उसे आयात का रूप नहीं दिया गया था।

  तथ्यों के हिसाब से यह टिकता है। ब्रांड जापान में पंजीकृत और विनिर्मित है। इसके आगे जापान से इसका लगभग कोई लेना-देना नहीं है। इसे शुरू से ही चीनी बाज़ार के लिए बनाया गया, इस तरह डिज़ाइन किया गया कि खरीदार ये मान ले कि यह जापान में वास्तव में इस्तेमाल होने वाला एक जाना-माना ब्रांड है। चीन में इसका एक नाम है: «नकली विदेशी ब्रांड» — ऐसा उत्पाद जो विदेशी पहचान पहनता है, पर कभी वह नहीं रहा, और खास तौर पर घरेलू बाज़ार के लिए बनाया गया।

  तो तथ्यों के हिसाब से न पांगडोंगलाई ने कुछ फ़र्ज़ी बनाया, न ही ब्रांड ने।

  फिर भी ग्राहकों को हुआ नुकसान सच है।

  उन्हें बेहतर गुणवत्ता वाला, परीक्षण-सिद्ध असर वाला, जापान में लोकप्रिय उत्पाद मिलने की उम्मीद थी। मिला वो शैम्पू जिसे जापान में कोई नहीं जानता, जिसे खासकर इसलिए बनाया गया ताकि लोग इसे कुछ और समझ लें।

  पांगडोंगलाई के कर्मचारियों ने शायद कभी सोचा ही नहीं होगा कि सारे सही कागज़ात वाला उत्पाद भी «सिर्फ़ चीनी खरीदारों के लिए बनाया गया» हो सकता है। कस्टम फ़ॉर्म, मूल प्रमाणपत्र, जाँच रिकॉर्ड — हर एक सही है। लेकिन इनमें से कोई भी कागज़ नहीं बता सकता कि जिस देश से आने का दावा ब्रांड करता है, वहाँ उसका कोई मतलब है भी या नहीं।

  मैं इस बात पर यक़ीन रखने को तैयार हूँ कि यह ईमानदारी की गलती थी।

  बात ये नहीं कि पांगडोंगलाई ने जानबूझकर लोगों को गुमराह किया हो। बस उसकी क्षमता अभी लोगों की उससे जुड़ी उम्मीदों तक नहीं पहुँची है। किसी आयातित उत्पाद को उसके अपने देश में वास्तव में कैसे देखा जाता है, ये जाँचना पांगडोंगलाई ने अभी नहीं सीखा। अगर ये प्रसंग उसकी आयात जाँच को एक परत और गहरा कर दे, तो ग्राहकों के लिए अच्छी बात होगी।

  पांगडोंगलाई के मशहूर होने का कोई राज़ नहीं है। उसने साफ़ बातों को — कर्मचारियों के साथ अच्छा व्यवहार करो, ग्राहकों के साथ ईमानदार रहो — लिया और सच में अमल में लाया। एक दशक से ज़्यादा समय तक ऐसा करने के बाद पूरे देश ने आख़िरकार ध्यान दिया।

  लेकिन ये कोई संत नहीं है। गलतियाँ होती हैं। जैसे-जैसे नए हालात आते हैं, और ज़्यादा गलतियाँ होंगी। ये भी वैसी ही एक आम कंपनी है, आम लोगों से मिलकर बनी।

  जब तक वो अपनी गलतियों का सामना करता रहे और उन बातों पर कायम रहे, उसे दूसरा मौका मिलना चाहिए।

  जिस कंपनी को लोग आवर्धक काँच से छानते हैं, वो उस कंपनी से ज़्यादा भरोसेमंद है जो किसी भी गलती के तुरंत बाद सब कुछ छिपा लेती है।
