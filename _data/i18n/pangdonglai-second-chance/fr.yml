title: "Le shampoing qui n'était pas vraiment japonais, et pourquoi Pangdonglai mérite une seconde chance"
description: "Un détaillant chinois connu pour bien traiter ses employés a vendu un shampoing étiqueté « importé du Japon ». Les papiers étaient authentiques ; l'histoire de la marque, non. Mérite-t-il une seconde chance ?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  Pangdonglai —une chaîne de supermarchés chinoise— revient sur le devant de la scène en Chine, et tout tient à une bouteille de shampoing.

  La chaîne, installée dans la province du Henan, s'est fait connaître pour la façon inhabituelle dont elle traite ses employés —de bons salaires, de courtes journées, des congés généreux— et pour ses égards envers les clients, comme les consommateurs chinois en voient rarement. C'est cette réputation qui a fait circuler l'histoire aussi loin.

  Sur ses rayons figurait un shampoing nommé CABELO, étiqueté « importé du Japon ». Quelqu'un est allé vérifier au Japon et a découvert que la marque n'était vendue dans aucun supermercado japonais courant.

  La réponse de Pangdonglai a été précise. Elle aurait entendu la même accusation dès janvier, dit-elle, et aurait envoyé des gens à l'usine au Japon, parcouru l'atelier et vérifié un à un les formulaires de douane, le certificat d'origine et les rapports d'inspection. Sa conclusion : le shampoing était bien fabriqué au Japon, et non produit en Chine puis fait passer pour une importation.

  Sur les faits, cela tient. La marque est déposée et fabriquée au Japon. Au-delà, elle n'a presque rien à voir avec le Japon. Elle a été conçue dès le départ pour le marché chinois, de manière à ce que l'acheteur suppose qu'il s'agit d'une marque connue, que les gens au Japon utilisent vraiment. En Chine, cela a un nom : une « fausse marque étrangère » —un produit qui revêt une identité étrangère sans l'avoir jamais été—.

  Donc, sur les faits, Pangdonglai n'a rien falsifié, et la marque non plus.

  Le tort causé aux clients est réel malgré tout.

  Ils attendaient un produit de meilleure qualité et aux résultats éprouvés, quelque chose de populaire au Japon. Ils ont obtenu un shampoing que personne au Japon ne connaît, produit expressément pour être pris pour ce qu'il n'est pas.

  Les employés de Pangdonglai n'imaginaient sans doute pas qu'un produit avec tous les papiers en règle puisse encore être « fait uniquement pour les acheteurs chinois ». Les formulaires de douane, le certificat d'origine, les rapports d'inspection : tout est en ordre. Mais aucun de ces documents ne vous dit si une marque signifie quelque chose dans le pays dont elle prétend venir.

  Je suis prêt à croire qu'il s'agit d'une erreur honnête.

  Ce n'est pas que Pangdonglai voulait induire les gens en erreur. Ses capacités n'ont tout simplement pas suivi les attentes qu'on a désormais de lui. Vérifier comment un produit importé est réellement considéré dans son pays d'origine est un travail que Pangdonglai n'a pas encore fait. Si cet épisode l'amène à approfondir d'un cran son contrôle des importations, tant mieux pour les clients.

  La célébrité de Pangdonglai n'a aucun secret. Il a pris des idées évidentes —bien traiter ses employés, être honnête avec ses clients— et les a réellement mises en pratique. Après plus d'une décennie à le faire, le pays entier a fini par s'en apercevoir.

  Mais ce n'est pas un saint. Il se trompe. Et à mesure qu'il rencontrera de nouvelles situations, il se trompera davantage. C'est une entreprise faite de gens ordinaires, comme n'importe quelle autre.

  Tant qu'il continuera à affronter ses erreurs et à s'en tenir à ces idées, il mérite une seconde chance.

  Une entreprise que le public passe au crible sous une loupe est plus fiable que celle qui s'empresse de tout étouffer dès que quelque chose tourne mal.
