title: "Shampo không thực sự là hàng Nhật, và vì sao Pangdonglai vẫn xứng đáng có cơ hội thứ hai"
description: "Một nhà bán lẻ Trung Quốc nổi tiếng vì đối xử tốt với nhân viên đã bán một chai shampo dán nhãn 'nhập khẩu từ Nhật'. Giấy tờ thì có thật, còn câu chuyện của thương hiệu thì không. Liệu có nên cho cơ hội thứ hai?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  Pangdonglai (một chuỗi siêu thị của Trung Quốc) lại đang được nhắc đến nhiều ở Trung Quốc, và lý do là một chai shampo.

  Chuỗi siêu thị ở tỉnh Hà Nam này nổi tiếng vì cách đối xử khác thường với nhân viên: lương tốt, giờ làm ngắn, nghỉ phép hào phóng. Cách họ chăm sóc khách hàng cũng hiếm thấy đối với người mua Trung Quốc. Chính danh tiếng đó khiến câu chuyện lan đi xa đến vậy.

  Trên kệ có một loại shampo tên CABELO, dán nhãn 'nhập khẩu từ Nhật'. Có người sang Nhật kiểm tra và thấy thương hiệu này không được bán ở bất kỳ siêu thị lớn nào.

  Phản hồi của Pangdonglai rất cụ thể. Họ nói đã nghe cùng một lời cáo buộc từ tháng Giêng, rồi cử người sang nhà máy ở Nhật, đi xem xưởng sản xuất và kiểm tra từng tờ một: tờ khai hải quan, giấy chứng nhận xuất xứ, hồ sơ kiểm định. Kết luận: chai shampo đúng là sản xuất tại Nhật, chứ không phải làm ở Trung Quốc rồi đội lốt hàng nhập khẩu.

  Về mặt sự thật, kết luận đó đứng vững. Thương hiệu được đăng ký và sản xuất tại Nhật. Ngoài ra, nó gần như chẳng liên quan gì đến Nhật. Ngay từ đầu nó được tạo ra cho thị trường Trung Quốc, thiết kế để người mua nghĩ rằng đây là một thương hiệu nổi tiếng mà người Nhật thực sự dùng. Trung Quốc có tên gọi cho chuyện này là 'thương hiệu ngoại giả': một sản phẩm đội lốt danh tính nước ngoài nhưng chưa từng là hàng ngoại thật.

  Nên về mặt sự thật, Pangdonglai không làm giả điều gì, và bản thân thương hiệu cũng không làm giả điều gì.

  Dù vậy, thiệt hại cho khách hàng là có thật.

  Họ mong đợi một sản phẩm chất lượng tốt hơn, hiệu quả đã được chứng minh, thứ gì đó phổ biến ở Nhật. Thứ họ nhận được lại là một chai shampo chẳng ai ở Nhật biết đến, được sản xuất đúng để bị nhầm thành thứ nó không phải.

  Nhân viên Pangdonglai hẳn không ngờ rằng một sản phẩm có đủ mọi giấy tờ hợp lệ vẫn có thể 'chỉ dành cho người mua Trung Quốc'. Tờ khai hải quan, giấy chứng nhận xuất xứ, hồ sơ kiểm định, tờ nào cũng đúng. Nhưng chẳng tờ nào trong số đó cho bạn biết một thương hiệu có ý nghĩa gì ở quốc gia mà nó nhận là quê hương.

  Tôi sẵn sàng tin đây chỉ là một sai sót vô tình.

  Không phải Pangdonglai định lừa dối ai. Năng lực của họ đơn giản là chưa theo kịp kỳ vọng mà người dân nay đặt vào họ. Việc kiểm tra một sản phẩm nhập khẩu thực sự được đánh giá thế nào ở nơi xuất xứ là công việc Pangdonglai chưa làm. Nếu vụ việc này đưa khâu sàng lọc hàng nhập khẩu của họ đi sâu thêm một lớp, thì đó là điều tốt cho khách hàng.

  Không có bí quyết gì đằng sau danh tiếng của Pangdonglai. Họ chọn những ý tưởng hiển nhiên: đối xử tốt với nhân viên, thành thật với khách hàng. Rồi thực sự đưa vào thực tế. Sau hơn mười năm làm vậy, cả nước cuối cùng cũng để ý.

  Nhưng họ không phải thánh nhân. Họ từng sai. Khi gặp tình huống mới, họ sẽ còn sai nhiều hơn. Đây là công ty được tạo nên từ những người bình thường, như bao công ty khác.

  Chừng nào còn tiếp tục đối diện với sai sót của mình và giữ vững những ý tưởng đó, họ vẫn xứng đáng có cơ hội thứ hai.

  Một công ty bị công chúng mổ xẻ dưới kính lúp thì đáng tin hơn một công ty vội vã che giấu ngay khi có chuyện hư hỏng.
