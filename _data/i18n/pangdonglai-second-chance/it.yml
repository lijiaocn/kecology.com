title: "Lo shampoo che non era davvero giapponese, e perché Pangdonglai merita ancora una seconda possibilità"
description: "Un rivenditore cinese noto per trattare bene i dipendenti ha venduto uno shampoo etichettato come 'importato dal Giappone'. I documenti erano veri, la storia del marchio no. Merita una seconda possibilità?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  Pangdonglai (una catena di supermercati cinese) torna a far parlare di sé in Cina, e il motivo è una bottiglia di shampoo.

  Questa catena della provincia dello Henan è diventata famosa per il modo insolito in cui tratta i dipendenti: stipendi buoni, orari brevi, ferie generose. E anche per come si prende cura dei clienti, in un modo che gli acquirenti cinesi raramente vedono. È questa reputazione che ha fatto circolare tanto la storia.

  Sugli scaffali c'era uno shampoo chiamato CABELO, con l'etichetta 'importato dal Giappone'. Qualcuno è andato a controllare in Giappone e ha scoperto che il marchio non si vendeva in nessun supermercato giapponese importante.

  La risposta di Pangdonglai è stata precisa. Ha detto di aver sentito la stessa accusa già a gennaio, e di aver mandato persone alla fabbrica in Giappone, girato l'officina e controllato uno per uno i moduli doganali, il certificato d'origine e i verbali di ispezione. La conclusione: lo shampoo era davvero prodotto in Giappone, non fabbricato in Cina e spacciato per importazione.

  Sui fatti, la conclusione regge. Il marchio è registrato e prodotto in Giappone. Oltre a questo, con il Giappone non ha quasi nulla a che fare. È stato creato fin dall'inizio per il mercato cinese, pensato perché gli acquirenti lo prendessero per un marchio noto, usato davvero dai giapponesi. In Cina ha un nome preciso: «marchio straniero fasullo», un prodotto che indossa un'identità straniera senza mai esserlo stata.

  Quindi, sui fatti, Pangdonglai non ha falsificato niente, e neanche il marchio ha falsificato niente.

  Eppure il danno per i clienti è reale.

  Si aspettavano un prodotto di qualità migliore, con risultati comprovati, qualcosa di popolare in Giappone. Quello che hanno ottenuto è uno shampoo che in Giappone non conosce nessuno, prodotto apposta per essere scambiato per ciò che non è.

  Lo staff di Pangdonglai probabilmente non ha mai immaginato che un prodotto con tutti i documenti in regola potesse ancora essere «fatto solo per gli acquirenti cinesi». I moduli doganali, il certificato d'origine, i verbali di ispezione: tutto torna. Ma nessuno di quei documenti può dirti se un marchio significhi qualcosa nel Paese che dichiara come proprio.

  Sono disposto a credere che sia stato un errore in buona fede.

  Non è che Pangdonglai volesse ingannare qualcuno. Semplicemente, le sue capacità non hanno ancora raggiunto le aspettative che la gente ripone oggi in lei. Verificare come un prodotto importato sia davvero considerato nel paese d'origine è un lavoro che Pangdonglai non ha ancora fatto. Se questo episodio spingerà il suo controllo sulle importazioni un livello più in là, sarà un bene per i clienti.

  Non c'è nessun segreto nel successo di Pangdonglai. Ha preso idee ovvie: tratta bene i dipendenti, sii onesto con i clienti. E le ha messe davvero in pratica. Dopo più di dieci anni a fare così, finalmente il Paese intero se ne è accorto.

  Ma non è un santo. Sbaglia. E mano a mano che affronta situazioni nuove, sbaglierà ancora. È un'azienda fatta di persone comuni, come qualsiasi altra.

  Finché continua a guardare in faccia i propri errori e a tenere ferme quelle idee, merita una seconda possibilità.

  Un'azienda che il pubblico seziona sotto una lente d'ingrandimento è più affidabile di una che copre tutto non appena qualcosa va storto.
