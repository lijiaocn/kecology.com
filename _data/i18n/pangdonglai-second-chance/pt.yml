title: "O xampu que não era tão japonês assim, e por que o Pangdonglai merece uma segunda chance"
description: "Um varejista chinês conhecido por tratar bem seus funcionários vendeu um xampu rotulado como importado do Japão. Os papéis eram verdadeiros; a história da marca, não. Ele merece uma segunda chance?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  O Pangdonglai —uma rede de supermercados chinesa— volta a ser assunto na China, e o motivo é uma garrafa de xampu.

  A rede, da província de Henan, ficou famosa por tratar os funcionários de um jeito incomum —bons salários, jornadas curtas, férias generosas— e por cuidar dos clientes como o consumidor chinês raramente vê. Foi essa reputação que fez a história se espalhar tanto.

  Nas prateleiras havia um xampu chamado CABELO, rotulado como «importado do Japão». Alguém foi conferir no Japão e descobriu que a marca não era vendida em nenhum supermercado japonês convencional.

  A resposta do Pangdonglai foi específica. Segundo a empresa, ela já havia ouvido a mesma alegação em janeiro e enviou gente à fábrica no Japão, percorreu a oficina e conferiu um a um os formulários de alfândega, o certificado de origem e os registros de inspeção. Conclusão: o xampu era mesmo fabricado no Japão, não era produzido na China para depois passar por importado.

  Nos fatos, isso se sustenta. A marca é registrada e fabricada no Japão. Fora isso, quase nada tem a ver com o Japão. Foi criada desde o começo para o mercado chinês, feita para que o comprador assumisse se tratar de uma marca conhecida, que as pessoas no Japão de fato usam. Na China, isso tem um nome: uma «marca estrangeira falsa» —um produto que veste uma identidade estrangeira sem nunca ter sido um—.

  Então, nos fatos, o Pangdonglai não falsificou nada, e a marca também não.

  O prejuízo para os clientes, ainda assim, é real.

  Eles esperavam um produto de melhor qualidade e resultados comprovados, algo popular no Japão. O que receberam foi um xampu que ninguém no Japão conhece, produzido justamente para ser confundido com algo que não é.

  Provavelmente os funcionários do Pangdonglai nunca imaginaram que um produto com todos os papéis em dia ainda pudesse ser «feito só para compradores chineses». Os formulários de alfândega, o certificado de origem, os registros de inspeção —tudo confere. Mas nenhum desses documentos diz se uma marca tem algum significado no país de onde afirma vir.

  Estou disposto a acreditar que foi um engano honesto.

  Não é que o Pangdonglai quisesse enganar ninguém. Sua capacidade simplesmente não acompanhou as expectativas que hoje se tem dele. Verificar como um produto importado é realmente visto em seu país de origem é um trabalho que o Pangdonglai ainda não faz. Se este episódio fizer sua triagem de importações ir um nível mais fundo, melhor para os clientes.

  Não há segredo no sucesso do Pangdonglai. Ele pegou ideias óbvias —tratar bem os funcionários, ser honesto com os clientes— e de fato as colocou em prática. Depois de mais de uma década fazendo isso, o país inteiro finalmente percebeu.

  Mas ele não é um santo. Erra. E, à medida que encontra situações novas, vai errar mais. É uma empresa feita de gente comum, como qualquer outra.

  Enquanto continuar encarando seus erros e se mantendo fiel a essas ideias, merece uma segunda chance.

  Uma empresa que o público desmonta sob uma lupa é mais confiável do que aquela que se apressa em encobrir tudo assim que algo dá errado.
