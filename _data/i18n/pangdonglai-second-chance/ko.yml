title: "정말 일본 제품은 아니었던 샴푸, 그럼에도 판둥라이에게 다시 한 번 기회를 줘도 될까"
description: "직원을 잘 대하는 것으로 알려진 중국 유통업체가 '일본 수입'이라고 표시된 샴푸를 팔았다. 서류는 진짜였지만 브랜드의 이야기는 아니었다. 다시 한 번 기회를 줘야 할까."
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  중국에서 판둥라이가 다시 화제다. 한 병의 샴푸 때문이다.

  판둥라이(중국의 슈퍼마켓 체인)는 직원을 유난히 잘 챙기는 곳으로 유명해졌다. 임금이 높고 근무 시간이 짧으며 휴가도 넉넉하다. 고객을 돌보는 방식도 중국 소비자가 좀처럼 보지 못한 수준이다. 이런 평판이 있어 이 이야기가 이렇게 널리 퍼졌다.

  매대에는 'CABELO'라는 샴푸가 '일본 수입'이라고 적혀 있었다. 누군가 일본에서 확인해 보니 그 브랜드는 일본의 어떤 주류 슈퍼에서도 팔지 않았다.

  판둥라이의 설명은 구체적이었다. 올해 1월에 같은 의혹을 들었고, 사람을 일본의 그 공장에 보내 작업장을 돌아보며 통관 서류, 원산지 증명, 검사 기록을 하나씩 확인했다는 것이다. 결론은 이랬다. 샴푸는 실제로 일본에서 만들어졌고, 중국에서 생산해 수입품으로 속인 것이 아니다.

  사실만 놓고 보면 이 설명은 성립한다. 브랜드는 일본에서 등록되고 일본에서 제조된다. 그 밖에는 일본과 거의 관련이 없다. 처음부터 중국 시장을 겨냥해 만들어졌고, 일본에서 실제로 쓰는 유명 브랜드라고 소비자가 여기도록 설계되었다. 중국에는 이를 가리키는 말이 있다. '가짜 외국 브랜드(假洋牌)'다. 외국인 척하지만 실체는 오직 중국 시장을 위해 만들어진 제품이라는 뜻이다.

  따라서 사실관계만 보면 판둥라이는 아무것도 속이지 않았고, 브랜드도 아무것도 속이지 않았다.

  그럼에도 고객이 입은 피해는 실제다.

  그들은 품질이 더 좋고 효과가 검증되었으며 일본에서 인기 있는 제품을 기대했다. 받아든 것은 일본에서 아무도 모르는 샴푸였고, 다른 것으로 오인되기 위해 태어난 제품이었다.

  판둥라이 직원들은 서류가 모두 갖춰진 제품도 '중국 구매자만을 위해 만들어진' 것일 수 있다는 상상은 못 했을 것이다. 통관 서류도, 원산지 증명도, 검사 기록도 빠짐없이 맞다. 하지만 그 어느 서류도 그 브랜드가 주장하는 나라에서 실제로 의미가 있는지 알려주지 않는다.

  나는 이것이 순수한 실수였다고 믿고 싶다.

  판둥라이가 사람을 오도하려 한 것은 아니다. 다만 지금 사람들이 판둥라이에게 거는 기대를 아직 따라가지 못했을 뿐이다. 수입품이 원산지에서 실제로 어떻게 받아들여지는지 확인하는 일을 판둥라이는 아직 해오지 않았다. 이번 일로 수입품 심사가 한 층 더 깊어진다면 고객에게 좋은 일이다.

  판둥라이가 유명해진 데는 비결이 없다. 당연한 방법을 실제로 실천했을 뿐이다. 직원에게 잘하고 고객에게 정직하게 대하는 것, 그것뿐이었다. 십몇 년 그렇게 해오자 비로소 온 나라가 알아보았다.

  하지만 성인은 아니다. 실수를 한다. 새로운 상황을 만날수록 더 많이 틀릴 것이다. 다른 모든 회사와 마찬가지로 평범한 사람들로 이루어져 있다.

  앞으로도 자기 잘못을 마주하고 그 원칙을 지킨다면, 판둥라이에게 다시 한 번 기회를 줘도 된다.

  돋보기로 흠을 잡히는 회사가, 문제가 생길 때마다 덮어버리는 회사보다 더 믿을 만하다.
