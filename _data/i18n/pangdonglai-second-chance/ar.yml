title: "الشامبو الذي لم يكن يابانياً حقاً، ولماذا يستحق «بانغ دونغ لاي» (Pangdonglai) فرصة ثانية"
description: "بائع تجزئة صيني معروف بحسن معاملة موظفيه باع شامبو مُوسوماً بأنه مستورد من اليابان. الأوراق كانت حقيقية، أما قصة العلامة فلم تكن كذلك. هل يستحق فرصة ثانية؟"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  عاد «بانغ دونغ لاي» (سلسلة متاجر صينية) يتصدر الحديث في الصين، والسبب زجاجة شامبو.

  «بانغ دونغ لاي» سلسلة متاجر في مقاطعة خنان، اشتهرت بمعاملة موظفيها بطريقة غير مألوفة: أجور جيدة، ساعات عمل قصيرة، وإجازات سخية، وبالعناية بالزبائن بطرق قلّما يراها المتسوقون الصينيون. هذه السمعة هي التي دفعت القصة إلى الانتشار بهذا الشكل.

  كان على رفوفه شامبو باسم CABELO، مُوسوماً بـ«مستورد من اليابان». تحقّق أحدهم في اليابان فوجد أن العلامة لا تُباع في أي متجر ياباني كبير.

  وجاء رد «بانغ دونغ لاي» محدداً. قال إنه سمع الادعاء ذاته في يناير، فأرسل أشخاصاً إلى المصنع في اليابان، فتجوّلوا في الورشة وتحقّقوا واحدةً واحدةً من أوراق الجمارك وشهادة المنشأ وسجلات الفحص. وخلصوا إلى أن الشامبو صُنع في اليابان فعلاً، لا في الصين ثم أُوهم بأنه مستورد.

  وهذا يثبت من حيث الوقائع. العلامة مسجّلة ومصنوعة في اليابان، ولا تربطها باليابان شيء تقريباً بعد ذلك. بُنيت منذ البداية من أجل السوق الصينية، صُمّمت لتوحي للمتسوق بأنها علامة معروفة يستخدمها الناس في اليابان فعلاً. وللصين اسم لهذا: «العلامة الأجنبية المزيّفة» — منتج يتوشّح بهوية أجنبية لم يكن يوماً كذلك، ويُصنع خصيصاً لخدمة السوق المحلية.

  فمن حيث الوقائع إذن، لم يزوّر «بانغ دونغ لاي» شيئاً، ولم تزوّر العلامة شيئاً كذلك.

  لكن الضرر الذي لحق بالزبائن حقيقي مع ذلك.

  كانوا يتوقعون منتجاً أفضل جودةً وله نتائج مُثبتة، وشائعاً في اليابان. فحصلوا على شامبو لا يعرفه أحد في اليابان، أُنتج خصيصاً ليُظنّ به غير ما هو عليه.

  غالباً لم يخطر بال بالعاملين في «بانغ دونغ لاي» أن منتجاً يستوفي كل الأوراق الصحيحة قد يكون «مُعدّاً للمشترين الصينيين وحدهم». أوراق الجمارك، شهادة المنشأ، سجلات الفحص، كلها سليمة. لكن لا واحدة من هذه الأوراق تستطيع أن تقول لك إن للعلامة أي معنى في البلد الذي تدّعي أنها جاءت منه.

  أنا مستعد لتصديق أن هذا كان خطأً غير مقصود.

  لم يكن الأمر أن «بانغ دونغ لاي» أراد تضليل الناس. قدرته ببساطة لم تلحق بعد بتوقّعات الناس منه. التحقّق من كيفية النظر إلى منتج مستورد في بلد منشئه عملٌ لم يقم به «بانغ دونغ لاي» بعد. فإن دفعت هذه الحادثة فحصه للواردات إلى تعميق طبقة أخرى، فهذا خير للزبائن.

  لا سرّ في سبب شهرة «بانغ دونغ لاي». أخذ الأفكار البديهية — أحسن إلى موظفيك، وكن صادقاً مع زبائنك — وطبّقها فعلياً. وبعد أكثر من عقد من العمل بهذا، انتبهت البلاد كلها أخيراً.

  لكنه ليس قدّيساً. يخطئ. ومع كل موقف جديد سيخطئ أكثر. إنه شركة تتألف من أناس عاديين، كأي شركة أخرى.

  ما دام يواجه أخطاءه ويتمسّك بتلك الأفكار، فإنه يستحق فرصة ثانية.

  الشركة التي يفكّكها الجميع تحت عدسة مكبّرة أكثر جدارة بالثقة من شركة تُخفي كل شيء بمجرد أن يقع خطأ.
