title: "那瓶洗发水其实不是日本的，胖东来仍值得再给一次机会"
description: "一家以善待员工闻名的中国零售商，卖出了标着「日本进口」的洗发水。报关手续是真的，品牌的故事却是假的。它值得再给一次机会吗？"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  胖东来又上了热搜，起因是一瓶洗发水。

  胖东来是河南的一家超市连锁，因为对员工格外好而出了名——工资高、工时短、假期足，对顾客的照顾也细致到中国消费者很少见的程度。正是这份口碑，让这件事传得这么广。

  货架上有一款叫 CABELO 的洗发水，标签写着「日本进口」。有人特地去日本查了一圈，发现这个品牌在日本任何一家主流超市都找不到。

  胖东来的回应很具体。它说早在今年一月就听到过同样的质疑，随即派人去了日本那家工厂，走进车间，把报关单、原产地证明和检验记录一项项核对了一遍。结论是：这款洗发水确实在日本生产，不是在国内造好再冒充进口。

  就事实而言，这个说法站得住。品牌在日本注册、在日本制造，仅此而已。除此之外，它跟日本几乎没什么关系。它从一开始就是冲着中国市场做出来的，就是想让消费者以为这是日本人在用的知名品牌。中国管这叫「假洋牌」——披着一副外国身份，骨子里却是专为国内市场打造的产品。

  所以从事实看，胖东来没有造假，这个品牌也没有造假。

  可对消费者的伤害是实实在在的。

  他们以为买到的是品质更好、效果经过验证、在日本很受欢迎的产品。到手的却是一款日本人根本没听过的洗发水，生来就是为了被误认成另一个东西。

  胖东来的员工大概从没想到过，一个手续齐全的产品，也可能是「只为中国买家准备的」。报关单、原产地证明、检验记录，每一份都查得出处。可这些文件没有一份能告诉你，这个品牌在它声称的母国到底有没有人认。

  我愿意相信这是一次无心之失。

  倒不是胖东来存心误导谁。它只是还没跟上人们对它的期待：查一款进口货在原产地究竟混得怎么样，这件工作胖东来还没做过。如果这件事能推着它把进口商品的审核再往深里做一层，那对顾客是好事。

  胖东来出名没什么秘密。它把再朴素不过的道理——善待员工、诚信待客——真真切切落到了实处。这么做了十几年，全国才终于看见。

  但它不是圣人。它会犯错。往后遇到新情况，还会犯更多错。它和任何一家公司一样，都是由普通人组成的。

  只要它还肯直面自己的错误、守住那些朴素的道理，就值得再给一次机会。

  一家被公众拿放大镜逐条挑刺的公司，比一出事就捂盖子的公司更值得信任。
