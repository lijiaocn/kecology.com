title: "El champú que no era realmente japonés, y por qué Pangdonglai merece una segunda oportunidad"
description: "Un minorista chino conocido por tratar bien a sus empleados vendió un champú etiquetado como importado de Japón. Los papeles eran auténticos; la historia de la marca, no. ¿Merece una segunda oportunidad?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  Pangdonglai, una cadena de supermercados china, vuelve a estar en boca de todos en China, y todo por una botella de champú.

  La cadena, de la provincia de Henan, se ha hecho famosa por tratar a sus empleados como pocas empresas lo hacen —buenos salarios, jornadas cortas, generosas vacaciones— y por cuidar a los clientes de formas que el consumidor chino rara vez ve. Esa reputación explica lo lejos que ha llegado esta historia.

  En sus estantes había un champú llamado CABELO, etiquetado como «importado de Japón». Alguien lo buscó en Japón y descubrió que la marca no se vendía en ningún supermercado japonés corriente.

  La respuesta de Pangdonglai fue concreta. Según dijo, ya había oído la misma acusación en enero y había enviado a personas a la fábrica en Japón, recorrido el taller y revisado uno por uno los formularios de aduanas, el certificado de origen y los registros de inspección. Su conclusión: el champú sí se fabricaba en Japón; no se producía en China para luego hacerse pasar por importado.

  En los hechos, eso se sostiene. La marca está registrada y se fabrica en Japón. Más allá de eso, casi no tiene nada que ver con Japón. Se creó desde el principio para el mercado chino, pensada para que los compradores dieran por sentado que era una marca conocida y que la gente en Japón realmente usa. En China tiene un nombre: una «marca extranjera falsa» —un producto que se disfraza de identidad extranjera sin haberlo sido nunca—.

  Así que, en los hechos, Pangdonglai no falsificó nada, y la marca tampoco.

  El perjuicio para los clientes, sin embargo, es real.

  Esperaban un producto de mejor calidad y resultados probados, algo popular en Japón. Lo que obtuvieron fue un champú que nadie en Japón conoce, fabricado expresamente para que se lo confundiera con algo que no es.

  Es probable que la gente de Pangdonglai nunca imaginara que un producto con todos los papeles en regla pudiera estar «hecho solo para compradores chinos». Los formularios de aduanas, el certificado de origen, los registros de inspección: todo cuadra. Pero ninguno de esos documentos dice si una marca significa algo en el país del que dice venir.

  Estoy dispuesto a creer que fue un error honesto.

  No es que Pangdonglai quisiera engañar a nadie. Su capacidad simplemente no ha alcanzado las expectativas que hoy se tienen de ella. Comprobar cómo se valora realmente un producto importado en su país de origen es un trabajo que Pangdonglai aún no hace. Si este episodio la lleva a profundizar un nivel más su control de las importaciones, tanto mejor para los clientes.

  El éxito de Pangdonglai no tiene ningún secreto. Tomó ideas obvias —tratar bien a los empleados, ser honesto con los clientes— y las llevó a la práctica. Tras más de una década haciéndolo, todo el país por fin se dio cuenta.

  Pero no es un santo. Se equivoca. Y a medida que se enfrente a situaciones nuevas, se equivocará más. Es una empresa hecha de gente corriente, como cualquier otra.

  Mientras siga enfrentando sus errores y manteniéndose fiel a esas ideas, merece una segunda oportunidad.

  Una empresa a la que el público examina con lupa es más fiable que otra que se apresura a encubrirlo todo en cuanto algo sale mal.
