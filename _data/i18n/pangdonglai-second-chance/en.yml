title: "The Shampoo That Wasn't Really Japanese, and Why Pangdonglai Still Deserves a Second Chance"
description: "A Chinese retailer known for treating its staff well sold a shampoo labeled as imported from Japan. The paperwork was real; the brand's story wasn't. Does it deserve a second chance?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  Pangdonglai is trending in China again, and a bottle of shampoo is why.

  Pangdonglai is a supermarket chain in Henan province that has become famous for treating its employees unusually well — good pay, short hours, generous time off — and for taking care of customers in ways Chinese shoppers rarely see. That reputation is why this story spread so far.

  A shampoo called CABELO was on its shelves, labeled "imported from Japan." Someone checked in Japan and found the brand wasn't sold in any mainstream Japanese supermarket.

  Pangdonglai's response was specific. It had heard the same claim back in January, it said, and had sent people to the factory in Japan, walked the workshop, and checked the customs forms, the certificate of origin and the inspection records one by one. Its conclusion: the shampoo really was made in Japan, not produced in China and passed off as an import.

  On the facts, that holds up. The brand is registered and manufactured in Japan. Beyond that, it has almost nothing to do with Japan. It was built from the start for the Chinese market, designed to let shoppers assume it's a well-known brand that people in Japan actually use. China has a name for this: a "fake foreign brand" — a product that wears a foreign identity without ever being one.

  So on the facts, Pangdonglai didn't fake anything, and the brand didn't fake anything either.

  The harm to customers is real nonetheless.

  They expected a product with better quality and proven results, something popular in Japan. What they got was a shampoo no one in Japan knows, produced specifically to be mistaken for something it isn't.

  Pangdonglai's staff probably never imagined that a product with all the right documents could still be "made for Chinese buyers only." The customs forms, the origin certificate, the inspection records — every one of them checks out. But none of those documents can tell you whether a brand means anything in the country it claims to come from.

  I'm willing to believe this was an honest mistake.

  It wasn't that Pangdonglai meant to mislead people. Its ability simply hasn't caught up with the expectations people now have of it. Checking how an imported product is actually regarded where it comes from is work Pangdonglai hasn't done yet. If this episode pushes its screening of imports a layer deeper, that's good for customers.

  There's no secret to why Pangdonglai became famous. It took the obvious ideas — be good to your employees, be honest with your customers — and actually put them into practice. After more than a decade of doing that, the whole country finally noticed.

  But it isn't a saint. It gets things wrong. As it runs into new situations, it will get more things wrong. It's a company made up of ordinary people, like any other.

  As long as it keeps facing its mistakes and holding to those ideas, it deserves a second chance.

  A company that the public picks apart under a magnifying glass is more trustworthy than one that covers things up the moment something goes wrong.
