title: "แชมพูที่ไม่ได้เป็นญี่ปุ่นจริง ๆ และทำไมผังตงไหล (Pangdonglai) ยังสมควรได้รับโอกาสครั้งที่สอง"
description: "ผู้ค้าปลีกรายหนึ่งในจีนที่ขึ้นชื่อเรื่องดูแลพนักงานเป็นอย่างดี ขายแชมพูที่ติดป้ายว่า 'นำเข้าจากญี่ปุ่น' เอกสารของจริง แต่เรื่องราวของแบรนด์ไม่จริง เขาสมควรได้โอกาสครั้งที่สองไหม"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  ผังตงไหล (Pangdonglai) เชนซูเปอร์มาร์เก็ตสัญชาติจีน กำลังกลับมาเป็นข่าวดังในจีนอีกครั้ง และสาเหตุก็คือแชมพูขวดหนึ่ง

  เชนซูเปอร์มาร์เก็ตในมณฑลเหอหนานนี้โด่งดังจากการดูแลพนักงานในแบบที่ไม่ธรรมดา ทั้งค่าจ้างที่ดี ชั่วโมงทำงานสั้น และวันลาที่เอื้อเฟื้อ รวมถึงการดูแลลูกค้าในแบบที่คนจีนหาได้ยาก ชื่อเสียงนี้แหละคือเหตุผลที่เรื่องราวแพร่กระจายไปไกลขนาดนี้

  แชมพูยี่ห้อ CABELO วางอยู่บนชั้น โดยติดป้ายว่า 'นำเข้าจากญี่ปุ่น' มีคนไปตรวจสอบที่ญี่ปุ่นแล้วพบว่า แบรนด์นี้ไม่ได้ขายในซูเปอร์มาร์เก็ตกระแสหลักแห่งใดเลย

  คำตอบของผังตงไหลชัดเจนมาก บริษัทบอกว่าได้ยินข้อกล่าวหาเดิมมาตั้งแต่เดือนมกราคม จึงส่งคนไปที่โรงงานในญี่ปุ่น เดินดูพื้นที่ผลิต และตรวจเอกสารศุลกากร ใบรับรองแหล่งกำเนิด และบันทึกการตรวจคุณภาพทีละฉบับ สรุปคือแชมพูนี้ผลิตในญี่ปุ่นจริง ไม่ได้ผลิตในจีนแล้วอ้างว่าเป็นของนำเข้า

  ในข้อเท็จจริง สรุปนี้ฟังขึ้น แบรนด์จดทะเบียนและผลิตในญี่ปุ่น นอกจากนั้นแล้ว แทบไม่มีอะไรเกี่ยวข้องกับญี่ปุ่นเลย มันถูกสร้างขึ้นเพื่อตลาดจีนตั้งแต่แรก ออกแบบมาให้ผู้ซื้อเข้าใจว่าเป็นแบรนด์ดังที่คนญี่ปุ่นใช้จริง ๆ จีนมีคำเรียกสำหรับเรื่องนี้ว่า 'แบรนด์ปลอมต่างชาติ' คือสินค้าที่สวมตัวตนต่างชาติทั้งที่ไม่เคยเป็นต่างชาติเลย

  ดังนั้นในข้อเท็จจริง ผังตงไหลไม่ได้ปลอมแปลงอะไร และแบรนด์เองก็ไม่ได้ปลอมแปลงอะไรเช่นกัน

  แต่ความเสียหายที่เกิดกับลูกค้านั้นมีจริง

  พวกเขาคาดหวังสินค้าที่มีคุณภาพดีกว่าและผลลัพธ์ที่พิสูจน์ได้ อะไรสักอย่างที่ได้รับความนิยมในญี่ปุ่น แต่สิ่งที่ได้กลับคือแชมพูที่ไม่มีใครในญี่ปุ่นรู้จัก ผลิตขึ้นมาเพื่อให้ถูกเข้าใจผิดว่าเป็นสิ่งที่มันไม่ใช่โดยเฉพาะ

  พนักงานของผังตงไหลคงไม่เคยคิดว่าสินค้าที่มีเอกสารครบถ้วนทุกอย่าง ยังอาจถูก 'ผลิตเฉพาะสำหรับผู้ซื้อชาวจีน' ได้ เอกสารศุลกากร ใบรับรองแหล่งกำเนิด บันทึกการตรวจคุณภาพ ทุกฉบับผ่านการตรวจสอบ แต่เอกสารเหล่านี้ไม่ฉบับใดเลยที่บอกได้ว่า แบรนด์หนึ่งมีความหมายอะไรในประเทศที่มันอ้างว่ามาจาก

  ผมยอมเชื่อว่านี่คือความผิดพลาดที่เกิดจากความบริสุทธิ์ใจ

  ไม่ได้หมายความว่าผังตงไหลตั้งใจหลอกลวงผู้คน เพียงแต่ความสามารถของบริษัทยังตามไม่ทันความคาดหวังที่ผู้คนมีต่อมันในตอนนี้ การตรวจสอบว่าสินค้านำเข้าได้รับการมองอย่างไรในแหล่งกำเนิด เป็นงานที่ผังตงไหลยังไม่เคยทำ ถ้าเหตุการณ์นี้ผลักดันให้การคัดกรองสินค้านำเข้าลึกขึ้นอีกชั้น นั่นก็ดีสำหรับลูกค้า

  ไม่มีความลับอะไรในเรื่องที่ผังตงไหลโด่งดัง บริษัทหยิบแนวคิดที่เห็นชัดอยู่แล้วมาใช้ ทั้งการปฏิบัติต่อพนักงานให้ดีและการซื่อสัตย์ต่อลูกค้า แล้วก็ลงมือทำจริง หลังจากทำมาเกินทศวรรษ ทั้งประเทศก็เพิ่งหันมาสังเกตเห็นในที่สุด

  แต่มันก็ไม่ใช่นักบุญ มันเคยทำผิด และเมื่อเจอสถานการณ์ใหม่ ๆ มันก็จะยิ่งทำผิดมากขึ้น นี่คือบริษัทที่ประกอบด้วยคนธรรมดา ๆ เหมือนบริษัทอื่นใด

  ตราบใดที่มันยังเผชิญหน้ากับความผิดพลาดของตัวเอง และยังยึดมั่นในแนวคิดเหล่านั้น มันก็สมควรได้รับโอกาสครั้งที่สอง

  บริษัทที่สาธารณชนแยกชิ้นส่วนตรวจสอบภายใต้แว่นขยาย ยิ่งเชื่อถือได้มากกว่าบริษัทที่รีบปิดบังทันทีที่มีปัญหาเกิดขึ้น
