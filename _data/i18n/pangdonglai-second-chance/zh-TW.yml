title: "那瓶洗髮精其實不是日本的，胖東來仍值得再給一次機會"
description: "一家以善待員工出名的中國零售商，賣出了標著「日本進口」的洗髮精。報關手續是真的，品牌的故事卻是假的。它值得再給一次機會嗎？"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  胖東來又上了熱搜，起因是一瓶洗髮精。

  胖東來是河南的一家超市連鎖，因為對員工格外好而出了名——薪水高、工時短、假期足，對顧客的照顧也細緻到台灣消費者很少見的程度。正是這份口碑，讓這件事傳得這麼廣。

  貨架上有一款叫 CABELO 的洗髮精，標籤寫著「日本進口」。有人特地去日本查了一圈，發現這個品牌在日本任何一家主流超市都找不到。

  胖東來的回應很具體。它說早在今年一月就聽過同樣的質疑，隨即派人去了日本那家工廠，走進車間，把報關單、原產地證明和檢驗報告一項項核對了一遍。結論是：這款洗髮精確實在日本生產，不是在中國製造好再冒充進口。

  就事實而言，這個說法站得住。品牌在日本註冊、在日本製造，僅此而已。除此之外，它跟日本幾乎沒什麼關係。它從一開始就是衝著中國市場做出來的，就是想讓消費者以為這是日本人在用的知名品牌。中國管這叫「假洋牌」——披著一副外國身分，骨子裡卻是專為中國市場打造的商品。

  所以從事實看，胖東來沒有造假，這個品牌也沒有造假。

  可對消費者的傷害是實實在在的。

  他們以為買到的是品質更好、效果經過驗證、在日本很受歡迎的商品。到手的卻是一款日本人根本沒聽過的洗髮精，生來就是為了被誤認成另一個東西。

  胖東來的員工大概從沒想過，一個手續齊全的商品，也可能是「只為中國買家準備的」。報關單、原產地證明、檢驗報告，每一份都查得出處。可這些文件沒有一份能告訴你，這個品牌在它聲稱的母國到底有沒有人認。

  我願意相信這是一次無心之失。

  倒不是胖東來存心誤導誰。它只是還沒跟上人們對它的期待：查一款進口貨在原產地究竟混得怎麼樣，這件工作胖東來還沒做過。如果這件事能推著它把進口商品的審核再往下做一層，那對顧客是好事。

  胖東來出名沒什麼秘訣。它把再樸素不過的道理——善待員工、誠信待客——確確實實落實了。這麼做了十幾年，全中國才終於看見。

  但它不是聖人。它會犯錯。往後遇到新情況，還會犯更多錯。它和任何一家公司一樣，都是由普通人組成的。

  只要它還肯直面自己的錯誤、守住那些樸素的道理，就值得再給一次機會。

  一家被公眾拿放大鏡逐條挑刺的公司，比一出事就掩蓋的公司更值得信任。
