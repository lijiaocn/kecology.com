title: "Das Shampoo, das eigentlich nicht japanisch war – und warum Pangdonglai eine zweite Chance verdient"
description: "Ein chinesischer Einzelhändler, der für die faire Behandlung seiner Mitarbeiter bekannt ist, verkaufte ein Shampoo, das als aus Japan importiert ausgezeichnet war. Die Papiere stimmten; die Geschichte der Marke nicht. Verdient er eine zweite Chance?"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  Pangdonglai —eine chinesische Supermarktkette— ist wieder in China in aller Munde, und der Grund ist eine Flasche Shampoo.

  Die Kette aus der Provinz Henan ist dafür bekannt, ihre Mitarbeiter ungewöhnlich gut zu behandeln —gute Löhne, kurze Schichten, großzügiger Urlaub— und sich um Kunden zu kümmern, wie es chinesische Käufer selten erleben. Dieser Ruf erklärt, warum sich die Geschichte so weit verbreitet hat.

  In ihren Regalen stand ein Shampoo namens CABELO, ausgezeichnet als „aus Japan importiert". Jemand hat in Japan nachgefragt und festgestellt, dass die Marke in keinem gängigen japanischen Supermarkt zu finden war.

  Pangdonglais Reaktion war konkret. Dem Unternehmen zufolge hatte es die gleiche Behauptung schon im Januar gehört und daraufhin Leute in die Fabrik nach Japan geschickt, die Werkstatt durchlaufen und Zollformulare, Ursprungszeugnis und Prüfprotokolle eins nach dem anderen geprüft. Das Ergebnis: Das Shampoo wurde tatsächlich in Japan hergestellt, nicht in China produziert und dann als Import ausgegeben.

  Auf der Ebene der Fakten hält das stand. Die Marke ist in Japan registriert und wird dort gefertigt. Darüber hinaus hat sie mit Japan so gut wie nichts zu tun. Sie wurde von Anfang an für den chinesischen Markt aufgebaut, darauf angelegt, dass Käufer annehmen, es handele sich um eine bekannte Marke, die Menschen in Japan tatsächlich verwenden. China hat dafür einen Namen: eine „unechte ausländische Marke" —ein Produkt, das eine ausländische Identität trägt, ohne je eine gewesen zu sein—.

  Also hat Pangdonglai auf der Ebene der Fakten nichts gefälscht, und die Marke auch nicht.

  Der Schaden für die Kunden ist dennoch real.

  Sie erwarteten ein Produkt von besserer Qualität mit nachgewiesener Wirkung, etwas, das in Japan beliebt ist. Bekamen sie ein Shampoo, das in Japan niemand kennt und das eigens dafür produziert wurde, für etwas gehalten zu werden, was es nicht ist.

  Pangdonglais Leute haben sich wohl kaum vorgestellt, dass ein Produkt mit allen richtigen Papieren trotzdem „nur für chinesische Käufer gemacht" sein kann. Die Zollformulare, das Ursprungszeugnis, die Prüfprotokolle —alle stimmen. Aber keines dieser Dokumente kann Ihnen sagen, ob eine Marke in dem Land, aus dem sie zu stammen vorgibt, überhaupt etwas bedeutet.

  Ich bin bereit, das für einen ehrlichen Fehler zu halten.

  Es war nicht so, dass Pangdonglai die Leute in die Irre führen wollte. Seine Fähigkeiten sind einfach nicht mit den Erwartungen Schritt gehalten, die man heute an das Unternehmen stellt. Zu prüfen, wie ein Importprodukt in seinem Herkunftsland tatsächlich angesehen wird, ist eine Aufgabe, die Pangdonglai noch nicht erledigt. Wenn diese Episode die Kontrolle der Importe eine Ebene tiefer treibt, ist das gut für die Kunden.

  Dass Pangdonglai bekannt wurde, hat kein Geheimnis. Das Unternehmen hat die naheliegenden Ideen —gut zu den Mitarbeitern sein, ehrlich zu den Kunden sein— tatsächlich in die Praxis umgesetzt. Nach über einem Jahrzehnt, in dem es das tat, hat das ganze Land es endlich bemerkt.

  Aber es ist kein Heiliger. Es macht Fehler. Und je öfter es in neue Situationen gerät, desto mehr Fehler wird es machen. Es ist ein Unternehmen aus ganz gewöhnlichen Menschen, wie jedes andere auch.

  Solange es seinen Fehlern weiter ins Gesicht sieht und an diesen Ideen festhält, verdient es eine zweite Chance.

  Ein Unternehmen, das die Öffentlichkeit unter der Lupe zerlegt, ist vertrauenswürdiger als eines, das beim ersten Problem alles zudeckt.
