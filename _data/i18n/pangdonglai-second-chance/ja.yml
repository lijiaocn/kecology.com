title: "本当は日本のものではなかったシャンプー、それでもパンドンライにもう一度チャンスを与えるべき理由"
description: "従業員を大切にすることで知られる中国の小売業者が、「日本から輸入」と表示されたシャンプーを売った。書類は本物だったが、ブランドの物語は違った。もう一度チャンスを与えるべきだろうか。"
image: /assets/img/blog/pangdonglai-second-chance/pangdonglai-cover.jpg

body: |
  また中国でパンドンライが話題になっている。きっかけは一本のシャンプーだ。

  パンドンライ（中国のスーパーチェーン）は、従業員への扱いが並外れてよいことで有名になった。賃金が高く、労働時間が短く、休暇もたっぷりだ。顧客の面倒も、中国の買い物客がめったに経験しないような見方で見ている。その評判があって、この話はここまで広がった。

  店頭に並んでいた「CABELO」というシャンプーには「日本から輸入」と表示されていた。誰かが日本で調べたところ、そのブランドは日本のどの主要スーパーにも置いていなかった。

  パンドンライの説明は具体的だった。今年1月に同じ指摘を受けて以来、担当者を日本の工場へ送り、作業場を歩き、通関書類、原産地証明、検査記録を一つずつ確認したという。結論はこうだ。シャンプーは確かに日本で作られており、中国で製造して輸入品に偽装したものではない。

  事実だけを見れば、この主張は通る。ブランドは日本で登録され、日本で製造されている。それ以外は、日本とほとんど関係がない。最初から中国市場を狙って作られ、日本で本当に使われている有名ブランドだと買い手に思わせるように設計されていた。中国にはこれを指す言葉がある。「偽の外国ブランド（假洋牌）」だ。外国の姿をまとっていながら、実態は中国市場のために作られた商品のことである。

  だから事実の上では、パンドンライは何も偽っていない。ブランドも何も偽っていない。

  それでも、顧客が受けた損害は本物だ。

  彼らが期待していたのは、品質がよく、効果が証明され、日本で人気のある商品だった。手にしたのは、日本では誰も知らないシャンプーで、別の何ものかに間違えられるために生まれたものだった。

  パンドンライのスタッフは、書類がすべて揃った商品でも「中国人の買い手だけを想定して作られた」ことがあるなど、思いもよらなかっただろう。通関書類も、原産地証明も、検査記録も、どれを取っても間違いない。だが、そのどれも、そのブランドが名乗る国で本当に意味を持っているかどうかは教えてくれない。

  私はこれを単なるうっかりだったと信じたい。

  パンドンライが人をだまそうとしたわけではない。ただ、いまの人々がパンドンライに寄せる期待に、まだ追いついていないだけだ。輸入品が産地で実際にどう評価されているかを調べる作業を、パンドンライはまだしてこなかった。この一件で輸入品の審査が一段深まれば、顧客にとっていいことだ。

  パンドンライが有名になった理由に秘密はない。当たり前のことを、実際にやり切っただけだ。従業員に親切にし、顧客に正直になる。それだけである。十数年それを続けた末に、ようやく国中が気づいた。

  だが、聖人ではない。間違える。新しい場面にぶつかるたび、さらに間違えるだろう。ほかのどの会社と同じく、普通の人間でできている。

  これからも自らの誤りに向き合い、その考えを守り続けるなら、パンドンライにもう一度チャンスを与える価値はある。

  拡大鏡の下で国民にあら探しされる会社のほうが、何かあるたびに蓋をする会社より、信頼に値する。
