title: "Perché i vecchi rivenditori cinesi non riescono a reinventarsi, e come Xiaoxiang Supermarket del Meituan vince"
description: "Il commercio al dettaglio cinese sostituisce continuamente ogni formato con uno più efficiente, e la vecchia guarda non riesce a tenere il passo. Xiaoxiang Supermarket del Meituan è l'ultimo esempio: dark store, nessun asset ereditato e una rete di consegne già pronta."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  Il commercio al dettaglio cinese segue sempre lo stesso copione: arriva un formato più efficiente e spazza via quello precedente.

  Le catene di supermercati hanno spazzato via i grandi magazzini statali. Scaffali a libero servizio, prezzi fissi e tutto sotto lo stesso tetto hanno fatto sembrare i banchi e i commessi dei vecchi grandi magazzini ridicolmente lenti.

  I negozi di convenienza in stile giapponese hanno spazzato via il negozio di quartiere. Filiere standardizzate, lanci frequenti di prodotti freschi e aperture 24 ore su 24 hanno lasciato i piccoli negozi di quartiere senza una filiera propria e senza nulla con cui reagire.

  L'e-commerce ha spazzato via l'ipermercato. Nessun affitto, nessun limite di scaffali, nessun orario di chiusura. Da un giorno all'altro, la superficie dell'ipermercato è passata da vantaggio a peso morto.

  Il vecchio formato non scompare del tutto, ma la sua quota crolla. I grandi magazzini sono sempre più rari; i negozi piccoli ripiegano su sigarette, bevande e acquisti d'emergenza; gli ipermercati perdono clienti e quote anno dopo anno. Il formato nuovo prende la parte grande, e quello vecchio si rimpiccisce in un angolo.

  Perché i vecchi formati non riescono a vincere?

  Ci hanno provato. Suning ha costruito Suning.com. RT-Mart ha creato Feiniu. Yonghui ha provato Super Species e Yonghui Life. Ognuno ha trattato l'autodisruzione come progetto numero uno, ha speso soldi veri e ha messo in gioco team, negozi e filiere.

  Ma due cose li frenano: gli asset vecchi e il modo in cui erano abituati a guadagnare.

  L'asset centrale di un ipermercato sono decine di migliaia di metri quadrati di superficie. Quell'asset determina la struttura dei costi e alimenta il modello di profitto: addebitare ai fornitori lo spazio sugli scaffali e l'inserimento dei prodotti, pagarli mesi dopo e continuare a guadagnare anche quando la merce resta sugli scaffali.

  Per cambiare, bisogna smontare quel modello con le proprie mani. Chiudere i grandi negozi, smettere di addebitare tariffe ai fornitori, assumersi l'inventario e gestire la consegna in proprio. Non appena inizi, il bilancio trimestrale crolla, l'organizzazione si sfalda, i fornitori se ne vanno e il titolo perde valore. Nessuno riesce a portare avanti un piano triennale trimestre dopo trimestre di risultati in calo.

  Quindi l'autodisruzione finisce di solito in morte più che in rinascita. Il tentativo di Suning è finito in una crisi del debito. Quello di RT-Mart si è concluso con la vendita dell'azienda ad Alibaba. Yonghui ha prodotto una serie di nuovi formati e anni di perdite.

  Ora lo stesso copione sta per ripetersi. Vedo due nuovi formati, uno online e uno offline.

  Quello online è Pinduoduo, un marketplace costruito intorno a sconti profondi. Aiuta le fabbriche a vendere direttamente ai consumatori. Fabbriche senza marchio saltano marchi e intermediari e vendono direttamente sulla piattaforma. I loro prezzi tagliano attraverso gli strati di ricarico che si trovano su Taobao e JD.

  Quello offline è Xiaoxiang Supermarket (da qui in poi, Xiaoxiang), la catena di supermercati del Meituan, l'azienda dietro la più grande rete di consegne di cibo della Cina (pensate a un DoorDash molto più grande). Opera soprattutto con dark store, piccoli magazzini nascosti dentro un quartiere che servono solo a preparare gli ordini, senza vendita al pubblico, più qualche grande negozio per garantire fiducia ed esperienza. Non c'è affitto commerciale, non ci sono casse, non ci sono furti sugli scaffali. Tutto è disposto per preparare e consegnare in fretta. I grandi negozi compensano il punto debole della dark store: la gente vuole vedere e toccare ciò che compra.

  Ogni metro quadrato di un supermercato tradizionale brucia denaro. I grandi negozi dello Xiaoxiang sono vetrine. La preparazione vera avviene nelle dark store, il cui affitto è grossomodo dal 30 al 50 per cento di quello che paga un supermercato di quartiere. Le due strutture di costo non sono nella stessa lega. È questa la base materiale per «spazzare via» la vecchia guardia.

  E arriva la parte più importante. Lo Xiaoxiang non è stato progettato: è cresciuto. È cresciuto dentro la rete di consegne del Meituan, quindi ha ereditato i vantaggi di quella storia e nessuno dei suoi oneri. È stato costruito fin dall'inizio intorno alle dark store, con i grandi negozi aggiunti solo dove si ammortizzano da soli.

  Hema, la catena di supermercati di Alibaba, è stata progettata dall'alto verso il basso intorno a una parola d'ordine che l'azienda chiama «new retail». Ha aperto prima i grandi negozi e ha aggiunto le dark store dopo. In termini di efficienza, è probabile che perda contro un operatore costruito puramente intorno alle dark store, come lo Xiaoxiang. Alibaba ha ora scorporato Taoxianda, il suo servizio di consegna di alimenti, come marchio separato, il che aggiunge un ulteriore livello di costo di sistema.

  Nel commercio al dettaglio, l'alta efficienza distrugge la bassa efficienza.
