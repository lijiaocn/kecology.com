title: "Mengapa Peritel Lama di China Tak Bisa Berubah Diri, dan Bagaimana Xiaoxiang Supermarket (rantai supermarket milik Meituan) Menang"
description: "Peritel China terus menggantikan satu format dengan format yang lebih efisien, sementara pemain lama tak bisa mengikuti. Xiaoxiang Supermarket milik Meituan adalah contoh terbaru: dark store (gudang kecil khusus pemenuhan pesanan di dalam lingkungan permukiman), tanpa aset warisan, dan jaringan pengiriman yang sudah ada."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  Peritel China terus mengikuti naskah yang sama: muncul format yang lebih efisien, lalu meruntuhkan format sebelumnya.

  Jaringan supermarket meruntuhkan toko serba ada milik negara. Rak swalayan, harga tetap, dan semua barang di bawah satu atap membuat konter dan pramuniaga toko serba ada lama terlihat sangat lambat.

  Minimarket bergaya Jepang meruntuhkan toko lingkungan. Rantai pasok yang terstandarisasi, produk segar yang diluncurkan terus-menerus, dan buka 24 jam membuat toko kecil tak punya rantai pasok sendiri dan tak ada cara untuk melawan.

  E-commerce meruntuhkan hipermarket. Tak ada sewa, tak ada batas rak, tak ada jam tutup. Dalam semalam, luas lantai hipermarket berubah dari keunggulan menjadi beban.

  Format lama tidak benar-benar hilang, tetapi pangsa pasarnya ambruk. Toko serba ada tinggal sedikit; toko kecil mundur ke rokok, minuman, dan belanja mendadak; hipermarket kehilangan pengunjung dan pangsa tahun demi tahun. Format baru mengambil porsi besar, sementara yang lama menyusut di pojokan.

  Mengapa format lama tak bisa menang?

  Mereka memang mencoba. Suning membangun Suning.com. RT-Mart membangun Feiniu. Yonghui mencoba Super Species dan Yonghui Life. Masing-masing menjadikan penghancuran diri sebagai proyek nomor satu, menggelontorkan uang sungguhan, dan mempertaruhkan tim, toko, serta rantai pasok untuk itu.

  Tetapi dua hal menahan mereka: aset lama, dan cara mereka dulu menghasilkan uang.

  Aset inti hipermarket adalah puluhan ribu meter persegi luas lantai. Aset ini menentukan struktur biaya dan melahirkan model keuntungannya: meminta bayaran kepada pemasok untuk ruang rak dan pencantuman produk, membayar mereka berbulan-bulan kemudian, dan terus mendapat uang meski barang hanya duduk di rak.

  Untuk berubah, model itu harus dihancurkan dengan tangan sendiri. Tutup toko-toko besar, hapus biaya pemasok, tanggung stok sendiri, dan tangani pengiriman sendiri. Begitu mulai, laporan kuartalan ambruk, organisasi terurai, pemasok pergi, dan harga saham turun. Tak ada yang bisa bertahan dengan rencana tiga tahun saat hasilnya menurun kuartal demi kuartal.

  Jadi, penghancuran diri biasanya berujung pada kematian, bukan kelahiran kembali. Upaya Suning berakhir dalam krisis utang. RT-Mart berakhir dengan menjual diri ke Alibaba. Yonghui menghasilkan serangkaian format baru dan tahun-tahun kerugian.

  Kini naskah yang sama akan terulang. Saya melihat dua format baru, satu online dan satu offline.

  Yang online adalah Pinduoduo, pasar yang dibangun di sekitar diskon besar. Platform ini membantu pabrik menjual langsung ke konsumen. Pabrik tanpa merek melewati merek dan perantara, lalu menjual langsung di platform. Harga mereka menembus lapisan margin yang Anda temui di Taobao dan JD.

  Yang offline adalah Xiaoxiang Supermarket (rantai supermarket milik Meituan), perusahaan di balik jaringan pengiriman makanan terbesar di China (bayangkan DoorDash yang jauh lebih besar). Operasinya terutama bertumpu pada dark store, dengan segelintir toko besar untuk membangun kepercayaan dan pengalaman. Dark store adalah gudang kecil khusus pemenuhan pesanan yang tersembunyi di dalam lingkungan permukiman. Tak ada sewa ritel, tak ada jalur kasir, tak ada penyusutan stok di rak. Semua diatur agar pengambilan barang dan pengiriman berjalan cepat. Toko-toko besar menutupi kelemahan dark store: orang ingin melihat dan menyentuh barang yang mereka beli.

  Setiap meter persegi supermarket tradisional membakar uang. Toko-toko besar Xiaoxiang adalah ruang pamer. Pemenuhan pesanan yang sesungguhnya terjadi di dark store, yang biaya sewanya kira-kira 30 sampai 50 persen dari apa yang dibayar supermarket lingkungan. Kedua struktur biaya itu tidak sekelas. Itulah dasar material untuk "meruntuhkan" para pemain lama.

  Dan inilah bagian yang lebih penting. Xiaoxiang tidak dirancang. Ia tumbuh. Ia tumbuh dari jaringan pengiriman Meituan, sehingga mewarisi keunggulan dari sejarah itu tanpa mewarisi beban apa pun. Sejak awal ia dibangun di sekitar dark store, dan toko besar hanya ditambahkan di tempat yang bisa menutup biayanya sendiri.

  Hema, rantai supermarket milik Alibaba, dirancang dari atas ke bawah di sekitar kata kunci yang disebut perusahaan itu sebagai "new retail". Toko besar dibuka lebih dulu, lalu dark store ditambahkan kemudian. Dalam hal efisiensi, Hema kemungkinan kalah dari pemain yang dibangun murni di sekitar dark store, seperti Xiaoxiang. Alibaba kini memisahkan Taoxianda, layanan pengiriman bahan makanannya, menjadi merek tersendiri, yang menambah satu lapisan biaya sistem lagi.

  Dalam ritel, efisiensi tinggi menghancurkan efisiensi rendah.
