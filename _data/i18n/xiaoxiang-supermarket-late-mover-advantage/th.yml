title: "ทำไมผู้ค้าปลีกเก่าของจีนถึงปรับตัวไม่ได้ และซีเซียง ซูเปอร์มาร์เก็ต (Xiaoxiang Supermarket) เชนซูเปอร์มาร์เก็ตของเหม่ยถวน (Meituan) ชนะได้อย่างไร"
description: "ผู้ค้าปลีกจีนผลัดเปลี่ยนรูปแบบให้มีประสิทธิภาพขึ้นเรื่อย ๆ ขณะที่เจ้าเก่าตามไม่ทัน กรณีล่าสุดคือซีเซียง ซูเปอร์มาร์เก็ต (Xiaoxiang Supermarket) ของเหม่ยถวน (Meituan): คลังมืด (คลังขนาดเล็กที่ส่งของอย่างเดียวในชุมชน) ไม่มีสินทรัพย์เก่าเป็นภาระ และมีเครือข่ายจัดส่งพร้อมใช้งาน"
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  ผู้ค้าปลีกในจีนยังคงเดินตามสูตรเดิมซ้ำแล้วซ้ำเล่า เมื่อมีรูปแบบธุรกิจที่มีประสิทธิภาพมากกว่าปรากฏขึ้น มันก็ปราบรูปแบบก่อนหน้าให้ราบลง

  เครือข่ายซูเปอร์มาร์เก็ตปราบห้างสรรพสินค้าของรัฐให้ราบ ชั้นวางแบบบริการตนเอง ราคาที่ตายตัว และของทุกอย่างอยู่ใต้หลังคาเดียว ทำให้เคาน์เตอร์กับพนักงานของห้างเก่าดูเชื่องช้าจนหมดหวัง

  ร้านสะดวกซื้อสไตล์ญี่ปุ่นปราบร้านค้าในชุมชนให้ราบ ห่วงโซ่อุปทานที่ได้มาตรฐาน การออกอาหารสดใหม่บ่อยครั้ง และการเปิดทำการ 24 ชั่วโมง ทำให้ร้านเล็ก ๆ ไม่มีห่วงโซ่อุปทานเป็นของตัวเองและไม่มีอะไรให้สู้

  อีคอมเมิร์ซปราบไฮเปอร์มาร์เก็ตให้ราบ ไม่มีค่าเช่า ไม่มีข้อจำกัดของชั้นวาง ไม่มีเวลาปิดร้าน ชั่วข้ามคืน พื้นที่ขายของไฮเปอร์มาร์เก็ตก็เปลี่ยนจากข้อได้เปรียบกลายเป็นภาระ

  รูปแบบเก่าไม่ได้หายไปหมด แต่ส่วนแบ่งตลาดร่วงลงมาก ห้างสรรพสินค้ามีน้อยเต็มที ร้านเล็ก ๆ ถอยไปขายบุหรี่ เครื่องดื่ม และของซื้อฉุกเฉิน ไฮเปอร์มาร์เก็ตเสียทั้งคนเดินเข้าร้านและส่วนแบ่งปีแล้วปีเล่า รูปแบบใหม่คว้าส่วนใหญ่ไป รูปแบบเก่าหดเหลือแค่มุมหนึ่ง

  ทำไมรูปแบบเก่าถึงชนะไม่ได้

  พวกเขาก็เคยลองแล้ว ซูหนิง (Suning) สร้าง Suning.com อาร์ที-มาร์ท (RT-Mart) สร้าง Feiniu ยงฮุย (Yonghui) ลอง Super Species และ Yonghui Life ทุกเจ้าตั้งการทำลายตัวเองเป็นโปรเจกต์อันดับหนึ่ง ลงเงินจริงจัง และเดิมพันทั้งทีม ร้านค้า และห่วงโซ่อุปทานกับมัน

  แต่มีสองอย่างที่ฉุดรั้งพวกเขาไว้ สินทรัพย์เก่า กับวิธีที่พวกเขาเคยทำเงิน

  สินทรัพย์หลักของไฮเปอร์มาร์เก็ตคือพื้นที่ขายหลายหมื่นตารางเมตร สินทรัพย์นี้กำหนดโครงสร้างต้นทุนและให้กำเนิดโมเดลทำเงินของตัวเอง คือคิดค่าพื้นที่วางของและค่าลงรายการสินค้าจากซัพพลายเออร์ จ่ายเงินให้เขาหลายเดือนต่อมา และยังคงได้เงินแม้ของจะนอนอยู่บนชั้นวาง

  จะเปลี่ยนได้ก็ต้องรื้อโมเดลนั้นด้วยมือตัวเอง ปิดร้านใหญ่ ยกเลิกค่าธรรมเนียมซัพพลายเออร์ แบกรับสต็อกเองและจัดการจัดส่งเอง พอเริ่มลงมือเมื่อไหร่ รายงานประจำไตรมาสก็พัง องค์กรก็แตกกระจาย ซัพพลายเออร์ก็จากไป ราคาหุ้นก็ร่วง ไม่มีใครทำตามแผนสามปีได้ต่อเนื่อง ขณะที่ผลประกอบการตกต่ำไตรมาสแล้วไตรมาสเล่า

  ดังนั้นการทำลายตัวเองจึงมักจบด้วยความตายมากกว่าการเกิดใหม่ ความพยายามของซูหนิงจบลงด้วยวิกฤตหนี้ อาร์ที-มาร์ทจบด้วยการขายตัวเองให้อาลีบาบา ส่วนยงฮุยป้อนรูปแบบใหม่ ๆ ออกมาต่อเนื่องและขาดทุนหลายปี

  ตอนนี้สูตรเดิมกำลังจะเกิดขึ้นอีกครั้ง ผมเห็นรูปแบบใหม่สองแบบ หนึ่งออนไลน์และหนึ่งออฟไลน์

  แบบออนไลน์คือพินตู้ตู้ (Pinduoduo) ตลาดกลางที่สร้างขึ้นรอบส่วนลดลึก ๆ ช่วยให้โรงงานขายตรงถึงผู้บริโภค โรงงานที่ไม่มีแบรนด์ข้ามแบรนด์และคนกลางไปขายบนแพลตฟอร์มโดยตรง ราคาของเขาทะลุชั้นมาร์กอัปที่คุณเจอบนเถ่าเป่า (Taobao) และ JD

  แบบออฟไลน์คือซีเซียง ซูเปอร์มาร์เก็ต (Xiaoxiang Supermarket) เชนซูเปอร์มาร์เก็ตของเหม่ยถวน (Meituan) บริษัทที่อยู่เบื้องหลังเครือข่ายจัดส่งอาหารที่ใหญ่ที่สุดในจีน (ลองนึกถึง DoorDash ที่ใหญ่กว่านั้นมาก) ร้านทำงานหลักผ่านคลังมืด โดยมีร้านใหญ่จำนวนน้อยไว้สร้างความเชื่อมั่นและประสบการณ์ คลังมืดคือคลังขนาดเล็กที่ทำหน้าที่ส่งของเพียงอย่างเดียว ซ่อนอยู่ในชุมชน ไม่มีค่าเช่าร้านค้าปลีก ไม่มีช่องจ่ายเงิน ไม่มีการหดหายของสินค้าบนชั้นวาง ทุกอย่างจัดวางเพื่อการหยิบของที่เร็วและการจัดส่งที่เร็ว ร้านใหญ่ช่วยชดเชยจุดอ่อนของคลังมืด คือคนอยากเห็นและสัมผัสของที่ซื้อ

  ทุกตารางเมตรของซูเปอร์มาร์เก็ตแบบดั้งเดิมเผาเงิน ร้านใหญ่ของซีเซียงคือห้องจัดแสดง การส่งของจริงเกิดขึ้นในคลังมืด ซึ่งมีค่าเช่าประมาณ 30 ถึง 50 เปอร์เซ็นต์ของสิ่งที่ซูเปอร์มาร์เก็ตในชุมชนจ่าย โครงสร้างต้นทุนทั้งสองแบบไม่ได้อยู่ในลีกเดียวกัน นี่คือพื้นฐานที่แท้จริงของการ "ปราบ" เจ้าเก่า

  และนี่คือส่วนที่สำคัญกว่า ซีเซียงไม่ได้ถูกออกแบบมา แต่มันเติบโตขึ้น มันเติบโตออกมาจากเครือข่ายจัดส่งของเหม่ยถวน จึงรับช่วงข้อได้เปรียบจากประวัติศาสตร์นั้นโดยไม่ต้องรับภาระเลย ตั้งแต่แรกมันถูกสร้างรอบคลังมืด และร้านใหญ่จะเพิ่มก็ต่อเมื่อคุ้มต้นทุน

  เฮมา (Hema) เชนซูเปอร์มาร์เก็ตของอาลีบาบา ถูกออกแบบจากบนลงล่างรอบคำฮิตที่บริษัทเรียกว่า "new retail" เปิดร้านใหญ่ก่อน แล้วค่อยเพิ่มคลังมืดทีหลัง ในด้านประสิทธิภาพ เฮมามีแนวโน้มแพ้คู่แข่งที่สร้างขึ้นรอบคลังมืดเพียงอย่างเดียวอย่างซีเซียง อาลีบาบายังแยกเถาเซียนตา (Taoxianda) บริการส่งของชำของตัวเอง ออกเป็นแบรนด์ต่างหาก ซึ่งเพิ่มชั้นต้นทุนของระบบอีกชั้นหนึ่ง

  ในวงการค้าปลีก ประสิทธิภาพสูงทำลายประสิทธิภาพต่ำ
