title: "중국의 낡은 소매업이 왜 스스로를 바꾸지 못하는가: 메이퇀의 식품 슈퍼 체인 샤오샹 슈퍼마켓(Xiaoxiang Supermarket)이 효율로 이긴다"
description: "중국 소매업은 더 효율적인 업태가 기존 업태를 계속 밀어내지만, 기존 강자들은 따라가지 못한다. 메이퇀의 샤오샹 슈퍼마켓이 그 최신 예다. 동네 안에 자리한 출고 전용 작은 창고인 다크 스토어를 바탕으로, 낡은 자산은 없고 배달 네트워크는 이미 갖춰져 있다."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  중국 소매업은 같은 시나리오를 반복한다. 더 효율적인 업태가 등장해 그 앞의 업태를 무너뜨린다.

  슈퍼마켓 체인이 국영 백화점을 무너뜨렸다. 셀프 서비스 진열대, 정해진 가격, 필요한 모든 것이 한 지붕 아래 있는 방식은 예전 백화점의 카운터와 점원들을 손 쓸 수 없을 만큼 느리게 보이게 했다.

  일본식 편의점이 동네 가게를 밀어냈다. 표준화된 공급망, 신선식품의 잦은 출시, 24시간 영업은 개인 상점에 자체 공급망도, 맞설 수단도 남겨주지 않았다.

  전자상거래가 대형 슈퍼마켓(하이퍼마켓)을 압도했다. 임대료도, 진열 공간의 제약도, 영업 종료 시간도 없다. 하루아침에 하이퍼마켓의 넓은 매장 면적은 강점에서 짐으로 바뀌었다.

  낡은 업태가 완전히 사라지는 것은 아니다. 하지만 점유율은 급락한다. 백화점은 눈에 띄게 줄고, 작은 가게는 담배·음료·급한 구매로 후퇴하며, 하이퍼마켓은 방문객 수와 점유율을 해마다 잃는다. 새로운 업태가 큰 몫을 차지하고, 낡은 업태는 구석으로 밀려난다.

  왜 낡은 업태는 이기지 못하는가.

  안 해본 것은 아니다. 쑤닝(Suning)은 쑤닝닷컴을 만들었고, RT-Mart는 페이니우를 세웠으며, 융후이(Yonghui)는 슈퍼 스피시즈와 융후이 라이프에 도전했다. 모두 스스로를 바꾸는 것을 최우선 과제로 삼고, 실제로 큰돈을 쓰고, 팀과 매장과 공급망을 걸었다.

  하지만 두 가지가 발목을 잡는다. 낡은 자산과, 예전에 돈을 벌던 방식이다.

  하이퍼마켓의 핵심 자산은 수만 제곱미터에 달하는 매장 면적이다. 이 자산이 비용 구조를 정하고, 수익 모델까지 만들어냈다. 공급업체에서 진열 자리와 상품 등록 비용을 받고, 대금은 몇 달 뒤에 치르며, 상품이 진열대에 그대로 있어도 계속 돈을 번다.

  바꾸려면 그 모델을 자기 손으로 허물어야 한다. 큰 매장을 닫고, 공급업체 수수료를 없애고, 재고를 직접 떠안고, 배송까지 직접 맡아야 한다. 손을 대는 순간 분기 실적이 무너지고, 조직이 흩어지고, 공급업체가 떠나고, 주가가 떨어진다. 실적이 분기마다 계속 떨어지는 상황에서 3개년 계획을 끝까지 밀고 갈 수 있는 사람은 없다.

  그래서 스스로를 바꾸는 일은 대개 다시 태어나는 것이 아니라 죽음으로 끝난다. 쑤닝의 시도는 부채 위기로 끝났고, RT-Mart는 알리바바에 몸을 파는 결말을 맞았으며, 융후이는 새 업태를 줄줄이 내놓았지만 몇 년 적자에 시달렸다.

  이제 같은 시나리오가 다시 펼쳐지려 한다. 온라인과 오프라인, 두 가지 새로운 업태가 보인다.

  온라인은 핀둬둬다. 큰 폭의 할인을 중심으로 만든 마켓플레이스다. 공장이 소비자에게 직접 팔 수 있게 해준다. 무브랜드 공장은 브랜드와 중간 단계를 건너뛰어 플랫폼에서 바로 판매한다. 그 가격은 타오바오나 JD에서 겹겹이 쌓인 마진을 뚫고 지나간다.

  오프라인은 샤오샹 슈퍼마켓이다. 중국 최대 음식 배달 네트워크를 가진 메이퇀(훨씬 큰 규모의 DoorDash라고 생각하면 된다)이 운영하는 식품 슈퍼 체인이다. 주로 다크 스토어를 중심으로 돌아가며, 신뢰와 경험을 담당하는 대형 매장을 소수 두고 있다. 다크 스토어는 동네 안에 자리한 출고 전용 작은 창고다. 소매 임대료도, 계산대 줄도, 진열 상품의 줄어듦도 없다. 모든 것이 빠른 피킹과 빠른 배송을 위해 배치되어 있다. 대형 매장은 다크 스토어의 약점을 보완한다. 사람은 사고 싶은 것을 눈으로 보고 손으로 만지고 싶어 한다.

  전통적인 슈퍼마켓의 매장은 제곱미터마다 돈을 태운다. 샤오샹의 대형 매장은 쇼룸에 불과하다. 실제 출고는 다크 스토어에서 이뤄지는데, 임대료는 동네 슈퍼마켓의 대략 30~50퍼센트다. 두 비용 구조는 같은 급이 아니다. 이것이 기존 강자들을 '무너뜨릴' 물적 토대다.

  더 중요한 부분은 따로 있다. 샤오샹은 설계된 것이 아니라 자란 것이다. 메이퇀의 배달 네트워크에서 나왔기 때문에, 그 역사가 가진 이점은 그대로 물려받되 짐은 하나도 이어받지 않았다. 처음부터 다크 스토어를 중심으로 지어졌고, 대형 매장은 수지가 맞는 곳에만 나중에 더해졌다.

  알리바바의 식품 슈퍼 체인 허마는 회사가 '신유통(new retail)'이라고 부르는 유행어를 중심으로 위에서 아래로 설계되었다. 먼저 대형 매장을 열고 나중에 다크 스토어를 더했다. 효율 면에서는 샤오샹처럼 처음부터 다크 스토어만을 전제로 만든 상대에게 질 가능성이 크다. 알리바바는 현재 식품 배송 서비스였던 타오셴다를 별도 브랜드로 분사했는데, 이로써 시스템 비용이 한 겹 더 쌓였다.

  소매업에서 높은 효율은 낮은 효율을 파괴한다.
