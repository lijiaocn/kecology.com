title: "Почему старые ритейлеры Китая не могут себя обновить — и как Xiaoxiang Supermarket от Meituan выигрывает"
description: "В китайской рознице каждому формату на смену приходит более эффективный, а старая гвардия не поспевает. Xiaoxiang Supermarket от Meituan — свежий пример: тёмные склады, никакого наследия старых активов и уже готовая сеть доставки."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  Китайская розница идёт по одному и тому же сценарию: появляется более эффективный формат и вытесняет предыдущий.

  Сети супермаркетов вытеснили государственные универмаги. Самообслуживание, фиксированные цены и всё под одной крышей заставили прилавки и продавцов старых универмагов выглядеть безнадёжно медленными.

  Круглосуточные магазины японского типа вытеснили лавки на районе. Стандартизированные цепочки поставок, частая смена свежих продуктов и работа 24 часа в сутки оставили мелких лавочников без собственной логистики и без аргументов в ответ.

  Интернет-торговля вытеснила гипермаркет. Ни аренды, ни ограничений по полкам, ни времени закрытия. В одночасье торговая площадь гипермаркета превратилась из преимущества в бремя.

  Старый формат не исчезает полностью, но его доля рушится. Универмаги становятся редкостью; мелкие лавки уходят в сигареты, напитки и срочные покупки; гипермаркеты год за годом теряют поток покупателей и долю рынка. Новый формат забирает большую часть, старый сжимается в угол.

  Почему старые форматы не могут выиграть?

  Они пытались. Suning создал Suning.com. RT-Mart построил Feiniu. Yonghui пробовал Super Species и Yonghui Life. Каждый считал саморазрушение своим проектом номер один, вкладывал реальные деньги и ставил на него команды, магазины и цепочки поставок.

  Но их сдерживают две вещи: старые активы и привычный способ зарабатывать.

  Главный актив гипермаркета — десятки тысяч квадратных метров торговой площади. Этот актив задаёт его структуру затрат и порождает его модель прибыли: брать с поставщиков плату за полочное пространство и за внесение товаров в ассортимент, платить им спустя месяцы и продолжать зарабатывать, даже когда товар лежит на полках.

  Чтобы измениться, надо собственными руками демонтировать эту модель. Закрыть большие магазины, отказаться от сборов с поставщиков, самим нести запасы и самим заниматься доставкой. Стоит начать — и квартальный отчёт рушится, организация рассыпается, поставщики уходят, акции падают. Никто не выдержит трёхлетний план, когда результаты ухудшаются квартал за кварталом.

  Поэтому саморазрушение обычно заканчивается не возрождением, а смертью. Попытка Suning закончилась долговым кризисом. Попытка RT-Mart — продажей компании Alibaba. У Yonghui получилась череда новых форматов и годы убытков.

  Теперь тот же сценарий готов повториться. Я вижу два новых формата — один онлайн, другой офлайн.

  Онлайн-формат — Pinduoduo, маркетплейс, построенный вокруг глубоких скидок. Он помогает фабрикам продавать напрямую покупателям. Безымянные фабрики обходят бренды и посредников и продают напрямую на платформе. Их цены прорываются сквозь слои наценки, которые встречаются на Taobao и JD.

  Офлайн-формат — Xiaoxiang Supermarket, сеть продуктовых магазинов Meituan, компании, которая стоит за крупнейшей в Китае сетью доставки еды (представьте себе DoorDash, только намного больше). Она работает в основном через тёмные склады, а несколько крупных магазинов нужны для доверия и впечатлений. Тёмный склад — это небольшой склад в жилом районе, предназначенный только для обработки заказов. Ни торговой аренды, ни касс, ни усушки товаров. Всё устроено для быстрого сбора заказа и быстрой доставки. Крупные магазины компенсируют слабое место тёмного склада: людям хочется видеть и трогать то, что они покупают.

  Каждый квадратный метр обычного супермаркета сжигает деньги. Большие магазины Xiaoxiang — это витрины. Настоящая обработка заказов идёт в тёмных складах, чья аренда составляет от 30 до 50 процентов от того, что платит районный супермаркет. Две структуры затрат находятся в разных весовых категориях. В этом материальная основа того, чтобы «прижать» старую гвардию.

  И вот что важнее. Xiaoxiang не проектировали — он вырос. Он вырос из сети доставки Meituan и поэтому унаследовал преимущества этой истории, но не её бремя. С самого начала он строился вокруг тёмного склада, а крупные магазины добавлялись только там, где они окупаются сами.

  Hema, продуктовая сеть Alibaba, была спроектирована сверху вниз вокруг модного слова, которое компания назвала «new retail». Сначала она открыла большие магазины, а тёмные склады добавила позже. По эффективности она, вероятно, проиграет игроку, построенному исключительно вокруг тёмных складов, как Xiaoxiang. Alibaba теперь выделила Taoxianda, свою службу доставки продуктов, в отдельный бренд, что добавляет ещё один слой системных затрат.

  В рознице высокая эффективность уничтожает низкую.
