title: "Why China's Old Retailers Can't Reinvent Themselves, and How Meituan's Xiaoxiang Supermarket Wins"
description: "Chinese retail keeps replacing each format with a more efficient one, and the old guard can't follow. Meituan's Xiaoxiang Supermarket is the latest example: dark stores, no legacy assets, and a delivery network already in place."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  Chinese retail keeps following the same script: a more efficient format shows up, and it flattens the one before it.

  Supermarket chains flattened state-run department stores. Self-service shelves, fixed prices and everything under one roof made the counters and clerks of the old department store look hopelessly slow.

  Japanese-style convenience stores flattened the neighborhood shop. Standardized supply chains, frequent fresh-food launches and 24-hour opening left mom-and-pop stores with no supply chain of their own and nothing to fight back with.

  E-commerce flattened the hypermarket. No rent, no shelf limits, no closing time. Overnight, the hypermarket's floor space went from being its advantage to being its burden.

  The old format doesn't disappear completely, but its share collapses. Department stores are few and far between; small shops retreat to cigarettes, drinks and emergency purchases; hypermarkets lose footfall and share year after year. The new format takes the big part, and the old one shrinks into a corner.

  Why can't the old formats win?

  They did try. Suning built Suning.com. RT-Mart built Feiniu. Yonghui tried Super Species and Yonghui Life. Each treated self-disruption as its number-one project, spent real money, and staked teams, stores and supply chains on it.

  But two things hold them back: old assets, and the way they used to make money.

  A hypermarket's core asset is tens of thousands of square meters of floor space. That asset sets its cost structure and breeds its profit model: charge suppliers for shelf space and product listings, pay them months later, and keep earning even when goods sit on shelves.

  To change, you have to tear that model down with your own hands. Close the big stores, drop the supplier fees, carry the inventory and handle the delivery yourself. The moment you start, the quarterly report collapses, the organization unravels, suppliers leave and the share price falls. Nobody can stick with a three-year plan through quarter after quarter of declining results.

  So self-disruption usually ends in death rather than rebirth. Suning's attempt ended in a debt crisis. RT-Mart's ended with the company selling itself to Alibaba. Yonghui produced a string of new formats and years of losses.

  Now the same script is about to play out again. I see two new formats, one online and one offline.

  The online one is Pinduoduo, a marketplace built around deep discounts. It helps factories sell straight to consumers. Unbranded factories skip brands and middlemen and sell on the platform directly. Their prices cut through the layers of markup you find on Taobao and JD.

  The offline one is Xiaoxiang Supermarket, the grocery chain of Meituan, the company behind China's largest food-delivery network (think a much bigger DoorDash). It runs mainly on dark stores, with a handful of large stores for trust and experience. A dark store is a small fulfillment-only warehouse tucked inside a neighborhood. No retail rent, no checkout lanes, no shelf shrinkage. Everything is arranged for fast picking and fast delivery. The big stores make up for the dark store's weak spot: people want to see and touch what they buy.

  Every square meter of a traditional supermarket burns money. Xiaoxiang's big stores are showrooms. The real fulfillment happens in dark stores, whose rent is roughly 30 to 50 percent of what a neighborhood supermarket pays. The two cost structures aren't in the same league. That's the material basis for "flattening" the old guard.

  And here's the more important part. Xiaoxiang wasn't designed. It grew. It grew out of Meituan's delivery network, so it inherits that history's advantages and none of its burdens. It was built around the dark store from the start, with big stores added only where they pay for themselves.

  Hema, Alibaba's grocery chain, was designed from the top down around a buzzword the company called "new retail." It opened big stores first and added dark stores later. On efficiency, it's likely to lose to a player built purely around dark stores, like Xiaoxiang. Alibaba has now spun off Taoxianda, its grocery-delivery service, into a separate brand, which adds one more layer of system cost.

  In retail, high efficiency destroys low efficiency.
