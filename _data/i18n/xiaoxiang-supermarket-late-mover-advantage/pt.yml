title: "Por que os varejistas tradicionais da China não conseguem se reinventar, e como o Xiaoxiang Supermarket, do Meituan, vence"
description: "O varejo chinês vem substituindo cada formato por um mais eficiente, e a velha guarda não acompanha. O Xiaoxiang Supermarket, do Meituan, é o exemplo mais recente: dark stores, sem ativos herdados e uma rede de entregas já pronta."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  O varejo chinês segue sempre o mesmo roteiro: surge um formato mais eficiente e ele achata o que veio antes.

  As redes de supermercados achataram as lojas de departamento estatais. Prateleiras de autosserviço, preços fixos e tudo sob um mesmo teto fizeram os balcões e atendentes das antigas lojas de departamento parecerem lentos demais.

  As lojas de conveniência de estilo japonês achataram a loja de bairro. Cadeias de suprimentos padronizadas, lançamentos frequentes de alimentos frescos e funcionamento 24 horas deixaram os pequenos negócios de bairro sem cadeia de suprimentos própria e sem nada com que reagir.

  O comércio eletrônico achatou o hipermercado. Sem aluguel, sem limite de prateleira, sem horário de fechamento. Da noite para o dia, a área de venda do hipermercado passou de vantagem a peso morto.

  O formato antigo não desaparece por completo, mas sua participação desaba. As lojas de departamento são cada vez mais raras; as lojinhas de bairro se retraem para cigarros, bebidas e compras de emergência; os hipermercados perdem frequentadores e participação ano após ano. O formato novo fica com a fatia grande, e o antigo encolhe num canto.

  Por que os formatos antigos não conseguem vencer?

  Eles tentaram. A Suning construiu a Suning.com. A RT-Mart criou a Feiniu. A Yonghui testou a Super Species e a Yonghui Life. Cada uma tratou a autodisrupção como seu projeto número um, gastou dinheiro de verdade e apostou equipes, lojas e cadeias de suprimentos nisso.

  Mas duas coisas os freiam: os ativos antigos e a forma como costumavam ganhar dinheiro.

  O ativo central de um hipermercado são dezenas de milhares de metros quadrados de área de venda. Esse ativo define sua estrutura de custos e alimenta seu modelo de lucro: cobrar dos fornecedores pelo espaço nas prateleiras e pela inclusão de produtos, pagar meses depois e continuar ganhando mesmo quando a mercadoria fica parada na prateleira.

  Para mudar, é preciso desmontar esse modelo com as próprias mãos. Fechar as grandes lojas, deixar de cobrar taxas dos fornecedores, assumir o estoque e cuidar da entrega você mesmo. Assim que você começa, o relatório trimestral desaba, a organização se desfaz, os fornecedores vão embora e a ação cai. Ninguém aguenta um plano de três anos trimestre após trimestre de resultados em queda.

  Então a autodisrupção costuma terminar em morte, não em renascimento. A tentativa da Suning acabou em crise de dívida. A da RT-Mart terminou com a empresa se vendendo para a Alibaba. A Yonghui deixou uma sucessão de novos formatos e anos de prejuízo.

  Agora o mesmo roteiro está prestes a se repetir. Vejo dois formatos novos, um online e outro offline.

  O online é o Pinduoduo, um marketplace construído em torno de descontos agressivos. Ele ajuda fábricas a vender direto ao consumidor. Fábricas sem marca pulam marcas e intermediários e vendem direto na plataforma. Seus preços cortam através das camadas de markup que você encontra no Taobao e no JD.

  O offline é o Xiaoxiang Supermarket (doravante, Xiaoxiang), a rede de supermercados do Meituan, a empresa por trás da maior rede de entrega de comida da China (pense num DoorDash muito maior). Opera principalmente com dark stores, pequenos armazéns escondidos dentro de um bairro que só servem para preparar pedidos, sem venda ao público, além de algumas poucas lojas grandes para gerar confiança e experiência. Não há aluguel comercial, não há caixas, não há quebra de estoque nas prateleiras. Tudo é organizado para separar e entregar rápido. As lojas grandes compensam o ponto fraco da dark store: as pessoas querem ver e tocar o que compram.

  Cada metro quadrado de um supermercado tradicional queima dinheiro. As lojas grandes do Xiaoxiang são vitrines. A preparação real acontece nas dark stores, cujo aluguel é de aproximadamente 30 a 50 por cento do que paga um supermercado de bairro. As duas estruturas de custo não estão na mesma liga. Essa é a base material para «achatar» a velha guarda.

  E aqui está a parte mais importante. O Xiaoxiang não foi desenhado: ele cresceu. Cresceu dentro da rede de entregas do Meituan, então herdou as vantagens dessa história e nenhum de seus ônus. Foi construído desde o início em torno da dark store, com lojas grandes adicionadas apenas onde se pagam sozinhas.

  A Hema, rede de supermercados da Alibaba, foi desenhada de cima para baixo em torno de uma palavra da moda que a empresa chamou de «new retail». Abriu primeiro as lojas grandes e só depois adicionou as dark stores. Em eficiência, provavelmente perde para um player construído puramente em torno das dark stores, como o Xiaoxiang. A Alibaba agora separou o Taoxianda, seu serviço de entrega de alimentos, como uma marca independente, o que adiciona mais uma camada de custo de sistema.

  No varejo, alta eficiência destrói baixa eficiência.
