title: "चीन की पुरानी रिटेल कंपनियां खुद को क्यों नहीं बदल पा रहीं, और मैटुआन (Meituan) की किराना श्रृंखला ज़ियाओशियांग सुपरमार्केट (Xiaoxiang Supermarket) कैसे जीत रही है"
description: "चीन की रिटेल दुनिया में हर फ़ॉर्मेट को उससे ज़्यादा कुशल फ़ॉर्मेट से बदला जा रहा है, और पुराने खिलाड़ी उसके साथ नहीं चल पा रहे। मैटुआन का ज़ियाओशियांग सुपरमार्केट नया उदाहरण है: डार्क स्टोर, कोई पुरानी संपत्ति का बोझ नहीं, और पहले से तैयार डिलीवरी नेटवर्क।"
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  चीन की रिटेल दुनिया एक ही स्क्रिप्ट दोहराती रहती है: कोई ज़्यादा कुशल फ़ॉर्मेट आता है और पिछले वाले को समतल कर देता है।

  सुपरमार्केट चेनों ने सरकारी डिपार्टमेंटल स्टोरों को समतल किया। सेल्फ-सर्विस शेल्फ़, तय दाम और सब कुछ एक छत के नीचे। इसने पुराने डिपार्टमेंटल स्टोर की काउंटरों और क्लर्कों को बेहद धीमा दिखा दिया।

  जापानी स्टाइल के कन्वीनियंस स्टोरों ने मोहल्ले की दुकान को समतल किया। मानकीकृत सप्लाई चेन, बार-बार ताज़ा खाद्य उत्पाद लॉन्च करना और 24 घंटे खुला रहना। इसने छोटी दुकानों को न अपनी सप्लाई चेन दी, न जवाब देने के लिए कुछ।

  ई-कॉमर्स ने हाइपरमार्केट को समतल किया। न किराया, न शेल्फ़ की सीमा, न बंद होने का समय। रातों-रात हाइपरमार्केट की बिक्री जगह उसकी ताक़त से निकलकर उसका बोझ बन गई।

  पुराना फ़ॉर्मेट पूरी तरह खत्म नहीं होता, पर उसका हिस्सा ढह जाता है। डिपार्टमेंटल स्टोर दुर्लभ हो गए; छोटी दुकानें सिगरेट, शरबत और आपातकालीन खरीदारी तक सिमट गईं; हाइपरमार्केट साल दर साल आने वाले ग्राहक और हिस्सा खो रहे हैं। नया फ़ॉर्मेट बड़ा हिस्सा ले लेता है और पुराना कोने में सिमट जाता है।

  तो पुराने फ़ॉर्मेट क्यों नहीं जीत पाते?

  उन्होंने कोशिश ज़रूर की। सुनिंग (Suning) ने Suning.com बनाया। आरटी-मार्ट (RT-Mart) ने Feiniu बनाया। योंगहुई (Yonghui) ने Super Species और Yonghui Life आज़माए। हर एक ने खुद को तोड़ने की योजना को अपनी नंबर एक परियोजना माना, असली पैसा खर्च किया और अपनी टीमों, दुकानों और सप्लाई चेनों को इस पर दांव पर लगा दिया।

  पर दो चीज़ें उन्हें रोकती हैं: पुरानी संपत्ति और पैसा कमाने का पुराना तरीक़ा।

  हाइपरमार्केट की मुख्य संपत्ति दसियों हज़ार वर्ग मीटर की बिक्री जगह है। यही संपत्ति उसकी लागत संरचना तय करती है और उसके मुनाफ़े के मॉडल को जन्म देती है: सप्लायरों से शेल्फ़ जगह और प्रोडक्ट लिस्टिंग के लिए पैसे वसूलो, महीनों बाद भुगतान करो, और सामान शेल्फ़ पर पड़ा रहे तब भी कमाते रहो।

  बदलाव के लिए तुम्हें ये मॉडल अपने हाथों से गिराना होगा। बड़ी दुकानें बंद करो, सप्लायरों की फ़ीस हटाओ, इन्वेंट्री और डिलीवरी खुद संभालो। जैसे ही तुम शुरू करते हो, तिमाही रिपोर्ट गिरती है, संगठन बिखरता है, सप्लायर चले जाते हैं और शेयर भाव गिरता है। कोई भी तीन साल की योजना पर लगातार गिरते नतीजों के बीच नहीं टिक सकता।

  इसलिए खुद को तोड़ना अक्सर नए जन्म के बजाय मौत पर खत्म होता है। सुनिंग की कोशिश कर्ज़ के संकट पर खत्म हुई। आरटी-मार्ट की कोशिश के बाद कंपनी ने खुद को अलीबाबा (Alibaba) बेच दिया। योंगहुई ने कई नए फ़ॉर्मेट दिए और सालों घाटे उठाए।

  अब यही स्क्रिप्ट फिर चलने वाली है। मुझे दो नए फ़ॉर्मेट दिखते हैं, एक ऑनलाइन और एक ऑफ़लाइन।

  ऑनलाइन वाला पिंडुओडुओ (Pinduoduo) है, गहरे डिस्काउंट के आस-पास बना एक मार्केटप्लेस। ये फ़ैक्टरियों को सीधे उपभोक्ताओं को बेचने में मदद करता है। बिना ब्रांड वाली फ़ैक्टरियां ब्रांड और बिचौलियों को छोड़कर सीधे प्लेटफ़ॉर्म पर बेचती हैं। उनकी कीमतें ताओबाओ (Taobao) और जेडी (JD) पर मिलने वाली मार्कअप की परतों को चीर देती हैं।

  ऑफ़लाइन वाला ज़ियाओशियांग सुपरमार्केट (Xiaoxiang Supermarket) है, मैटुआन (Meituan) की किराना चेन। मैटुआन वही कंपनी है जिसके पास चीन का सबसे बड़ा फ़ूड डिलीवरी नेटवर्क है (सोचिए एक बहुत बड़ा DoorDash)। ये मुख्यतः डार्क स्टोर (dark store) पर चलती है, साथ ही विश्वास और अनुभव के लिए कुछ बड़ी दुकानें हैं। डार्क स्टोर एक छोटा गोदाम है जो सिर्फ़ ऑर्डर तैयार करने के लिए होता है और किसी मोहल्ले के भीतर छिपा होता है। न रिटेल किराया, न कैश काउंटर की कतार, न शेल्फ़ की कमी। सब कुछ तेज़ पिकिंग और तेज़ डिलीवरी के लिए सजाया गया है। बड़ी दुकानें डार्क स्टोर की कमज़ोरी पूरी करती हैं: लोग वो देखना और छूना चाहते हैं जो खरीद रहे हैं।

  पारंपरिक सुपरमार्केट का हर वर्ग मीटर पैसा जलाता है। ज़ियाओशियांग की बड़ी दुकानें शोरूम हैं। असली ऑर्डर तैयारी डार्क स्टोर में होती है, जिनका किराया लगभग 30 से 50 प्रतिशत होता है जो एक मोहल्ले के सुपरमार्केट को देना पड़ता है। दोनों लागत संरचनाएँ एक ही लीग में नहीं हैं। पुरानों को "समतल" करने की भौतिक बुनियाद यही है।

  और ज़्यादा अहम बात: ज़ियाओशियांग को डिज़ाइन नहीं किया गया, वो उगी। वो मैटुआन के डिलीवरी नेटवर्क से निकली, इसलिए उस इतिहास के फ़ायदे तो मिले पर बोझ नहीं। इसे शुरू से ही डार्क स्टोर के आस-पास बनाया गया, और बड़ी दुकानें सिर्फ़ वहीं जोड़ी गईं जहाँ वो अपना खर्च खुद निकाल सकें।

  अलीबाबा की किराना चेन हेमा (Hema) को ऊपर से नीचे की तरफ़, कंपनी के "न्यू रिटेल" ("new retail") नाम के एक ट्रेंडी शब्द के इर्द-गिर्द डिज़ाइन किया गया। इसने पहले बड़ी दुकानें खोलीं और डार्क स्टोर बाद में जोड़े। कुशलता के मामले में, ज़ियाओशियांग जैसे सिर्फ़ डार्क स्टोर पर बने खिलाड़ी से हारने की संभावना ज़्यादा है। अलीबाबा ने अब अपनी किराना डिलीवरी सेवा ताओशियांडा (Taoxianda) को अलग ब्रांड कर दिया है, जिससे सिस्टम की लागत में एक और परत जुड़ गई है।

  रिटेल में ज़्यादा कुशलता, कम कुशलता को खत्म कर देती है।
