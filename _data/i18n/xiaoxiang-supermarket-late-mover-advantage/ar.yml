title: "لماذا تعجز سلاسل التجزئة القديمة في الصين عن إعادة اختراع نفسها، وكيف تتفوق سلسلة البقالة «شيانغشيانغ» (Xiaoxiang Supermarket) التابعة لميتوان (Meituan)"
description: "يستبدل قطاع التجزئة في الصين باستمرار كل نموذج بنموذج أكثر كفاءة، والقدامى عاجزون عن اللحاق. «شيانغشيانغ» أحدث مثال: مستودعات مظلمة (dark stores)، وأصول قديمة معدومة، وشبكة توصيل جاهزة بالفعل."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  يسير قطاع التجزئة في الصين على النمط ذاته مراراً: يبرز شكل أكثر كفاءة، فيُسطِّح الشكل الذي قبله.

  سلاسل المتاجر الكبرى سطّحت متاجر الأقسام الحكومية. الرفوف ذات الخدمة الذاتية، والأسعار الثابتة، وكل شيء تحت سقف واحد، جعلت طاولات البيع وباعة متجر الأقسام القديم يبدون بطيئين بشكل ميؤوس منه.

  متاجر الخدمة على الطراز الياباني سطّحت متاجر الحي. سلاسل الإمداد الموحّدة، وإطلاق منتجات طازجة بشكل متكرر، والفتح على مدار 24 ساعة، تركت المتاجر الصغيرة التقليدية بلا سلسلة إمداد خاصة بها ولا أي سلاح تردّ به.

  التجارة الإلكترونية سطّحت المتاجر العملاقة. لا إيجار، ولا حدود للرفوف، ولا وقت إغلاق. بين عشية وضحاها، تحوّلت مساحة البيع في المتجر العملاق من ميزة إلى عبء.

  النموذج القديم لا يختفي تماماً، لكن حصته تنهار. متاجر الأقسام أصبحت نادرة؛ والمتاجر الصغيرة تراجعت إلى السجائر والمشروبات والمشتريات الطارئة؛ والمتاجر العملاقة تفقد الزبائن والحصة سنة بعد سنة. النموذج الجديد يأخذ النصيب الأكبر، والقديم ينكمش في زاوية.

  فلماذا لا تستطيع النماذج القديمة أن تربح؟

  لقد حاولت. سونينغ (Suning) بنت Suning.com. آر تي مارت (RT-Mart) بنت Feiniu. يونغوي (Yonghui) جرّبت Super Species وYonghui Life. كل واحدة منها عاملت تدمير الذات كأول مشروع لها، وأنفقت أموالاً حقيقية، وراهنت عليه بفرقها ومتاجرها وسلاسل إمدادها.

  لكن أمرين يعيقانها: الأصول القديمة، والطريقة التي كانت تجني بها المال.

  الأصل الأساسي للمتجر العملاق هو عشرات الآلاف من الأمتار المربعة من مساحة البيع. هذا الأصل يحدد هيكل تكاليفه وينتج نموذج ربحه: فرض رسوم على الموردين مقابل مساحة الرفوف وإدراج المنتجات، ودفع مستحقاتهم بعد أشهر، ومواصلة جني الأرباح حتى حين تبقى البضائع على الرفوف.

  ولتغيير ذلك، عليك أن تهدم هذا النموذج بيديك. أغلق المتاجر الكبرى، وألغِ رسوم الموردين، وتحمّل المخزون والتوصيل بنفسك. بمجرد أن تبدأ، ينهار التقرير الربعي، وتتفكك المؤسسة، ويغادر الموردون، وهبط سهم الشركة. لا أحد يستطيع الاستمرار في خطة ثلاثية السنوات ربعاً بعد ربع من النتائج المتردية.

  لذلك ينتهي تدمير الذات عادةً بالموت لا بالبعث. انتهت محاولة سونينغ بأزمة ديون. وانتهت محاولة آر تي مارت ببيع الشركة نفسها لشركة علي بابا (Alibaba). أما يونغوي فأنتجت سلسلة من النماذج الجديدة وسنوات من الخسائر.

  والآن أوشك نفس النمط أن يتكرر. أرى نموذجين جديدين، واحداً على الإنترنت وآخر خارجها.

  النموذج الإلكتروني هو بيندودو (Pinduoduo)، سوق إلكترونية مبنية حول الخصومات الكبيرة. يساعد المصانع على البيع مباشرة للمستهلكين. المصانع بلا علامات تجارية تتجاوز العلامات والوسطاء وتبيع على المنصة مباشرة. أسعارها تخترق طبقات الهوامش المتراكمة التي تجدها على تاوباو (Taobao) وجي دي (JD).

  أما النموذج الواقعي فهو متاجر شيانغشيانغ (Xiaoxiang Supermarket)، سلسلة البقالة التابعة لميتوان (Meituan)، الشركة التي تقف وراء أكبر شبكة لتوصيل الطعام في الصين (تخيل DoorDash أكبر بكثير). تعتمد بشكل أساسي على المستودعات المظلمة (dark stores)، مع عدد قليل من المتاجر الكبيرة لبناء الثقة وتجربة التسوق. المستودع المظلم هو مستودع صغير مخصص فقط لتجهيز الطلبات، مخفي داخل أحد الأحياء. لا إيجار تجاري، ولا طوابير دفع، ولا نقص في الرفوف. كل شيء مرتب لسرعة انتقاء الطلبات وسرعة التوصيل. المتاجر الكبيرة تعوّض نقطة ضعف المستودع المظلم: الناس يريدون أن يروا ويلمسوا ما يشترون.

  كل متر مربع في متجر تقليدي يحرق المال. متاجر شيانغشيانغ الكبيرة هي صالات عرض. التجهيز الحقيقي يحدث في المستودعات المظلمة، التي يعادل إيجارها تقريباً 30 إلى 50 بالمئة مما يدفعه متجر حي تقليدي. هيكلتا التكلفة ليستا في نفس المستوى. تلك هي المادة الأساسية لـ«تسطيح» القدامى.

  والأهم من ذلك: شيانغشيانغ لم تُصمَّم، بل نبتت. نبتت من شبكة توصيل ميتوان، فورثت مزايا ذلك التاريخ دون أعبائه. بُنيت حول المستودع المظلم منذ البداية، ولم تُضَف المتاجر الكبيرة إلا حيث تبرر تكلفتها.

  أما هيما (Hema)، سلسلة البقالة التابعة لعلي بابا، فصُمّمت من الأعلى إلى الأسفل حول كلمة رائجة أسمتها الشركة «التجزئة الجديدة» («new retail»). افتتحت المتاجر الكبيرة أولاً وأضافت المستودعات المظلمة لاحقاً. من حيث الكفاءة، يُرجّح أن تخسر أمام لاعب بُني بالكامل حول المستودعات المظلمة، مثل شيانغشيانغ. وقد فصلت علي بابا الآن خدمة توصيل البقالة الخاصة بها تاوشياندا (Taoxianda) لتصبح علامة تجارية مستقلة، مما يضيف طبقة أخرى من تكلفة النظام.

  في التجزئة، الكفاءة العالية تُدمّر الكفاءة المنخفضة.
