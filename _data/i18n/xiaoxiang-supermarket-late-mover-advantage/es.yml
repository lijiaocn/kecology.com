title: "Por qué los viejos minoristas de China no pueden reinventarse, y cómo Xiaoxiang Supermarket, de Meituan, se impone"
description: "El comercio minorista chino va reemplazando cada formato por uno más eficiente, y la vieja guarda no logra seguir el ritmo. Xiaoxiang Supermarket, de Meituan, es el último ejemplo: tiendas oscuras, sin activos heredados y una red de reparto ya montada."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  El comercio minorista chino sigue siempre el mismo guion: aparece un formato más eficiente y aplana al que venía antes.

  Las cadenas de supermercados barrieron a los grandes almacenes estatales. Los estantes de autoservicio, los precios fijos y tenerlo todo bajo un mismo techo hicieron que los mostradores y dependientes de los viejos almacenes parecieran lentos hasta lo ridículo.

  Las tiendas de conveniencia de estilo japonés barrieron a la tienda de barrio. Cadenas de suministro estandarizadas, lanzamientos frecuentes de productos frescos y horarios de 24 horas dejaron a los negocios de barrio sin cadena de suministro propia y sin nada con qué defenderse.

  El comercio electrónico barrió al hipermercado. Sin alquiler, sin límite de estantes, sin hora de cierre. De la noche a la mañana, la superficie del hipermercado pasó de ser su ventaja a ser su carga.

  El formato antiguo no desaparece del todo, pero su cuota se desploma. Los grandes almacenes son cada vez más raros; las tiendas pequeñas se replegan a tabaco, bebidas y compras de urgencia; los hipermercados pierden clientela y cuota año tras año. El formato nuevo se queda con la parte grande y el antiguo se encoge en un rincón.

  ¿Por qué no pueden ganar los formatos antiguos?

  Lo intentaron. Suning construyó Suning.com. RT-Mart creó Feiniu. Yonghui probó Super Species y Yonghui Life. Cada uno trató la autodisrupción como su proyecto número uno, gastó dinero de verdad y puso en juego equipos, tiendas y cadenas de suministro.

  Pero dos cosas los frenan: los activos heredados y la forma en que solían ganar dinero.

  El activo central de un hipermercado son decenas de miles de metros cuadrados de superficie. Ese activo marca su estructura de costes y alimenta su modelo de beneficios: cobrar a los proveedores por el espacio en los estantes y por las listas de productos, pagarles meses después y seguir ganando incluso cuando la mercancía se queda en el estante.

  Para cambiar, hay que desmontar ese modelo con las propias manos. Cerrar las grandes tiendas, dejar de cobrar tasas a los proveedores, asumir el inventario y encargarse uno mismo del reparto. En cuanto empiezas, el informe trimestral se desploma, la organización se deshace, los proveedores se van y la acción cae. Nadie aguanta un plan a tres años trimestre tras trimestre de resultados decrecientes.

  Así que la autodisrupción suele acabar en muerte y no en renacimiento. El intento de Suning terminó en una crisis de deuda. El de RT-Mart, con la venta de la empresa a Alibaba. Yonghui dejó una ristra de formatos nuevos y años de pérdidas.

  Ahora el mismo guion está a punto de repetirse. Veo dos formatos nuevos, uno en línea y otro fuera de línea.

  El de en línea es Pinduoduo, un mercado montado en torno a descuentos profundos. Ayuda a las fábricas a vender directamente a los consumidores. Fábricas sin marca se saltan las marcas y los intermediarios y venden directamente en la plataforma. Sus precios atraviesan las capas de recargo que se encuentran en Taobao y JD.

  El de fuera de línea es Xiaoxiang Supermarket (en adelante, Xiaoxiang), la cadena de supermercados de Meituan, la empresa detrás de la mayor red de reparto de comida de China (piensa en un DoorDash mucho más grande). Opera sobre todo con tiendas oscuras, también llamadas almacenes de preparación: pequeños almacenes escondidos dentro de un barrio que solo sirven para preparar pedidos, sin venta al público. Se apoya además en un puñado de grandes tiendas para generar confianza y ofrecer una experiencia. No hay alquiler comercial, no hay cajas, no hay mermas en los estantes. Todo está dispuesto para preparar y repartir rápido. Las grandes tiendas compensan el punto débil de la tienda oscura: la gente quiere ver y tocar lo que compra.

  Cada metro cuadrado de un supermercado tradicional quema dinero. Las grandes tiendas de Xiaoxiang son escaparates. La preparación real ocurre en las tiendas oscuras, cuyo alquiler ronda entre el 30 y el 50 por ciento de lo que paga un supermercado de barrio. Las dos estructuras de costes no juegan en la misma liga. Esa es la base material para «aplanar» a los veteranos.

  Y aquí viene lo más importante. Xiaoxiang no fue diseñado: creció. Creció dentro de la red de reparto de Meituan, así que heredó las ventajas de esa historia y ninguna de sus cargas. Se construyó desde el principio en torno a la tienda oscura, y las grandes tiendas se añadieron solo donde se amortizan solas.

  Hema, la cadena de supermercados de Alibaba, fue diseñada de arriba abajo en torno a una palabra de moda que la empresa llamó «new retail». Abrió primero grandes tiendas y añadió las tiendas oscuras después. En eficiencia, es probable que pierda frente a un jugador construido puramente en torno a las tiendas oscuras, como Xiaoxiang. Alibaba ha separado ahora Taoxianda, su servicio de reparto de alimentos, como marca independiente, lo que añade una capa más de coste de sistema.

  En comercio minorista, la alta eficiencia destruye a la baja eficiencia.
