title: "老零售為什麼贏不了新業態：美團小象超市的後發優勢"
description: "中國零售業反覆上演同一個劇本：更有效率的業態擊垮舊業態，而舊業態連自我革新都做不到。美團小象超市踩在前人交過的學費上，用前置倉和現成的配送網路進場。"
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  零售業有一條反覆上演的規律：**一種具有優勢的形態一旦出現，它會以摧枯拉朽之勢迅速擊垮上一代的形態。**

  連鎖大超市擊垮了國營百貨。貨架自選、明碼標價、一站購齊，百貨公司的櫃檯和售貨員在那套效率面前毫無還手之力。

  日式便利商店擊垮了傳統小商店，標準化供應鏈、鮮食上新、24 小時營業，把沒有供應鏈能力的夫妻店碾到粉碎。

  電商又擊敗了線下大賣場，沒有租金、沒有貨架限制、沒有營業時間，大賣場的規模優勢瞬間變成了包袱。

  上一代的形態雖然不會徹底消失，但份額會極大萎縮。百貨公司所剩無幾，小賣部退守菸酒飲料和應急，大賣場客流和份額一年比一年薄。新形態拿走大頭，舊形態萎縮成角落。

  為什麼舊形態打不贏？

  它們其實都試過。蘇寧做易購，大潤發做飛牛網，永輝做超級物種、做永輝生活，每一家都把"自我革命"當成一號工程，真金白銀砸下去，團隊、門店、供應鏈全押上。

  但舊形態被兩樣東西鎖著：**舊資產，和以往賺錢的方式。**

  大賣場的核心資產是幾萬平方米的門店，這套資產撐起了它的成本結構，也養出了它的獲利模式——靠通道費、進場費、帳期，把貨壓給供應商，貨賣得慢一點也照樣賺錢。

  要革命，就得親手否掉這套東西：關大店、砍通道費、自己扛庫存和履約。可一動手，當季報表立刻塌，組織先亂，供應商先跑，股價先跌。**沒有人能在業績下滑的季度裡堅持三年。**

  於是自我革命的結果，大概率不是重生，是殞命。蘇寧革出了債務危機，大潤發革到最後把自己賣給了阿里，永輝革出一堆新業態和連年虧損。

  現在，這條規律又到了上演的時候。我看到兩個新形態，一個線上，一個線下。

  **線上的是拼多多。**這個主打低價的電商平台扶持工廠直面消費者，白牌工廠繞過品牌商和中間商，直接在平台上賣貨。價格擊穿了淘寶京東上層層加價的鏈路。

  **線下的是小象超市。**它是美團（中國最大的外送平台）旗下的生鮮零售連鎖，以前置倉（只做揀貨配送、不對顧客開放的小倉庫）為主，輔以少量大店提升信任和體驗。前置倉藏在社群裡，沒有賣場租金、沒有收銀動線、沒有貨架損耗，一切只為揀貨快、送得快；大店則補上前置倉的天生短板——消費者看不見摸不著商品的信任問題。

  傳統超市的每一平方米門店都在燒錢，而小象的大店只是體驗展示廳，履約主力是成本只有社群超市租金三到五成的前置倉。成本結構不在一個數量級上，這就是"摧枯拉朽"的物質基礎。

  更關鍵的一點：**小象不是設計出來的，是長出來的。**它長在美團的外送配送網路上，只有歷史優勢沒有歷史負擔。直接以前置倉為中心進行業務設計，大店只在有利可圖的地方做補充。

  反觀盒馬（阿里巴巴旗下的生鮮超市），在新零售的概念下被自上而下設計出來。先有了好多大店，然後開始補前置倉。效率上恐怕會輸給純粹以前置倉為中心的小象。如今又把淘鮮達（阿里的生鮮配送服務）拉出來和盒馬的品牌隔離，再多一套系統成本。

  零售業，高效率必然摧毀低效率。
