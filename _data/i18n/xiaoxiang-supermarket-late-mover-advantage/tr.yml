title: "Çin'in Eski Perakende Zincirleri Neden Kendini Yenileyemiyor ve Meituan'ın (Meituan) Market Zinciri Xiaoxiang Supermarket (Xiaoxiang Supermarket) Nasıl Kazanıyor"
description: "Çin perakendesinde her format, daha verimli bir formatla sürekli değiştiriliyor ve eskiler bu değişime ayak uyduramıyor. Meituan'ın Xiaoxiang Supermarket'i bunun son örneği: karanlık depolar, eski varlık yükü yok ve kurulmuş bir teslimat ağı var."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  Çin perakendesi aynı senaryoyu tekrar tekrar izliyor: daha verimli bir format ortaya çıkıyor ve öncekinin üstünü çiziyor.

  Süpermarket zincirleri, devlet işletmesi olan eski mağazaları düzleştirdi. Self-servis raflar, sabit fiyatlar ve her şeyin tek çatı altında olması, eski mağazanın tezgâhlarını ve satıcılarını umutsuzca yavaş gösterdi.

  Japon tarzı marketler, mahalle bakkalını düzleştirdi. Standartlaşmış tedarik zincirleri, sık sık yeni taze gıda çıkarmaları ve 24 saat açıklık, bakkalları kendi tedarik zincirinden ve karşı koyacak hiçbir şeyden yoksun bıraktı.

  E-ticaret, hipermarketi düzleştirdi. Ne kira, ne raf sınırı, ne kapanış saati. Bir gecede hipermarketin satış alanı, avantajı olmaktan çıkıp yükü oldu.

  Eski format tamamen yok olmuyor ama payı çöküyor. Büyük mağazalar seyrek hale geldi; küçük dükkanlar sigara, içecek ve acil alışverişe çekildi; hipermarketler her yıl hem ziyaretçi hem pay kaybediyor. Yeni format büyük payı alıyor, eskisi ise bir köşeye sıkışıyor.

  Peki eski formatlar neden kazanamıyor?

  Aslında denediler. Suning (Suning), Suning.com'u kurdu. RT-Mart (RT-Mart), Feiniu'yu kurdu. Yonghui (Yonghui), Super Species ve Yonghui Life'ı denedi. Her biri kendi kendini yıkamayı bir numaralı projesi olarak gördü, gerçek para harcadı ve ekiplerini, mağazalarını, tedarik zincirlerini buna yatırdı.

  Ama onları iki şey geri tutuyor: eski varlıklar ve eskiden para kazanma biçimleri.

  Bir hipermarketin temel varlığı, on binlerce metrekarelik satış alanıdır. Bu varlık maliyet yapısını belirler ve kâr modelini doğurur: tedarikçilere raf alanı ve ürün listelemesi için ücret ödet, aylar sonra ödeme yap, mallar raflarda dururken bile kazanmaya devam et.

  Değişmek için bu modeli kendi ellerinle yıkman gerekir. Büyük mağazaları kapat, tedarikçi ücretlerini kaldır, envanteri ve teslimatı kendin üstlen. Başlar başlamaz çeyrek dönem raporu çöküyor, örgüt dağılıyor, tedarikçiler gidiyor, hisse fiyatı düşüyor. Hiç kimse, çeyrek çeyrek kötüleşen sonuçların ortasında üç yıllık bir plana bağlı kalamaz.

  Bu yüzden kendi kendini yıkama çoğu zaman yeniden doğuşla değil, ölümle sonuçlanır. Suning'in girişimi bir borç kriziyle bitti. RT-Mart'ınki, şirketin kendisini Alibaba'ya (Alibaba) satmasıyla sonuçlandı. Yonghui ise bir dizi yeni format ve yıllarca zarar üretti.

  Şimdi aynı senaryo yeniden oynanmak üzere. İki yeni format görüyorum: biri çevrimiçi, diğeri çevrimdışı.

  Çevrimiçi olanı, derin indirimler etrafında kurulmuş bir pazaryeri olan Pinduoduo (Pinduoduo). Fabrikaların doğrudan tüketicilere satmasını sağlıyor. Markasız fabrikalar markaları ve aracıları atlayıp doğrudan platformda satıyor. Fiyatları, Taobao'da (Taobao) ve JD'de (JD) gördüğünüz zam katmanlarını delip geçiyor.

  Çevrimdışı olanı ise Xiaoxiang Supermarket (Xiaoxiang Supermarket), Çin'in en büyük yemek teslimat ağının arkasındaki şirket Meituan'ın (Meituan) market zinciri (düşünün: çok daha büyük bir DoorDash). Ağırlıklı olarak karanlık depolarla (dark store) çalışıyor; güven ve deneyim için bir avuç büyük mağaza var. Karanlık depo, bir mahallenin içine gizlenmiş, yalnızca sipariş hazırlamaya ayrılmış küçük bir depodur. Ne perakende kirası, ne kasa sırası, ne rafta fire. Her şey hızlı toplama ve hızlı teslimat için düzenlenmiş. Büyük mağazalar, karanlık deponun zayıf noktasını telafi ediyor: insanlar satın aldıkları şeyi görmek ve dokunmak istiyor.

  Geleneksel bir süpermarketin her metrekarezi para yakıyor. Xiaoxiang'ın büyük mağazaları vitrin. Asıl sipariş hazırlama karanlık depolarda gerçekleşiyor; kiraları bir mahalle süpermarketinin ödediğinin yaklaşık yüzde 30 ila 50'si. İki maliyet yapısı aynı ligde değil. "Eskileri düzleştirmenin" maddi temeli bu.

  Ve daha önemlisi: Xiaoxiang tasarlanmadı, büyüdü. Meituan'ın teslimat ağından doğdu, bu yüzden o geçmişin avantajlarını aldı ama yüklerini almadı. Başından itibaren karanlık depo etrafında kuruldu; büyük mağazalar ancak kendi masrafını çıkardığı yerlere eklendi.

  Alibaba'nın market zinciri Hema (Hema) ise tepeden aşağıya, şirketin "yeni perakende" ("new retail") adını verdiği bir moda sözcükle tasarlandı. Önce büyük mağazaları açtı, karanlık depoları sonra ekledi. Verimlilik açısından, tıpkı Xiaoxiang gibi tamamen karanlık depo etrafında kurulmuş bir oyuncuya yenilmesi muhtemel. Alibaba şimdi market teslimat hizmeti Taoxianda'yı (Taoxianda) ayrı bir marka olarak ayırdı; bu da sisteme bir maliyet katmanı daha ekliyor.

  Perakendede yüksek verimlilik, düşük verimliliği yok eder.
