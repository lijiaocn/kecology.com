title: "Vì sao nhà bán lẻ cũ ở Trung Quốc không thể tự đổi mới, và cách Xiaoxiang Supermarket (chuỗi siêu thị của Meituan) giành chiến thắng"
description: "Bán lẻ Trung Quốc liên tục thay một mô hình bằng mô hình hiệu quả hơn, còn những tên tuổi cũ thì không theo kịp. Xiaoxiang Supermarket của Meituan là ví dụ mới nhất: kho tối (kho nhỏ chỉ xử lý đơn hàng trong khu dân cư), không tài sản kế thừa, và mạng lưới giao hàng đã có sẵn."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  Bán lẻ tại Trung Quốc cứ lặp đi lặp lại một kịch bản: một mô hình hiệu quả hơn xuất hiện, rồi đánh bại mô hình đứng trước nó.

  Các chuỗi siêu thị đã đánh bại các cửa hàng bách hóa nhà nước. Kệ tự chọn, giá niêm yết cố định và mọi thứ gộp dưới một mái nhà khiến quầy hàng và nhân viên bán hàng của cửa hàng bách hóa cũ trở nên chậm chạp một cách vô vọng.

  Cửa hàng tiện lợi kiểu Nhật lại đánh bại cửa hàng trong khu dân cư. Chuỗi cung ứng được chuẩn hóa, thường xuyên ra mắt thực phẩm tươi và mở cửa 24 giờ khiến các cửa hàng nhỏ lẻ không có chuỗi cung ứng riêng, cũng chẳng có gì để chống cự.

  Thương mại điện tử đánh bại siêu thị lớn. Không tiền thuê, không giới hạn kệ hàng, không giờ đóng cửa. Chỉ sau một đêm, diện tích sàn của siêu thị lớn từ chỗ là lợi thế đã trở thành gánh nặng.

  Mô hình cũ không biến mất hoàn toàn, nhưng thị phần sụt giảm mạnh. Cửa hàng bách hóa thưa thớt; cửa hàng nhỏ lùi lại sang thuốc lá, nước uống và các lần mua gấp; siêu thị lớn mất dần lượt khách và thị phần năm này qua năm khác. Mô hình mới chiếm phần lớn, còn mô hình cũ co lại trong một góc.

  Vì sao các mô hình cũ không thể thắng?

  Họ đã từng thử. Suning xây dựng Suning.com. RT-Mart xây Feiniu. Yonghui thử Super Species và Yonghui Life. Mỗi bên đều coi việc tự phá vỡ mình là dự án số một, chi tiền thật và đặt cược cả đội ngũ, cửa hàng lẫn chuỗi cung ứng vào đó.

  Nhưng có hai thứ kìm hãm họ: tài sản cũ và cách họ từng kiếm tiền.

  Tài sản cốt lõi của một siêu thị lớn là hàng chục nghìn mét vuông diện tích sàn. Tài sản đó quyết định cơ cấu chi phí và sinh ra mô hình lợi nhuận của họ: thu phí của nhà cung cấp cho không gian kệ và việc liệt kê sản phẩm, trả tiền họ vài tháng sau, và tiếp tục kiếm lời ngay cả khi hàng vẫn nằm trên kệ.

  Để thay đổi, phải tự tay phá bỏ mô hình đó. Đóng cửa những siêu thị lớn, bỏ phí thu từ nhà cung cấp, tự chịu hàng tồn kho và tự lo khâu giao hàng. Ngay khi bắt tay vào, báo cáo tài chính quý lao dốc, tổ chức rạn nứt, nhà cung cấp bỏ đi và giá cổ phiếu giảm. Không ai có thể theo đuổi kế hoạch ba năm qua từng quý liên tiếp kết quả đi xuống.

  Vì vậy, tự phá vỡ mình thường kết thúc bằng cái chết chứ không phải tái sinh. Nỗ lực của Suning kết thúc trong khủng hoảng nợ; của RT-Mart bằng việc bán mình cho Alibaba; còn Yonghui tạo ra một loạt mô hình mới nhưng phải chịu nhiều năm thua lỗ.

  Giờ đây kịch bản đó sắp lặp lại. Tôi thấy hai mô hình mới, một trực tuyến và một ngoại tuyến.

  Mô hình trực tuyến là Pinduoduo, một sàn thương mại xây dựng quanh các đợt giảm giá sâu. Nó giúp nhà máy bán trực tiếp cho người tiêu dùng. Các nhà máy không có thương hiệu bỏ qua khâu thương hiệu và trung gian, bán trực tiếp trên nền tảng. Giá của họ xuyên qua lớp lớp biên lợi nhuận mà bạn thấy trên Taobao và JD.

  Mô hình ngoại tuyến là Xiaoxiang Supermarket (chuỗi siêu thị của Meituan), công ty đứng sau mạng lưới giao đồ ăn lớn nhất Trung Quốc (hãy nghĩ đến một DoorDash lớn hơn rất nhiều). Mô hình này vận hành chủ yếu bằng kho tối, chỉ có một vài cửa hàng lớn để tạo niềm tin và trải nghiệm. Kho tối là một kho nhỏ chỉ chuyên xử lý đơn hàng, nằm ẩn trong một khu dân cư. Không tiền thuê mặt bằng bán lẻ, không quầy thanh toán, không hao hụt hàng trên kệ. Mọi thứ được sắp xếp để lấy hàng nhanh và giao hàng nhanh. Những cửa hàng lớn bù vào điểm yếu của kho tối: người ta muốn nhìn và chạm vào thứ mình mua.

  Mỗi mét vuông của siêu thị truyền thống đều đốt tiền. Các cửa hàng lớn của Xiaoxiang chỉ là showroom. Việc xử lý đơn hàng thật sự diễn ra ở kho tối, nơi tiền thuê mặt bằng chỉ bằng khoảng 30 đến 50 phần trăm so với siêu thị khu dân cư. Hai cơ cấu chi phí này không cùng một đẳng cấp. Đó là nền tảng vật chất để "đánh bại" thế hệ cũ.

  Và đây là phần quan trọng hơn. Xiaoxiang không được thiết kế ra. Nó lớn lên. Nó lớn lên từ mạng lưới giao hàng của Meituan, nên thừa hưởng những lợi thế của lịch sử đó mà không vướng chút gánh nặng nào. Ngay từ đầu nó được xây dựng quanh kho tối, và cửa hàng lớn chỉ được thêm ở nơi tự thu hồi vốn.

  Hema, chuỗi siêu thị của Alibaba, được thiết kế từ trên xuống quanh một khẩu hiệu mà công ty gọi là "new retail". Họ mở cửa hàng lớn trước, rồi mới thêm kho tối sau. Về hiệu quả, Hema nhiều khả năng thua một đối thủ được xây dựng thuần túy quanh kho tối như Xiaoxiang. Alibaba hiện đã tách Taoxianda, dịch vụ giao đồ tươi của mình, thành một thương hiệu riêng, và điều đó cộng thêm một lớp chi phí hệ thống.

  Trong bán lẻ, hiệu quả cao tiêu diệt hiệu quả thấp.
