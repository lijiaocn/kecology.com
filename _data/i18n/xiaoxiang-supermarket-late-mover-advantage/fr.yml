title: "Pourquoi les vieux détaillants chinois ne peuvent pas se réinventer, et comment Xiaoxiang Supermarket de Meituan s'impose"
description: "Le commerce de détail chinois remplace sans cesse chaque format par un plus efficace, et la vieille garde ne suit pas. Xiaoxiang Supermarket de Meituan en est le dernier exemple : des dark stores, aucun actif hérité et un réseau de livraison déjà en place."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  Le commerce de détail chinois suit toujours le même scénario : un format plus efficace apparaît, et il aplatit celui qui le précédait.

  Les chaînes de supermarchés ont aplati les grands magasins d'État. Rayons en libre-service, prix fixes et tout sous un même toit ont rendu les comptoirs et les vendeurs des vieux grands magasins ridiculement lents.

  Les magasins de proximité de style japonais ont aplati l'épicerie de quartier. Des chaînes d'approvisionnement standardisées, des lancements fréquents de produits frais et une ouverture 24 heures sur 24 ont laissé les petits commerces de quartier sans chaîne d'approvisionnement propre et sans rien pour riposter.

  Le commerce en ligne a aplati l'hypermarché. Pas de loyer, pas de limite de rayons, pas d'heure de fermeture. Du jour au lendemain, la surface de vente de l'hypermarché est passée d'avantage à fardeau.

  Le vieux format ne disparaît pas complètement, mais sa part s'effondre. Les grands magasins sont de plus en plus rares ; les petites boutiques se replient sur les cigarettes, les boissons et les achats d'urgence ; les hypermarchés perdent du trafic et des parts année après année. Le nouveau format prend la grosse part, et l'ancien se réduit à un coin.

  Pourquoi les vieux formats ne peuvent-ils pas gagner ?

  Ils ont essayé. Suning a construit Suning.com. RT-Mart a créé Feiniu. Yonghui a tenté Super Species et Yonghui Life. Chacun a traité l'auto-disruption comme son projet numéro un, a investi de l'argent réel et a mis en jeu équipes, magasins et chaînes d'approvisionnement.

  Mais deux choses les freinent : les actifs hérités et la façon dont ils gagnaient leur vie.

  L'actif central d'un hypermarché, ce sont des dizaines de milliers de mètres carrés de surface. Cet actif détermine sa structure de coûts et nourrit son modèle de profit : facturer aux fournisseurs l'espace en rayon et l'inscription des produits, les payer des mois plus tard et continuer à gagner même quand la marchandise reste sur les étagères.

  Pour changer, il faut démonter ce modèle de ses propres mains. Fermer les grands magasins, renoncer aux taxes versées par les fournisseurs, assumer les stocks et gérer la livraison soi-même. Dès que l'on commence, le rapport trimestriel s'effondre, l'organisation se délite, les fournisseurs partent et le cours de l'action chute. Personne ne tient un plan sur trois ans face à des résultats en baisse trimestre après trimestre.

  Alors l'auto-disruption finit généralement en mort plutôt qu'en renaissance. La tentative de Suning s'est soldée par une crise de dette. Celle de RT-Mart par la vente de l'entreprise à Alibaba. Yonghui a produit une série de nouveaux formats et des années de pertes.

  Maintenant, le même scénario est sur le point de se rejouer. Je vois deux nouveaux formats, un en ligne et un hors ligne.

  Celui en ligne, c'est Pinduoduo, une place de marché construite autour de remises profondes. Elle aide les usines à vendre directement aux consommateurs. Des usines sans marque sautent les marques et les intermédiaires et vendent directement sur la plateforme. Leurs prix traversent les couches de marge que l'on trouve sur Taobao et JD.

  Celui hors ligne, c'est Xiaoxiang Supermarket (ci-après Xiaoxiang), la chaîne de supermarchés de Meituan, l'entreprise derrière le plus grand réseau de livraison de repas de Chine (imaginez un DoorDash beaucoup plus grand). Elle fonctionne surtout avec des dark stores, de petits entrepôts de préparation cachés dans un quartier et réservés à la préparation des commandes, sans vente au public, auxquels s'ajoutent quelques grands magasins pour inspirer confiance et offrir une expérience. Pas de loyer commercial, pas de caisses, pas de vols en rayon. Tout est agencé pour préparer et livrer vite. Les grands magasins compensent le point faible du dark store : les gens veulent voir et toucher ce qu'ils achètent.

  Chaque mètre carré d'un supermarché traditionnel brûle de l'argent. Les grands magasins de Xiaoxiang sont des vitrines. La préparation réelle a lieu dans les dark stores, dont le loyer représente environ 30 à 50 pour cent de ce que paie un supermarché de quartier. Les deux structures de coûts ne sont pas dans la même catégorie. C'est la base matérielle permettant d'«aplatir» la vieille garde.

  Et voici l'essentiel. Xiaoxiang n'a pas été conçu : il a grandi. Il a grandi dans le réseau de livraison de Meituan et hérite donc des avantages de cette histoire sans aucun de ses fardeaux. Il a été construit dès le départ autour du dark store, les grands magasins n'étant ajoutés que là où ils s'amortissent d'eux-mêmes.

  Hema, la chaîne de supermarchés d'Alibaba, a été conçue de haut en bas autour d'un mot à la mode que l'entreprise appelle «new retail». Elle a ouvert d'abord les grands magasins et a ajouté les dark stores ensuite. En efficacité, elle devrait perdre face à un acteur bâti uniquement autour des dark stores, comme Xiaoxiang. Alibaba a désormais détaché Taoxianda, son service de livraison d'aliments, en une marque séparée, ce qui ajoute une couche supplémentaire de coût système.

  Dans le commerce de détail, la haute efficacité détruit la basse efficacité.
