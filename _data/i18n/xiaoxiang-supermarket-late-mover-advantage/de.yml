title: "Warum sich Chinas alte Einzelhändler nicht neu erfinden können – und Meituans Xiaoxiang Supermarket gewinnt"
description: "Im chinesischen Einzelhandel ersetzt ein effizienteres Format immer das vorherige, und die etablierten Ketten können nicht mithalten. Meituans Xiaoxiang Supermarket ist das jüngste Beispiel: Dark Stores, keine geerbten Altlasten und ein Liefernetz, das bereits steht."
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  Der chinesische Einzelhandel folgt immer demselben Muster: Ein effizienteres Format taucht auf und plättet das bisherige.

  Supermarktketten plätteten die staatlichen Kaufhäuser. Selbstbedienungsregale, feste Preise und alles unter einem Dach ließen die Theken und Verkäufer der alten Kaufhäuser hoffnungslos langsam erscheinen.

  Convenience Stores japanischer Prägung plätteten die Tante-Emma-Läden. Standardisierte Lieferketten, häufige Frischwaren-Neuheiten und rund um die Uhr geöffnet ließen die kleinen Läden ohne eigene Lieferkette und ohne Mittel zur Gegenwehr zurück.

  Der Onlinehandel plättete den Hypermarkt. Keine Miete, keine Begrenzung durch die Regalfläche, keine Schließzeit. Über Nacht wurde die Verkaufsfläche des Hypermarkts von seinem Vorteil zu seiner Last.

  Das alte Format verschwindet nicht ganz, aber sein Anteil bricht ein. Kaufhäuser werden immer seltener; die kleinen Läden ziehen sich auf Zigaretten, Getränke und spontane Einkäufe zurück; die Hypermärkte verlieren Jahr für Jahr Besucher und Marktanteile. Das neue Format nimmt den großen Teil, das alte schrumpft in eine Ecke.

  Warum können die alten Formate nicht gewinnen?

  Sie haben es versucht. Suning baute Suning.com. RT-Mart schuf Feiniu. Yonghui probierte Super Species und Yonghui Life. Jedes behandelte die Selbstzerstörung als sein Projekt Nummer eins, gab echtes Geld aus und setzte Teams, Filialen und Lieferketten darauf.

  Doch zwei Dinge halten sie zurück: die Altlasten und die Art, wie sie früher Geld verdienten.

  Der Kern eines Hypermarkts sind Zehntausende Quadratmeter Verkaufsfläche. Dieser Vermögenswert bestimmt seine Kostenstruktur und bringt sein Gewinnmodell hervor: den Lieferanten Regalplatz und Produkteinträge in Rechnung stellen, sie erst Monate später bezahlen und weiter verdienen, selbst wenn die Ware in den Regalen liegt.

  Um etwas zu ändern, muss man dieses Modell mit den eigenen Händen abreißen. Die großen Filialen schließen, die Lieferantenabgaben streichen, den Warenbestand selbst tragen und die Auslieferung selbst übernehmen. Sobald man anfängt, bricht der Quartalsbericht ein, die Organisation zerfällt, die Lieferanten gehen und der Aktienkurs fällt. Niemand hält ein Dreijahresprogramm durch, wenn die Ergebnisse Quartal für Quartal schlechter werden.

  So endet die Selbstzerstörung meist mit dem Tod statt mit einer Wiedergeburt. Sunings Versuch endete in einer Schuldenkrise. Der von RT-Mart damit, dass sich das Unternehmen an Alibaba verkaufte. Yonghui brachte eine Reihe neuer Formate hervor und Jahre voller Verluste.

  Jetzt steht dasselbe Muster kurz davor, sich zu wiederholen. Ich sehe zwei neue Formate, eines online und eines offline.

  Das Online-Format ist Pinduoduo, ein Marktplatz, der um hohe Rabatte herum gebaut ist. Er hilft Fabriken, direkt an Verbraucher zu verkaufen. Markenlose Fabriken überspringen Marken und Zwischenhändler und verkaufen direkt auf der Plattform. Ihre Preise schneiden durch die vielen Gewinnspannen hindurch, wie man sie von Taobao und JD kennt.

  Das Offline-Format ist Xiaoxiang Supermarket, die Lebensmittelkette von Meituan, dem Unternehmen hinter Chinas größtem Essensliefernetz (man stelle sich ein deutlich größeres DoorDash vor). Sie arbeitet vor allem mit Dark Stores, dazu kommen ein paar große Filialen für Vertrauen und Einkaufserlebnis. Ein Dark Store ist ein kleiner, rein der Auftragsabwicklung dienender Lagerraum im Wohnviertel. Keine Ladenmiete, keine Kassenzonen, keine Regalverluste. Alles ist auf schnelles Kommissionieren und schnelle Auslieferung ausgelegt. Die großen Filialen gleichen die Schwäche des Dark Store aus: Die Leute wollen sehen und anfassen, was sie kaufen.

  Jeder Quadratmeter eines herkömmlichen Supermarkts verbrennt Geld. Xiaoxiangs große Filialen sind Schauräume. Die eigentliche Auftragsabwicklung findet in den Dark Stores statt, deren Miete rund 30 bis 50 Prozent dessen beträgt, was ein Nachbarschaftssupermarkt zahlt. Die beiden Kostenstrukturen liegen weltenweit auseinander. Das ist die materielle Grundlage dafür, die alte Garde zu „plätten“.

  Und jetzt kommt der wichtigere Teil. Xiaoxiang wurde nicht entworfen. Es ist gewachsen. Es ist aus Meituans Liefernetz hervorgegangen und erbt daher die Vorteile dieser Geschichte, aber keine ihrer Lasten. Von Anfang an war es um den Dark Store herum gebaut; große Filialen kamen nur dort hinzu, wo sie sich selbst tragen.

  Hema, Alibabas Lebensmittelkette, wurde von oben nach unten um ein Modewort herum konstruiert, das das Unternehmen „new retail“ nannte. Zuerst wurden große Filialen eröffnet, die Dark Stores kamen später hinzu. Bei der Effizienz wird es voraussichtlich gegen einen Akteur verlieren, der rein um Dark Stores herum gebaut ist, wie Xiaoxiang. Alibaba hat inzwischen Taoxianda, seinen Lieferservice für Lebensmittel, als eigenständige Marke ausgegliedert, was eine weitere Ebene an Systemkosten hinzufügt.

  Im Einzelhandel zerstört hohe Effizienz die niedrige Effizienz.
