title: "中国の古い小売が再生できない理由：デリバリー最大手・美团の食材スーパー、小象超市（Xiaoxiang Supermarket）が効率で勝つ"
description: "中国の小売では、より効率的な業態が古い業態を次々と置き換えてきたが、既存の大手はついていけない。最新例が、美团の食材スーパー、小象超市だ。地域に潜む出荷専門の小さな倉庫（ダークストア）を軸に、過去の資産を抱えず、配達ネットワークを最初から持っている。"
image: /assets/img/blog/xiaoxiang-supermarket-late-mover-advantage/xiaoxiang-supermarket-cover.png

body: |
  中国の小売業は、同じシナリオを繰り返している。より効率的な業態が現れると、それまでの業態をなぎ倒していくのだ。

  スーパーチェーンが、国営の百貨店を飲み込んだ。セルフサービスの棚に、決まった価格、必要なものはすべて一つの屋根の下。そのやり方が、昔ながらの百貨店のカウンターと店員を、どうしようもなく遅く見せたのである。

  次は、日本式のコンビニが町の小さな店を駆逐した。標準化されたサプライチェーン、新鮮な食品の頻繁な投入、24時間営業。これにより、個人商店は自前の仕入れ網を持たず、対抗する手立ても失った。

  ネット通販が巨大スーパー（ハイパーマーケット）を圧倒した。家賃も、棚の制限も、閉店時間もない。ある日突然、広大な売り場面積が、ハイパーマーケットの強みから重荷へと変わった。

  古い業態が完全に消えるわけではないが、シェアは急落する。百貨店はめっきり減り、小さな店はタバコ・飲料・急な買い物へと縮こまり、ハイパーマーケットは来店客数とシェアを毎年減らしていく。新しい業態が大きなシェアを取り、古い業態は片隅に追いやられる。

  なぜ、古い業態は勝てないのか。

  やらないわけではなかった。スーニング（Suning）は「Suning.com」を作り、RT-Martは「Feiniu」を立ち上げ、ヨンフイ（Yonghui）は「Super Species」と「Yonghui Life」に挑んだ。いずれも自らを壊すことを最優先課題に据え、本気で金を投じ、チームも店舗もサプライチェーンも賭けたのである。

  だが、二つのものが足を引っ張る。古い資産と、これまで稼いできたやり方である。

  ハイパーマーケットの核心的な資産は、数万平方メートルもの売り場面積である。この資産がコスト構造を規定し、独自の収益モデルを生んできた。仕入れ先から棚の使用料や商品掲載料を取り、代金は数か月後に支払う。商品が棚に眠っていても、収益は入り続ける。

  変わるには、そのモデルを自分の手で壊さなければならない。大きな店を閉め、仕入れ先からの料金をやめ、在庫を自ら抱え、配達も自前でこなす。手をつけた瞬間、四半期決算は悪化し、組織はほぐれ、仕入れ先は離れ、株価は下落する。業績が下がり続ける四半期が何期も続く中で、三年計画を最後までやり切れる者はいない。

  だから、自らを壊す試みは、再生ではなく死に終わることが多い。スーニングの挑戦は債務危機に終わり、RT-Martはアリババに身を売る結末を迎え、ヨンフイは新しい業態を次々と生み出したものの、何年も赤字を抱え込んだ。

  そして今、同じシナリオがもう一度繰り返されようとしている。オンラインとオフライン、二つの新しい業態が見えている。

  オンライン側は拼多多（ピンドゥオドォ）だ。大幅な値引きを軸にしたマーケットプレイスである。工場から消費者へ直接売る仕組みを作った。無ブランドの工場は、ブランドや中間業者を飛び越え、プラットフォームで直接販売する。その価格は、淘宝（タオバオ）やJD（ジンディング）に積み重なるマージンの層を突き抜ける。

  オフライン側は、小象超市だ。中国最大のフードデリバリーネットワークを抱える美团（DoorDashをはるかに大きくしたもの、と思えばいい）の食材スーパーチェーンである。店舗の中心はダークストアで、信用と体験を担う大型店を少数置いているだけだ。ダークストアとは、住宅街の一角に潜む、出荷専門の小さな倉庫のこと。小売の家賃も、レジの列も、棚の目減りもない。すべてが素早いピッキングと素早い配達のために配置されている。大型店は、ダークストアの弱点を補う。人は買うものを目で見て、手で触れたいのだ。

  従来型スーパーの売り場は、一平方メートルごとに金を燃やす。小象超市の大型店はショールームにすぎない。実際の出荷はダークストアで行われ、その家賃は町のスーパーのおよそ30〜50パーセントだ。二つのコスト構造は、同じ土俵にすらいない。これが、古い勢力を「なぎ倒す」ための物質的な基盤である。

  そして、もっと重要なのはここからだ。小象超市は、設計されたのではない。育ったのである。美团の配達ネットワークから生まれたため、その歴史が持つ恩恵はそのまま受け継ぎ、重荷は一切引き継いでいない。最初からダークストアを軸に作られ、大型店は採算が取れる場所にだけ後から追加された。

  一方、アリババの食材スーパー、盒马（フーマ）は、同社が「ニューリテール」と呼ぶキャッチフレーズを軸に、トップダウンで設計された。まず大型店を開き、後からダークストアを足した。効率の点では、小象超市のように最初からダークストアだけを前提に作られた相手に負ける可能性が高い。アリババは現在、食材配達サービスだった淘鲜达（タオシェンダ）を別ブランドに分社化しており、それがシステムコストの層をさらに一枚、積み上げている。

  小売の世界では、高い効率が低い効率を壊す。
