title: "एक चीनी स्नातकोत्तर छात्रा ने गर्भावस्था का समय शीतकालीन अवकाश के अनुसार क्यों चुना — और यह क्यों समझदारी है"
description: "एक चीनी स्नातकोत्तर छात्रा ने शीतकालीन अवकाश में बच्चे को जन्म देने की योजना बनाई। इंटरनेट ने इसे लापरवाही कहा। मेरा मानना है कि उसने समय की गणना सबसे बेहतर की।"
body: |
  चीन में एक कहानी तेज़ी से फैल रही है: एक स्नातकोत्तर छात्रा ने अपनी गर्भावस्था का समय इस तरह तय किया कि बच्चे का जन्म शीतकालीन अवकाश के दौरान हो। चीन के विश्वविद्यालय जनवरी और फरवरी के आसपास कई सप्ताह के लिए बंद रहते हैं, और उसने जानबूझकर उसी अवधि को चुना था।

  कमेंट सेक्शन गुलजार हो उठा। कुछ लोगों ने उसे बेवकूफ़ कहा — अभी छात्रा है, पहले ही माँ बन गई। दूसरों ने कहा कि उसने कुछ समझ लिया है।

  मेरी राय में, वही सबसे समझदार है।

  बीसवें दशक में कई लोग घोषणा करते हैं कि उन्हें कभी बच्चा नहीं चाहिए। DINK — double income, no kids, यानी दो आय वाला, बच्चा-रहित जोड़ा। पच्चीस साल की उम्र में पैसा अपना होता है, समय अपना होता है, और बच्चा उन सब चीज़ों को बर्बाद करने वाला लगता है।

  लेकिन तीस और चालीस के दशक में लोग बदल जाते हैं। दोस्त बच्चे पैदा करने लगते हैं। उनके घर शोर से भरे और जीवंत हो जाते हैं। इस बीच DINK वाला घर और शांत होता जाता है। यात्रा और अच्छा खाना उस खालीपन को अब नहीं भरते। जो चीज़ लोग अब चाहते हैं, वह है पैरों के नीचे दौड़ता हुआ बच्चा।

  और तब समय उनके खिलाफ हो जाता है। शरीर पहले जैसा साथ नहीं देता। जब जन्म की तारीक़ नज़दीक आती है, करियर सबसे अधिक मांग वाला हो जाता है। आप काम पर ध्यान नहीं दे सकते बिना यह महसूस किए कि बच्चे की उपेक्षा कर रहे हैं; बच्चे पर ध्यान नहीं दे सकते बिना देखे कि करियर फिसल रहा है।

  स्त्रियों के लिए देर से बच्चा पैदा करने की कीमत ज़्यादा भारी होती है। कुछ लोग अंततः अपना करियर ही छोड़ देती हैं।

  ज़्यादातर लोग आख़िरकार बच्चे पालते ही हैं, चाहे जल्दी हो या देर। अगर आपकी मंज़िल वही है, तो यह जल्दी करना बेहतर विकल्प है।

  जल्दी करने से क्या मिलता है? आप जवान हैं — शरीर साथ देता है, ऊर्जा है, और बच्चे की देखभाल आपको थका नहीं देती। आप करियर की शुरुआत में हैं, जब बॉस और सहकर्मी नई माँ के लिए ज़्यादा समझदार होते हैं; छुट्टी के दिनों कोई हिसाब नहीं रखता। और आपके अपने माँ-बाप अभी जवान और सेहतमंद हैं, जो बच्चे की देखभाल में मदद कर सकते हैं। पैंतीस साल तक इंतज़ार कीजिए तो ये तीनों फ़ायदे चले जाते हैं।

  शुरुआत पर वापस आएँ। इस छात्रा ने शीतकालीन अवकाश में बच्चे को जन्म दिया, बिना अपनी पढ़ाई रोके, शांत और बिना जल्दबाज़ी के। उसने ज़िंदगी के सबसे कठिन हिस्से को उस समय पूरा कर लिया जब बाकी लोग अब भी इस बात पर बहस कर रहे थे कि सही समय कब है।

  समझदारी क्या है? यह जानना कि कुछ चीज़ों से बचा नहीं जा सकता, और उन्हें तब करना जब लागत अभी कम है। उसने सबसे अच्छा हिसाब लगाया।
