title: "Mengapa mahasiswi pascasarjana China mengatur waktu kehamilannya agar melahirkan saat libur musim dingin — dan mengapa itu cerdas"
description: "Seorang mahasiswi pascasarjana di China merencanakan melahirkan saat libur musim dingin. Warganet menyebutnya nekat. Saya justru berpikir dia menghitung waktu lebih baik daripada siapa pun."
body: |
  Sebuah kisah tengah ramai dibicarakan di China: seorang perempuan yang masih menempuh pendidikan pascasarjana mengatur waktu kehamilannya supaya melahirkan saat libur musim dingin. Universitas di China libur beberapa minggu sekitar bulan Januari dan Februari, dan dia sengaja membidik jendela waktu itu.

  Kolom komentar pun ramai. Ada yang bilang dia bodoh — masih jadi mahasiswi, sudah jadi ibu. Ada pula yang mengatakan dia sudah menemukan sesuatu.

  Pendapat saya: dialah orang yang paling jernih berpikir di sini.

  Banyak orang di usia dua puluhan menyatakan tak akan punya anak. DINK — double income, no kids, atau pasangan berpenghasilan ganda tanpa anak. Di usia dua puluh lima tahun, uang dan waktu masih sepenuhnya milik sendiri, dan seorang anak terasa seperti hal yang akan menghancurkan semua itu.

  Tapi orang berubah di usia tiga dan empat puluhan. Teman-teman mulai punya anak. Rumah mereka jadi ramai dan penuh kehidupan. Sementara itu, rumah tangga DINK justru makin sunyi. Perjalanan dan makanan enak tak lagi cukup mengisi kekosongan. Yang mereka inginkan sekarang adalah anak yang berlari ke sana kemari di sekitar kaki mereka.

  Dan ketika itu tiba, waktunya sudah berbalik melawan mereka. Tubuh tak lagi bekerja seperti dulu. Karier justru paling menuntut ketika tanggal melahirkan mendekat. Kamu tak bisa fokus bekerja tanpa merasa mengabaikan anak; tak bisa fokus pada anak tanpa melihat kariermu melorot.

  Bagi perempuan, melahirkan di usia tua membawa harga yang lebih berat. Sebagian akhirnya harus meninggalkan karier sama sekali.

  Kebanyakan orang pada akhirnya tetap membesarkan anak. Kalau itu memang tujuanmu, melakukannya lebih awal adalah pilihan yang lebih baik.

  Apa untungnya lebih awal? Kamu masih muda — tubuh kuat, energi ada, dan merawat anak tak membuatmu kehabisan tenaga. Kamu masih di awal karier, ketika atasan dan rekan kerja jauh lebih pengertian kepada ibu baru; tak ada yang menghitung-hitung soal cuti. Orang tuamu juga masih cukup muda dan sehat untuk membantu merawat bayi. Tunggu sampai tiga puluh lima, dan ketiga keuntungan itu hilang semua.

  Kembali ke awal. Perempuan ini melahirkan saat libur musim dingin, tanpa menghentikan studinya, dengan tenang dan tak terburu-buru. Dia menyelesaikan bagian paling berat dari jadwal hidup sementara orang lain masih berdebat soal kapan waktu yang tepat.

  Apa artinya berpikir jernih? Menyadari bahwa ada hal yang tak bisa dihindari, dan melakukannya selagi biayanya masih rendah. Dia menghitungnya lebih jeli daripada siapa pun.
