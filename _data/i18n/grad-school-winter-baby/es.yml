title: "Por qué una estudiante de posgrado china programó su embarazo para las vacaciones de invierno — y por qué acertó"
description: "Una estudiante de posgrado en China planeó dar a luz durante las vacaciones de invierno. Internet la tachó de temeraria. Yo creo que calculó mejor el momento que nadie."
body: |
  En China corre la historia de una estudiante de posgrado —la etapa de estudios que sigue a la licenciatura— que calculó su embarazo para dar a luz durante las vacaciones de invierno. Las universidades chinas cierran varias semanas entre enero y febrero, y ella apuntó deliberadamente a ese periodo.

  La sección de comentarios se incendió. Unos la tacharon de inconsciente —todavía estudiante y ya madre—. Otros dijeron que había descubierto algo.

  Mi lectura: es la persona más lúcida de todos.

  Muchos dicen en la veintena que nunca tendrán hijos. DINK —double income, no kids, es decir, dos sueldos y ningún hijo—. A los veinticinco años, el dinero es tuyo y el tiempo es tuyo, y un niño parece justo lo que vendría a arruinarlo todo.

  Pero la gente cambia en la treintena y la cuarentena. Los amigos empiezan a tener hijos. Sus casas suenan y rebosan vida. En cambio, el hogar DINK se queda en silencio. Viajar y comer bien dejan de llenar el vacío. Lo que uno acaba deseando es un niño corriendo de un lado a otro.

  Y para entonces el calendario se le ha puesto en contra. El cuerpo ya no responde como antes. La carrera alcanza su momento más exigente justo cuando se acerca la fecha del parto. No puedes concentrarte en el trabajo sin sentir que descuidas al niño, ni concentrarte en el niño sin ver cómo tu carrera se resbala.

  Para las mujeres, dar a luz tarde tiene un precio más alto. Algunas acaban abandonando por completo su carrera.

  Casi todo el mundo acaba criando hijos, tarde o temprano. Si ese es tu destino, hacerlo antes es la mejor opción.

  ¿Qué gana uno al hacerlo antes? Eres más joven: el cuerpo aguanta, tienes energía y cuidar de un bebé no te deja agotado. Estás al principio de tu carrera, cuando jefes y compañeros son mucho más comprensivos con una madre recién estrenada; nadie lleva la cuenta de los días libres. Y tus propios padres todavía son lo bastante jóvenes y sanos para echar una mano con el bebé. Espera a los treinta y cinco y esas tres ventajas desaparecen.

  Volvamos al principio. Esta mujer dio a luz durante las vacaciones de invierno, sin interrumpir sus estudios, con calma y sin prisas. Se quitó de encima la parte más difícil del calendario vital mientras los demás seguían debatiendo cuándo sería el momento adecuado.

  ¿Qué significa ser lúcido? Saber que hay cosas que no se pueden evitar y hacerlas mientras el coste todavía es bajo. Ella hizo mejor las cuentas que nadie.
