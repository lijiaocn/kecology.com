title: "Warum eine chinesische Studentin im Aufbaustudium ihre Schwangerschaft auf die Winterferien geplant hat — und warum das klug war"
description: "Eine Studentin im Aufbaustudium in China wollte während der Winterferien entbinden. Das Internet nannte es unverantwortlich. Ich finde, sie hat den Zeitpunkt besser berechnet als alle anderen."
image: /assets/img/blog/grad-school-winter-baby/grad-school-baby-cover.jpg

body: |
  In China geht gerade eine Geschichte herum: Eine Studentin im Aufbaustudium — in China die Studienphase nach dem Bachelor — hat ihre Schwangerschaft so geplant, dass sie in den Winterferien entbindet. Die chinesischen Universitäten machen rund um Januar und Februar mehrere Wochen zu, und genau dieses Zeitfenster hatte sie im Blick.

  Die Kommentarspalte explodierte. Manche nannten sie dumm – noch Studentin, schon Mutter –, andere sagten, sie habe etwas durchschaut.

  Meine Meinung: Sie ist die Klügste von allen.

  Viele sagen in ihren Zwanzigern, dass sie nie Kinder wollen. DINK – double income, no kids, auf Deutsch zwei Einkommen, keine Kinder. Mit fünfundzwanzig gehört das Geld einem selbst, die Zeit gehört einem selbst, und ein Kind wirkt genau wie das, was alles kaputt macht.

  Aber Menschen verändern sich in den Dreißigern und Vierzigern. Freunde bekommen Kinder. Bei ihnen zu Hause ist es laut und voller Leben. Der DINK-Haushalt wird derweil stiller. Reisen und gutes Essen füllen die Lücke nicht mehr. Was man dann tatsächlich will, ist ein Kind, das einem zwischen den Füßen herumläuft.

  Und dann ist der Zeitpunkt gegen sie gekippt. Der Körper gehorcht nicht mehr wie früher. Der Karriereweg wird genau dann am forderndsten, wenn der Geburtstermin näher rückt. Man kann sich nicht auf die Arbeit konzentrieren, ohne das Gefühl zu haben, das Kind zu vernachlässigen, und nicht auf das Kind, ohne zuzusehen, wie die Karriere abrutscht.

  Für Frauen hat eine späte Geburt einen höheren Preis. Manche geben am Ende ihre Karriere ganz auf.

  Die meisten Menschen ziehen früher oder später doch Kinder groß. Wenn das dein Weg ist, ist es besser, es früher zu tun.

  Was bringt es, früher dran zu sein? Man ist jünger – der Körper hält mit, man hat Energie, und die Kinderbetreuung zehrt nicht aus. Man steht noch am Anfang der Karriere, wo Chefinnen und Chefs sowie Kolleginnen und Kollegen einer jungen Mutter gegenüber viel nachsichtiger sind; niemand zählt die Tage der Abwesenheit. Und die eigenen Eltern sind noch jung und gesund genug, um mit dem Baby zu helfen. Warte bis fünfunddreißig, und alle drei Vorteile sind weg.

  Zurück zum Anfang. Diese Frau hat in den Winterferien entbunden, ohne ihr Studium zu unterbrechen, ruhig und ohne Hast. Sie hat den schwierigsten Teil des Lebensplans abgehakt, während alle anderen noch darüber diskutierten, wann der richtige Zeitpunkt sei.

  Was heißt klar denken? Zu wissen, dass sich manches nicht vermeiden lässt, und es zu tun, solange der Preis noch niedrig ist. Sie hat besser gerechnet als jeder andere.
