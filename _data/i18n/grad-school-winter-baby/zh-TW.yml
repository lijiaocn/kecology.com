title: "中國一位研究生算好時間趕在寒假生子，為什麼說她才是清醒的那個"
description: "一位中國研究生打算在寒假裡生孩子。網上說她太冒險。可我覺得，這個時間她算得比誰都準。"
image: /assets/img/blog/grad-school-winter-baby/grad-school-baby-cover.jpg

body: |
  最近中國流傳著一件事：一位在讀研究生算好了懷孕時間，讓自己趕在寒假裡生孩子。中國高校在一二月會放好幾週寒假，她就是衝著這段時間安排的。

  評論區炸開了鍋。有人說她傻，還是學生就當了媽。也有人說她想明白了。

  我的看法是，她才是最清醒的那個。

  很多人二十幾歲就放話，說這輩子不生孩子。DINK（double income, no kids），說白了就是兩個人賺錢、不養孩子。二十五歲上下，錢歸自己支配，時間也歸自己，孩子看著就是那個要把這一切攪亂的東西。

  可人到了三四十歲會變。朋友們陸續有了孩子，家裡熱熱鬧鬧。DINK 的家卻越來越安靜。旅行和美食填不滿那個空缺了。這時候心裡真正想要的，是個在腳邊跑來跑去的孩子。

  可到了這時候，時間已經不站在他們這邊。身體不像從前那麼配合。預產期愈來愈近，偏偏事業也正到了最吃勁的時候。專心工作，又覺得虧欠了孩子；守著孩子，眼睜睜看著事業往下掉。

  對女人來說，晚生孩子的代價更重。有些人最後乾脆放棄了事業。

  大多數人最後遲早都會養孩子。既然終究要走這一步，早點生是更划算的選擇。

  早生到底划算在哪？你更年輕，身體扛得住，精力也夠，帶孩子不會把人掏空。事業才剛起步，上司和同事對新媽媽寬容得多，也沒人拿你的請假說事。加上你自己的父母還年輕、身體也好，能幫著搭把手帶孩子。等到三十五歲，這三樣好處全沒了。

  回到開頭。這位研究生在寒假裡生了孩子，沒耽誤學業，不慌不忙。別人還在爭論什麼時候才是合適的時機，她已經把人生裡最難安排的那一段提前辦完了。

  什麼叫清醒？就是明白有些事躲不掉，趁代價還小的時候把它做了。這筆帳，她算得比誰都清楚。
