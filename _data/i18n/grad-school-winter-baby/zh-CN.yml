title: "中国一位研究生算好时间赶在寒假生子，为什么说她才是清醒的那个"
description: "一位中国研究生打算在寒假里生孩子。网上说她太冒险。可我觉得，这个时间她算得比谁都准。"
image: /assets/img/blog/grad-school-winter-baby/grad-school-baby-cover.jpg

body: |
  最近中国流传着一件事：一位在读研究生算好了怀孕时间，让自己赶在寒假里生孩子。中国高校在一二月会放好几周寒假，她就是冲着这段时间安排的。

  评论区炸开了锅。有人说她傻，还是学生就当了妈。也有人说她想明白了。

  我的看法是，她才是最清醒的那个。

  很多人二十几岁就放话，说自己这辈子不生孩子。DINK（double income, no kids），说白了就是两个人挣钱、不养孩子。二十五岁上下，钱归自己支配，时间也归自己，孩子看着就是那个要把这一切搅乱的东西。

  可人到了三四十岁会变。朋友们陆续有了孩子，家里热热闹闹。DINK 的家却越来越安静。旅行和美食填不满那个空缺了。这时候心里真正想要的，是个在脚边跑来跑去的孩子。

  可到了这时候，时间已经不站在他们这边。身体不像从前那么配合。预产期越来越近，偏偏事业也正到了最吃劲的时候。专心工作，又觉得亏欠了孩子；守着孩子，眼看着事业往下掉。

  对女人来说，晚生孩子的代价更重。有些人最后干脆放弃了事业。

  大多数人最后迟早都会养孩子。既然终究要走这一步，早点生是更划算的选择。

  早生到底划算在哪？你更年轻，身体扛得住，精力也够，带孩子不会把人掏空。事业才刚起步，上司和同事对新妈妈宽容得多，也没人拿你的请假说事。加上你自己的父母还年轻、身体也好，能帮着搭把手带孩子。等到三十五岁，这三样好处全没了。

  回到开头。这位研究生在寒假里生了孩子，没耽误学业，不慌不忙。别人还在争论什么时候才是合适的时机，她已经把人生里最难安排的那一段提前办完了。

  什么叫清醒？就是明白有些事躲不掉，趁代价还小的时候把它做了。这笔账，她算得比谁都清楚。
