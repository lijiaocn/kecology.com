title: "Pourquoi une étudiante chinoise de troisième cycle a programmé sa grossesse pendant les vacances d’hiver — et pourquoi c’était judicieux"
description: "Une étudiante de troisième cycle en Chine avait prévu d’accoucher pendant les vacances d’hiver. Internet l’a traitée d’irresponsable. Moi, je trouve qu’elle a mieux calculé son moment que personne."
image: /assets/img/blog/grad-school-winter-baby/grad-school-baby-cover.jpg

body: |
  Une histoire circule en Chine : une étudiante de troisième cycle — ces études supérieures qui suivent la licence dans le pays — a calculé sa grossesse pour accoucher pendant les vacances d’hiver. Les universités chinoises ferment plusieurs semaines autour de janvier et février, et elle a visé cette fenêtre exprès.

  Les commentaires se sont enflammés. Certains l’ont traitée de folle (encore étudiante et déjà mère) ; d’autres ont dit qu’elle avait compris quelque chose.

  Mon avis : c’est elle, la plus lucide.

  Beaucoup de gens déclarent dans la vingtaine qu’ils n’auront jamais d’enfants. DINK — de l’anglais double income, no kids, deux revenus et aucun enfant —. À vingt-cinq ans, l’argent est à vous, le temps est à vous, et un enfant semble précisément ce qui viendrait tout gâcher.

  Mais les gens changent dans la trentaine et la quarantaine. Les amis commencent à avoir des enfants. Leurs maisons sont bruyantes et pleines de vie. Le foyer DINK, lui, devient plus silencieux. Voyager et bien manger ne comblent plus le vide. Ce qu’on se surprend à vouloir, c’est un enfant qui court partout sous nos pieds.

  Et là, le calendrier s’est retourné contre eux. Leur corps ne coopère plus comme avant. La carrière devient la plus exigeante au moment exact où la date de l’accouchement approche. On ne peut pas se concentrer sur le travail sans avoir l’impression de négliger l’enfant, ni sur l’enfant sans voir sa carrière glisser.

  Pour les femmes, accoucher tard se paie plus cher. Certaines finissent par abandonner complètement leur carrière.

  La plupart des gens finissent par élever des enfants, tôt ou tard. Si c’est là que vous allez, s’y prendre tôt est le meilleur choix.

  Qu’est-ce que ça apporte, de s’y prendre tôt ? Vous êtes plus jeune : votre corps tient bon, vous avez de l’énergie, et garder un bébé ne vous épuise pas. Vous êtes au début de votre carrière, quand patrons et collègues sont bien plus indulgents envers une jeune maman ; personne ne tient le compte des jours d’absence. Et vos propres parents sont encore assez jeunes et en bonne santé pour aider avec le bébé. Attendez trente-cinq ans et ces trois avantages disparaissent.

  Revenons au début. Cette femme a accouché pendant les vacances d’hiver, sans interrompre ses études, avec calme et sans se presser. Elle a réglé la partie la plus difficile de l’emploi du temps d’une vie pendant que les autres débattaient encore du bon moment.

  Être lucide, qu’est-ce que ça veut dire ? Savoir que certaines choses ne s’évitent pas, et les faire pendant que le coût est encore faible. Elle a fait le calcul mieux que personne.
