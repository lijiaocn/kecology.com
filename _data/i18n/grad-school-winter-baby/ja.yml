title: "中国人の大学院生が冬休みに出産を合わせたのはなぜか——そして、なぜそれが賢明だったのか"
description: "中国人の大学院生が冬休みに出産する予定を立てた。ネットは無謀だと騒いだが、彼女は誰よりも上手にタイミングを読んでいたと思う。"
image: /assets/img/blog/grad-school-winter-baby/grad-school-baby-cover.jpg

body: |
  中国でこんな話が広がっている。大学院生の女性が、冬休み（1〜2月、中国の大学の長期休暇）に出産できるよう、妊娠のタイミングを計ったという。中国の大学は1月から2月にかけて数週間休みになる。彼女はその時期をあえて狙ったのだ。

  ネットのコメント欄は騒然とした。「学生なのに、もう母親か」と嘲る声もあれば、「何かを見抜いたのでは」という声もある。

  私の見立てでは、彼女がいちばん冷静な判断をしている。

  二十代で「子どもは作らない」と宣言する人は多い。DINK（double income, no kids、つまり共働きで子どものいない夫婦）だ。二十五歳くらいなら、金も時間も自分のものだ。子どもは、その自由を台無しにするものに見える。

  だが、三十代、四十代になると人は変わる。周囲が子どもを持ち始める。その家はにぎやかで活気に満ちている。一方、DINKの家庭は静かになっていく。旅行も美食も、その穴を埋められなくなる。気づけば、足元を走り回る子どもが欲しくなっている。

  そのころには、タイミングも味方しない。体は昔ほど言うことをきかない。出産予定日が近づくころには、仕事がいちばん忙しくなる。仕事に集中すれば子どもをないがしろにしている気がする。子どもに目を向ければ、キャリアがすり減っていくのがわかる。

  女性にとって、遅い出産は代償が重い。仕事を完全にやめてしまう人もいる。

  たいていの人は、遅かれ早かれ子どもを育てることになる。もしそうなるのなら、早いうちに済ませたほうがいい。

  早めると何がいいのか。若ければ、体が持つ。体力がある。子育てに疲れ切ることもない。キャリアのスタート地点なら、上司も同僚も新米の母親に寛容だ。休んだことなんて誰も数えていない。自分の親もまだ若く健康で、赤ちゃんの世話を手伝ってくれる。三十五歳まで待てば、この三つの強みはすべて消えている。

  冒頭に戻ろう。彼女は冬休みに、学業を中断することなく、落ち着いて出産した。ほかの者たちが「適切な時期はいつか」と議論している間に、彼女は人生のスケジュールで一番きつい部分を片付けてしまったのだ。

  冷静さとは何か。避けられないことを、代償がまだ小さいうちにやってしまうことだ。彼女は誰よりも上手に計算した。
