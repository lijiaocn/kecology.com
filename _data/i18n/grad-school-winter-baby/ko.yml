title: "중국 대학원생이 임신을 겨울방학에 맞춘 이유, 그리고 그것이 현명한 선택인 이유"
description: "중국의 한 대학원생이 겨울방학에 아이를 낳기로 했습니다. 인터넷은 무모하다고 했지만, 저는 그녀가 시기를 누구보다 정확하게 계산했다고 생각합니다."
image: /assets/img/blog/grad-school-winter-baby/grad-school-baby-cover.jpg

body: |
  중국에서 요즘 화제인 이야기가 있습니다. 대학원에 다니는 한 여성이 임신 시기를 조절해 겨울방학에 아이를 낳으려고 했다는 것입니다. 중국 대학은 1월과 2월에 몇 주간 겨울방학으로 문을 닫는데, 그녀는 바로 그 시기를 노린 것이었습니다.

  댓글란이 들끓었습니다. 어떤 사람들은 아직 학생인데 벌써 엄마가 된다며 바보 같다고 했고, 또 어떤 사람들은 그녀가 뭔가를 꿰뚫어 본 것이라고 했습니다.

  제 생각은 다릅니다. 오히려 그녀가 가장 이성적인 사람입니다.

  20대에 아이를 낳지 않겠다고 선언하는 사람이 많습니다. DINK(double income, no kids), 즉 맞벌이에 자녀는 없는 생활입니다. 스물다섯 무렵에는 돈도 내 맘대로, 시간도 내 맘대로인데, 아이는 그 모든 것을 망쳐 놓을 존재로 보입니다.

  하지만 사람은 30대와 40대에 달라집니다. 친구들이 하나둘 아이를 낳습니다. 그네 집은 시끌시끌하고 생기가 넘칩니다. 반면 DINK 가정은 점점 조용해집니다. 여행과 맛있는 음식도 그 빈자리를 채우지 못합니다. 사람들이 정말 원하게 되는 것은 발밑을 돌아다니는 아이입니다.

  그런데 그때쯤엔 시기가 오히려 등을 돌립니다. 몸이 예전처럼 따라주지 않습니다. 출산 예정일이 다가올수록 일은 가장 많은 걸 요구합니다. 일에 집중하면 아이를 소홀히 하는 것 같고, 아이에게 집중하면 커리어가 미끄러지는 걸 지켜봐야 합니다.

  여성에게 늦은 출산은 더 큰 대가를 요구합니다. 어떤 이는 결국 커리어를 완전히 포기합니다.

  대부분의 사람은 결국 늦든 빠르든 아이를 키우게 됩니다. 그 길로 가고 있다면, 이르게 하는 편이 더 나은 선택입니다.

  일찍 낳으면 무엇이 좋을까요? 나이가 젊어 몸이 이를 견디고 기력도 있습니다. 아이를 키워도 녹초가 되지 않습니다. 커리어가 이제 막 시작된 단계라 상사와 동료들이 갓 출산한 엄마에게 훨씬 너그럽고, 휴가에 대해 눈치 보는 사람도 없습니다. 게다가 부모님도 아직 젊고 건강해 육아를 도와줄 수 있습니다. 35세까지 미루면 이 세 가지 이점이 모두 사라집니다.

  처음으로 돌아가 보겠습니다. 이 여성은 겨울방학에 아이를 낳았고, 학업을 중단하지도 않았습니다. 느긋하고 여유로웠습니다. 다른 사람들이 아직 적절한 시점이 언제인지 논쟁하는 동안, 그녀는 인생에서 가장 어려운 일정을 이미 처리해 버렸습니다.

  이성적이라는 건 무엇일까요? 피할 수 없는 일이 있다는 걸 알고, 대가가 아직 작을 때 그 일을 해치우는 것입니다. 그녀는 그 계산을 누구보다 잘했습니다.
