title: "Çinli bir yüksek lisans öğrencisi hamileliğini kış tatiline nasıl denk getirdi — ve bu neden akıllıcaydı"
description: "Çin'de bir yüksek lisans öğrencisi doğumunu kış tatilinde yapmayı planladı. İnternet onu sorumsuz ilan etti. Bense zamanlamayı herkesten iyi yaptığını düşünüyorum."
image: /assets/img/blog/grad-school-winter-baby/grad-school-baby-cover.jpg

body: |
  Çin'de şu günlerde bir hikâye dolaşıyor: lisansüstü eğitim gören bir kadın, hamileliğini kış tatilinde doğum yapacak şekilde ayarlamış. Çin üniversiteleri ocak ve şubat aylarında birkaç hafta boyunca kapanıyor; o da tam olarak bu pencereyi hedeflemiş.

  Yorumlar alevlendi. Kimisi ona aptal dedi — daha öğrenci, hem de anne olmuş. Kimisi de bir şeyi çözdüğünü söyledi.

  Benim görüşüme göre, kafası en açık olan o.

  Yirmili yaşlarında pek çok insan çocuk sahibi olmayacağını ilan eder. DINK — İngilizce double income, no kids, yani «çift gelir, çocuksuz». Yirmi beş yaşındayken paran da senin, zamanın da senin; çocuk da bütün bunları mahvedecek şey gibi görünür.

  Ama insan otuzlu ve kırklı yaşlarında değişir. Arkadaşlar çocuk yapmaya başlar; evleri gürültülü ve hayat doludur. DINK çiftinin eviyse giderek sessizleşir. Seyahat ve iyi yemek artık boşluğu doldurmaz. İnsanın içinden geçen, ayak altında koşuşturan bir çocuk ister.

  O zamana kadar da zaman onlara karşı dönmüştür. Bedenleri eskisi gibi işbirliği yapmaz. Kariyer, tam doğum tarihi yaklaşırken en zorlu noktasındadır. İşe odaklanamazsın, çocuğunu ihmal ettiğini hissedersin; çocuğa odaklanamazsın, kariyerinin kaydığını görürsün.

  Kadınlar için geç doğumun bedeli daha ağırdır. Kimileri sonunda kariyerinden tamamen vazgeçer.

  Çoğu insan sonunda er ya da geç çocuk büyütür. Eğer yönün buysa, bunu erken yapmak daha iyi bir tercih.

  Erken olmak ne kazandırır? Daha gençsindir — bedenin dayanır, enerjin var, çocuk bakımı seni tüketmez. Kariyerinin henüz başındasın; patronlar ve iş arkadaşları yeni anneye karşı çok daha hoşgörülüdür, kimse izin günlerini tutmaz. Kendi anne-baban da hâlâ genç ve yardımcı olacak kadar sağlıklıdır. Otuz beşi beklersen, bu üç avantajın hepsi de kaybolur.

  Başa dönelim. Bu kadın kış tatilinde, eğitimini kesmeden, sakin ve acele etmeden doğum yaptı. Hayatın en zor maddesini, herkes hâlâ doğru zamanın ne zaman olduğunu tartışırken halletti.

  Kafası açık olmak ne demek? Bazı şeylerin kaçınılmaz olduğunu bilmek ve onları bedeli hâlâ düşükken yapmak. Hesabı herkesten iyi yaptı.
