title: "ทำไมนักศึกษาระดับบัณฑิตศึกษาชาวจีนจึงจับจังหวะตั้งครรภ์ให้คลอดในช่วงปิดเทอมหนาว — และทำไมถึงเป็นเรื่องฉลาด"
description: "นักศึกษาระดับบัณฑิตศึกษาคนหนึ่งในจีนวางแผนคลอดลูกในช่วงปิดเทอมหนาว คนในอินเทอร์เน็ตบอกว่าเธอเสี่ยงเกินไป แต่ฉันคิดว่าเธอคำนวณจังหวะได้ดีกว่าใครทั้งหมด"
body: |
  มีเรื่องเล่ากำลังแพร่กระจายในจีน: หญิงสาวคนหนึ่งที่กำลังเรียนระดับบัณฑิตศึกษา จับจังหวะตั้งครรภ์ให้ตัวเองคลอดลูกในช่วงปิดเทอมหนาว มหาวิทยาลัยจีนปิดการเรียนการสอนหลายสัปดาห์รอบเดือนมกราคมถึงกุมภาพันธ์ และเธอตั้งใจเล็งช่วงเวลานั้นไว้ล่วงหน้า

  ช่องคอมเมนต์เดือดขึ้นมาทันที บางคนว่าเธอโง่ — เป็นนักศึกษาอยู่ก็กลายเป็นแม่แล้ว บางคนก็บอกว่าเธอคงเห็นอะไรบางอย่างที่คนอื่นไม่เห็น

  สำหรับฉันแล้ว เธอคือคนที่คิดอย่างมีสติที่สุด

  คนจำนวนไม่น้อยในวัยยี่สิบประกาศว่าจะไม่มีลูกเลย DINK — double income, no kids หรือครอบครัวที่ทำงานสองคน มีรายได้สองทาง แต่ไม่มีลูก ตอนอายุยี่สิบห้า เงินก็เป็นของเรา เวลาก็เป็นของเรา เด็กกลายเป็นสิ่งที่ดูจะทำลายอิสระทั้งหมดนั้น

  แต่คนเปลี่ยนไปในวัยสามสิบ สี่สิบ เพื่อนๆ เริ่มมีลูก บ้านของเขาเสียงดังและมีชีวิตชีวา ขณะที่ครอบครัว DINK กลับเงียบลงเรื่อยๆ การเที่ยวและอาหารอร่อยไม่สามารถเติมเต็มช่องว่างนั้นได้อีกแล้ว สิ่งที่พวกเขาอยากได้ตอนนี้คือเด็กที่วิ่งเล่นอยู่ใต้เท้า

  และตอนนั้นจังหวะก็หันมาขัดขวางพวกเขาแล้ว ร่างกายไม่ได้ช่วยเหลือเหมือนเมื่อก่อน อาชีพการงานก็เรียกร้องมากที่สุดตอนที่วันคลอดกำลังใกล้เข้ามา คุณไม่มีทางโฟกัสงานได้โดยไม่รู้สึกว่ากำลังละเลยลูก ไม่มีทางโฟกัสลูกได้โดยไม่เห็นอาชีพของตัวเองถอยหลัง

  สำหรับผู้หญิง การคลอดลูกช้ามีราคาที่หนักกว่า บางคนต้องละทิ้งอาชีพไปเลย

  คนส่วนใหญ่ก็จะเลี้ยงลูกอยู่ดี ช้าหรือเร็วก็ตาม ถ้านั่นคือสิ่งที่คุณกำลังมุ่งไป การทำให้เร็วกว่านี้คือทางเลือกที่ดีกว่า

  เร็วกว่าได้อะไร? คุณยังเด็ก — ร่างกายยังรับไหว มีพลังงาน และการเลี้ยงเด็กไม่ทำให้คุณหมดแรง คุณยังอยู่ในช่วงเริ่มต้นอาชีพ ที่หัวหน้าและเพื่อนร่วมงานเข้าใจแม่ใหม่ได้มากกว่า ไม่มีใครจดจำเรื่องลา และพ่อแม่ของคุณเองก็ยังเด็กและแข็งแรงพอที่จะช่วยเลี้ยงลูก รอจนถึงสามสิบห้าปี ข้อได้เปรียบทั้งสามอย่างนั้นจะหายไปหมด

  กลับมาที่เรื่องตอนต้น หญิงสาวคนนี้คลอดในช่วงปิดเทอมหนาว โดยไม่ต้องหยุดการเรียน และทำอย่างสงบไม่เร่งรีบ เธอจัดการส่วนที่ยากที่สุดของตารางชีวิตเสร็จไปแล้ว ในขณะที่คนอื่นยังถกเถียงกันอยู่ว่าช่วงเวลาที่เหมาะสมคือตอนไหน

  ความมีสติคืออะไร? คือการรู้ว่าบางสิ่งหลีกเลี่ยงไม่ได้ แล้วทำมันตอนที่ต้นทุนยังต่ำอยู่ เธอคำนวณได้แม่นยำกว่าใครทั้งหมด
