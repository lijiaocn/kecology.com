title: "Why a Chinese Grad Student Timed Her Pregnancy for Winter Break — and Why That's Smart"
description: "A graduate student in China planned to give birth during the winter holiday. The internet called it reckless. I think she worked out the timing better than anyone."
image: /assets/img/blog/grad-school-winter-baby/grad-school-baby-cover.jpg

body: |
  A story is making the rounds in China: a woman in graduate school timed her pregnancy so that she would give birth during the winter break. Chinese universities shut down for several weeks around January and February, and she aimed for that window on purpose.

  The comments section lit up. Some called her foolish — still a student, already a mother. Others said she had figured something out.

  Here's my take: she's the clear-headed one.

  Plenty of people declare in their twenties that they'll never have children. DINK — double income, no kids. At twenty-five or so, your money is your own and your time is your own, and a child looks like the thing that would wreck all of that.

  But people change in their thirties and forties. Friends start having kids. Their homes are loud and full of life. The DINK household, meanwhile, gets quieter. Travel and good food stop filling the gap. What people find themselves wanting is a child running around underfoot.

  And by then the timing has turned against them. Their bodies don't cooperate the way they used to. Careers are at their most demanding just as the due date approaches. You can't focus on work without feeling you're neglecting a child; you can't focus on the child without watching your career slip.

  For women, late childbirth carries the heavier price. Some end up giving up their careers altogether.

  Most people do end up raising children sooner or later. If that's where you're headed, doing it earlier is the better choice.

  What does early buy you? You're younger — your body holds up, you have the energy, and childcare doesn't wipe you out. You're still at the start of your career, when bosses and colleagues are far more forgiving of a new mother; nobody is keeping score about time off. And your own parents are still young and healthy enough to help with the baby. Wait until thirty-five and all three of those advantages are gone.

  Back to the beginning. This woman gave birth during the winter break, without interrupting her studies, calm and unhurried. She cleared the hardest part of life's schedule while everyone else was still debating when the right moment would be.

  What does clear-headed mean? Knowing that some things can't be avoided, and doing them while the cost is still low. She did the arithmetic better than anyone.
