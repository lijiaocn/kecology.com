title: "Почему китайская аспирантка запланировала роды на зимние каникулы — и почему это было умно"
description: "Китайская аспирантка запланировала роды на зимние каникулы. В интернете её назвали безрассудной. Я же думаю, что она рассчитала сроки лучше всех."
body: |
  В Китае сейчас обсуждают такую историю: студентка аспирантуры запланировала беременность так, чтобы родить в период зимних каникул. Китайские вузы закрываются на несколько недель в январе–феврале, и она намеренно целилась именно в это окно.

  Комментарии взорвались. Одни называли её глупой — ещё студентка, уже мать. Другие говорили, что она поняла что-то такое, чего другие не видят.

  А по-моему, именно она — самая рассудительная.

  Многие в двадцать лет заявляют, что никогда не будут иметь детей. DINK — double income, no kids, по-русски «два дохода, без детей». В двадцать пять с небольшим деньги твои и время твоё, а ребёнок кажется тем самым, что всё это разрушит.

  Но в тридцать и сорок лет люди меняются. У друзей появляются дети, их дома шумные и полные жизни. А квартира «динков» между тем становится всё тише. Путешествия и хорошая еда больше не заполняют эту пустоту. И в конце концов хочется ребёнка, который бегает под ногами.

  А к тому времени сроки уже против них. Тело не слушается, как раньше. Карьера требует максимума как раз тогда, когда приближается дата родов. Не можешь сосредоточиться на работе — и чувствуешь, что запускаешь ребёнка; не можешь сосредоточиться на ребёнке — и видишь, как карьера уходит вниз.

  Для женщин поздние роды обходятся дороже. Некоторые в итоге совсем уходят из профессии.

  Большинство всё равно рано или поздно становятся родителями. Если ты идёшь именно к этому, лучше сделать это раньше.

  Что даёт ранний возраст? Ты моложе: тело выдерживает, энергии хватает, и уход за ребёнком тебя не добивает. Ты только в начале карьеры, когда начальство и коллеги куда снисходительнее к молодой матери; никто не считает, сколько ты пропустила. И твои собственные родители ещё молоды и здоровы настолько, чтобы помочь с малышом. Подожди до тридцати пяти — и все три преимущества исчезнут.

  Вернёмся к началу. Эта девушка родила в зимние каникулы, не прервав учёбу, спокойно и без спешки. Она разобралась с самым трудным пунктом в расписании жизни, пока все остальные ещё спорили, когда же наступит подходящий момент.

  Что значит быть рассудительной? Знать, что некоторые вещи неизбежны, и делать их, пока цена ещё невысока. Она посчитала лучше всех.
