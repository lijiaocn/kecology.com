title: "Vì sao một nữ sinh cao học Trung Quốc tính thời điểm mang thai để sinh đúng vào kỳ nghỉ đông — và vì sao điều đó lại thông minh"
description: "Một nữ sinh cao học ở Trung Quốc đã lên kế hoạch sinh con vào kỳ nghỉ đông. Cư dân mạng gọi đó là liều lĩnh. Tôi thì nghĩ cô ấy tính toán thời điểm tốt hơn ai hết."
image: /assets/img/blog/grad-school-winter-baby/grad-school-baby-cover.jpg

body: |
  Một câu chuyện đang lan truyền ở Trung Quốc: một phụ nữ đang học cao học đã tính thời điểm mang thai để sinh con đúng vào kỳ nghỉ đông. Các trường đại học Trung Quốc nghỉ vài tuần vào khoảng tháng 1 và tháng 2, và cô ấy cố tình nhắm đúng khung thời gian đó.

  Phần bình luận sôi lên. Người thì chê cô dại — còn là sinh viên đã làm mẹ. Người thì bảo cô đã tìm ra được điều gì đó.

  Theo tôi, cô ấy mới là người sáng suốt nhất.

  Nhiều người ở tuổi hai mươi tuyên bố sẽ không bao giờ sinh con. DINK — double income, no kids, tức cặp đôi hai thu nhập không con. Ở tuổi hai mươi lăm, tiền là của mình, thời gian là của mình, và đứa trẻ trông như thứ sẽ phá hỏng tất cả những điều ấy.

  Nhưng rồi người ta thay đổi ở tuổi ba mươi, bốn mươi. Bạn bè bắt đầu sinh con. Nhà họ ồn ào và đầy sức sống. Trong khi đó, gia đình DINK lại càng yên tĩnh. Du lịch và những bữa ngon không còn lấp được chỗ trống ấy. Điều người ta thấy mình muốn lúc này là một đứa trẻ chạy loạn dưới chân.

  Và đến lúc đó, thời gian lại chống lại họ. Cơ thể không còn nghe lời như xưa. Sự nghiệp lại đòi hỏi nhiều nhất đúng vào lúc ngày dự sinh đến gần. Bạn không thể tập trung vào công việc mà không thấy mình bỏ bê con; không thể tập trung vào con mà không thấy sự nghiệp của mình tuột đi.

  Với phụ nữ, sinh muộn mang cái giá nặng hơn. Có người cuối cùng phải bỏ hẳn sự nghiệp.

  Đa số rồi cũng sẽ nuôi con, sớm hay muộn. Nếu đó là hướng bạn đang đi, làm sớm hơn là lựa chọn tốt hơn.

  Sớm mang lại gì? Bạn còn trẻ — cơ thể giữ được, sức lực còn đầy, và chăm con không làm bạn kiệt sức. Bạn vẫn ở giai đoạn đầu sự nghiệp, khi sếp và đồng nghiệp dễ thông cảm hơn với một người mẹ mới; chẳng ai ghi chép chuyện nghỉ phép. Cha mẹ bạn cũng vẫn còn trẻ và đủ khỏe để phụ giúp trông trẻ. Đợi đến ba mươi lăm, cả ba lợi thế ấy đều biến mất.

  Trở lại với câu chuyện ban đầu. Người phụ nữ này sinh vào kỳ nghỉ đông, không gián đoạn việc học, điềm tĩnh và không vội vã. Cô đã giải quyết xong phần khó nhất trong lịch trình cuộc đời trong khi mọi người vẫn còn đang tranh luận khi nào là thời điểm chín muồi.

  Sáng suốt là gì? Là biết rằng có những chuyện không thể tránh khỏi, và làm chúng khi cái giá vẫn còn thấp. Cô ấy tính toán tốt hơn ai hết.
