title: "Por que uma estudante chinesa de pós-graduação programou a gravidez para as férias de inverno — e por que isso foi esperto"
description: "Uma estudante de pós-graduação na China planejou dar à luz durante as férias de inverno. A internet chamou isso de imprudência. Acho que ela acertou o momento melhor do que ninguém."
body: |
  Corre uma história na China: uma estudante de pós-graduação —a etapa de estudos posteriores à graduação no país— programou a gravidez para dar à luz durante as férias de inverno. As universidades chinesas fecham por várias semanas entre janeiro e fevereiro, e ela mirou de propósito essa janela.

  A seção de comentários pegou fogo. Uns a chamaram de tola —ainda estudante e já mãe—. Outros disseram que ela tinha descoberto alguma coisa.

  A minha leitura: ela é a pessoa mais lúcida de todas.

  Muita gente diz aos vinte e poucos anos que nunca vai ter filhos. DINK —do inglês double income, no kids, dois salários e nenhum filho—. Aos vinte e cinco, o dinheiro é seu e o tempo é seu, e uma criança parece exatamente o que viria estragar tudo isso.

  Mas as pessoas mudam na casa dos trinta e dos quarenta. Os amigos começam a ter filhos. As casas deles ficam barulhentas e cheias de vida. A casa DINK, por outro lado, fica mais silenciosa. Viagens e boa comida param de preencher o vazio. O que a pessoa passa a querer é uma criança correndo por toda parte.

  E aí o tempo já virou contra ela. O corpo não responde como antes. A carreira chega ao seu momento mais exigente justo quando a data do parto se aproxima. Você não consegue focar no trabalho sem sentir que negligencia a criança, nem focar na criança sem ver a carreira escorregar.

  Para as mulheres, ter filhos tarde cobra um preço mais alto. Algumas acabam abandonando a carreira por completo.

  Quase todo mundo acaba criando filhos, mais cedo ou mais tarde. Se é para lá que você vai, fazer isso antes é a escolha melhor.

  O que você ganha ao fazer antes? É mais jovem: o corpo aguenta, você tem energia e cuidar do bebê não te esgota. Está no começo da carreira, quando chefes e colegas são muito mais compreensivos com uma mãe de primeira viagem; ninguém fica contando os dias de folga. E seus próprios pais ainda são jovens e saudáveis o suficiente para ajudar com o bebê. Espere até os trinta e cinco e essas três vantagens somem.

  Voltando ao começo. Esta mulher deu à luz durante as férias de inverno, sem interromper os estudos, com calma e sem pressa. Ela resolveu a parte mais difícil do cronograma da vida enquanto todo mundo ainda discutia qual seria o momento certo.

  O que significa ser lúcido? Saber que certas coisas não podem ser evitadas e fazê-las enquanto o custo ainda é baixo. Ela fez as contas melhor do que ninguém.
