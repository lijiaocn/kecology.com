title: "Perché una studentessa cinese di laurea magistrale ha programmato la gravidanza per le vacanze invernali — e perché è stata una scelta intelligente"
description: "Una studentessa di laurea magistrale in Cina ha programmato di partorire durante le vacanze invernali. Su internet l'hanno definita avventata. Secondo me ha calcolato i tempi meglio di chiunque altro."
body: |
  In Cina sta circolando una storia: una studentessa di un corso di laurea magistrale ha programmato la gravidanza per partorire proprio durante le vacanze invernali. Le università cinesi chiudono per qualche settimana tra gennaio e febbraio, e lei ha puntato deliberatamente a quella finestra.

  I commenti si sono infiammati. C'è chi l'ha definita sciocca — ancora studentessa e già madre — e chi, al contrario, ha riconosciuto che aveva intuito qualcosa di importante.

  Il mio parere? È lei quella che ha la testa più chiara.

  In tanti, a vent'anni, dichiarano che non avranno mai figli. DINK — dall'inglese double income, no kids, «doppio reddito, nessun figlio». A venticinque anni circa, i soldi sono tuoi e il tempo è tuo, e un bambino sembra proprio la cosa che verrà a rovinare tutto quanto.

  Ma con l'arrivo dei trenta e dei quarant'anni le persone cambiano. Gli amici cominciano ad avere figli. Le loro case diventano rumorose e piene di vita. Quella della coppia DINK, intanto, si fa sempre più silenziosa. Viaggi e buon cibo non bastano più a colmare il vuoto. Quello che si finisce per desiderare è un bambino che corre per casa.

  E a quel punto i tempi si sono rivoltati contro di loro. Il corpo non risponde più come una volta. La carriera è al suo momento più impegnativo proprio mentre si avvicina la data del parto. Non puoi concentrarti sul lavoro senza sentirti trascurare un figlio; non puoi concentrarti sul figlio senza vedere la carriera scivolare via.

  Per le donne, il prezzo di una maternità tardiva è più alto. Alcune finiscono per abbandonare del tutto la carriera.

  La maggior parte delle persone, prima o poi, finisce per avere figli. Se è la direzione in cui stai andando, farlo prima è la scelta migliore.

  Cosa ti dà il farlo presto? Sei più giovane: il corpo regge, hai energia e prenderti cura di un bambino non ti svuota. Sei ancora all'inizio della carriera, quando capi e colleghi sono molto più tolleranti con una neo-mamma; nessuno fa conto delle assenze. E i tuoi genitori sono ancora abbastanza giovani e in salute per aiutarti con il bebè. Aspetta fino a trentacinque anni e tutti e tre questi vantaggi sono spariti.

  Torniamo all'inizio. Questa ragazza ha partorito durante le vacanze invernali, senza interrompere gli studi, con calma e senza fretta. Ha liberato il punto più difficile del calendario della vita mentre tutti gli altri ancora discutevano su quando fosse il momento giusto.

  Cosa significa avere la testa chiara? Sapere che certe cose non si possono evitare e farle quando il prezzo è ancora basso. Lei ha fatto i conti meglio di chiunque altro.
