title: "لماذا خطّطت طالبة دراسات عليا صينية لحملها ليكون خلال العطلة الشتوية — ولماذا كان ذلك ذكاءً"
description: "طالبة دراسات عليا في الصين خطّطت للولادة خلال العطلة الشتوية. قال الناس على الإنترنت إنها متهورة. أما أنا فأرى أنها أحسنت التوقيت أكثر من أي أحد."
image: /assets/img/blog/grad-school-winter-baby/grad-school-baby-cover.jpg

body: |
  تتداول الصين حالياً قصة امرأة في مرحلة الدراسات العليا خطّطت لحملها بحيث تضع مولودها خلال العطلة الشتوية. فالجامعات الصينية تُعطّل دروسها لعدة أسابيع بين يناير وفبراير، في عطلة شتوية معروفة، وقد اختارت هي هذه النافذة عن قصد.

  اشتعلت زاوية التعليقات. فمنهم من اتهمها بالحماقة — ما زالت طالبة وأصبحت أماً — ومنهم من قال إنها أدركت شيئاً لا يراه الآخرون.

  أما رأيي، فهي أصفى الناس ذهناً.

  كثيرون يُعلنون في العشرينات من عمرهم أنهم لن ينجبوا أبداً. DINK — اختصار إنجليزي يعني «دخل مزدوج بلا أطفال» (double income, no kids). وفي الخامسة والعشرين تقريباً، يكون المال مالَك والوقت وقتَك، فيبدو الطفل هو الشيء الذي سيُفسد كل ذلك.

  لكن الناس يتغيرون في الثلاثينات والأربعينات. يبدأ الأصدقاء في إنجاب الأطفال، فتصبح بيوتهم صاخبة ومليئة بالحياة. أما بيت «الدينك» فيزداد هدوءاً. ولم يعد السفر والطعام الجيد يسدّان تلك الفجوة. وما يجد المرء نفسه يريده هو طفل يركض تحت قدميه.

  وبحلول ذلك الوقت يكون الوقت قد انقلب ضدهم. فأجسادهم لم تعد تستجيب كما كانت. وتصل المسيرة المهنية إلى ذروة متطلباتها تماماً مع اقتراب موعد الولادة. لا تستطيع التركيز في العمل دون أن تشعري بأنك تُهملين طفلك، ولا تستطيع التركيز في طفلك دون أن ترَي مسيرتك المهنية تتراجع.

  وعلى النساء، يقع ثقل الولادة المتأخرة أكبر. فبعضهن ينتهي بهن المطاف بالتخلي عن مهنهن تماماً.

  ومعظم الناس ينتهي بهم الأمر بتربية الأطفال عاجلاً أم آجلاً. وإذا كان هذا هو طريقك، فالقيام به مبكراً هو الخيار الأفضل.

  ماذا يمنحك التبكير؟ أنك أصغر سناً: جسدك يحتمل، ولديك الطاقة، ورعاية الطفل لا تُنهكك. وما زلت في بداية مسيرتك المهنية، حيث يكون رؤساؤك وزملاؤك أكثر تسامحاً بكثير مع أم جديدة، ولا أحد يحصي لك أيام غيابك. ووالداك ما زالا شابين بصحة جيدة بما يكفي لمساعدتك في الطفل. أما إذا انتظرت حتى الخامسة والثلاثين، فستفقدي هذه المزايا الثلاث جميعها.

  لنعد إلى البداية. هذه المرأة أنجبت خلال العطلة الشتوية، دون أن تُقاطع دراستها، بهدوء ودون عجلة. فقد أنهت أصعب بند في جدول الحياة بينما كان الجميع ما زالوا يتجادلون حول متى يكون الوقت المناسب.

  ماذا يعني أن تكون أصفى ذهناً؟ أن تعرف أن بعض الأشياء لا مفر منها، وأن تقوم بها بينما لا يزال ثمنها منخفضاً. هي أحسنت الحساب أكثر من أي أحد.
