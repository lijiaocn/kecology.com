title: "Why a Business That Can Be Won on Price Is a Bad Business: What Kweichow Moutai and Pop Mart Understand About Retail"
description: "Chinese retail keeps replacing each format with a cheaper one, and nobody makes money for long. Duan Yongping's question about business models points to a simple test: if cutting prices wins customers, the business is structurally brutal."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping, a Chinese investor and businessman whose views on investing are followed closely in China, has spent years saying the same thing: look at the business model first, and look for differentiation.

  But what actually counts as a good business model? And what counts as differentiation?

  A post on this site a few days ago described a pattern in Chinese retail: once a more efficient format appears, it flattens the previous one. Chain supermarkets flattened state-run department stores. E-commerce flattened the hypermarkets. Now instant-delivery groceries - small neighbourhood warehouses that dispatch orders within minutes - are coming for the supermarkets.

  I have been turning that over ever since, and I think I have hold of one piece of the reason.

  **A business where price wars work is not a good business.**

  Here is the logic. If cutting prices reliably wins customers in your trade, every participant has one fate: a long grind of cutting costs and raising efficiency. You either become the operator that grinds hardest, or you get ground out of the market by that operator.

  And cost and efficiency are not measured against your own past. They are measured against your competitors, every quarter, without a break. The moment a rival finds a real way to cut cost or lift efficiency, you have to match it immediately. Because once your price loses its edge, the customer is gone.

  Retail is the clearest example of a business where price works. Different companies sell largely the same goods, so the biggest thing that separates them is price. If you want more of the business, you have to find it in the price. Shoppers are intensely sensitive to it. Sell the same item for a little more and they simply leave.

  That is why retail looks like a huge, lively market and is in fact one of the hardest businesses to make money in. The efficient player destroys the inefficient one, then a more efficient player arrives and destroys that one. Nobody gets to earn good money for long.

  So what does a business where price wars do not work look like?

  Take Kweichow Moutai, the Chinese baijiu maker - baijiu is a clear spirit, and Moutai's bottles are treated as gifts and status objects, often priced at several hundred dollars or more. Another company can sell liquor far more cheaply and still take none of Moutai's customers. What buyers want is the brand, the face it gives them, the price itself. If Moutai cut its price, it would damage itself. A price war cannot even get started here.

  Or take Pop Mart, the Chinese company behind the Labubu blind-box toys that became a global craze. A customer pays for the design and the feeling, not the cost of the plastic. A rival can make a cheaper copy and it changes nothing, because you cannot copy the feeling of "I have to have this one."

  What these businesses share is simple: customers choose them for reasons that have nothing to do with being cheaper. They do not have to watch a rival's cost line every quarter, and they do not have to worry about being undercut tomorrow. That is what Duan Yongping means by differentiation. That is a good business model.

  One more step, though. In a business where price works, eventually one company builds a cost advantage so large that every rival's costs sit above its own. Is that company a good business?

  It is certainly a good company. Whether it is a good business depends on how that low-cost position was won, and whether it can be kept.

  An advantage built on scale lasts longer. Scale is not something you get from one decision. It takes years of spending and accumulated orders. A rival can understand exactly how you did it and still cannot copy it overnight - the warehouses, the delivery network, the supplier terms all take time and money to build. And the bigger you are, the lower your unit cost, which gives you more money to widen the gap further. It feeds itself.

  But there is a price for this. The company's profit ceiling gets locked. It has to hold prices at a level that makes rivals uncomfortable enough that they do not move. Lift prices far enough to earn eye-catching margins and competitors get a reason to enter. The price war starts again.

  So it can only earn the amount that keeps it comfortable without tempting anyone else in. That is the best outcome a good company can reach in this kind of business. It is still not what a good business looks like.

  **In a business where price wars work, there are no real winners. The one left standing is simply the operator that could grind longer and cut deeper. A genuinely good business is one where a price war never gets off the ground at all.**
