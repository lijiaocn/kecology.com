title: "价格战有效的生意都不是好生意：茅台和泡泡玛特做对了什么"
description: "中国零售业不断用更便宜的新形态淘汰旧形态，谁都赚不到长久的钱。段永平反复讲的生意模式，指向一个简单的检验：如果降价就能抢到顾客，这门生意结构上就很苦。"
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  段永平反复讲，做生意先看生意模式，要有差异化。

  但怎么才算好的生意模式，怎么算是有差异化？

  本站前几天的文章提到一个现象：零售行业里，一种更有效率的形态一旦出现，就会以摧枯拉朽之势击垮上一代。连锁超市干掉国营百货，电商干掉大卖场，现在轮到前置仓——开在社区里、只负责拣货配送的小型仓库。

  最近反复在想这背后的原因，领悟到一点。

  **价格战有效的生意，都不是好生意。**

  一个生意，如果价格战是有效的，参与者就只有一个宿命：长期地卷成本、卷效率。要么成为卷王，要么被卷王挤出市场。

  而且成本和效率不是跟自己的昨天比就够了，要时时刻刻跟行业里的对手比。对手用了一个有效的降本增效的办法，你必须立刻跟上。因为价格上一旦没有优势，生意立刻就被别人抢走了。

  这是一场没有终点的赛跑。你今天省下来的每一分钱，明天就会被对手用同样的方式省掉，然后你们俩一起把价格再往下压一截。省下来的好处，最后都让给了消费者，自己一分没留。

  零售业就是最典型的价格有效的生意。不同的公司卖的东西，最大的差异化就是价格，想多拿一点生意，只能在价格上想办法。消费者对价格极其敏感，同样的东西，你贵一块钱，人就走了。

  所以零售业看起来热闹，其实是最苦的生意。效率高的摧毁效率低的，然后新的高效率玩家再来摧毁它。没有谁能安安稳稳赚很久的钱。

  那什么样的生意，价格战是无效的？

  比如贵州茅台。别家白酒卖得再便宜，也抢不走茅台的生意。消费者买茅台，买的不是酒精，是牌子、是面子、是那个价格本身。茅台要是降价，反而伤害自己。价格战在这里根本打不起来。

  比如泡泡玛特，就是把 Labubu 盲盒做成全球热潮的那家公司。消费者为一个盲盒、一个 IP 掏钱，买的是设计和情绪，不是成本。别人把仿品做得更便宜，也没用，你抢不走那种"我就是想要这个"的冲动。

  这些生意的共同点是：客户选择你，不是因为你便宜。它们不用时时刻刻盯着对手的成本，也不用担心哪天被人用价格掀翻。这才是段永平说的差异化，才是好的生意模式。

  不过，价格有效的生意里，最后总会有一个公司建立起显著的成本优势，所有对手的成本都比它高。那这家公司，是不是就成了一门好生意？

  它肯定是个好公司。但是不是好生意，要看它的低成本优势是怎么来的，以及能不能一直保持。

  靠规模建立起来的成本优势，持续时间会比较长。因为规模不是做一个决策就能得到的，要靠很多年的投入和订单一点点堆出来。对手就算看懂了，也没法一夜之间复制——建仓储、铺网络、养供应链，都要时间和钱。而且规模越大，单位成本越低，越有钱去巩固优势，这是个正循环。

  但代价是，这家公司的利润上限也被锁死了。它必须把价格维持在一个让对手难受、不敢动手的水平。价格一旦提上去，赚到让旁人眼馋的钱，对手就有了进场的理由，价格战会重新开始。

  所以它只能赚"让自己活得很舒服、但不足以诱惑别人进场"的钱。这是一个好公司能拿到的最好结果，却不是一门好生意该有的样子。

  **价格战有效的生意里，没有真正的赢家。卷到最后那个，只是比别人更能忍、成本更低。真正的好生意，是让价格战从一开始就打不起来。**
