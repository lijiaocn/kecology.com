title: "Mengapa bisnis yang bisa menang lewat harga justru bisnis yang buruk: Apa yang Kweichow Moutai dan Pop Mart pahami tentang ritel"
description: "Ritel Tiongkok terus menggantikan format lama dengan format yang lebih murah, dan tak ada yang bisa menghasilkan uang terlalu lama. Pertanyaan Duan Yongping soal model bisnis menunjukkan satu tes sederhana: jika memotong harga memenangkan pelanggan, bisnis itu brutal secara struktural."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping, investor dan pengusaha Tiongkok yang pandangan investasinya diikuti ketat di dalam negeri, sudah bertahun-tahun mengatakan hal yang sama: lihat dulu model bisnisnya, lalu carilah diferensiasi.

  Tapi apa yang benar-benar disebut model bisnis yang baik? Dan apa yang disebut diferensiasi?

  Beberapa hari lalu situs ini memuat tulisan tentang pola dalam ritel Tiongkok: begitu format yang lebih efisien muncul, format sebelumnya dibereskan. Supermarket rantai membereskan toko departemen milik negara. E-commerce membereskan hipermarket. Sekarang belanjaan pengiriman instan—gudang kecil di lingkungan perumahan yang mengirim pesanan dalam hitungan menit—sedang membidik supermarket.

  Sejak itu saya terus memikirkannya, dan saya rasa sudah memegang satu keping dari alasannya.

  **Bisnis yang bisa dimenangkan lewat perang harga bukanlah bisnis yang baik.**

  Logikanya begini. Jika dalam usaha Anda memotong harga secara pasti merebut pelanggan, maka nasib semua pelaku sudah ditentukan: pergesekan panjang untuk menekan biaya dan menaikkan efisiensi. Anda harus menjadi operator yang paling gigih menekan biaya, atau Anda akan digiling keluar dari pasar oleh operator itu.

  Dan biaya serta efisiensi tidak diukur terhadap masa lalu Anda sendiri. Mereka diukur terhadap pesaing, setiap kuartal, tanpa henti. Begitu saingan menemukan cara nyata untuk menekan biaya atau menaikkan efisiensi, Anda harus segera menyamainya. Karena sekali harga Anda kalah unggul, pelanggan pun pergi.

  Ritel adalah contoh paling jelas dari bisnis yang harga berfungsi. Perusahaan-perusahaan menjual barang yang sebagian besar sama, sehingga pembeda terbesar di antara mereka adalah harga. Kalau ingin porsi lebih besar, Anda harus mencarinya di harga. Pembeli sangat sensitif terhadap harga. Jual barang yang sama sedikit lebih mahal, mereka langsung pergi.

  Itulah sebabnya ritel tampak seperti pasar yang besar dan hidup, tetapi sebenarnya termasuk bisnis paling sulit untuk menghasilkan uang. Pelaku yang efisien mengalahkan yang tidak efisien, lalu pelaku yang lebih efisien datang dan mengalahkannya. Tak ada yang bisa menghasilkan keuntungan besar terlalu lama.

  Lalu seperti apa bisnis yang perang harganya tidak berfungsi?

  Ambil Kweichow Moutai, produsen baijiu asal Tiongkok—baijiu adalah minuman keras bening hasil penyulingan, dan botol Moutai diperlakukan sebagai hadiah serta simbol status, sering dibanderol ratusan dolar atau lebih. Perusahaan lain bisa menjual minuman keras jauh lebih murah dan tetap tidak merebut satu pun pelanggan Moutai. Yang diinginkan pembeli adalah mereknya, wajah yang diberikannya, dan harga itu sendiri. Jika Moutai memotong harga, ia merugikan dirinya sendiri. Perang harga bahkan tidak bisa dimulai di sini.

  Atau Pop Mart, perusahaan Tiongkok di balik mainan kotak buta Labubu yang menjadi demam global. Pelanggan membayar untuk desain dan perasaannya, bukan biaya plastiknya. Saingan bisa membuat tiruan yang lebih murah dan tidak ada yang berubah, karena perasaan "aku harus punya yang ini" tidak bisa ditiru.

  Yang dimiliki bersama oleh bisnis-bisnis ini sederhana: pelanggan memilih mereka karena alasan yang tak ada hubungannya dengan lebih murah. Mereka tidak perlu memantau garis biaya saingan setiap kuartal, dan tidak perlu khawatir besok dikalahkan harga. Itulah yang dimaksud Duan Yongping dengan diferensiasi. Itulah model bisnis yang baik.

  Satu langkah lagi. Dalam bisnis yang harga berfungsi, pada akhirnya satu perusahaan membangun keunggulan biaya sedemikian besar sehingga biaya semua saingan berada di atas biayanya. Apakah perusahaan itu merupakan bisnis yang baik?

  Tentu saja perusahaan yang baik. Apakah ia bisnis yang baik bergantung pada bagaimana posisi biaya rendah itu direbut, dan apakah bisa dipertahankan.

  Keunggulan yang dibangun dari skala bertahan lebih lama. Skala bukan sesuatu yang didapat dari satu keputusan. Ia membutuhkan tahun-tahun pengeluaran dan pesanan yang terakumulasi. Saingan bisa memahami persis bagaimana Anda melakukannya dan tetap tidak bisa menirunya dalam semalam—gudang, jaringan pengiriman, dan kesepakatan dengan pemasok semuanya butuh waktu dan uang untuk dibangun. Dan semakin besar Anda, semakin rendah biaya per unit, sehingga ada lebih banyak uang untuk memperlebar jarak. Ini menguatkan dirinya sendiri.

  Tapi ada harganya. Plafon keuntungan perusahaan jadi terkunci. Perusahaan harus menjaga harga pada level yang membuat saingan cukup tidak nyaman sampai tidak bergerak. Naikkan harga cukup jauh untuk meraih margin yang mencolok, dan kompetitor pun punya alasan masuk. Perang harga dimulai lagi.

  Jadi perusahaan hanya bisa memperoleh keuntungan yang cukup membuatnya nyaman tanpa mengundang orang lain masuk. Itu adalah hasil terbaik yang bisa dicapai perusahaan baik dalam bisnis seperti ini. Itu masih bukan tampilan dari bisnis yang baik.

  **Dalam bisnis yang perang harganya berfungsi, tidak ada pemenang sejati. Yang tersisa sampai akhir hanyalah operator yang bisa menggiling lebih lama dan memotong lebih dalam. Bisnis yang benar-benar baik adalah bisnis yang perang harganya tidak pernah lepas landas sama sekali.**
