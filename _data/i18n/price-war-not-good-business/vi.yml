title: "Vì sao ngành kinh doanh thắng được nhờ giá lại là ngành tồi: Điều Kweichow Moutai (Mao Đài) và Pop Mart hiểu về bán lẻ"
description: "Bán lẻ Trung Quốc cứ liên tục thay dạng thức cũ bằng dạng thức rẻ hơn, và chẳng ai giữ được lợi nhuận lâu dài. Câu hỏi của Duan Yongping về mô hình kinh doanh chỉ ra một phép thử rất đơn giản: nếu cắt giá là có khách, ngành đó tàn khốc ngay từ cấu trúc."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping, một nhà đầu tư và doanh nhân Trung Quốc mà quan điểm đầu tư được theo dõi sát sao trong nước, đã nói đi nói lại một điều suốt nhiều năm: hãy nhìn vào mô hình kinh doanh trước, và tìm kiếm sự khác biệt.

  Nhưng thế nào là một mô hình kinh doanh tốt? Và thế nào là khác biệt?

  Cách đây vài ngày, trang này có một bài mô tả quy luật trong bán lẻ Trung Quốc: cứ khi có dạng thức hiệu quả hơn xuất hiện, nó san bằng dạng thức đi trước. Siêu thị chuỗi san bằng các cửa hàng bách hóa nhà nước. Thương mại điện tử san bằng các đại siêu thị. Giờ đây, tạp hóa giao nhanh—những kho nhỏ trong khu dân cư gửi đơn trong vài phút—đang nhắm vào các siêu thị.

  Từ đó đến nay tôi vẫn cứ suy nghĩ về điều này, và có vẻ như đã nắm được một mảnh của câu trả lời.

  **Ngành kinh doanh nào mà cắt giá là thắng thì ngành đó không tốt.**

  Lý do như sau. Nếu trong ngành của bạn, cắt giá luôn mang lại khách, số phận của mọi người chơi đều đã định: một cuộc mài mòn kéo dài để giảm chi phí và tăng hiệu quả. Bạn phải trở thành bên mài dữ dội nhất, nếu không sẽ bị bên đó mài ra khỏi thị trường.

  Hơn nữa, chi phí và hiệu quả không được đo bằng chính quá khứ của bạn. Chúng được đo bằng đối thủ, mỗi quý, không ngừng. Ngay khi đối thủ tìm ra cách thật sự giảm chi phí hoặc tăng hiệu quả, bạn phải bắt kịp ngay. Bởi chỉ cần giá của bạn mất lợi thế, khách đã đi mất rồi.

  Bán lẻ là ví dụ rõ nhất của ngành mà giá có sức mạnh. Các công ty bán đại loại cùng một hàng, nên điều khác biệt lớn nhất giữa họ chính là giá. Muốn chiếm thêm thị phần, bạn phải tìm nó trong giá. Người mua cực kỳ nhạy về giá. Bán cùng một món cao hơn một chút là họ bỏ đi.

  Vì thế bán lẻ trông thì là thị trường lớn và sôi động, nhưng thực ra là một trong những ngành khó kiếm tiền nhất. Bên hiệu quả hơn dẹp bên kém hiệu quả, rồi một bên còn hiệu quả hơn lại đến dẹp tiếp. Chẳng ai được hưởng lợi tốt lâu dài.

  Vậy ngành kinh doanh mà chiến tranh giá không có tác dụng thì ra sao?

  Hãy xem Kweichow Moutai (Mao Đài), nhà sản xuất baijiu của Trung Quốc—baijiu là rượu chưng cất trong, và chai Moutai được xem như quà tặng và biểu tượng địa vị, thường có giá vài trăm đô la trở lên. Một công ty khác bán rượu rẻ hơn rất nhiều vẫn chẳng giành được lấy một khách của Moutai. Điều người mua muốn là thương hiệu, là thể diện nó mang lại, và chính là mức giá. Nếu Moutai hạ giá, nó tự làm tổn thương mình. Chiến tranh giá ở đây không thể nào nổ ra.

  Hoặc Pop Mart, công ty Trung Quốc đứng sau món đồ chơi hộp mù Labubu từng gây sốt toàn cầu. Khách trả tiền cho thiết kế và cảm giác, chứ không phải chi phí nhựa. Đối thủ làm bản sao rẻ hơn cũng chẳng thay đổi được gì, vì không thể sao chép được cảm giác "phải có cái này bằng được".

  Điểm chung của những ngành này rất đơn giản: khách chọn họ vì những lý do chẳng liên quan gì đến việc rẻ hơn. Họ không phải canh đường chi phí của đối thủ mỗi quý, cũng không phải lo bị hạ giá ngày mai. Đó chính là điều Duan Yongping gọi là khác biệt. Đó là mô hình kinh doanh tốt.

  Thêm một bước nữa. Trong ngành mà giá có sức mạnh, cuối cùng sẽ có một công ty xây được lợi thế chi phí lớn đến mức chi phí của mọi đối thủ đều cao hơn của mình. Công ty đó có phải là ngành kinh doanh tốt không?

  Chắc chắn là một công ty tốt. Còn có phải ngành tốt hay không thì phụ thuộc vào việc vị thế chi phí thấp đó giành được như thế nào, và có giữ được hay không.

  Lợi thế xây bằng quy mô bền hơn. Quy mô không phải thứ có được sau một quyết định. Nó cần nhiều năm chi tiền và những đơn hàng tích lũy. Đối thủ có thể hiểu chính xác bạn làm thế nào mà vẫn không sao chép được trong một đêm—kho hàng, mạng lưới giao nhận, điều khoản với nhà cung cấp đều cần thời gian và tiền bạc để xây. Và bạn càng lớn, chi phí trên mỗi đơn vị càng thấp, đồng nghĩa có thêm tiền để nới rộng khoảng cách. Nó tự nuôi chính nó.

  Nhưng cái giá phải trả là trần lợi nhuận của công ty bị khóa. Công ty phải giữ giá ở mức khiến đối thủ đủ khó chịu để không động đậy. Nâng giá đủ xa để có biên lợi nhuận bắt mắt là đối thủ có lý do để nhập cuộc. Chiến tranh giá lại bắt đầu.

  Vì vậy công ty chỉ kiếm được mức đủ để mình thoải mái mà không lôi kéo thêm ai vào. Đó là kết quả tốt nhất mà một công ty tốt đạt được trong ngành kiểu này. Và nó vẫn chưa phải là bộ mặt của một ngành kinh doanh tốt.

  **Trong ngành mà chiến tranh giá phát huy tác dụng, chẳng có người thắng thật sự. Kẻ còn lại cuối cùng chỉ là bên mài được lâu hơn và cắt sâu hơn. Một ngành kinh doanh tốt thật sự là ngành mà chiến tranh giá không bao giờ kịp nổ ra.**
