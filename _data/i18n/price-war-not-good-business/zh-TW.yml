title: "價格戰有效的生意都不是好生意：茅台和泡泡瑪特做對了什麼"
description: "中國零售業不斷用更便宜的新形態淘汰舊形態，誰都賺不到長久的錢。段永平反覆講的生意模式，指向一個簡單的檢驗：如果降價就能搶到顧客，這門生意結構上就很苦。"
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  段永平反覆講，做生意先看生意模式，要有差異化。

  但怎麼才算好的生意模式，怎麼算是有差異化？

  本站前幾天的文章提到一個現象：零售行業裡，一種更有效率的形態一旦出現，就會以摧枯拉朽之勢擊垮上一代。連鎖超市打垮國營百貨，電商打垮大賣場，現在輪到前置倉——開在社區裡、只負責揀貨配送的小型倉庫。

  最近反覆在想這背後的原因，領悟到一點。

  **價格戰有效的生意，都不是好生意。**

  一個生意，如果價格戰是有效的，參與者就只有一個宿命：長期地捲成本、捲效率。要嘛成為捲王，要嘛被捲王擠出市場。

  而且成本和效率不是跟自己的昨天比就夠了，要時時刻刻跟行業裡的對手比。對手用了一個有效的降本增效的辦法，你必須立刻跟上。因為價格上一旦沒有優勢，生意立刻就被別人搶走了。

  這是一場沒有終點的賽跑。你今天省下來的每一分錢，明天就會被對手用同樣的方式省掉，然後你們倆一起把價格再往下壓一截。省下來的好處，最後都讓給了消費者，自己一分沒留。

  零售業就是最典型的價格有效的生意。不同的公司賣的東西，最大的差異化就是價格，想多拿一點生意，只能在價格上想辦法。消費者對價格極其敏感，同樣的東西，你貴一塊錢，人就走了。

  所以零售業看起來熱鬧，其實是最苦的生意。效率高的摧毀效率低的，然後新的高效率玩家再來摧毀它。沒有誰能安安穩穩賺很久的錢。

  那什麼樣的生意，價格戰是無效的？

  比如貴州茅台。別家白酒賣得再便宜，也搶不走茅台的生意。消費者買茅台，買的不是酒精，是牌子、是面子、是那個價格本身。茅台要是降價，反而傷害自己。價格戰在這裡根本打不起來。

  比如泡泡瑪特，就是把 Labubu 盲盒做成全球熱潮的那家公司。消費者為一個盲盒、一個 IP 掏錢，買的是設計和情緒，不是成本。別人把仿品做得更便宜，也沒用，你搶不走那種"我就是想要這個"的衝動。

  這些生意的共同點是：客戶選擇你，不是因為你便宜。它們不用時時刻刻盯著對手的成本，也不用擔心哪天被人用價格掀翻。這才是段永平說的差異化，才是好的生意模式。

  不過，價格有效的生意裡，最後總會有一個公司建立起顯著的成本優勢，所有對手的成本都比它高。那這家公司，是不是就成了一門好生意？

  它肯定是個好公司。但是不是好生意，要看它的低成本優勢是怎麼來的，以及能不能一直保持。

  靠規模建立起來的成本優勢，持續時間會比較長。因為規模不是做一個決策就能得到的，要靠很多年的投入和訂單一點點堆出來。對手就算看懂了，也沒法一夜之間複製——建倉儲、鋪網路、養供應鏈，都要時間和錢。而且規模越大，單位成本越低，越有錢去鞏固優勢，這是個正循環。

  但代價是，這家公司的利潤上限也被鎖死了。它必須把價格維持在一個讓對手難受、不敢動手的水平。價格一旦提上去，賺到讓旁人眼饞的錢，對手就有了進場的理由，價格戰會重新開始。

  所以它只能賺"讓自己活得很舒服、但不足以誘惑別人進場"的錢。這是一個好公司能拿到的最好結果，卻不是一門好生意該有的樣子。

  **價格戰有效的生意裡，沒有真正的贏家。捲到最後那個，只是比別人更能忍、成本更低。真正的好生意，是讓價格戰從一開始就打不起來。**
