title: "Por qué un negocio que se gana bajando precios es un mal negocio: la lección de Kweichow Moutai y Pop Mart para el comercio minorista en cualquier mercado"
description: "El comercio minorista chino no deja de sustituir un formato por otro más barato, y nadie gana dinero durante mucho tiempo. La pregunta de Duan Yongping sobre los modelos de negocio apunta a una prueba sencilla: si bajar precios te gana clientes, ese negocio es estructuralmente brutal."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping, inversor y empresario chino cuyas opiniones sobre inversión se siguen de cerca en China, lleva años diciendo lo mismo: mira primero el modelo de negocio y busca la diferenciación.

  Pero, ¿qué cuenta realmente como un buen modelo de negocio? ¿Y qué cuenta como diferenciación?

  Hace unos días, un artículo en este sitio describía un patrón del comercio minorista chino: en cuanto aparece un formato más eficiente, aplana al anterior. Las cadenas de supermercados aplanaron a los grandes almacenes estatales. El comercio electrónico aplanó a los hipermercados. Ahora las compras con entrega inmediata —pequeños almacenes de barrio que despachan pedidos en cuestión de minutos— vienen a comerse a los supermercados.

  Le he dado vueltas sin parar desde entonces, y creo que he dado con una parte de la respuesta.

  **Un negocio en el que funcionan las guerras de precios no es un buen negocio.**

  Vamos con la lógica. Si bajar precios te gana clientes de forma fiable en tu sector, todos los participantes corren la misma suerte: una larga trituración hecha de recortes de costes y aumentos de eficiencia. O te conviertes en el operador que exprime más, o ese operador te exprime a ti hasta sacarte del mercado.

  Y costes y eficiencia no se miden respecto a tu propio pasado. Se miden frente a tus competidores, cada trimestre, sin descanso. En cuanto un rival encuentra una forma real de bajar costes o subir la eficiencia, tienes que igualarla de inmediato. Porque en cuanto tu precio pierde su ventaja, el cliente se va.

  El comercio minorista es el ejemplo más claro de negocio donde el precio funciona. Distintas empresas venden prácticamente los mismos productos, así que lo que más las separa es el precio. Si quieres quedarte con más negocio, tienes que buscarlo en el precio. Los compradores son extremadamente sensibles a él. Vende el mismo artículo un poco más caro y sencillamente se marchan.

  Por eso el retail parece un mercado enorme y animado y, en realidad, es uno de los negocios más difíciles en los que ganar dinero. El operador eficiente destruye al ineficiente, entonces aparece uno más eficiente y destruye a ese. Nadie consigue ganar buen dinero durante mucho tiempo.

  Entonces, ¿cómo es un negocio en el que las guerras de precios no funcionan?

  Tomemos Kweichow Moutai, el fabricante chino de baijiu —un destilado transparente—, cuyas botellas se tratan como regalos y objetos de estatus, y suelen costar varios cientos de dólares o más. Otra empresa puede vender licor mucho más barato y no robarle ni un cliente a Moutai. Lo que buscan los compradores es la marca, la imagen que les da, el precio en sí. Si Moutai bajara su precio, se haría daño a sí misma. Aquí una guerra de precios ni siquiera puede empezar.

  O pensemos en Pop Mart, la empresa china detrás de los juguetes Labubu en cajas ciegas que se convirtieron en una fiebre mundial. El cliente paga por el diseño y por la emoción, no por el coste del plástico. Un rival puede fabricar una copia más barata y eso no cambia nada, porque no se puede copiar la sensación de «tengo que tener este».

  Lo que comparten estos negocios es simple: los clientes los eligen por razones que no tienen nada que ver con que sean más baratos. No tienen que vigilar la línea de costes de un rival cada trimestre, ni preocuparse por que mañana los vendan más barato. Eso es lo que Duan Yongping entiende por diferenciación. Ese es un buen modelo de negocio.

  Pero demos un paso más. En un negocio donde el precio funciona, al final una empresa construye una ventaja de costes tan grande que los costes de todos sus rivales quedan por encima de los suyos. ¿Es esa empresa un buen negocio?

  Sin duda es una buena empresa. Si es un buen negocio depende de cómo haya conseguido esa posición de costes bajos y de si puede conservarla.

  Una ventaja construida a base de escala dura más. La escala no se consigue con una sola decisión. Requiere años de gasto y de pedidos acumulados. Un rival puede entender exactamente cómo lo hiciste y aun así no poder copiarlo de la noche a la mañana: los almacenes, la red de reparto y las condiciones con los proveedores llevan tiempo y dinero construirse. Y cuanto más grande eres, menor es tu coste unitario, lo que te da más dinero para ampliar aún más la distancia. Se alimenta a sí misma.

  Pero eso tiene un precio. El techo de beneficios de la empresa queda fijado. Debe mantener los precios en un nivel que incomode lo suficiente a los rivales para que no se muevan. Si los sube lo bastante para conseguir márgenes llamativos, los competidores encuentran un motivo para entrar. Y la guerra de precios vuelve a empezar.

  Así que solo puede ganar lo que le basta para estar cómoda sin tentar a nadie más a entrar. Ese es el mejor resultado al que puede aspirar una buena empresa en este tipo de negocio. Sigue sin ser lo que se entiende por un buen negocio.

  **En un negocio donde funcionan las guerras de precios no hay ganadores reales. El que queda en pie es simplemente el operador que supo apretar más tiempo y recortar más hondo. Un buen negocio de verdad es aquel en el que la guerra de precios nunca llega a empezar.**
