title: "لماذا تُعدّ الأعمال التي تُربح بالسعر أعمالاً سيئة: ما تعلّمه تجارة التجزئة عالمياً من Kweichow Moutai وPop Mart"
description: "تستبدل التجارة الصينية كل نموذج بآخر أرخص، ولا أحد يربح لوقت طويل. ويعود سؤال Duan Yongping عن نماذج الأعمال إلى اختبار بسيط: إن كان خفض السعر هو ما يجلب العملاء، فالقطاع قاسٍ بحكم بنيته."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping (دون يونبينغ)، مستثمر ورجل أعمال صيني كانت آراؤه في الاستثمار موضع متابعة دقيقة في الصين، ظلّ يقول الشيء نفسه لسنوات: ابدأ بنموذج العمل، ثم اسأل ما الذي يميّزه عن غيره.

  لكن ما الذي يجعل نموذج العمل جيداً حقاً؟ وما الذي يُعدّ تمايزاً؟

  قبل أيام نشر هذا الموقع مقالاً عن نمط متكرّر في التجارة الصينية: ما إن يظهر نموذج أكثر كفاءة حتى يُسوّي الذي قبله بالأرض. محلات السوبرماركت المتسلسلة سوّت متاجر الأقسام الحكومية بالأرض. والتجارة الإلكترونية سوّت الهايبرماركت بالأرض. والآن جاءت خدمات توصيل البقالة الفورية — مستودعات صغيرة في الأحياء تُرسل الطلبات في دقائق — لتنافس السوبرماركت.

  من ذلك الحين وأنا أقلّب هذه الفكرة، وأظن أنني أمسكت بأحد أسبابها.

  **الأعمال التي تنجح فيها حروب الأسعار ليست أعمالاً جيدة.**

  والمنطق كالتالي: إذا كان خفض السعر يكسبك العملاء بثقة في قطاعك، فمصير كل مشارك واحد: كفاح طويل لتقليل التكاليف ورفع الكفاءة. إما أن تكون أنت المشغّل الذي يضغط بقوة أكبر من الجميع، وإما أن يُخرجك هذا المشغّل من السوق.

  وليست التكاليف والكفاءة تُقاس مقارنةً بماضيك، بل مقارنةً بالمنافسين، كل ربع سنة بلا توقف. فما إن يجد خصمك طريقة حقيقية لخفض التكلفة أو رفع الكفاءة حتى تضيف أنت إلى ذلك فوراً؛ لأن السعر ما إن يفقد ميزته حتى يغيب العميل.

  التجزئة أوضح مثال على عمل تنجح فيه السعر. شركات مختلفة تبيع سلعاً متطابقة في الغالب، وأكبر ما يفصل بينها هو السعر. تريد حصة أكبر؟ عليك أن تجدها في السعر. والمشترون حسّاسون له إلى حدّ مفرط. ارفع سعر المنتج نفسه قليلاً، وهم ببساطة يرحلون.

  لذلك تبدو التجزئة سوقاً ضخمة نابضة بالحياة، وهي في الحقيقة من أصعب الأعمال ربحاً. المشغّل الكفء يقضي على غير الكفء، ثم يظهر من هو أكثر كفاءة فيقضي عليه. ولا أحد يحصل على ربح جيد لوقت طويل.

  فكيف يبدو العمل الذي لا تنجح فيه حروب الأسعار؟

  خذ Kweichow Moutai، صانع baijiu الصيني — وbaijiu مشروب كحولي صافٍ — الذي تُعامل زجاجاته كهدايا ورموز مكانة، وغالباً ما تُسعّر بمئات الدولارات أو أكثر. تستطيع شركة أخرى أن تبيع الخمر أرخص بكثير ولا تنتزع عميلاً واحداً من Moutai. ما يريده المشترون هو العلامة التجارية، والوجه الذي تمنحه لهم، والسعر نفسه. ولو خفّض Moutai سعره لأضرّ بنفسه. لا يمكن لحرب أسعار أن تبدأ هنا أصلاً.

  أو خذ Pop Mart، الشركة الصينية وراء ألعاب Labubu في الصناديق العمياء التي صارت هوساً عالمياً. يدفع العميل مقابل التصميم والمشاعر، لا مقابل تكلفة البلاستيك. تستطيع منافسة أن تصنع نسخة أرخص فلا يتغيّر شيء، لأنك لا تستطيع تقليد إحساس "لا بد أن أحصل على هذه بالذات".

  ما يجمعهما بسيط: العملاء يختارونهما لأسباب لا علاقة لها بالأرخص. ليس عليهما مراقبة خط تكلفة المنافس كل ربع سنة، ولا القلق من أن يُخفّض سعرهما غداً. هذا ما يعنيه Duan Yongping بالتمايز. وهذا هو نموذج العمل الجيد.

  لكن خطوة أخرى: في عمل تنجح فيه السعر، تُبني في النهاية شركة ميزة تكلفة ضخمة بحيث تقع تكاليف كل منافسيها فوق تكلفتها هي. هل يعني هذا أنها عمل جيد؟

  إنها بلا شك شركة جيدة. أما كونها عملاً جيداً فيتوقف على كيف حصلت على هذا الموقع منخفض التكلفة، وعلى إمكانية الحفاظ عليه.

  الميزة المبنية على الحجم تدوم أطول. والحجم لا يُكتسب بقرار واحد، بل بسنوات من الإنفاق وتراكم الطلبات. قد يعرف المنافس تماماً كيف فعلتَ ذلك ولا يستطيع تقليده بين ليلة وضحاها: المستودعات وشبكة التوصيل وشروط الموردين كلها تُبنى بالوقت والمال. وكلما كبرتَ انخفضت تكلفة الوحدة، فصار لديك مال أكثر لتوسيع الفجوة. وهذا يتغذى ذاتياً.

  لكن ثمناً لذلك. سقف ربح الشركة يصبح مكبلاً. عليها أن تُبقي الأسعار عند مستوى يُحرج المنافسين بما يكفي كي لا يتحركوا. ارفع الأسعار بما يكفي لتحقيق هوامش لافتة، وصار لدى المنافسين سبب للدخول. وتعود حرب الأسعار من جديد.

  لذا لا تستطيع أن تربح إلا المقدار الذي يبقيها مرتاحة دون أن تُغري أحداً بالدخول. هذا أفضل ما يمكن لشركة جيدة أن تصل إليه في هذا النوع من الأعمال. ومع ذلك، ليس هذا ما يبدو عليه العمل الجيد.

  **في الأعمال التي تنجح فيها حروب الأسعار، لا يوجد رابحون حقيقيون. من يبقى واقفاً هو ببساطة المشغّل الذي احتمل أطول وقطع أعمق. أما العمل الجيد حقاً فهو الذي لا تنطلق فيه حرب أسعار من الأساس.**
