title: "जिस व्यवसाय में कीमत जीत तय करती है, वह बुरा क्यों है: Kweichow Moutai और Pop Mart से दुनिया भर के रिटेल को सबक"
description: "चीन की रिटेल हर फ़ॉर्मेट को किसी सस्ते फ़ॉर्मेट से बदलती रहती है, और कोई लंबे समय तक पैसा नहीं कमाता। दुआन योंगपिंग का व्यवसाय मॉडल पर सवाल एक सरल परीक्षण की ओर इशारा करता है: अगर कीमत काटने से ग्राहक मिलते हैं, तो यह व्यवसाय अपनी संरचना से ही क्रूर है।"
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping (दुआन योंगपिंग), चीन के निवेशक और उद्यमी जिनके निवेशी विचारों पर देश में करीब से नज़र रखी जाती है, सालों से एक ही बात दोहरा रहे हैं: पहले व्यवसाय मॉडल देखो, फिर ऐसी चीज़ खोजो जो आपको दूसरों से अलग बनाए।

  लेकिन अच्छा व्यवसाय मॉडल असल में क्या है? अलगता क्या गिनी जाएगी?

  कुछ दिन पहले इस साइट पर चीन की रिटेल के एक पैटर्न की बात हुई थी: जैसे ही कोई ज़्यादा कुशल फ़ॉर्मेट आता है, वो पिछले को ध्वस्त कर देता है। चेन सुपरमार्केट ने सरकारी डिपार्टमेंटल स्टोर को ध्वस्त किया। ई-कॉमर्स ने हाइपरमार्केट को ध्वस्त किया। अब इंस्टेंट-डिलीवरी ग्रॉसरी — छोटे पड़ोसी गोदाम जो मिनटों में ऑर्डर भेज देते हैं — सुपरमार्केट पर आक्रमण कर रही हैं।

  तब से मैं इस पर विचार कर रहा हूँ, और लगता है कि मुझे इसकी एक वजह समझ आ गई है।

  **जिस व्यवसाय में कीमतों की जंग असरदार होती है, वह अच्छा व्यवसाय नहीं होता।**

  तर्क यह है। अगर आपके यहाँ कीमत काटना भरोसेमंद तरीके से ग्राहक लाता है, तो हर खिलाड़ी की किस्मत एक ही: लागत घटाने और दक्षता बढ़ाने की लंबी, थकाऊ जंग। या तो आप वो ऑपरेटर बनें जो सबसे ज़्यादा कसता है, या फिर वही ऑपरेटर आपको बाज़ार से बाहर कर देगा।

  और लागत या दक्षता का माप आपके अपने अतीत से नहीं होता। वे विरोधी से मापी जाती हैं — हर तिमाही, बिना रुके। जैसे ही किसी विरोधी को लागत घटाने या दक्षता बढ़ाने का असली तरीका मिला, आपको उसे तुरंत अपनाना पड़ेगा। क्योंकि जैसे ही आपकी कीमत का फ़ायदा खत्म हुआ, ग्राहक चला गया।

  रिटेल सबसे स्पष्ट मिसाल है कि कीमत कैसे काम करती है। अलग-अलग कंपनियाँ ज़्यादातर वही सामान बेचती हैं, इसलिए उन्हें अलग करने वाली सबसे बड़ी बात कीमत है। ज़्यादा हिस्सा चाहिए तो उसे कीमत में ही खोजना पड़ेगा। खरीदार कीमत के प्रति बहुत संवेदनशील होते हैं। वही चीज़ थोड़ी महँगी बेचो, वो बस चले जाएँगे।

  इसी वजह से रिटेल एक विशाल, जीवंत बाज़ार दिखता है और वास्तव में पैसा कमाने वाले सबसे कठिन व्यवसायों में से एक है। कुशल खिलाड़ी अकुशल को मिटा देता है, फिर और कुशल आकर उसे मिटा देता है। किसी को अच्छा मुनाफ़ा लंबे समय तक नहीं मिलता।

  तो ऐसा व्यवसाय कैसा दिखता है जहाँ कीमतों की जंग काम नहीं करती?

  Kweichow Moutai को लीजिए, चीन के baijiu निर्माता — baijiu एक साफ़, तीखी शराब है — जिनकी बोतलें उपहार और प्रतिष्ठा की वस्तु मानी जाती हैं, अक्सर सैकड़ों डॉलर या उससे अधिक कीमत पर। दूसरी कंपनी शराब बहुत सस्ती बेच सकती है और फिर भी Moutai का एक ग्राहक नहीं छीन पाएगी। खरीदार चाहते हैं ब्रांड, वो इज़्ज़त जो वो उन्हें देता है, और कीमत खुद भी। अगर Moutai कीमत घटाए तो खुद को नुकसान पहुँचाएगा। यहाँ कीमतों की जंग शुरू भी नहीं हो सकती।

  या Pop Mart लें — चीनी कंपनी जिसने Labubu के ब्लाइंड-बॉक्स खिलौने बनाए जो दुनिया भर में क्रेज़ बन गए। ग्राहक डिज़ाइन और उस अहसास के पैसे देता है, प्लास्टिक की लागत के नहीं। प्रतिद्वंद्वी सस्ती नकल बना सकता है, इससे कुछ नहीं बदलता; क्योंकि "मुझे यही चाहिए" वाला अहसास नकल नहीं होता।

  इन व्यवसायों में समानता सादी है: ग्राहक उन्हें ऐसे कारणों से चुनते हैं जिनका सस्ते होने से कोई लेना-देना नहीं है। उन्हें हर तिमाही विरोधी की लागत रेखा पर नज़र रखनी नहीं पड़ती, और न ही डरना पड़ता कि कल कोई सस्ता कर देगा। Duan Yongping का मतलब अलगता से यही है। यही अच्छा व्यवसाय मॉडल है।

  एक और कदम आगे। कीमत जहाँ काम करती है, वहाँ आख़िरकार एक कंपनी इतनी बड़ी लागत बढ़त बना लेती है कि हर विरोधी की लागत उसकी अपनी लागत से ऊपर रहती है। क्या वो कंपनी अच्छा व्यवसाय है?

  वो तो यक़ीनन अच्छी कंपनी है। अच्छा व्यवसाय है या नहीं, ये इस बात पर निर्भर है कि ये कम-लागत वाली जगह कैसे हासिल हुई और क्या उसे बनाए रखा जा सकता है।

  पैमाने पर बनी बढ़त ज़्यादा टिकती है। पैमाना एक फैसले से नहीं मिलता; इसके लिए सालों का खर्च और जमा हुए ऑर्डर चाहिए। विरोधी को पता हो सकता है कि आपने ये कैसे किया, फिर भी वो रातों-रात नकल नहीं कर सकता — गोदाम, डिलीवरी नेटवर्क, सप्लायर की शर्तें, सब समय और पैसे से बनते हैं। और आप जितने बड़े होते हैं, इकाई लागत उतनी कम, यानी फासला और बढ़ाने के लिए ज़्यादा पैसा। ये अपने आप को पोषित करता है।

  लेकिन इसकी कीमत है। कंपनी के मुनाफ़े की सीमा जाम हो जाती है। उसे कीमतें ऐसे स्तर पर रखनी पड़ती हैं जो विरोधियों को इतना असहज करे कि वे हिलें नहीं। अगर आप कीमतें इतनी बढ़ा दें कि आकर्षक मार्जिन दिखे, तो प्रतिद्वंद्वियों को बाज़ार में आने का कारण मिल जाता है। कीमतों की जंग दोबारा शुरू हो जाती है।

  इसलिए वो सिर्फ़ उतना कमा सकती है जितना उसे आराम दे और किसी और को आने का लालच न दे। ऐसे व्यवसाय में अच्छी कंपनी का यही सबसे अच्छा नतीजा है। फिर भी ये वैसा नहीं है जैसा अच्छा व्यवसाय दिखता है।

  **जिन व्यवसायों में कीमतों की जंग असरदार होती है, वहाँ कोई असली विजेता नहीं होता। बचा हुआ सिर्फ़ वही ऑपरेटर है जो ज़्यादा देर टिका और ज़्यादा गहरी कटौती कर सका। असली अच्छा व्यवसाय वो है जहाँ कीमतों की जंग शुरू ही नहीं होती।**
