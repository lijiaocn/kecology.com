title: "Почему бизнес, где всё решает цена, — плохой бизнес: уроки Kweichow Moutai и Pop Mart для ритейла во всём мире"
description: "Китайская розница меняет один формат на другой, более дешёвый, и никто долго не зарабатывает. Вопрос Duan Yongping о бизнес-моделях сводится к простому тесту: если клиентов привлекает снижение цены, такой бизнес жесток по своей структуре."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping (Дуань Юнпин), китайский инвестор и предприниматель, чьи инвестиционные взгляды в Китае находятся под пристальным вниманием, годами повторяет одно и то же: сначала разбирай бизнес-модель и ищи то, чего нет у других.

  Но что на самом деле делает бизнес-модель хорошей? И что именно считается отличием?

  Несколько дней назад на этом сайте вышел материал о закономерности китайской розницы: стоит появиться более эффективному формату — он раздавливает предыдущий. Сетевые супермаркеты раздавили государственные универмаги. Электронная коммерция раздавила гипермаркеты. Теперь за супермаркеты берутся службы мгновенной доставки продуктов — небольшие районные склады, которые отправляют заказы за считанные минуты.

  С тех пор я возвращаюсь к этой мысли и, кажется, ухватил одну из причин.

  **Бизнес, в котором ценовые войны работают, — плохой бизнес.**

  Логика тут такая. Если снижение цены надёжно приводит клиентов к вам в этой отрасли, у каждого участника одна судьба: долгая изнурительная гонка за снижением издержек и повышением эффективности. Либо вы тот оператор, который жмёт сильнее всех, либо именно он выдавливает вас с рынка.

  Причём издержки и эффективность измеряются не относительно вашего собственного прошлого. Их меряют против конкурентов — каждый квартал, без перерыва. Стоит сопернику найти реальный способ снизить издержки или поднять эффективность — вам приходится повторить это немедленно. Ведь едва ваша цена теряет преимущество, клиент исчезает.

  Розница — самый наглядный пример бизнеса, где цена работает. Разные компании продают по сути одни и те же товары, так что главное, что их различает, — цена. Хотите больше доли — найдите её в цене. Покупатели невероятно чувствительны к ней. Поднимите цену на ту же вещь чуть выше — и они просто уйдут.

  Поэтому розница выглядит огромным живым рынком, а на деле — одной из самых тяжёлых сфер для зарабатывания денег. Эффективный игрок уничтожает неэффективного, затем приходит ещё эффективнее и уничтожает этого. Никто не успевает долго получать хорошую прибыль.

  А как выглядит бизнес, в котором ценовые войны не работают?

  Возьмите Kweichow Moutai, китайского производителя baijiu — baijiu это прозрачный крепкий напиток, — чьи бутылки воспринимают как подарок и предмет статуса, часто по цене в несколько сотен долларов и выше. Другая компания может продавать выпивку гораздо дешевле и всё равно не отнять у Moutai ни одного клиента. Покупателям нужен бренд, то «лицо», которое он им даёт, и сама цена. Если Moutai снизит цену, он навредит себе сам. Ценовая война здесь даже не начинается.

  Или Pop Mart — китайская компания, стоявшая за игрушками Labubu в слепых коробках, которые стали мировым увлечением. Покупатель платит за дизайн и за чувство, а не за стоимость пластика. Конкурент может сделать более дешёвую копию — и ничего не изменится: чувство «я должна заполучить именно этого» не скопируешь.

  Что общего у таких бизнесов? Простое: клиенты выбирают их по причинам, не имеющим отношения к тому, что дешевле. Им не надо каждый квартал следить за издержками конкурента и не надо бояться, что завтра их перебьют ценой. Вот что Duan Yongping называет отличием. Вот что такое хорошая бизнес-модель.

  Но шагните ещё дальше. В бизнесе, где цена работает, рано или поздно одна компания наращивает такое преимущество по издержкам, что издержки всех соперников оказываются выше её собственных. Это хороший бизнес?

  Она наверняка хорошая компания. А хороший ли это бизнес — зависит от того, как досталось это низкозатратное положение и удаётся ли его удержать.

  Преимущество, построенное на масштабе, живёт дольше. Масштаб не даётся одним решением. Он требует лет расходов и накопленных заказов. Соперник может точно знать, как вы это сделали, и всё равно не скопировать за ночь — склады, сеть доставки, условия с поставщиками всё это строят время и деньги. И чем вы больше, тем ниже себестоимость единицы, а значит, больше средств, чтобы ещё сильнее разогнать отрыв. Система сама себя подпитывает.

  Но за это приходится платить. Потолок прибыли компании оказывается зажатым. Она должна держать цены на уровне, который соперникам невыгодно атаковать — настолько некомфортном, чтобы они не сдвинулись. Поднимите цены достаточно высоко, чтобы похвастаться броскими маржами — и у конкурентов появится повод прийти. Ценовая война начнётся снова.

  Поэтому она может зарабатывать лишь столько, сколько не привлекает новичков. Это лучший результат, которого хорошая компания способна достичь в таком бизнесе. И всё равно это не то, как выглядит хороший бизнес.

  **В бизнесе, где ценовые войны работают, настоящих победителей нет. Тот, кто остался на ногах, — просто оператор, который дольше выдерживал и глубже резал издержки. По-настоящему хороший бизнес — тот, где ценовая война вообще не начинается.**
