title: "ทำไมธุรกิจที่ชนะด้วยราคาจึงเป็นธุรกิจที่ไม่ดี: สิ่งที่กุยโจวเหมาไถและป๊อปมาร์ทเข้าใจเกี่ยวกับค้าปลีก"
description: "ค้าปลีกจีนผลัดเปลี่ยนรูปแบบไปเรื่อยๆ รูปแบบที่ถูกกว่ามาแทนที่ของเก่า แต่ไม่มีใครทำเงินได้นาน คำถามของ Duan Yongping เรื่องโมเดลธุรกิจชี้ให้เห็นบททดสอบง่ายๆ ว่า ถ้าลดราคาแล้วได้ลูกค้า ธุรกิจนั้นโหดร้ายในเชิงโครงสร้าง"
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping นักลงทุนและนักธุรกิจชาวจีนที่ความเห็นเรื่องการลงทุนได้รับการจับตาอย่างใกล้ชิดในจีน พูดเรื่องเดียวกันมาหลายปี คือให้ดูโมเดลธุรกิจก่อน แล้วมองหาความแตกต่างที่แท้จริง

  แต่โมเดลธุรกิจที่ดีหน้าตาเป็นยังไง และความแตกต่างนั้นหมายถึงอะไร

  เมื่อไม่กี่วันก่อน เว็บไซต์นี้เขียนถึงรูปแบบหนึ่งในค้าปลีกจีน คือเมื่อมีรูปแบบที่มีประสิทธิภาพมากกว่าปรากฏขึ้น มันจะปราบรูปแบบเก่าให้ราบ ซูเปอร์มาร์เก็ตแบบโซ่ปราบห้างสรรพสินค้าของรัฐ อีคอมเมิร์ซปราบไฮเปอร์มาร์เก็ต ตอนนี้ร้านขายของชำส่งด่วน——คลังขนาดเล็กในละแวกที่จัดส่งภายในไม่กี่นาที——กำลังจับตาซูเปอร์มาร์เก็ต

  ตั้งแต่นั้นฉันก็คิดเรื่องนี้เรื่อยมา และคิดว่าจับจุดเหตุผลได้ชิ้นหนึ่งแล้ว

  **ธุรกิจที่สงครามราคาได้ผล ไม่ใช่ธุรกิจที่ดี**

  ตรรกะเป็นแบบนี้ ถ้าการลดราคาในอุตสาหกรรมของคุณดึงลูกค้าได้แทบแน่นอน ทุกคนในตลาดก็มีชะตาเดียวกัน คือต้องบีบต้นทุนและยกระดับประสิทธิภาพยาวนาน คุณต้องเป็นผู้เล่นที่บีบได้โหดที่สุด มิฉะนั้นก็ถูกเขาบีบออกจากตลาด

  ยิ่งไปกว่านั้น ต้นทุนและประสิทธิภาพไม่ได้วัดเทียบกับอดีตของตัวเอง แต่เทียบกับคู่แข่ง ทุกไตรมาส ไม่มีวันหยุด พอคู่แข่งเจวิธีลดต้นทุนหรือเพิ่มประสิทธิภาพจริงๆ คุณต้องตามทันทันที เพราะพอราคาของคุณเสียเปรียบ ลูกค้าก็หายไป

  ค้าปลีกคือตัวอย่างชัดเจนที่สุดของธุรกิจที่ราคามีพลัง แต่ละบริษัทขายสินค้าแทบเหมือนกัน สิ่งที่แยกกันมากที่สุดจึงคือราคา ถ้าอยากได้ส่วนแบ่งมากขึ้น ต้องหามันจากราคา ผู้ซื้ออ่อนไหวกับราคามาก ขายของชิ้นเดียวแพงขึ้นนิดเดียว เขาก็เดินออกไปเฉยๆ

  นี่คือเหตุผลที่ค้าปลีกดูเหมือนตลาดใหญ่และมีชีวิตชีวา แต่ความจริงเป็นหนึ่งในธุรกิจที่ทำเงินยากที่สุด รายที่เก่งกว่าปราบรายที่ตามไม่ทัน แล้วรายที่เก่งกว่าอีกก็มาปราบรายนั้นต่อ ไม่มีใครได้เงินดีๆ นานๆ

  แล้วธุรกิจที่สงครามราคาไม่ได้ผลล่ะ เป็นยังไง

  ลองดู กุยโจวเหมาไถ (Kweichow Moutai) ผู้ผลิต baijiu ของจีน—baijiu คือสุรากลั่นใส และขวดของเหมาไถถูกมองเป็นของขวัญและสัญลักษณ์สถานะ มักตั้งราคาหลายร้อยดอลลาร์ขึ้นไป บริษัทอื่นขายเหล้าถูกกว่ามากก็ชิงลูกค้าเหมาไถไม่ได้สักคน สิ่งที่ผู้ซื้ออยากได้คือแบรนด์ คือหน้าตาที่มันให้ และคือตัวราคาเอง ถ้าเหมาไถลดราคา มันก็ทำร้ายตัวเอง สงครามราคาที่นี่เริ่มต้นไม่ขึ้นด้วยซ้ำ

  หรือป๊อปมาร์ท (Pop Mart) บริษัทจีนเบื้องหลังของเล่นกล่องสุ่ม Labubu ที่กลายเป็นกระแสโลก ลูกค้าจ่ายเพื่อดีไซน์และความรู้สึก ไม่ใช่ต้นทุนพลาสติก คู่แข่งทำของเลียนแบบที่ถูกกว่าก็ไม่เปลี่ยนอะไร เพราะคุณลอกความรู้สึกว่า "ฉันต้องได้อันนี้" ไม่ได้

  สิ่งที่ธุรกิจเหล่านี้มีร่วมกันง่ายๆ คือ ลูกค้าเลือกเพราะเหตุผลที่ไม่เกี่ยวกับการถูกกว่า พวกเขาไม่ต้องจับตาเส้นต้นทุนของคู่แข่งทุกไตรมาส และไม่ต้องกังวลว่าพรุ่งนี้ใครจะขายถูกกว่า นี่แหละคือสิ่งที่ Duan Yongping เรียกว่าความแตกต่าง และนี่คือโมเดลธุรกิจที่ดี

  อีกก้าวหนึ่ง ในธุรกิจที่ราคามีพลัง ท้ายที่สุดจะมีบริษัทหนึ่งสร้างความได้เปรียบด้านต้นทุนใหญ่โตจนต้นทุนของคู่แข่งทุกเจ้าสูงกว่าของมัน บริษัทนั้นเป็นธุรกิจที่ดีไหม

  แน่นอนว่าเป็นบริษัทที่ดี แต่ว่าจะเป็นธุรกิจที่ดีหรือไม่ ขึ้นกับว่าตำแหน่งต้นทุนต่ำนั้นได้มาอย่างไร และรักษาไว้ได้หรือไม่

  ความได้เปรียบที่สร้างจากขนาดอยู่ได้นาน ขนาดไม่ได้มาจากการตัดสินใจครั้งเดียว ต้องใช้การลงทุนหลายปีและยอดสั่งที่สะสม คู่แข่งอาจเข้าใจเป๊ะว่าคุณทำยังไง แต่ก็ลอกไม่ได้ข้ามคืน คลังสินค้า เครือข่ายจัดส่ง เงื่อนไขกับซัพพลายเออร์ ล้วนใช้เวลาและเงินในการสร้าง และยิ่งคุณใหญ่ขึ้น ต้นทุนต่อหน่วยก็ยิ่งลด ทำให้มีเงินมากขึ้นในการขยายช่องว่าง มันเลี้ยงตัวเอง

  แต่นี่มีราคาที่ต้องจ่าย เพดานกำไรของบริษัทถูกล็อก ต้องรักษาราคาให้ระดับที่ทำให้คู่แข่งไม่สบายใจพอที่จะไม่ขยับ ถ้าขึ้นราคามากพอจะได้มาร์จิ้นที่จับตา คู่แข่งก็มีเหตุผลเข้าตลาด สงครามราคาก็เริ่มอีก

  ดังนั้นมันจึงได้กำไรแค่พอที่ตัวเองสบายโดยไม่ดึงดูดให้ใครเข้ามา นี่คือผลลัพธ์ที่ดีที่สุดที่บริษัทที่ดีจะไปถึงในธุรกิจแบบนี้ แต่มันก็ยังไม่ใช่หน้าตาของธุรกิจที่ดี

  **ในธุรกิจที่สงครามราคาได้ผล ไม่มีผู้ชนะที่แท้จริง คนที่รอดอยู่คนสุดท้ายคือผู้เล่นที่บีบได้นานกว่าและลึกกว่าเท่านั้น ธุรกิจที่ดีจริงๆ คือธุรกิจที่สงครามราคาไม่มีทางเริ่มขึ้นตั้งแต่แรก**
