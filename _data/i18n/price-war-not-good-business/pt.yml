title: "Por que um negócio que se ganha pelo preço é um mau negócio: o que Kweichow Moutai e Pop Mart ensinam ao varejo em qualquer mercado"
description: "O varejo chinês não para de trocar um formato por outro mais barato, e ninguém ganha dinheiro por muito tempo. A pergunta de Duan Yongping sobre modelos de negócio aponta para um teste simples: se baixar preços conquista clientes, o negócio é estruturalmente brutal."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping, investidor e empresário chinês cujas opiniões sobre investimentos são acompanhadas de perto na China, vem dizendo a mesma coisa há anos: observe primeiro o modelo de negócio e busque a diferenciação.

  Mas o que conta, afinal, como um bom modelo de negócio? E o que conta como diferenciação?

  Há alguns dias, um texto neste site descreveu um padrão do varejo chinês: assim que aparece um formato mais eficiente, ele achata o anterior. As redes de supermercados achataram as lojas de departamento estatais. O comércio eletrônico achatou os hipermercados. Agora são as compras com entrega instantânea —pequenos depósitos de bairro que despacham pedidos em minutos— que vêm atrás dos supermercados.

  Fiquei remoendo isso desde então, e acho que consegui agarrar uma parte da resposta.

  **Um negócio em que a guerra de preços funciona não é um bom negócio.**

  Eis a lógica. Se baixar preços costuma ganhar clientes no seu ramo, todos os participantes têm o mesmo destino: uma maratona interminável de cortes de custo e ganhos de eficiência. Ou você se torna o operador que mais aperta, ou esse operador aperta você até tirá-lo do mercado.

  E custo e eficiência não são medidos contra o seu próprio passado. São medidos contra os concorrentes, todo trimestre, sem pausa. No momento em que um rival encontra uma forma real de reduzir custo ou elevar a eficiência, você tem que acompanhar na hora. Porque assim que seu preço perde a vantagem, o cliente vai embora.

  O varejo é o exemplo mais claro de negócio em que o preço funciona. Empresas diferentes vendem basicamente os mesmos produtos, então o que mais as separa é o preço. Se você quer uma fatia maior desse negócio, tem que encontrá-la no preço. Os compradores são extremamente sensíveis a isso. Venda o mesmo item um pouco mais caro e eles simplesmente saem.

  É por isso que o varejo parece um mercado enorme e animado, mas é, na prática, um dos negócios mais difíceis de lucrar. O operador eficiente destrói o ineficiente; depois chega um ainda mais eficiente e destrói esse. Ninguém consegue ganhar bem por muito tempo.

  Então, como é um negócio em que a guerra de preços não funciona?

  Pegue a Kweichow Moutai, a fabricante chinesa de baijiu —uma bebida destilada transparente—, cujas garrafas são tratadas como presentes e símbolos de status, muitas vezes com preços de centenas de dólares ou mais. Outra empresa pode vender bebida muito mais barata e ainda assim não tirar um único cliente da Moutai. O que os compradores querem é a marca, a imagem que ela dá, o próprio preço. Se a Moutai baixasse seu preço, estaria se prejudicando. Aqui uma guerra de preços nem chega a começar.

  Ou pense na Pop Mart, a empresa chinesa por trás dos brinquedos Labubu em caixas surpresa que viraram febre mundial. O cliente paga pelo design e pela sensação, não pelo custo do plástico. Um rival pode fazer uma cópia mais barata e isso não muda nada, porque não se copia a sensação de “preciso ter este”.

  O que esses negócios têm em comum é simples: os clientes os escolhem por razões que não têm nada a ver com ser mais barato. Eles não precisam vigiar a linha de custo de um rival a cada trimestre, nem temer que amanhã alguém os supere pelo preço. É isso que Duan Yongping chama de diferenciação. Esse é um bom modelo de negócio.

  Mais um passo, porém. Num negócio em que o preço funciona, no fim uma empresa constrói uma vantagem de custo tão grande que os custos de todos os rivais ficam acima dos dela. Essa empresa é um bom negócio?

  Ela é, sem dúvida, uma boa empresa. Se é um bom negócio depende de como conquistou essa posição de baixo custo e se consegue mantê-la.

  Uma vantagem construída com escala dura mais. Escala não é algo que se obtém com uma única decisão. Levam anos de gastos e pedidos acumulados. Um rival pode entender exatamente como você fez e ainda assim não conseguir copiar da noite para o dia — os armazéns, a rede de entrega e as condições com fornecedores levam tempo e dinheiro para serem construídos. E quanto maior você é, menor é o custo unitário, o que lhe dá mais dinheiro para ampliar ainda mais a diferença. Isso se alimenta sozinho.

  Mas isso tem um preço. O teto de lucro da empresa fica travado. Ela precisa manter os preços em um nível que deixe os rivais desconfortáveis o suficiente para não se mexerem. Subir preços o bastante para alcançar margens chamativas dá aos concorrentes um motivo para entrar. A guerra de preços recomeça.

  Então ela só pode ganhar o que basta para ficar confortável sem atrair ninguém mais para dentro. Esse é o melhor resultado que uma boa empresa pode alcançar nesse tipo de negócio. Ainda assim não é o que se entende por um bom negócio.

  **Num negócio em que a guerra de preços funciona, não há vencedores de verdade. Quem sobra é simplesmente o operador que aguentou mais tempo e cortou mais fundo. Um bom negócio de verdade é aquele em que a guerra de preços nem chega a sair do lugar.**
