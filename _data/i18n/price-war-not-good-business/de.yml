title: "Warum ein Geschäft, das man über den Preis gewinnt, ein schlechtes Geschäft ist: Was Kweichow Moutai und Pop Mart dem Einzelhandel in aller Welt zeigen"
description: "Im chinesischen Einzelhandel ersetzt ein Format immer wieder ein günstigeres, und niemand verdient lange Geld. Duan Yonyings Frage nach dem Geschäftsmodell führt zu einem einfachen Test: Wenn Preissenkungen Kunden bringen, ist das Geschäft von Grund auf gnadenlos."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping, ein chinesischer Investor und Unternehmer, dessen Ansichten über das Investieren in China aufmerksam verfolgt werden, sagt seit Jahren immer wieder dasselbe: Man muss zuerst auf das Geschäftsmodell schauen und nach Differenzierung suchen.

  Aber was gilt eigentlich als gutes Geschäftsmodell? Und was gilt als Differenzierung?

  Vor ein paar Tagen beschrieb ein Beitrag auf dieser Website ein Muster im chinesischen Einzelhandel: Sobald ein effizienteres Format auftaucht, plattet es das bisherige. Supermarktketten haben die staatlichen Kaufhäuser plattgemacht. Der Online-Handel hat die Hypermärkte plattgemacht. Jetzt kommen Lieferdienste für Lebensmittel – kleine Stadtteillager, die Bestellungen in wenigen Minuten rausschicken –, um den Supermärkten den Garaus zu machen.

  Ich habe seitdem immer wieder darüber nachgedacht, und ich glaube, ich habe einen Teil der Antwort in der Hand.

  **Ein Geschäft, in dem Preiskriege funktionieren, ist kein gutes Geschäft.**

  Hier ist die Logik. Wenn Preissenkungen in einer Branche zuverlässig Kunden bringen, wartet auf alle Beteiligten dasselbe Schicksal: ein langes Ringen um Kostensenkungen und Effizienzsteigerungen. Entweder man wird selbst der Betreiber, der am gnadenlosesten Kosten rauspresst, oder man wird von genau so einem aus dem Markt gepresst.

  Und Kosten und Effizienz werden nicht an der eigenen Vergangenheit gemessen. Sie werden an den Wettbewerbern gemessen, jedes Quartal, ohne Unterbrechung. In dem Moment, in dem ein Rivale einen echten Weg findet, Kosten zu senken oder die Effizienz zu steigern, muss man sofort nachziehen. Denn sobald der Preis seinen Vorteil verliert, ist der Kunde weg.

  Der Einzelhandel ist das deutlichste Beispiel für ein Geschäft, in dem der Preis funktioniert. Verschiedene Unternehmen verkaufen weitgehend dieselben Waren, also ist der Preis das, was sie am meisten unterscheidet. Wer mehr vom Geschäft will, muss es über den Preis holen. Käufer reagieren extrem empfindlich darauf. Verkauft man denselben Artikel ein bisschen teurer, gehen sie einfach.

  Deshalb wirkt der Einzelhandel wie ein riesiger, lebendiger Markt, ist aber in Wahrheit eines der Geschäfte, in denen am schwersten Geld zu verdienen ist. Der effiziente Anbieter vernichtet den ineffizienten, dann kommt ein noch effizienterer und vernichtet diesen. Niemand verdient lange gut.

  Wie sieht nun ein Geschäft aus, in dem Preiskriege nicht funktionieren?

  Nehmen wir Kweichow Moutai, der chinesische Hersteller von Baijiu – einer klaren Spirituose –, dessen Flaschen als Geschenke und Statussymbole gelten und oft mehrere hundert Dollar oder mehr kosten. Ein anderes Unternehmen kann Alkohol viel billiger verkaufen und trotzdem keinen einzigen Kunden von Moutai abziehen. Die Käufer wollen die Marke, das Gesicht, das sie ihnen verleiht, den Preis selbst. Würde Moutai seinen Preis senken, würde es sich selbst schaden. Ein Preiskrieg kann hier gar nicht erst beginnen.

  Oder nehmen wir Pop Mart, das chinesische Unternehmen hinter den Labubu-Figuren aus Blind-Boxen, die weltweit Furore machten. Der Kunde bezahlt für das Design und das Gefühl, nicht für die Kosten des Plastiks. Ein Rivale kann eine billigere Kopie anbieten, und das ändert nichts – denn das Gefühl „Ich muss genau dieses hier haben“ lässt sich nicht kopieren.

  Was diese Geschäfte gemeinsam haben, ist einfach: Die Kunden wählen sie aus Gründen, die nichts damit zu tun haben, billiger zu sein. Sie müssen nicht jedes Quartal die Kostenkurve eines Rivalen im Auge behalten und müssen nicht fürchten, morgen unterboten zu werden. Genau das meint Duan Yongping mit Differenzierung. Das ist ein gutes Geschäftsmodell.

  Noch ein Schritt allerdings. In einem Geschäft, in dem der Preis funktioniert, baut irgendwann ein Unternehmen einen so großen Kostenvorsprung auf, dass die Kosten aller Rivalen über den eigenen liegen. Ist dieses Unternehmen ein gutes Geschäft?

  Es ist zweifellos eine gute Firma. Ob es ein gutes Geschäft ist, hängt davon ab, wie diese Niedrigkosten-Position errungen wurde und ob sie gehalten werden kann.

  Ein Vorteil, der auf Skala beruht, hält länger. Skala bekommt man nicht durch eine einzige Entscheidung. Sie braucht jahrelange Ausgaben und angesammelte Aufträge. Ein Rivale kann genau verstehen, wie man es gemacht hat, und es trotzdem nicht über Nacht kopieren – die Lager, das Zustellnetz, die Konditionen bei den Lieferanten brauchen Zeit und Geld, um aufgebaut zu werden. Und je größer man ist, desto niedriger die Stückkosten, was wiederum mehr Geld gibt, um den Abstand weiter zu vergrößern. Das nährt sich selbst.

  Aber das hat seinen Preis. Die Gewinndecke der Firma wird festgeschrieben. Sie muss die Preise auf einem Niveau halten, das die Rivalen unbehaglich genug macht, um sich nicht zu rühren. Hebt sie die Preise hoch genug, um auffällige Margen zu verdienen, bekommen Wettbewerber einen Grund, einzusteigen. Der Preiskrieg beginnt von vorn.

  Sie kann also nur so viel verdienen, wie ihr genügt, um sich selbst gut zu stellen, ohne andere hereinzulocken. Das ist das beste Ergebnis, das eine gute Firma in dieser Art von Geschäft erreichen kann. Es ist immer noch nicht das, was ein gutes Geschäft ausmacht.

  **In einem Geschäft, in dem Preiskriege funktionieren, gibt es keine echten Gewinner. Wer übrig bleibt, ist einfach der Betreiber, der länger durchhalten und tiefer schneiden konnte. Ein wirklich gutes Geschäft ist eines, in dem ein Preiskrieg gar nicht erst in Gang kommt.**
