title: "Perché un business che si vince sul prezzo è un cattivo business: la lezione di Kweichow Moutai e Pop Mart per la distribuzione in ogni mercato"
description: "La distribuzione cinese sostituisce continuamente un formato con uno più economico, e nessuno guadagna per molto. La domanda di Duan Yongping sui modelli di business indica un test semplice: se abbassare i prezzi porta clienti, quell'attività è strutturalmente spietata."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping, investitore e imprenditore cinese le cui opinioni sugli investimenti sono seguite da vicino in Cina, ripete da anni la stessa cosa: si guarda prima al modello di business e si cerca la differenziazione.

  Ma cosa conta davvero come un buon modello di business? E cosa conta come differenziazione?

  Qualche giorno fa un post su questo sito descriveva un andamento della distribuzione cinese: appena compare un formato più efficiente, spiana quello precedente. Le catene di supermercati hanno spianato i grandi magazzini statali. Il commercio elettronico ha spianato gli ipermercati. Ora arrivano le consegne istantanee di generi alimentari — piccoli magazzini di quartiere che spediscono gli ordini in pochi minuti — per prendersi i supermercati.

  Ci ho rimuginato sopra da allora, e credo di aver afferrato una parte della spiegazione.

  **Un business in cui le guerre dei prezzi funzionano non è un buon business.**

  Ecco la logica. Se nel proprio settore abbassare i prezzi porta clienti in modo affidabile, a tutti i partecipanti tocca la stessa sorte: una lunga tritatura fatta di tagli ai costi e guadagni di efficienza. O si diventa l'operatore che stringe di più, o si viene stritolati e buttati fuori dal mercato da quell'operatore.

  E costi ed efficienza non si misurano rispetto al proprio passato. Si misurano rispetto ai concorrenti, ogni trimestre, senza fermarsi. Nel momento in cui un rivale trova un modo vero per tagliare i costi o alzare l'efficienza, bisogna allinearsi subito. Perché quando il prezzo perde il suo vantaggio, il cliente se ne va.

  La distribuzione al dettaglio è l'esempio più chiaro di business in cui il prezzo funziona. Aziende diverse vendono più o meno gli stessi beni, quindi ciò che le distingue di più è il prezzo. Se si vuole una fetta più grande del mercato, la si deve cercare nel prezzo. Gli acquirenti sono sensibilissimi. Vendendo lo stesso articolo un po' più caro, se ne vanno e basta.

  Perché la distribuzione sembra un mercato enorme e vivace, mentre in realtà è uno dei business in cui è più difficile guadagnare. L'operatore efficiente distrugge quello inefficiente, poi arriva un operatore ancora più efficiente e distrugge quello. Nessuno riesce a guadagnare bene a lungo.

  Allora, com'è un business in cui le guerre dei prezzi non funzionano?

  Prendiamo Kweichow Moutai, il produttore cinese di baijiu — un liquore distillato e limpido —, le cui bottiglie sono trattate come regali e oggetti di status, spesso a prezzi di centinaia di dollari o più. Un'altra azienda può vendere liquori molto più a basso prezzo e non portare via nemmeno un cliente a Moutai. Ciò che gli acquirenti vogliono è il marchio, l'immagine che dà loro, il prezzo stesso. Se Moutai abbassasse il prezzo, si danneggerebbe da sola. Qui una guerra dei prezzi non può nemmeno iniziare.

  Oppure prendiamo Pop Mart, l'azienda cinese dietro i giocattoli Labubu in scatole cieche diventati una mania globale. Il cliente paga per il design e per la sensazione, non per il costo della plastica. Un rivale può fare una copia più economica e non cambia niente, perché non si può copiare la sensazione di «devo assolutamente averlo questo».

  Ciò che questi business hanno in comune è semplice: i clienti li scelgono per ragioni che non hanno nulla a che fare con l'essere più economici. Non devono tenere d'occhio la linea di costi di un rivale ogni trimestre, né temere di essere sottobattuti domani. È questo che Duan Yongping intende per differenziazione. Questo è un buon modello di business.

  Un altro passo, però. In un business in cui il prezzo funziona, prima o poi un'azienda costruisce un vantaggio di costi così grande che i costi di tutti i rivali stanno sopra i suoi. Quell'azienda è un buon business?

  È certamente una brava azienda. Se sia un buon business dipende da come ha ottenuto quella posizione di bassi costi e se riesce a mantenerla.

  Un vantaggio costruito sulla scala dura di più. La scala non si ottiene con una sola decisione. Servono anni di spese e ordini accumulati. Un rivale può capire esattamente come si è fatto e ancora non riuscire a copiare da un giorno all'altro — i magazzini, la rete di consegne, le condizioni con i fornitori richiedono tempo e denaro per essere costruiti. E più si è grandi, più basso è il costo unitario, il che dà più denaro per allargare ancora il divario. Si nutre da solo.

  Ma questo ha un prezzo. Il tetto dei profitti dell'azienda resta bloccato. Deve mantenere i prezzi a un livello che metta a disagio i rivali abbastanza da non farli muovere. Alzandoli abbastanza da ottenere margini vistosi, i concorrenti hanno un motivo per entrare. E la guerra dei prezzi ricomincia.

  Quindi può guadagnare solo quanto basta per stare comoda senza invitare altri a entrare. È il miglior risultato che una brava azienda può ottenere in questo tipo di business. Resta comunque diverso da ciò che si intende per un buon business.

  **In un business in cui le guerre dei prezzi funzionano non ci sono veri vincitori. Chi rimane in piedi è semplicemente l'operatore che è riuscito a resistere più a lungo e a tagliare più in profondità. Un buon business è quello in cui la guerra dei prezzi non decolla affatto.**
