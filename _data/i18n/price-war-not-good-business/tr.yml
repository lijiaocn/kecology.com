title: "Fiyat avantajıyla kazanılan iş neden kötü bir iştir: Kweichow Moutai ve Pop Mart'ın dünya perakendesine öğrettikleri"
description: "Çin perakendesinde her format, daha ucuz bir başkasıyla yer değiştiriyor ve kimse uzun süre para kazanamıyor. Duan Yongping'in iş modellerine ilişkin sorusu basit bir sınava işaret ediyor: fiyat düşürmek müşteri getiriyorsa, iş yapısal olarak acımasızdır."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Yatırıma dair görüşleri Çin'de yakından takip edilen Çinli yatırımcı ve işadamı Duan Yongping, yıllardır aynı şeyi söylüyor: önce iş modeline bak, sonra onu rakiplerinden ayıran şeyi ara.

  Peki iyi bir iş modeli tam olarak nedir? Farklılaşma sayılan şey ne?

  Birkaç gün önce bu sitede Çin perakendesindeki bir örüntü anlatılmıştı: daha verimli bir format ortaya çıkar çıkmaz öncekindi düzleştiriyor. Zincir süpermarketler devlet işletmesi büyük mağazaları düzleştirdi. E-ticaret hipermarketleri düzleştirdi. Şimdi de anında teslimat marketleri — mahallelerdeki küçük depolardan dakikalar içinde sipariş çıkaran yapılar — süpermarketlere yöneliyor.

  O günden beri bunu düşünüyorum ve sanırım nedenin bir parçasını yakaladım.

  **Fiyat savaşlarının işe yaradığı bir iş, iyi bir iş değildir.**

  Mantık şu: sektörünüzde fiyat düşürmek güvenilir biçimde müşteri getiriyorsa, her katılımcının kaderi aynıdır: maliyetleri düşürmek ve verimliliği artırmak için uzun soluklu bir mücadele. Ya en sert sıkan operatör siz olursunuz ya da o operatör sizi pazardan iter.

  Üstelik maliyet ve verimlilik kendi geçmişinize göre ölçülmez; rakiplerinize göre ölçülür, her çeyrek dönem, hiç ara vermeden. Rakip, maliyet düşürmenin ya da verimliliği artırmanın gerçek bir yolunu bulur bulmaz siz de hemen aynısını yapmak zorundasınız. Çünkü fiyatınız avantajını bir kez yitirdi mi, müşteri gidiyor.

  Perakende, fiyatın işe yaradığı işin en açık örneği. Farklı şirketler büyük ölçüde aynı malları satıyor; aralarındaki en büyük fark fiyat. Daha fazla pay istiyorsanız, onu fiyatta bulmanız gerekiyor. Alıcılar fiyata son derece duyarlı. Aynı ürünü biraz daha pahalı satınca, gidiyorlar.

  İşte bu yüzden perakende kocaman, canlı bir pazar gibi görünür ama aslında para kazanılması en zor işlerden biridir. Verimli olan verimsizi yok eder, ardından daha verimlisi gelip onu yok eder. Kimse uzun süre iyi para kazanamaz.

  Peki fiyat savaşlarının işe yaramadığı bir iş nasıl görünür?

  Kweichow Moutai'yi ele alalım; Çinli bir baijiu üreticisi — baijiu berrak bir içkidir — ve Moutai'nin şişeleri hediye ve statü simgesi olarak görülür, çoğu zaman yüzlerce dolara ya da daha fazlasına fiyatlanır. Başka bir şirket içkiyi çok daha ucuza satabilir ve yine de Moutai'nin müşterilerinden birini bile alamaz. Alıcıların istediği şey marka, markanın onlara verdiği "yüz" ve fiyatın ta kendisi. Moutai fiyatını düşürse kendine zarar verir. Burada fiyat savaşı hiç başlayamaz.

  Ya da dünya çapında bir çılgınlığa dönüşen Labubu sürpriz kutulu oyuncaklarının ardındaki Çin şirketi Pop Mart'ı alın. Müşteri tasarım ve his için ödeme yapar, plastiğin maliyeti için değil. Rakip daha ucuz bir kopya yapabilir, bu hiçbir şeyi değiştirmez; çünkü "bunu mutlaka almalıyım" hissi kopyalanamaz.

  Bu işlerin ortak noktası basit: müşteriler onları ucuz olmakla ilgisi olmayan nedenlerle seçiyor. Her çeyrek dönem rakibin maliyet çizgisini izlemek zorunda değiller, yarın birinin fiyatı düşüreceği endişesini de taşımıyorlar. Duan Yongping'in farklılaşmadan kastı bu. İyi iş modeli de bu.

  Bir adım daha. Fiyatın işe yaradığı yerde, sonunda öyle bir şirket maliyet avantajı kurar ki tüm rakiplerin maliyeti kendi maliyetinin üstünde kalır. Bu şirket iyi bir iş mi?

  Kuşkusuz iyi bir şirket. İyi bir iş olup olmadığı, bu düşük maliyetli konumun nasıl kazanıldığına ve korunup korunamayacağına bağlı.

  Ölçek üzerine kurulu avantaj daha uzun sürer. Ölçek tek bir kararla gelmez; yılların harcaması ve biriken siparişlerle oluşur. Rakip tam olarak ne yaptığınızı bilebilir ve yine de bir gecede kopyalayamaz — depolar, teslimat ağı, tedarikçi koşullarının hepsi zaman ve para ister. Üstelik büyüdükçe birim maliyetiniz düşer, farkı daha da açmak için elinize daha fazla para geçer. Bu kendi kendini besler.

  Ama bunun bedeli var. Şirketin kâr tavanı kilitlenir. Fiyatları, rakipleri harekete geçmeyecek kadar rahatsız edici bir düzeyde tutmak zorundadır. Göz alıcı marjlar için fiyatları yeterince yükseltin, rakiplerin pazara girmek için bir nedeni olur. Fiyat savaşı yeniden başlar.

  Bu yüzden ancak kimseyi cezbetmeden kendisini rahat ettirecek kadar kazanabilir. İyi bir şirketin bu tür bir işte ulaşabileceği en iyi sonuç budur. Yine de bu, iyi bir işin görünümü değildir.

  **Fiyat savaşlarının işe yaradığı işlerde gerçek kazanan yoktur. Ayakta kalan, sadece daha uzun süre dayanan ve daha derin kesen operatördür. Gerçekten iyi iş, fiyat savaşının hiç başlamadığı işlerdir.**
