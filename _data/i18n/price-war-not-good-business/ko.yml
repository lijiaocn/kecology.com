title: "가격으로 이길 수 있는 사업이 왜 나쁜 사업인가: 구이저우 마오타이와 팝마트가 말하는 유통의 본질"
description: "중국 유통업은 더 싼 업태가 기존 업태를 계속 밀어내지만, 아무도 오래 돈을 벌지 못한다. 사업 모델에 관한 Duan Yongping의 질문은 한 가지 단순한 판별 기준을 가리킨다. 가격을 내려 고객을 끌어올 수 있다면 그 사업은 구조적으로 잔인하다."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  중국의 투자자이자 사업가로 투자에 대한 견해가 국내에서 주목받는 Duan Yongping(두안 융핑)은 수년째 같은 말을 해왔다. 먼저 사업 모델을 보라. 그리고 차별화를 찾으라.

  그런데 좋은 사업 모델이란 무엇인가. 차별화란 또 무엇인가.

  며칠 전 이 사이트에는 중국 유통업의 한 패턴을 다룬 글이 올라왔다. 더 효율적인 업태가 등장하면 기존 업태를 밀어 쓰러뜨린다는 내용이었다. 체인 슈퍼가 국영 백화점을 밀어냈고, 이커머스가 하이퍼마켓을 무너뜨렸다. 이제는 즉시 배송 식료품——몇 분 안에 주문을 처리하는 작은 동네 창고——가 슈퍼를 노리고 있다.

  그 뒤로 줄곧 이 생각을 되씹어왔고, 그 이유의 한 조각을 잡은 것 같다.

  **가격 경쟁으로 이길 수 있는 사업은 좋은 사업이 아니다.**

  논리는 이렇다. 가격만 내리면 확실히 고객을 끌어올 수 있는 업종이라면 참여자 모두의 운명은 정해져 있다. 비용을 깎고 효율을 높이는 길고 지난한 싸움을 해야 한다. 가장 집요하게 깎는 사업자가 되거나, 그 사업자에게 시장에서 밀려나거나 둘 중 하나다.

  더구나 비용과 효율은 과거의 자신과 비교하는 게 아니다. 분기마다, 쉬지 않고 경쟁사와 비교된다. 라이벌이 진짜로 비용을 줄이거나 효율을 높이는 방법을 찾는 순간 당장 따라가야 한다. 가격에서 우위를 잃는 순간 고객은 떠나버리니까.

  가격이 먹히는 사업의 가장 뚜렷한 예가 유통업이다. 여러 회사가 대체로 같은 상품을 팔기 때문에 가장 큰 차이가 가격에서 생긴다. 장사를 더 키우려면 가격에서 답을 찾아야 한다. 쇼핑객은 가격에 매우 민감하다. 같은 물건을 조금만 비싸게 팔아도 그냥 떠난다.

  그래서 유통은 크고 활기찬 시장처럼 보이지만 실제로는 돈 벌기가 가장 어려운 사업 중 하나다. 효율적인 업체가 비효율적인 업체를 무너뜨리고, 더 효율적인 업체가 다시 그 업체를 무너뜨린다. 아무도 오랫동안 제대로 된 돈을 벌지 못한다.

  그럼 가격 경쟁이 먹히지 않는 사업은 어떤 모습일까.

  구이저우 마오타이(Kweichow Moutai)를 보자. 중국의 baijiu(백주) 제조사다. baijiu는 맑은 증류주이고, 마오타이 병은 선물이자 지위의 상징으로 취급되며 수백 달러 이상의 가격이 붙는 일이 흔하다. 다른 회사가 훨씬 싸게 술을 팔아도 마오타이의 고객은 한 명도 옮기지 않는다. 구매자가 원하는 건 브랜드이고, 그것이 주는 체면이며, 가격 자체다. 마오타이가 가격을 내리면 스스로를 깎아내린다. 여기서는 가격 경쟁이 시작조차 되지 않는다.

  팝마트(Pop Mart)도 마찬가지다. 전 세계적 열풍이 된 Labubu 블라인드 박스 완구를 만든 중국 회사다. 고객은 플라스틱 원가가 아니라 디자인과 그 느낌에 돈을 낸다. 경쟁사가 더 싼 모조품을 만들어도 달라지는 건 없다. '이건 꼭 가져야 해'라는 느낌은 복제할 수 없기 때문이다.

  이 사업들의 공통점은 간단하다. 고객이 고르는 이유가 더 싸다는 것과 아무 관련이 없다. 분기마다 경쟁사의 원가선을 지켜볼 필요도, 내일 가격이 깎일까 걱정할 필요도 없다. Duan Yongping이 말한 차별화가 바로 이것이다. 이것이 좋은 사업 모델이다.

  한 걸음 더 나아가 보자. 가격이 먹히는 사업에서는 결국 한 회사가 너무나 큰 원가 우위를 쌓아 라이벌 전부의 원가가 자사보다 높아지는 지점에 이른다. 이 회사는 좋은 사업일까.

  분명 좋은 회사다. 하지만 좋은 사업인지는 그 낮은 원가의 위치를 어떻게 얻었는지, 그리고 그것을 지킬 수 있는지에 달려 있다.

  규모로 만든 우위는 더 오래 간다. 규모는 한 번의 결정으로 얻어지지 않는다. 수년간의 지출과 쌓인 주문이 필요하다. 라이벌이 방법을 정확히 알아도 하루아침에 따라 할 수는 없다. 창고, 배송망, 공급처 조건 모두 시간과 돈을 들여야 갖춰진다. 그리고 몸집이 커질수록 단가가 내려가고, 그만큼 격차를 더 벌릴 돈이 늘어난다. 스스로를 키우는 순환이다.

  다만 대가가 있다. 회사의 이익 상한이 고정된다. 라이벌이 움직이지 않을 만큼 불편한 가격을 유지해야 한다. 눈에 띄는 마진을 얻으려고 가격을 크게 올리면 경쟁사에 진입할 이유를 준다. 가격 경쟁이 다시 시작된다.

  결국 다른 이를 유혹하지 않고 자신이 편안할 정도의 이익밖에 벌 수 없다. 이런 사업에서 좋은 회사가 도달할 수 있는 최선의 결과가 그것이다. 여전히 좋은 사업의 모습은 아니다.

  **가격 경쟁이 먹히는 사업에는 진짜 승자가 없다. 끝까지 남는 건 더 오래 버티고 더 깊이 깎은 사업자일 뿐이다. 진짜 좋은 사업은 가격 경쟁이 애초에 붙지도 않는 사업이다.**
