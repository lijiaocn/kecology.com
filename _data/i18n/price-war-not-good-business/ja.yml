title: "価格で勝てるビジネスは、なぜ悪いビジネスなのか——貴州茅台とポップマートが示す小売の本質"
description: "中国の小売は、より安い業態が次々と古い業態を置き換えてきたが、誰も長く利益を上げられない。ビジネスモデルをめぐるDuan Yongpingの問いが、単純な判定基準を示している——値下げで客を奪えるなら、そのビジネスは構造的に過酷だ。"
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  中国の投資家・実業家で、投資に関する見解が国内で熱心に追われているDuan Yongping（段永平）は、長年、同じことを言い続けてきた。まずビジネスモデルを見よ。そして差別化を探せ、と。

  では、良いビジネスモデルとは何か。差別化とは、具体的に何を指すのか。

  数日前、このサイトで中国の小売についてこんな傾向を書いた。新しい、より効率的な業態が現れると、それまでの業態をなぎ倒す、というものだ。チェーンスーパーが国営デパートを追いやり、ネット通販がハイパーマーケットを潰した。次は即時配達の食料品——数分で注文を捌く小さな地域倉庫——がスーパーを狙っている。

  それ以来、このことをずっと考えている。そして、理由の一片をつかんだ気がしている。

  **価格競争で勝てるビジネスは、良いビジネスではない。**

  理屈は単純だ。値下げさえすれば確実に客を奪える商売では、参加者全員が同じ運命をたどる。コストを削り、効率を上げる際限のない消耗戦だ。自分が一番徹底して削れる側になるか、そうした相手に市場から締め出されるか。その二つしかない。

  しかもコストや効率は、過去の自分と比べられるのではない。四半期ごとに、休みなく、競合と比べられる。ライバルが本当にコストを下げる方法や効率を上げる方法を見つけた瞬間、こちらもすぐに追随しなければならない。価格で優位を失った瞬間、客は消えるからだ。

  価格が効くビジネスの典型が、小売だ。各社がほぼ同じ商品を売るため、一番の差別化要因が価格になる。シェアを増やしたいなら、価格の中で探すしかない。買い物客は価格に極めて敏感だ。同じ商品を少し高く売れば、彼らは立ち去る。

  だから小売は、巨大で活気ある市場に見えながら、実際には最も儲けにくいビジネスのひとつだ。効率的な業者が非効率的な業者を潰し、さらに効率的な業者が現れてその業者を潰す。誰も長く十分な利益を上げられない。

  では、価格競争が効かないビジネスとは、どんなものだろうか。

  貴州茅台（Kweichow Moutai）を例に取ろう。中国のbaijiu（白酒）メーカーだ。baijiuは透明な蒸留酒で、茅台のボトルは贈り物でありステータスシンボルとして扱われ、数百ドル、あるいはそれ以上の値がつくことも珍しくない。別の会社がもっと安く酒を売っても、茅台の客は一人も移らない。買い手が求めているのはブランドであり、それが持たせる体面であり、価格そのものだ。茅台が値下げすれば、自分で自分を傷つける。価格競争はここでは始まることすらできない。

  ポップマート（Pop Mart）もそうだ。世界的なブームになったLabubuのブラインドボックスおもちゃを手がけた中国企業だ。客が払うのはデザインとその感覚であり、プラスチックの原価ではない。ライバルが安い模造品を作っても、何も変わらない。「これを絶対に手に入れたい」という気持ちは、コピーできないからだ。

  これらのビジネスに共通しているのは単純なことだ。客が選ぶ理由が、安いことと一切関係ない。競合のコスト曲線を四半期ごとに見張る必要も、明日値下げされる心配をする必要もない。Duan Yongpingが言う差別化とは、まさにこのことだ。これが良いビジネスモデルだ。

  もう一歩、先に進もう。価格が効くビジネスでは、やがてある会社が圧倒的なコスト優位を築き、ライバル全員のコストが自社を上回る状態になる。この会社は良いビジネスだろうか。

  間違いなく良い会社だ。しかし、それが良いビジネスかどうかは、その低コストの地位をどう勝ち取ったか、そしてそれを維持できるかにかかっている。

  規模で築いた優位は長く続く。規模は一度の決断で手に入るものではない。何年もの投資と、積み重ねた受注が必要だ。ライバルがやり方を完全に理解しても、一夜で真似することはできない。倉庫も、配送網も、仕入れ条件も、時間と金をかけて初めて築ける。そして大きくなるほど単価が下がり、その分だけ差をさらに広げる資金が増える。自分で自分を強くしていく循環だ。

  ただし、代償がある。この会社の利益の天井が固定される。ライバルが動かない程度に不快な価格を保たなければならない。目を引く利幅を得ようと価格を大きく上げれば、競合が参入する理由を与えてしまう。価格競争が再開されるのだ。

  つまり、他社を誘わずに自分が心地よくいられる範囲の利益しか稼げない。こうしたビジネスで良い会社が達成できる最良の結果が、それだ。それでも、良いビジネスの姿には及ばない。

  **価格競争が効くビジネスに、本当の勝者はいない。最後まで残るのは、より長く削り、より深く削れた事業者にすぎない。本当に良いビジネスとは、価格競争がそもそも始まらないビジネスのことだ。**
