title: "Pourquoi une activité qu'on gagne en baissant les prix est une mauvaise activité : la leçon de Kweichow Moutai et Pop Mart pour le commerce de détail partout dans le monde"
description: "Le commerce de détail chinois remplace sans cesse un format par un autre, moins cher, et personne ne gagne de l'argent bien longtemps. La question que pose Duan Yongping sur les modèles économiques conduit à un test simple : si baisser les prix attire les clients, l'activité est structurellement impitoyable."
image: /assets/img/blog/price-war-not-good-business/price-war-cover.png

body: |
  Duan Yongping, investisseur et homme d'affaires chinois dont les vues sur l'investissement sont suivies de près en Chine, répète depuis des années la même chose : commencez par le modèle économique, et cherchez la différenciation.

  Mais qu'est-ce qui fait, au juste, un bon modèle économique ? Et qu'est-ce qui fait la différenciation ?

  Il y a quelques jours, un article de ce site décrivait une règle du commerce de détail chinois : dès qu'un format plus efficace apparaît, il aplatit le précédent. Les chaînes de supermarchés ont aplati les grands magasins d'État. Le commerce en ligne a aplati les hypermarchés. Voici que les courses à livraison immédiate — de petits entrepôts de quartier qui expédient les commandes en quelques minutes — s'en viennent chercher les supermarchés.

  Je retourne ça dans ma tête depuis, et je crois avoir saisi une partie de la réponse.

  **Une activité où la guerre des prix fonctionne n'est pas une bonne activité.**

  Voici le raisonnement. Si, dans votre secteur, baisser vos prix vous gagne régulièrement des clients, chaque acteur a le même destin : une longue usure faite de réductions de coûts et de gains d'efficacité. Ou vous devenez l'exploitant qui serre le plus, ou c'est lui qui vous serre jusqu'à vous éjecter du marché.

  Et coûts et efficacité ne se mesurent pas à votre propre passé. Ils se mesurent face à vos concurrents, chaque trimestre, sans répit. Dès qu'un rival trouve une vraie façon de baisser ses coûts ou d'améliorer son efficacité, vous devez l'imiter immédiatement. Car dès que votre prix perd son avantage, le client s'en va.

  Le commerce de détail est l'exemple le plus net d'activité où le prix fait la loi. Des entreprises différentes vendent à peu près les mêmes biens, si bien que ce qui les distingue le plus, c'est le prix. Si vous voulez faire plus d'affaires, c'est dans le prix qu'il faut les chercher. Les acheteurs y sont extrêmement sensibles. Vendez le même article un peu plus cher et ils partent, tout simplement.

  C'est pourquoi le commerce de détail ressemble à un marché immense et animé alors qu'il est, en réalité, l'une des activités où il est le plus difficile de gagner de l'argent. L'acteur efficace détruit l'inefficace, puis un acteur plus efficace arrive et détruit celui-là. Personne ne garde longtemps de bons bénéfices.

  Alors, à quoi ressemble une activité où la guerre des prix ne fonctionne pas ?

  Prenez Kweichow Moutai, le fabricant chinois de baijiu — une boisson spiritueuse claire —, dont les bouteilles sont traitées comme des cadeaux et des objets de statut, souvent vendues plusieurs centaines de dollars ou plus. Une autre entreprise peut vendre de l'alcool bien moins cher sans pour autant prendre un seul client à Moutai. Ce que les acheteurs veulent, c'est la marque, l'image qu'elle leur donne, le prix lui-même. Si Moutai baissait ses prix, elle se ferait du tort. Ici, une guerre des prix ne peut même pas démarrer.

  Ou prenez Pop Mart, l'entreprise chinoise derrière les jouets Labubu en boîtes surprises devenus une folie mondiale. Le client paie pour le design et pour la sensation, pas pour le coût du plastique. Un rival peut proposer une copie moins chère, cela ne change rien : on ne copie pas ce sentiment : « il me faut celui-là ».

  Ce que ces activités ont en commun est simple : les clients les choisissent pour des raisons qui n'ont rien à voir avec le fait d'être moins cher. Elles n'ont pas à surveiller la ligne de coûts d'un rival chaque trimestre, ni à redouter d'être dépassées par un prix plus bas demain. C'est cela que Duan Yongping appelle la différenciation. C'est un bon modèle économique.

  Un pas de plus, pourtant. Dans une activité où le prix fait la loi, une entreprise finit par bâtir un avantage de coût si large que les coûts de tous ses rivaux se situent au-dessus des siens. Est-ce pour autant une bonne activité ?

  C'est assurément une bonne entreprise. Mais savoir si c'est une bonne activité dépend de la façon dont cette position de bas coût a été gagnée, et de ce qu'elle peut durer.

  Un avantage bâti sur l'échelle dure plus longtemps. L'échelle ne s'obtient pas par une seule décision. Elle demande des années de dépenses et de commandes accumulées. Un rival peut comprendre exactement comment vous avez fait et rester incapable de copier du jour au lendemain — les entrepôts, le réseau de livraison, les conditions négociées avec les fournisseurs prennent du temps et de l'argent à construire. Et plus vous êtes grand, plus votre coût unitaire baisse, ce qui vous donne davantage de moyens pour creuser encore l'écart. Cela s'auto-alimente.

  Mais cela a un prix. Le plafond de bénéfice de l'entreprise se trouve verrouillé. Elle doit maintenir ses prix à un niveau qui gêne assez les rivaux pour qu'ils ne bougent pas. Les remonter assez haut pour afficher des marges flatteuses donne aux concurrents une raison d'entrer. Et la guerre des prix reprend.

  Elle ne peut donc gagner que ce qui lui suffit pour être à l'aise sans attirer personne d'autre. C'est le meilleur résultat qu'une bonne entreprise puisse obtenir dans ce genre d'activité. Ce n'est toujours pas ce qu'on appelle une bonne activité.

  **Dans une activité où la guerre des prix fonctionne, il n'y a pas de vrais vainqueurs. Celui qui reste debout est simplement l'exploitant qui a su serrer plus longtemps et tailler plus profond. Une vraie bonne activité est celle où la guerre des prix ne démarre jamais.**
