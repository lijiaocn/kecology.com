title: "Meituan ของจีนจะรักษาที่ในหัวคน เวลาจะใช้จ่ายแถวบ้านไว้ได้ไหม"
description: "Meituan แอปบริการในชีวิตประจำวันเจ้าใหญ่ของจีน ที่คิดว่าเป็นแค่แอปส่งอาหาร แต่ตัวทำเงินจริงๆ อยู่อีกที่ บันทึกสะเปะสะปะเรื่องเครือข่ายส่งของ โครงสร้างกำไร Douyin และ AI"
image: "/assets/img/blog/meituan-local-consumption-mindshare/cover-th.jpg"
body: |
  ความคิดยังไม่ชัดเท่าไหร่ คิดได้แค่ไหนก็เขียนแค่นั้น เขียนไปจัดความคิดไป เลยจะรกๆ หน่อยนะ

  ผมค้างคาใจเรื่อง Meituan มานานแล้ว รู้สึกว่ามันมีอะไรไม่เหมือนใคร แต่บอกไม่ถูกว่าต่างตรงไหน ตอนแรกที่เริ่มสนใจ เพราะกำลังหาตัวเลือกนอกจาก Tencent เครือข่ายส่งของของ Meituan ตอนนี้กลายเป็นโครงสร้างพื้นฐานของการใช้จ่ายออฟไลน์ในจีนไปแล้ว ดูแวบๆ คล้าย "Tencent ฝั่งออฟไลน์"

  เครือข่ายนี้คือการส่งด่วนแบบทันที และเงื่อนไขให้มันเดินได้นั้นโหดมาก

  ในรัศมี 3 กิโลเมตร ภายใน 30 นาที ต้องมีออเดอร์ ร้านค้า และคนส่งของครบพอ ถึงจะเกิดเป็นตารางเล็กๆ ที่ทำกำไรได้ แล้วต้องเอาตารางเล็กๆ แบบนี้จำนวนมหาศาลมาต่อกันให้เป็นเครือข่ายส่งด่วนที่ขยายขนาดได้ ขอบเขตของเครือข่ายยังถูกกำหนดด้วยการกระจายตัวของผู้คน ถ้าอยากเป็นแบรนด์ระดับประเทศ ก็ต้องทำซ้ำกระบวนการนี้ในทุกเมือง

  การสร้างเครือข่ายแบบนี้ขึ้นใหม่ ต้องใช้เงิน คน เทคโนโลยี ความสามารถด้านการจัดการ และฝีมือในการทำการตลาดกับปฏิบัติการ ถ้าอยากเลียนแบบ Meituan ให้มีเครือข่ายระดับอำเภอกว่า 2,000 แห่งทั่วประเทศ เงินที่ต้องลงไปอาจมากพอจะซื้อ Meituan ได้เลย

  ถ้ามองจากต้นทุนในการสร้างทดแทน คุณค่าของเครือข่ายส่งด่วนนี้สูงมาก

  แต่ต้นทุนสร้างใหม่สูง ไม่ได้แปลว่าจะทำเงินได้แน่ๆ ถ้าพยายามรีดกำไรจากเครือข่ายนี้ให้หนาขึ้น ฝั่งออเดอร์ ร้านค้า หรือคนส่งของ ฝั่งใดฝั่งหนึ่งอาจพังทันที แล้วเครือข่ายทั้งก้อนก็ล่มตามไปด้วย การจะให้มันเดินต่อได้ ต้องลงทุนไม่หยุดเพื่อรักษาความหนาแน่นของอุปทานทั้งสามฝั่ง ขณะที่กำไรต่อออเดอร์นับกันเป็นสลึงเป็นบาท

  ถ้ามองในแง่หาเงิน เครือข่ายส่งด่วนไม่ใช่สินทรัพย์ที่ดีเท่าไหร่

  ถ้า Meituan คือบริการส่งของล้วนๆ ก็ไม่น่าสนใจเลย แต่ผมรู้สึกว่ามันน่าจะเป็นอะไรอย่างอื่นด้วย แล้วอะไรล่ะ จนได้เห็นโครงสร้างกำไรสุทธิของ Meituan ที่ AI สรุปให้ ผมถึงเริ่มเข้าใจ

  บริการส่งอาหารกับค้าปลีกด่วน (闪购) ที่วิ่งอยู่บนเครือข่ายนี้ ดูผิวเผินแล้วกำไรต่อออเดอร์บางเฉียบ แกว่งนิดเดียวก็ขาดทุน แต่กำไรที่เห็นนั่นเป็นแค่ส่วนหนึ่งของผลตอบแทน ทุกออเดอร์ยังพ่วงประโยชน์พิเศษที่ธุรกิจแต่ละตัวนับรวมเองไม่ได้

  สั่งอาหารสั่งของด่วนซ้ำๆ ไป คนใช้ก็ค่อยๆ ฝังความรู้สึกว่า เปิด Meituan แล้วหาของใกล้ตัวได้หมด พอมีเรื่องอยากใช้จ่ายแถวบ้าน ก็จะนึกถึงการเปิด Meituan เสิร์ชก่อน และการเสิร์ชแต่ละครั้งที่มีใจจะซื้อ ก็เป็นรายได้ให้ Meituan ทั้งจากโฆษณาหรือค่าคอมมิชชันหลังปิดดีลสำเร็จ

  ผู้ใช้เรียก Meituan ว่าแอปส่งอาหาร หรือแอปจักรยานเช่า ตามความถี่ที่ตัวเองใช้ แต่โครงสร้างกำไรสุทธิบอกว่านั่นไม่ใช่แก่นของมัน เพราะธุรกิจที่คนใช้มากที่สุด ไม่ใช่ตัวที่ทำเงินมากที่สุด ส่งอาหารไม่ได้ให้กำไรโดยตรงมากสุด ส่วนใหญ่ของกำไรมาจากดีลกรุ๊ปบาย (团购) กับที่พัก

  ประโยชน์พิเศษที่ทุกออเดอร์บนเครือข่ายส่งด่วนพ่วงมาด้วย คือรากฐานที่แท้จริงของ Meituan ประโยชน์พิเศษนั้นก็คือ การรักษาไว้ว่า Meituan เป็นประตูแรกในหัวผู้ใช้เวลาจะใช้จ่ายแถวบ้าน

  สิ่งที่ Meituan ทำจริงๆ คือการเป็นประตูแรกของการใช้จ่ายในท้องถิ่น

  มันเริ่มจากดีลกรุ๊ปบาย แล้วขยายไปบัตรเข้าชม ที่พัก ส่งอาหาร ซื้อยา ส่งเหล้า การเดินทาง ซูเปอร์มาร์เก็ต แบตสำรองเช่า และธุรกิจสารพัด ธุรกิจเหล่านี้เกื้อหนุนกัน บางตัวสร้างกำไร บางตัวตอกย้ำการรับรู้ พอมันมาเรียงกันอยู่ตรงหน้าผู้ใช้ ก็บอกเรื่องเดียวกัน คือ ที่นี่มีของใช้จ่ายแถวบ้านครบที่สุด

  Meituan จะทำเงินได้เท่าไหร่ ขึ้นอยู่กับว่ามีคนมองว่ามันเป็นประตูแรกของการใช้จ่ายในท้องถิ่นมากแค่ไหน พฤติกรรมการใช้จ่ายแถวบ้านของคนคนหนึ่งยาวนานเป็นสิบๆ ปี ประตูที่อยู่อันดับหนึ่งในใจคน จะได้ออกโรงในการตัดสินใจใช้จ่ายมหาศาลในอนาคต และทุกครั้งที่ได้เข้าไปเกี่ยว ก็อาจมีกำไรตามมา

  เวลามอง Meituan ต้องคิดถึงคำถามเหล่านี้

  เวลามีความต้องการใช้จ่ายแถวบ้าน คนจะไปหาที่ไหน และ Meituan ยังเป็นประตูแรกที่ใช้ตัดสินใจอยู่ไหม การจะรักษาที่ประตูแรกไว้ ต้องเชื่อมบริการท้องถิ่นให้ได้มากที่สุด แล้วธุรกิจใหม่ๆ เหล่านี้กำลังสร้างคุณค่าหรือเผากำไร และที่ต้องระวังกว่านั้นคือ การค้นหา ตัดสินใจ และจบธุรกรรมในการใช้จ่ายท้องถิ่น ในอนาคตจะมีรูปแบบใหม่ๆ เกิดขึ้นหรือเปล่า

  ธุรกิจส่งอาหารไม่ใช่ปัญหาแล้ว โอกาสที่จะเกิดสงครามส่งอาหารรอบใหม่ต่ำมาก ส่งอาหารพิสูจน์แล้วว่าไม่ได้แค่ตอกย้ำภาพ Meituan ในฐานะประตูแรกของการใช้จ่ายท้องถิ่น แต่ยังสร้างกำไรได้ด้วยตัวเอง และด้วยต้นทุนการสร้างและดูแลเครือข่ายส่งด่วนที่สูงลิบ มันจึงกลายเป็นกำแพงที่สูงที่สุด

  ความท้าทายอยู่ที่การค้นหาและการตัดสินใจ

  Douyin (แอปคลิปสั้นของ ByteDance ในจีน) พิสูจน์แล้วว่าดีลกรุ๊ปบายขายผ่านคลิปสั้นได้ แม้วิธีนี้จะไม่กลายเป็นช่องทางหลักของการค้นหาและตัดสินใจเรื่องใช้จ่ายท้องถิ่น แต่ Douyin ก็กำลังลองใช้หน้าภายในแอปและแอปแยกต่างหากมารับการค้นหาด้วยตัวเองของผู้ใช้ เมื่อคิดถึงแรงส่งจากทราฟฟิกที่มันอัดได้ ความทะเยอทะยานของ Douyin ประมาทไม่ได้

  ยังมีของใหม่อีกอย่าง คือ AI ที่ช่วยตัดสินใจเรื่องใช้จ่ายท้องถิ่น

  ByteDance กับ Alibaba ที่มีพลัง AI แข็งแกร่ง ต่างก็จ้องตลาดท้องถิ่นมานาน เจตนาจะแซงหน้าแทบไม่ปิดบัง ถ้าฉากนี้ถูกพิสูจน์ว่าไปได้จริง Meituan จะใช้ความสั่งสมในตลาดท้องถิ่นแย่งส่วนแบ่งอันดับหนึ่งไว้ได้ หรือจะถูกคู่แข่งตัวเบาล้มเอา เพราะธุรกิจของตัวเองดึงกันไปมา มือซ้ายสู้มือขวา ผลประโยชน์พันกันยุ่งเหยิง
