title: "La cinese Meituan riuscirà a restare il primo posto dove cerchiamo cosa fare e comprare vicino a casa?"
description: "Appunti disordinati, pensando ad alta voce: la rete di consegne immediate di Meituan, l'abitudine di aprirla per prima per qualsiasi cosa nei dintorni e la pressione di video brevi e IA."
image: /assets/img/blog/meituan-local-consumption-mindshare/cover-it.png

body: |
  Le idee non sono ancora chiare. Scrivo quello che mi viene, alla rinfusa, e intanto metto in ordine.

  È un po' che Meituan, la piattaforma cinese di servizi locali, mi frulla in testa. Ho la sensazione che abbia qualcosa di particolare, ma non so dire cosa. Ho cominciato a guardarla perché cercavo un'alternativa a Tencent. La sua rete di consegne mi sembra già l'infrastruttura della spesa offline in Cina, un po' come una Tencent del mondo fisico.

  Quella rete è di consegne immediate, e le condizioni per farla girare sono dure.

  Nel giro di circa 3 km e in 30 minuti bisogna mettere insieme abbastanza ordini, negozi e fattorini da far funzionare in utile una piccola griglia. Poi si uniscono tantissime griglie fino a ottenere una rete di consegne che si possa gestire su larga scala. E i confini della rete dipendono da dove vive la gente: per diventare un marchio nazionale bisogna rifare tutto da capo in ogni città.

  Costruire da zero una rete di consegne immediate richiede un mucchio di soldi e di persone, più tecnologia, gestione, promozione e operatività. Chi volesse imitare Meituan, con le sue oltre 2.000 reti a livello di contea, spenderebbe forse abbastanza da comprarsi Meituan.

  Per costo di ricostruzione, la rete vale moltissimo.

  Ma costare tanto da rifare non vuol dire far guadagnare in sicurezza. Se provi a tirarne fuori più profitto, ordini, negozi o fattorini possono crollare di colpo, e con loro tutta la rete. Per tenerla in piedi bisogna continuare a metterci risorse per mantenere la densità dei tre lati, mentre l'utile di ogni ordine si conta in centesimi.

  Come bene per fare soldi, una rete di consegne immediate non è granché.

  Se Meituan fosse solo consegne, non varrebbe la pena guardarla. Ma continuo a sentire che è anche qualcos'altro. Cosa? Quando ho visto come un'IA scomponeva l'utile netto di Meituan, mi si è accesa la lampadina.

  Il cibo a domicilio, la spesa lampo e il resto, che viaggiano su quella rete, sembrano attività a margine sottilissimo: ogni ordine lascia quasi niente e basta un piccolo scossone per andare in perdita. Ma quel profitto in superficie è solo una parte del ritorno. Ogni ordine porta con sé anche un beneficio extra che non si riesce a contabilizzare dentro i singoli business.

  Ordine dopo ordine, l'utente si fa un'idea: su Meituan si trova quello che c'è nei dintorni. Così, quando gli viene voglia di spendere vicino a casa, pensa di cercare lì. E ogni ricerca fatta con la voglia di comprare porta a Meituan pubblicità o una commissione a trattativa conclusa.

  Gli utenti la vedono per quanto la usano: «l'app del cibo a domicilio», «le bici in condivisione». Ma l'utile netto dice che non è questa la sua essenza, perché il business più usato non è quello che guadagna di più. Il cibo a domicilio non è quello che contribuisce di più in modo diretto; la fetta grossa viene dalle offerte di gruppo e dagli alloggi.

  Quello che regge Meituan è il beneficio extra che ogni ordine sulla rete di consegne porta con sé. E quel beneficio extra è questo: far sì che Meituan resti, nella testa degli utenti, la porta d'ingresso ai consumi locali.

  Quello che Meituan fa davvero è diventare la prima cosa che apri quando vuoi spendere vicino a casa.

  È partita dalle offerte di gruppo e si è allargata a biglietti, alloggi, cibo a domicilio, farmacia, consegna di alcolici, mobilità, supermercato, power bank... un business dopo l'altro. Alcuni fanno utile, altri servono soprattutto a rafforzare l'idea, ma messi uno accanto all'altro davanti all'utente dicono la stessa cosa: qui c'è il più completo dei consumi locali.

  Quanto guadagnerà Meituan dipende da quante persone la considerano la prima porta. I consumi locali di una persona durano decenni. L'ingresso che sta al primo posto nella testa della gente sarà presente in una massa enorme di decisioni d'acquisto future, e ogni volta che entra in gioco può portare profitto.

  Guardando Meituan, bisogna chiedersi:

  Quando uno ha voglia di consumare qualcosa vicino a sé, dove cerca? Meituan è il primo posto in cui decide? Per mantenere quel ruolo bisogna collegare più servizi locali possibile: questi nuovi business creano valore o bruciano utili? E soprattutto: scoperta, decisione e acquisto dei consumi locali potrebbero prendere una forma nuova?

  Il cibo a domicilio non è più il problema. Una nuova grande guerra delle consegne è molto improbabile. Ha già dimostrato non solo di rafforzare Meituan come prima porta dei consumi locali, ma anche di generare utile in proprio e, visto il costo altissimo di creare e mantenere una rete di consegne immediate, di essere la barriera più alta.

  Le sfide stanno nella scoperta e nella decisione.

  Douyin (il TikTok cinese) ha già dimostrato che le offerte di gruppo si vendono con i video brevi. Non sarà il modo principale per scoprire e scegliere nei consumi locali, ma Douyin sta anche sperimentando pagine interne e perfino un'app indipendente per intercettare la ricerca attiva degli utenti. Con la spinta di traffico che può dare, le sue ambizioni non vanno sottovalutate.

  E poi c'è una novità: l'IA che aiuta a decidere i consumi locali.

  ByteDance e Alibaba, con un'IA potentissima, hanno gli occhi puntati da tempo sui consumi locali, e la voglia di sorpassare si vede lontano un miglio. Se questo scenario regge, Meituan si prenderà la quota più grande grazie a tutto quello che ha accumulato nel locale, o verrà rovesciata da rivali più leggeri mentre la sua mano destra e la sua mano sinistra si pestano i piedi per interessi incrociati?
