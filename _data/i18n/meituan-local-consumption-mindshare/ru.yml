title: "Останется ли китайская Meituan первым приложением, которое мы открываем за всем, что рядом?"
description: "Сумбурные заметки вслух: сеть быстрой доставки Meituan, привычка открывать её первой для любых местных трат и давление со стороны коротких видео и ИИ."
image: /assets/img/blog/meituan-local-consumption-mindshare/cover-ru.png

body: |
  Мысли ещё не улеглись. Пишу как получается, всё вперемешку, и разбираюсь по ходу дела.

  Уже давно что-то бормочу себе под нос про Meituan, китайский сервис местных услуг. Чувствую, что в нём есть что-то особенное, но где именно это «особенное», сказать не могу. Заинтересовался я им, когда искал вариант не на Tencent. И мне показалось, что сеть доставки Meituan стала чем-то вроде инфраструктуры офлайн-потребления, и в ней смутно проглядывает этакий офлайновый Tencent.

  Сеть Meituan — это сеть быстрой доставки, а условия у неё жёсткие.

  В радиусе примерно трёх километров и за полчаса нужно собрать достаточно заказов, достаточно магазинов и ресторанов и достаточно курьеров, чтобы получилась небольшая сетка, которая приносит прибыль. Потом из множества таких сеток складывается сеть, которую можно масштабировать. Границы сети задаёт то, как расселены люди, так что стать общенациональным брендом можно, только повторив всё это в каждом городе.

  Строить новую сеть быстрой доставки — это большие деньги, много людей, технологии, умение управлять и продвигаться. Если бы кто-то захотел повторить Meituan с её двумя с лишним тысячами сетей на уровне уездов, то потратил бы, пожалуй, достаточно, чтобы просто купить саму Meituan.

  По стоимости воспроизведения такая сеть стоит очень дорого.

  Но дорого построить — не значит стабильно зарабатывать. Попробуешь выжать из сети чуть больше прибыли — и предложение с одной из трёх сторон (заказы, магазины или курьеры) может сразу обвалиться, а следом рухнет и вся сеть. Чтобы всё держалось, надо постоянно вливать ресурсы и поддерживать плотность предложения по всем трём сторонам, а прибыль с заказа считается копейками.

  Если смотреть, как на этом заработать, то сеть быстрой доставки — не лучший актив.

  Если Meituan — это просто доставка, то и следить за ней не стоит. Но мне упорно кажется, что это ещё что-то. Что именно? Когда я увидел структуру чистой прибыли Meituan, которую выдал ИИ, до меня наконец дошло.

  Доставка еды, быстрые покупки и прочее, что ездит по этой сети, выглядят почти бесприбыльными: на каждом заказе крохи, чуть просел объём — и вот уже убыток. Но видимая прибыль — только часть отдачи. У каждого заказа есть ещё дополнительная польза, которую внутри самого этого бизнеса не посчитаешь.

  Заказ за заказом у пользователя складывается представление: в Meituan есть всё, что вокруг. Потом, когда ему нужно что-то купить или куда-то сходить рядом, он думает: надо поискать там. А каждый поиск с намерением потратить деньги приносит Meituan рекламу или комиссию после сделки.

  Мы, пользователи, называем приложение по тому, чем пользуемся чаще: «доставка еды», «прокат велосипедов». Но структура чистой прибыли показывает, что суть Meituan не в этом: самое востребованное направление не самое прибыльное. Доставка еды напрямую приносит не больше всех, основная прибыль идёт от групповых купонов и отелей.

  Фундамент Meituan — это дополнительная выгода от каждого заказа в сети доставки. И эта выгода в том, что Meituan остаётся в голове у пользователя дверью в местное потребление.

  На самом деле Meituan занята тем, чтобы быть первым местом, куда идут, когда хочется что-то потратить недалеко от дома.

  Начиналось всё с групповых скидок, потом добавились билеты, жильё, еда, аптека, доставка алкоголя, поездки, супермаркеты, павербанки — и так далее. Эти направления подпирают друг друга: одни приносят прибыль, другие закрепляют образ. Когда они лежат рядом, они твердят одно и то же: здесь самый полный набор местных услуг.

  Сколько заработает Meituan — зависит от того, сколько людей считают её первой дверью в местное потребление. А человек тратит деньги на местные нужды десятилетиями. Дверь, которая в его голове стоит первой, будет работать в несметном числе будущих решений, и каждый раз это может превратиться в прибыль.

  Глядя на Meituan, стоит спросить себя вот о чём.

  Где люди ищут, когда им нужно потратить деньги рядом с домом, и остаётся ли Meituan первой дверью для такого решения? Чтобы удержать это место, нужно подключать как можно больше местных сервисов, и тут вопрос: новые направления создают ценность или сжигают прибыль? А главное, не пропустить другое: не появятся ли у поиска, выбора и самой покупки местных услуг новые формы?

  С едой уже всё ясно. Новая большая война доставки маловероятна. Еда доказала, что не только укрепляет образ Meituan как первой двери в местное потребление, но и сама приносит прибыль, а из-за огромной стоимости создания и содержания сети быстрой доставки становится самым высоким барьером.

  Сложнее с поиском и выбором.

  Douyin (китайский TikTok от ByteDance) показал, что групповые купоны можно продавать через короткие видео. Главным способом находить и выбирать местные услуги это, скорее всего, не станет, но Douyin пробует перехватывать и осознанный поиск пользователей: через страницы внутри приложения и отдельный продукт. Учитывая, какой поддержкой для этого служит его трафик, недооценивать его замысел не стоит.

  И есть ещё новое: ИИ, который помогает решать, где тратить деньги рядом с домом.

  У ByteDance и Alibaba сильный ИИ, обе давно положили глаз на местное потребление, и желание обогнать Meituan на этом повороте они не скрывают. Если сценарий окажется рабочим, получит ли Meituan самую большую долю за счёт всего накопленного в местных услугах? Или её опрокинет налегке бегущий соперник, а ей помешают переплетённые интересы, когда правая рука воюет с левой?
