title: "¿Podrá la china Meituan seguir siendo la primera app que abrimos para el consumo local?"
description: "Notas desordenadas, pensando en voz alta: la red de reparto inmediato de Meituan, el reflejo de abrirla primero para cualquier cosa del barrio y la presión del vídeo corto y la IA."
image: /assets/img/blog/meituan-local-consumption-mindshare/cover-es.jpg

body: |
  Todavía no lo tengo claro. Voy apuntando lo que se me ocurre, todo revuelto, y ordeno las ideas sobre la marcha.

  Llevo tiempo rumiando sobre Meituan, la plataforma china de servicios locales. Tengo la sensación de que tiene algo distinto, pero no sabría decir qué. Me fijé en ella porque buscaba una opción que no fuera Tencent. Su red de reparto ya me parece la infraestructura del gasto físico en China, algo así como una Tencent de lo offline.

  Esa red es de reparto inmediato, y las condiciones para que funcione son duras.

  En un radio de unos 3 km y en 30 minutos hay que reunir suficientes pedidos, comercios y repartidores para que una pequeña cuadrícula dé beneficios. Luego se unen muchísimas cuadrículas hasta formar una red de reparto que se pueda escalar. Y los límites de la red los pone dónde vive la gente, así que, para ser una marca nacional, hay que repetir todo ese proceso en cada ciudad.

  Montar una red de reparto desde cero cuesta mucho dinero y mucha gente, además de tecnología, gestión y capacidad de marketing y operaciones. Quien quisiera copiar a Meituan y tener más de 2.000 redes a nivel de condado probablemente gastaría lo suficiente como para comprar la propia Meituan.

  Por coste de reconstrucción, la red vale muchísimo.

  Pero que reconstruirla sea carísimo no significa que dé dinero con seguridad. Si intentas sacarle más margen, puede que de golpe se hundan los pedidos, los comercios o los repartidores, y con ellos toda la red. Para que siga en pie hay que seguir metiendo recursos y mantener la densidad de los tres lados, mientras que lo que deja cada pedido se cuenta en céntimos.

  Para ganar dinero, una red de reparto inmediato no es un gran activo.

  Si Meituan fuera solo reparto, no merecería la pena fijarse en ella. Pero sigo teniendo la sensación de que es algo más. ¿El qué? Al ver cómo una IA desglosaba el beneficio neto de Meituan, algo hizo clic.

  La comida a domicilio, las compras exprés y demás que circulan por esa red parecen de margen finísimo: cada pedido deja casi nada y una pequeña sacudida lo convierte en pérdida. Pero ese margen visible es solo una parte de lo que se gana. Cada pedido trae además un beneficio extra que no se puede contabilizar dentro de cada negocio.

  Pedido tras pedido, el usuario va formándose una idea: en Meituan se encuentra de todo lo que tiene cerca. Así que, cuando le apetece gastar por la zona, piensa en mirar ahí. Y cada búsqueda hecha con ganas de comprar le da a Meituan publicidad o una comisión cuando se cierra la compra.

  Los usuarios la vemos según lo que más usamos: «la app de comida a domicilio», «las bicis compartidas». Pero el beneficio neto dice que esa no es su esencia, porque lo más usado no es lo que más dinero da. La comida a domicilio no es lo que más beneficio aporta directamente; lo que más pesa son las ofertas de grupo y los alojamientos.

  Lo que de verdad sostiene a Meituan es el beneficio extra de cada pedido en la red de reparto. Y ese beneficio extra es este: mantener en la cabeza del usuario que Meituan es la puerta de entrada al consumo local.

  Lo que Meituan hace de verdad es ser lo primero que abres cuando quieres gastar cerca de casa.

  Empezó con las ofertas de grupo y se fue extendiendo a entradas, alojamiento, comida a domicilio, farmacia, reparto de licores, movilidad, supermercado, baterías portátiles... un negocio tras otro. Unos dejan dinero y otros sobre todo refuerzan la marca, pero, puestos uno junto a otro delante del usuario, dicen lo mismo: aquí está lo más completo en consumo local.

  Cuánto gane Meituan depende de cuánta gente la tenga como primera puerta. El gasto local de una persona dura décadas. La entrada que ocupe el primer lugar en la cabeza de la gente estará presente en una cantidad enorme de decisiones de compra futuras, y cada vez que participe puede llevarse algo.

  Al mirar a Meituan, hay que hacerse unas cuantas preguntas:

  Cuando alguien quiere consumir algo cerca, ¿dónde busca? ¿Es Meituan el primer sitio donde decide? Para conservar ese lugar hay que enchufar cuantos más servicios locales mejor: ¿esos negocios nuevos aportan valor o se comen el beneficio? Y, sobre todo, ¿podrían el descubrimiento, la decisión y la compra del consumo local tomar una forma nueva?

  El reparto de comida ya no es el problema. Que haya otra gran guerra del delivery es muy improbable. Ya ha demostrado que no solo refuerza la idea de Meituan como primera puerta del consumo local, sino que además da beneficios por sí solo y, por lo carísimo que es crear y mantener una red de reparto inmediato, es la barrera más alta.

  Donde hay retos es en el descubrimiento y la decisión.

  Douyin (el TikTok chino) ya ha demostrado que las ofertas de grupo se pueden vender con vídeo corto. No será la forma dominante de descubrir y decidir el consumo local, pero Douyin también está probando páginas internas y hasta una app independiente para captar la búsqueda activa del usuario. Con el empujón de tráfico que puede darle, sus ambiciones no se pueden subestimar.

  Y hay otra novedad: la IA como ayuda para decidir el consumo local.

  ByteDance y Alibaba, con una IA potentísima, llevan tiempo con el ojo puesto en el consumo local, y sus ganas de adelantar por la derecha se les notan a la legua. Si este escenario se demuestra válido, ¿Meituan se llevará la mayor cuota gracias a todo lo que ha acumulado en lo local, o la tumbará un rival ligero de equipaje mientras ella se enreda con los intereses cruzados de su mano izquierda y su mano derecha?
