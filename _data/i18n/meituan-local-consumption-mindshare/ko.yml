title: "중국 메이퇀(美团), 동네 소비의 '첫 번째 앱' 자리를 지킬 수 있을까"
description: "중국 배달·생활서비스 앱 메이퇀. 배달 회사인 줄 알았는데 진짜 돈 되는 건 따로 있었다. 배달망 비용, 이익 구조, 더우인과 AI의 도전까지 생각나는 대로 적은 메모."
image: "/assets/img/blog/meituan-local-consumption-mindshare/cover-ko.jpg"
body: |
  생각이 아직 정리가 안 됐다. 떠오르는 대로 쓰고, 쓰면서 정리해 보는 어수선한 메모다.

  메이퇀(美团)이 계속 마음에 걸렸다. 뭔가 다른 구석이 있는 것 같은데, 그게 뭔지 설명이 안 됐다. 처음 눈여겨본 건 텐센트 말고 다른 선택지를 찾던 때였다. 메이퇀의 배달망은 이미 중국 오프라인 소비의 인프라가 됐고, 어렴풋이 '오프라인판 텐센트' 같은 느낌이 있었다.

  메이퇀의 배달망은 즉시배달이고, 돌아가는 조건이 까다롭기 짝이 없다.

  반경 3km, 30분 안이라는 좁은 범위 안에 주문, 가게, 라이더가 충분히 모여야 수지가 맞는 작은 격자 하나가 만들어진다. 그런 격자를 잔뜩 엮어야 비로소 규모를 낼 수 있는 배달망이 된다. 게다가 망의 경계는 사람들이 어디에 사느냐에 묶여 있어서, 전국 브랜드가 되려면 도시마다 같은 과정을 처음부터 다시 해야 한다.

  새로 만들려면 돈, 사람, 기술, 관리, 홍보 운영 능력이 다 필요하다. 메이퇀처럼 전국 2000개가 넘는 현(县) 단위로 배달망을 깔겠다고 하면, 들어가는 돈으로 차라리 메이퇀을 사는 편이 나을 수도 있다.

  재구축 비용으로만 보면 즉시배달망의 가치는 엄청나게 높다.

  하지만 다시 만들기 어렵다고 해서 돈을 꾸준히 번다는 뜻은 아니다. 이 망에서 이익을 더 짜내려 들면 주문, 가게, 라이더 중 어느 한쪽 공급이 곧바로 무너지고, 그러면 망 전체가 흔들릴 수 있다. 망을 굴리려면 세 쪽의 공급 밀도를 지키려고 계속 돈을 써야 하는데, 한 건당 이익은 푼돈 단위로 센다.

  돈을 버는 자산으로만 보면 즉시배달망은 그리 좋은 자산이 아니다.

  메이퇀이 곧 즉시배달이라면 굳이 지켜볼 회사가 아니다. 그런데 자꾸 배달망만은 아닌 다른 무언가처럼 보였다. 그게 뭘까. AI가 정리해 준 메이퇀 순이익 구성을 보고서야 감이 왔다.

  이 배달망 위에서 돌아가는 배달, 즉시 소매(闪购) 같은 사업은 겉보기엔 건당 이익이 얇아서, 조금만 흔들려도 적자가 된다. 그런데 눈에 보이는 이익은 수익의 일부일 뿐이다. 주문 한 건마다 그 사업 안에서는 장부에 잡히지 않는 덤이 따라붙는다.

  배달과 즉시 소매를 한 번 한 번 쓰다 보면, 사용자 머릿속에 '메이퇀에 들어가면 근처 온갖 소비가 다 있다'는 인식이 생긴다. 그래서 동네에서 뭔가 쓰고 싶을 때 메이퇀부터 검색하게 되고, 살 마음이 있는 검색 한 번 한 번이 광고 수입이나 거래 성사 후 수수료로 메이퇀에 들어간다.

  사용자는 쓰는 빈도 때문에 메이퇀을 배달앱이나 공유자전거로 여긴다. 하지만 순이익 구성은 그게 본질이 아니라고 말한다. 가장 많이 쓰는 사업이 가장 돈이 되는 사업은 아니기 때문이다. 배달이 직접 벌어들이는 이익은 가장 크지 않았다. 이익의 큰 몫은 공동구매 쿠폰(团购)과 숙박이었다.

  즉시배달망 위에서 주문 한 건마다 붙는 덤이 메이퇀의 뿌리라고 생각한다. 그 덤이란 바로 '동네 소비는 메이퇀'이라는 사용자 마음속 자리를 계속 지켜 주는 것이다.

  메이퇀이 진짜 하고 있는 일은, 사람들의 동네 소비에서 첫 번째 입구가 되는 것이다.

  공동구매에서 시작해 티켓, 숙박, 배달, 약, 술 배달, 이동, 마트, 보조배터리까지 온갖 사업으로 넓혀 왔다. 이 사업들은 서로 보완한다. 이익을 내는 쪽도 있고, 인식을 굳히는 쪽도 있다. 그것들이 한 화면에 나란히 뜰 때 전하는 메시지는 하나다. 동네에서 쓸 건 여기가 제일 다 있다.

  메이퇀이 얼마나 벌지는 몇 명이 메이퇀을 동네 소비의 첫 번째 입구로 여기느냐에 달려 있다. 한 사람의 동네 소비는 수십 년 이어진다. 마음속 1순위로 자리 잡은 입구는 앞으로 쏟아질 소비 결정마다 끼어들 것이고, 끼어들 때마다 이익이 될 수 있다.

  메이퇀을 볼 때 따져야 할 질문은 이렇다.

  사람들은 동네에서 뭔가 쓰고 싶을 때 어디에서 찾을까. 메이퇀이 그 결정의 첫 번째 문일까. 첫 번째 입구라는 인식을 지키려면 가능한 한 많은 동네 서비스를 붙여야 하는데, 그렇게 늘린 새 사업은 가치를 만들고 있을까, 이익을 까먹고 있을까. 그리고 가장 경계해야 할 건, 동네 소비를 찾고, 정하고, 끝내는 방식 자체가 앞으로 새로운 모습으로 바뀌지 않을까 하는 점이다.

  배달은 이제 문제가 아니다. 배달 대전이 다시 벌어질 가능성은 아주 낮다. 배달은 메이퇀이 동네 소비의 첫 번째 입구라는 인식을 굳혀 줄 뿐 아니라, 혼자서도 이익을 낼 수 있다는 걸 이미 보여 줬다. 게다가 즉시배달망은 만드는 데도 유지하는 데도 돈이 엄청나게 들어서, 가장 높은 진입장벽이 되어 준다.

  도전은 찾는 쪽과 정하는 쪽에서 온다.

  더우인(抖音, 바이트댄스의 중국 숏폼 앱)은 공동구매를 숏폼으로 팔 수 있다는 걸 보여 줬다. 이 방식이 동네 소비를 찾고 정하는 주류가 되지는 않을 거라고 본다. 하지만 더우인은 앱 안의 페이지와 별도 앱으로, 사용자가 직접 찾는 순간까지 가져가려 하고 있다. 트래픽을 얹어 줄 수 있는 힘을 생각하면 더우인의 야심을 우습게 볼 수 없다.

  새로운 변수도 하나 있다. AI가 동네 소비 결정을 돕는 것이다.

  AI 역량이 강한 바이트댄스와 알리바바는 둘 다 오래전부터 동네 소비를 노려 왔고, 추월하겠다는 속내를 숨기지 않는다. 이 장면이 실제로 성립한다고 판명되면, 메이퇀은 동네 소비에서 쌓아 온 것들을 무기로 가장 큰 점유율을 가져갈까. 아니면 왼손 오른손이 서로 싸우는 이해관계의 얽힘 때문에 몸이 가벼운 상대에게 뒤집힐까.
