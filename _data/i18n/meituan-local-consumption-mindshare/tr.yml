title: "Çin'in Meituan'ı Yerel Tüketimde 'Akla İlk Gelen Uygulama' Olma Yerini Koruyabilir mi?"
description: "Çin'in dev yerel hizmet uygulaması Meituan'ı yemek siparişi şirketi sanıyordum, asıl parayı başka yerden kazanıyormuş. Teslimat ağı, kâr yapısı, Douyin ve yapay zekâ üzerine dağınık notlar."
image: "/assets/img/blog/meituan-local-consumption-mindshare/cover-tr.png"
body: |
  Fikirlerim henüz net değil. Aklıma geldikçe yazıyorum, yazarken de kafamı toparlıyorum, o yüzden biraz dağınık olacak.

  Meituan içimde hep bir kurtçuk gibi duruyordu. Bir farkı var gibi hissediyordum ama o farkın nerede olduğunu söyleyemiyordum. İlk dikkatimi çekmesi, Tencent dışında bir seçenek aradığım döneme denk geliyor. Meituan'ın teslimat ağı artık Çin'de fiziksel dünyadaki harcamanın altyapısı gibi, ve belli belirsiz "çevrimdışı dünyanın Tencent'i" havası var.

  Bu ağ anlık teslimat ağı ve işlemesi için gereken koşullar çok sert.

  3 kilometrelik bir alanda, 30 dakikalık bir sürede yeterince sipariş, işletme ve kurye bir araya gelirse kâr eden küçük bir hücre ortaya çıkıyor. Sonra bu küçük hücrelerin çoğunu birleştirip ölçeklenebilir bir anlık teslimat ağı kuruyorsun. Ağın sınırlarını da nüfusun dağılımı belirliyor. Ülke çapında bir marka olmak istiyorsan aynı süreci her şehirde baştan tekrarlaman gerekiyor.

  Böyle bir ağı sıfırdan kurmak ciddi para, insan, teknoloji, yönetim becerisi ile tanıtım ve operasyon gücü ister. Meituan'ı taklit edip ülke çapında 2.000'den fazla ilçe düzeyinde ağ kurmaya kalkarsan, harcayacağın kaynakla belki Meituan'ın kendisini satın alırsın.

  Yeniden kurma maliyeti açısından bakınca anlık teslimat ağının değeri çok yüksek.

  Ama yeniden kurma maliyetinin yüksek olması, bu işin kesin kazandırdığı anlamına gelmiyor. Bu ağdan daha fazla kâr sıkmaya çalışırsan sipariş, işletme ya da kurye arzı bir anda çökebilir, arkasından da ağın tamamı dağılabilir. Ağı döndürmek için üç taraftaki arz yoğunluğunu korumak adına sürekli kaynak akıtmak gerekiyor, sipariş başına kâr ise kuruş hesabı.

  Para kazanma açısından bakarsak anlık teslimat ağı pek iyi bir varlık değil.

  Meituan sadece teslimat olsaydı üzerinde durmaya değmezdi. Ama onun sadece teslimat ağı olmadığını, başka bir şey olduğunu hissediyordum. Ne peki? Yapay zekânın çıkardığı Meituan net kâr dağılımına bakınca nihayet bir şey oturdu kafamda.

  Bu ağın üstünde dönen yemek siparişi ve anlık perakende (闪购) gibi işler, yüzeyden bakınca sipariş başına çok az kâr bırakıyor, azıcık dalgalansa zarara dönüyor. Ama görünen kâr, getirinin sadece bir kısmı. Her siparişin, kendi iş kolunun içinde ölçülemeyen bir ek faydası da var.

  Yemek ve anlık alışverişi tekrar tekrar kullanan kullanıcıda zamanla şu algı oluşuyor: Meituan'da yakındaki her türlü harcamanın karşılığı bulunur. Bu yüzden yakın çevrede bir şey harcamak istediğinde ilk iş Meituan'da aramak aklına geliyor. Satın alma niyetiyle yapılan her arama da Meituan'a ya reklam geliri ya da anlaşma tamamlandıktan sonra komisyon olarak dönüyor.

  Kullanıcılar, ne kadar sık kullandıklarına bakıp Meituan'a yemek uygulaması ya da paylaşımlı bisiklet diyor. Oysa net kâr dağılımı bunun Meituan'ın özü olmadığını gösteriyor, çünkü en çok kullanılan iş kolu en çok kazandıran değil. Yemek siparişinin doğrudan getirdiği kâr en yüksek değil. Kâr payının büyük kısmı grup indirimi (团购) ve konaklamadan geliyor.

  Anlık teslimat ağındaki her siparişin getirdiği ek fayda, Meituan'ın asıl temeli. O ek fayda şu: Meituan'ın, yerel harcamada ilk açılan kapı olduğu algısını ayakta tutmak.

  Meituan'ın gerçekten yaptığı şey, kullanıcının yerel harcamasında birinci giriş kapısı olmak.

  Grup indirimiyle başladı, sonra bilet, konaklama, yemek siparişi, ilaç, alkol teslimatı, ulaşım, market, şarj bankası kiralama ve daha nice işe yayıldı. Bu işler birbirini tamamlıyor. Kimi kâr getiriyor, kimi algıyı güçlendiriyor. Kullanıcının önünde yan yana durduklarında hepsi aynı şeyi söylüyor: yerel harcamanın en eksiksiz hali burada.

  Meituan'ın ne kadar kazanacağı, kaç kişinin onu yerel harcamanın ilk kapısı olarak görmesine bağlı. Bir insanın yerel harcaması onlarca yıl sürer. Zihinlerde bir numaraya oturan giriş kapısı, gelecekteki sayısız harcama kararında devreye girecek ve her devreye girişinde kâr getirebilecek.

  Meituan'a bakarken şu sorulara bakmak gerekiyor:

  İnsanların yerel bir ihtiyacı çıktığında nerede arayacağı, ve Meituan'ın o karar sürecinde ilk kapı olup olmadığı. İlk kapı algısını korumak için olabildiğince çok yerel hizmeti ağa bağlamak gerekiyor, peki bu yeni işler değer mi üretiyor, yoksa kâr mı yakıyor? Daha da dikkat edilmesi gereken, yerel harcamada keşfetme, karar verme ve işi tamamlama sürecinin ileride yeni biçimlere bürünüp bürünmeyeceği.

  Yemek siparişi artık sorun değil. Yeni bir yemek siparişi savaşı çıkma ihtimali çok düşük. Yemek siparişi, Meituan'ın yerel harcamada ilk kapı olduğu algısını güçlendirmekle kalmadı, tek başına kâr da üretebildiğini kanıtladı. Üstelik anlık teslimat ağının kurulma ve işletme maliyeti öyle yüksek ki, bu iş en yüksek duvar haline geldi.

  Zorluk keşif ve karar tarafında.

  Douyin (ByteDance'in Çin'deki kısa video uygulaması) grup indirimlerinin kısa videoyla satılabileceğini kanıtladı. Bu yol, yerel harcamada keşif ve karar vermenin ana yolu olmayacak. Ama Douyin, uygulama içi sayfalar ve bağımsız bir uygulamayla kullanıcıların kendi yaptığı aramaları da karşılamayı deniyor. Üzerine akıtabileceği trafiğin gücü düşünülürse Douyin'in hırsı küçümsenemez.

  Bir de yeni bir şey var: yerel harcama kararlarına yardım eden yapay zekâ.

  Güçlü yapay zekâ yeteneğine sahip ByteDance ile Alibaba'nın ikisi de uzun zamandır yerel harcamaya göz dikmiş durumda, öne geçme niyetleri açık seçik ortada. Bu senaryo gerçekten tutarsa, Meituan yerel harcamada biriktirdikleriyle en büyük payı alacak mı, yoksa kendi iş kollarının birbiriyle çatışması, sağ elle sol elin kapışması, çıkarların birbirine dolanması yüzünden hafif ve çevik rakipler tarafından alt mı edilecek?
