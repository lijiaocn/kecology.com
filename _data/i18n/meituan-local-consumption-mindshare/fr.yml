title: "La Meituan chinoise restera-t-elle le premier réflexe pour consommer près de chez soi ?"
description: "Notes en vrac, en pensant à voix haute : le réseau de livraison instantanée de Meituan, l'habitude de l'ouvrir en premier pour tout ce qui est à côté, et la pression de la vidéo courte et de l'IA."
image: /assets/img/blog/meituan-local-consumption-mindshare/cover-fr.jpg

body: |
  Mes idées ne sont pas encore nettes. J'écris ce qui me passe par la tête, dans le désordre, et je range en route.

  Meituan, la plateforme chinoise de services de proximité, me trotte dans la tête depuis un moment. J'ai l'impression qu'elle a quelque chose de particulier, sans réussir à dire quoi. Je m'y suis intéressé au départ parce que je cherchais une option autre que Tencent. Son réseau de livraison me paraît déjà être l'infrastructure de la dépense hors ligne en Chine, un peu comme un Tencent du monde physique.

  Ce réseau, c'est de la livraison instantanée, et les conditions pour le faire tourner sont rudes.

  Dans un rayon d'environ 3 km et en 30 minutes, il faut réunir assez de commandes, de commerçants et de livreurs pour qu'une petite maille soit rentable. Ensuite, on assemble un grand nombre de ces mailles en un réseau qui peut passer à l'échelle. Or les limites du réseau dépendent de la répartition de la population : pour devenir une marque nationale, il faut refaire tout ça, ville après ville.

  Monter un nouveau réseau de livraison instantanée coûte énormément d'argent et de monde, sans compter la technique, la gestion, le marketing et l'exploitation. Qui voudrait copier Meituan avec ses plus de 2 000 réseaux à l'échelle des districts y laisserait peut-être de quoi racheter Meituan elle-même.

  Au coût de reconstruction, ce réseau vaut donc très cher.

  Mais coûter cher à refaire ne veut pas dire rapporter à coup sûr. Si on essaie d'en tirer plus de profit, les commandes, les commerçants ou les livreurs peuvent soudain décrocher, et tout le réseau s'effondre avec eux. Pour qu'il tienne, il faut continuer à injecter des ressources afin de garder la densité des trois côtés, alors que chaque commande ne laisse que quelques centimes.

  Pour gagner de l'argent, un réseau de livraison instantanée n'est pas un très bon actif.

  Si Meituan se résumait à de la livraison, ça ne vaudrait pas la peine d'y regarder. Mais j'ai toujours le sentiment que c'est autre chose aussi. Quoi ? En voyant comment une IA décomposait le bénéfice net de Meituan, j'ai fini par comprendre.

  Les repas livrés, les courses express et le reste, qui roulent sur ce réseau, ont l'air d'activités à marge ultra-mince : chaque commande ne laisse presque rien, et un petit à-coup suffit à la faire passer dans le rouge. Mais ce profit apparent n'est qu'une partie du rendement. Chaque commande apporte aussi un bénéfice supplémentaire qu'on ne peut pas comptabiliser dans chacune des activités.

  Commande après commande, l'utilisateur se met en tête que sur Meituan, on trouve ce qu'il y a autour de lui. Alors quand l'envie de dépenser près de chez lui se présente, il pense à chercher là. Et chaque recherche faite avec une vraie intention rapporte à Meituan de la publicité, ou une commission une fois l'affaire conclue.

  Les utilisateurs voient Meituan à travers ce qu'ils utilisent le plus : « l'appli de livraison de repas », « les vélos en libre-service ». Mais le bénéfice net montre que ce n'est pas son essence, parce que l'activité la plus utilisée n'est pas la plus rentable. La livraison de repas n'est pas celle qui rapporte le plus en direct ; le gros du profit vient des offres groupées et de l'hébergement.

  Ce qui fait la base de Meituan, c'est le bénéfice supplémentaire que chaque commande du réseau de livraison apporte. Et ce bénéfice supplémentaire, le voici : faire que Meituan reste, dans la tête des gens, la porte d'entrée de la consommation locale.

  Ce que Meituan fait vraiment, c'est devenir la première chose qu'on ouvre dès qu'on veut dépenser près de chez soi.

  Elle est partie des offres groupées, puis s'est étendue aux billets, à l'hébergement, à la livraison de repas, à la pharmacie, aux livraisons d'alcool, à la mobilité, aux courses, aux batteries externes... un métier après l'autre. Certains rapportent de l'argent, d'autres servent surtout à ancrer l'image, mais alignés sous les yeux de l'utilisateur, ils disent tous la même chose : c'est ici qu'on trouve le plus complet en consommation locale.

  Ce que Meituan gagnera dépend du nombre de gens qui en font leur première porte. La consommation locale d'une personne s'étale sur des décennies. L'entrée qui occupe la première place dans les esprits sera présente dans une masse de décisions d'achat à venir, et chaque fois qu'elle intervient, elle peut en tirer un profit.

  Quand on regarde Meituan, il faut se poser quelques questions :

  Quand quelqu'un a envie de consommer près de chez lui, où va-t-il chercher ? Meituan est-elle le premier endroit où il décide ? Pour garder cette place, il faut brancher le plus de services locaux possible : ces nouvelles activités créent-elles de la valeur, ou mangent-elles le profit ? Et surtout, la découverte, la décision et l'achat en consommation locale pourraient-ils prendre une forme nouvelle ?

  La livraison de repas n'est plus un sujet. Une nouvelle grande guerre de la livraison est très improbable. Elle a déjà prouvé qu'elle renforce l'image de Meituan comme première porte de la consommation locale, qu'elle crée du profit par elle-même et que, vu le coût colossal de création et d'entretien d'un réseau de livraison instantanée, elle constitue la barrière la plus haute.

  Les défis se jouent côté découverte et décision.

  Douyin (le TikTok chinois) a déjà prouvé que les offres groupées se vendent par vidéo courte. Ce ne sera pas la voie principale pour découvrir et choisir en consommation locale, mais Douyin explore aussi des pages internes et même une appli indépendante pour capter la recherche active des utilisateurs. Avec le coup de pouce de trafic dont il dispose, on aurait tort de sous-estimer ses ambitions.

  Et il y a une autre nouveauté : l'IA qui aide à décider d'une consommation locale.

  ByteDance et Alibaba, qui ont une IA puissante, lorgnent la consommation locale depuis longtemps, et leur envie de doubler tout le monde se lit sans peine. Si ce scénario s'avère solide, Meituan prendra-t-elle la plus grosse part grâce à tout ce qu'elle a accumulé dans le local, ou se fera-t-elle renverser par des rivaux plus légers pendant que sa main gauche et sa main droite se disputent des intérêts croisés ?
