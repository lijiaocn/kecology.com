title: "Bisakah Meituan dari Tiongkok Tetap Jadi Aplikasi Pertama yang Terpikir untuk Belanja dan Jajan Lokal?"
description: "Meituan, aplikasi layanan lokal raksasa dari Tiongkok. Kukira cuma perusahaan antar makanan, ternyata sumber untung besarnya di tempat lain. Catatan acak soal jaringan pengantaran, struktur laba, Douyin, dan AI."
image: "/assets/img/blog/meituan-local-consumption-mindshare/cover-id.png"
body: |
  Pikiranku belum rapi. Nulis sambil mikir, sambil beres-beres isi kepala, jadi maaf kalau agak berantakan.

  Sudah lama aku kepikiran terus soal Meituan. Rasanya ada yang beda dari perusahaan ini, tapi aku nggak bisa bilang bedanya di mana. Awalnya aku mulai memperhatikannya karena lagi cari pilihan selain Tencent. Jaringan pengantaran Meituan sudah jadi semacam infrastruktur belanja offline di Tiongkok, dan samar-samar mirip "Tencent-nya dunia offline".

  Jaringan itu adalah pengantaran instan, dan syarat supaya bisa jalan itu galak banget.

  Dalam radius 3 km dan waktu 30 menit, harus terkumpul cukup pesanan, merchant, dan kurir sampai terbentuk satu kotak kecil yang menguntungkan. Lalu banyak kotak kecil itu harus disambung jadi satu jaringan pengantaran instan yang bisa dijalankan dalam skala besar. Batas jaringan ditentukan oleh sebaran penduduk, jadi untuk jadi merek nasional, proses yang sama harus diulang di setiap kota.

  Membangun jaringan seperti itu dari nol butuh uang, tenaga, teknologi, kemampuan manajemen, plus kemampuan promosi dan operasional. Kalau mau meniru Meituan sampai punya 2.000-an jaringan tingkat kabupaten di seluruh negeri, dana yang dikeluarkan mungkin cukup untuk membeli Meituan sekalian.

  Dilihat dari biaya penggantian, nilai jaringan pengantaran instan ini tinggi sekali.

  Tapi biaya bangun ulang yang mahal bukan berarti pasti untung. Begitu kita coba memeras untung lebih tebal dari jaringan ini, pasokan pesanan, merchant, atau kurir bisa langsung runtuh, lalu seluruh jaringan ikut ambruk. Supaya tetap hidup, kita harus terus menyuntik dana untuk menjaga kepadatan pasokan di ketiga sisi, sementara untung per pesanan dihitung receh demi receh.

  Kalau dilihat sebagai mesin cari duit, jaringan pengantaran instan bukan aset yang bagus.

  Kalau Meituan cuma pengantaran, ya nggak perlu diperhatikan. Tapi aku merasa Meituan bukan cuma itu. Terus apa? Setelah melihat rincian laba bersih Meituan yang disusun AI, baru aku agak tercerahkan.

  Layanan antar makanan dan belanja kilat (闪购) yang jalan di atas jaringan itu, kelihatannya untung per pesanan tipis banget, goyang sedikit saja langsung rugi. Tapi laba yang tampak di permukaan itu baru sebagian dari manfaatnya. Tiap pesanan juga membawa manfaat tambahan yang nggak bisa dihitung di dalam bisnisnya sendiri.

  Dari pesanan makanan dan belanja kilat yang berulang-ulang, pengguna pelan-pelan punya kesan: di Meituan, semua kebutuhan di sekitar rumah bisa ditemukan. Jadi pas ada kebutuhan belanja lokal, mereka kepikiran cari dulu di Meituan, dan setiap pencarian yang memang ada niat beli menyumbang pemasukan buat Meituan, entah lewat iklan atau komisi setelah transaksi jadi.

  Pengguna menyebut Meituan aplikasi antar makanan atau sepeda sewa, sesuai seberapa sering mereka pakai. Tapi rincian laba bersihnya bilang itu bukan esensinya, karena bisnis yang paling banyak dipakai bukan yang paling menguntungkan. Antar makanan bukan penyumbang laba langsung terbesar. Bagian terbesar justru datang dari kupon grup (团购) dan penginapan.

  Manfaat tambahan dari tiap pesanan di jaringan pengantaran instan itulah fondasi Meituan. Manfaat tambahan itu adalah: menjaga posisi Meituan sebagai pintu pertama yang terpikir di kepala pengguna soal belanja lokal.

  Yang sebenarnya sedang dikerjakan Meituan adalah menjadi pintu masuk nomor satu untuk belanja lokal.

  Dimulai dari kupon grup, lalu melebar ke tiket, penginapan, antar makanan, beli obat, antar minuman keras, transportasi, supermarket, power bank sewa, dan macam-macam lagi. Bisnis-bisnis itu saling melengkapi: ada yang menyumbang laba, ada yang menguatkan kesan. Waktu semuanya tampil berdampingan di depan pengguna, pesannya sama: di sini paling lengkap untuk urusan lokal.

  Berapa banyak Meituan bisa menghasilkan tergantung berapa banyak orang yang menganggapnya pintu pertama untuk belanja lokal. Perilaku belanja lokal seseorang berlangsung puluhan tahun. Pintu masuk yang menempati peringkat pertama di benak orang akan berperan dalam begitu banyak keputusan belanja di masa depan, dan tiap kali ikut berperan, ada peluang menghasilkan laba.

  Waktu menilai Meituan, ada beberapa pertanyaan yang perlu diajukan.

  Saat orang butuh sesuatu di sekitar rumah, ke mana mereka mencari, dan apakah Meituan pintu pertama tempat mereka mengambil keputusan? Untuk mempertahankan posisi pintu pertama itu, Meituan harus menyambungkan layanan lokal sebanyak mungkin; apakah bisnis-bisnis baru itu menambah nilai atau malah membakar laba? Dan yang paling perlu diwaspadai: cara orang menemukan, memutuskan, dan menyelesaikan belanja lokal ke depan, apakah akan muncul bentuk baru?

  Soal antar makanan, itu sudah bukan masalah. Kemungkinan terjadi perang antar makanan lagi kecil sekali. Antar makanan sudah membuktikan bahwa ia bukan cuma memperkuat kesan Meituan sebagai pintu pertama belanja lokal, tapi juga bisa menghasilkan laba sendiri, dan karena biaya membangun serta merawat jaringan pengantaran instan begitu tinggi, ia jadi tembok pertahanan paling tinggi.

  Tantangannya ada di sisi menemukan dan memutuskan.

  Douyin (TikTok versi Tiongkok milik ByteDance) sudah membuktikan bahwa kupon grup bisa dijual lewat video pendek. Cara ini tidak akan jadi jalur utama orang menemukan dan memutuskan belanja lokal, tapi Douyin juga sedang menjajal halaman di dalam aplikasi dan aplikasi mandiri untuk menampung pencarian aktif pengguna. Mengingat dorongan trafik yang bisa digelontorkannya, ambisi Douyin tidak bisa dipandang sebelah mata.

  Selain itu ada satu hal baru: AI yang membantu keputusan belanja lokal.

  ByteDance dan Alibaba punya kemampuan AI yang kuat, dan sudah lama mengincar belanja lokal; niat menyalip itu kelihatan jelas. Kalau skenario ini terbukti jalan, apakah Meituan akan memanfaatkan akumulasi panjangnya di belanja lokal untuk merebut pangsa terbesar, atau malah ditumbangkan lawan yang lebih ringan karena bisnisnya sendiri saling berbenturan, tangan kiri lawan tangan kanan dengan kepentingan yang saling kusut?
