title: "中国の美団(メイトゥアン)は、「地元で何かしたい」の第一想起を守れるか"
description: "中国の生活サービス大手・美団。出前の会社だと思っていたら、本当の稼ぎどころは別にあった。配送網のコスト、利益の中身、抖音やAIの挑戦まで、考えながら書いたメモ。"
image: "/assets/img/blog/meituan-local-consumption-mindshare/cover-ja.png"
body: |
  まだ考えが固まっていない。思いついた順に書いて、書きながら整理していく、散らかったメモです。

  美団(メイトゥアン)のことが、ずっと頭の片隅に引っかかっている。ほかとは何か違う気がするのに、どこが違うのか言葉にできない。最初に目を向けたのは、テンセント以外の投資先を探していたときだった。美団の配送網は、中国の実店舗消費を支えるインフラのようになっていて、なんとなく「オフライン版のテンセント」っぽい匂いがした。

  あの配送網は即時配送で、回すための条件がやたら厳しい。

  半径3キロ、30分以内という範囲に、注文と店と配達員が十分な数そろって、ようやく採算の取れる小さなマス目ができる。そのマス目を大量に束ねて、はじめて規模を出せる即時配送網になる。しかも網の境界は人の住み方で決まってしまうので、全国ブランドになるには、街ごとに同じことをやり直すしかない。

  新しく作るには、お金も人も技術も管理力も、宣伝や運営の力もいる。美団をまねて全国2000以上の県レベルに網を張ろうとしたら、かかる投資額で美団そのものが買えてしまうかもしれない。

  作り直しのコストで見れば、即時配送網の価値はものすごく高い。

  ただ、作り直すのが大変だからといって、安定して儲かるわけではない。ここが厄介なところで、もっと利益を絞り出そうとすると、注文・店・配達員のどれかの供給がすぐに崩れて、網ごと壊れかねない。網を回し続けるには、三者の供給密度を保つために投資を続けるしかなく、そのくせ一件あたりの利益は、数円単位の世界だ。

  稼ぐ資産として見ると、即時配送網はあまりいい商売ではない。

  美団=即時配送なら、わざわざ注目する会社ではない。でも、どうしてもそれだけには見えなかった。じゃあ何なのか。AIに出してもらった美団の純利益の内訳を見て、やっと腑に落ちた。

  配送網の上に乗っている出前や「閃購」(即配のコンビニ・小売)は、一件ごとに見ると利益が薄く、ちょっと揺れただけで赤字になる。でも、その表向きの利益は取り分の一部にすぎない。一件ごとに、その事業の中では数えきれない「おまけの効果」がついてくる。

  出前や閃購を何度も使ううちに、ユーザーの中に「美団を開けば近所のいろんな店が見つかる」という感覚ができあがる。すると、地元で何か使いたくなったとき、まず美団で調べるようになる。そして、買う気のある検索の一回一回が、広告収入か、成約後の手数料として美団に入ってくる。

  ユーザーは、使う頻度で美団を「出前アプリ」や「シェア自転車」だと思っている。でも純利益の内訳は、それが本質ではないと言っている。一番よく使われる事業が、一番儲かっているわけではないからだ。出前が直接稼ぐ利益は最大ではなく、大きな柱はクーポン販売(団購)と宿泊だった。

  即時配送網の上で、一件ごとに積み上がる「おまけの効果」こそ、美団の土台だと思う。そのおまけとは、「地元で使うなら美団」というユーザーの頭の中の位置を、保ち続けていること。

  美団が本当にやっているのは、地元消費の第一の入口になること。

  団購から始まって、チケット、宿泊、出前、薬、お酒の配達、移動、スーパー、モバイルバッテリーまで、ありとあらゆる事業に広げてきた。これらは互いを補い合っていて、利益を出すものもあれば、認知を固めるものもある。画面に並んで出てくるとき、伝えているのは同じ一つのメッセージ。「地元で使うものは、ここに一番そろっている」。

  美団がどれだけ稼げるかは、どれだけの人が美団を地元消費の第一の入口と思うかで決まる。一人の人の地元消費は、何十年も続く。心の中で一番手に置かれた入口は、これから先の膨大な消費の判断のたびに出番があり、そのたびに利益になりうる。

  美団を見るときに考えたいのは、こういうことだ。

  地元で何か使いたくなったとき、人はどこで探すのか。美団は、その判断の最初の入口に立てているのか。第一入口という認識を保つには、できるだけ多くの地元サービスをつなぐ必要があるけれど、その新しい事業は価値を生んでいるのか、利益を食いつぶしているのか。そして一番警戒したいのは、地元消費の「見つける・決める・済ませる」という流れそのものに、この先新しい形が出てこないか、という点。

  出前はもう問題ではない。出前戦争がまた激しくなる可能性はかなり低い。出前は、美団が第一の入口だという認識を強めるだけでなく、それ単体でも利益を出せると証明した。しかも即時配送網は作るのも維持するのも桁違いに高くつくから、最も高い参入障壁にもなっている。

  試されているのは、「見つける」と「決める」のほう。

  抖音(ダウイン、バイトダンスの中国向けショート動画アプリ)は、団購をショート動画で売れると証明した。これが地元消費の「見つける・決める」の主流になることはないと思う。ただ抖音は、アプリ内のページや独立アプリで、ユーザーが自分で探す場面まで取りにいこうとしている。あの集客力の後押しを考えると、抖音の狙いは見くびれない。

  もう一つ、新しい要素がある。AIが地元消費の判断を手伝う、という話。

  AIに強いバイトダンスとアリババは、どちらも前から地元消費を狙っていて、追い越したいという気持ちが隠せていない。もしこの使い方が成り立つと分かったら、美団は地元消費でこれまで積み上げてきたものを武器に、一番大きなシェアを取れるのか。それとも、右手と左手が争う利害のもつれのせいで、身軽な相手にひっくり返されてしまうのか。
