title: "Can China's Meituan Hold Onto Local Commerce Mindshare?"
description: "Messy notes while thinking out loud: Meituan's on-demand delivery network, the habit of opening it first for anything nearby, and the pressure from short video and AI."
image: /assets/img/blog/meituan-local-consumption-mindshare/cover-en.png

body: |
  The thinking isn't fully sorted yet. Writing as I go, cleaning it up as I write.

  I've been circling Meituan for a while. Something about it feels distinct, but I couldn't name what. I first paid attention looking for a bet outside Tencent. Its delivery network already feels like infrastructure for offline spending in China—vaguely like an offline Tencent.

  That network is on-demand delivery, and the operating conditions are brutal.

  Inside about three kilometers and thirty minutes, you need enough orders, merchants, and couriers to form a profitable little grid. Then you stitch many of those grids into one on-demand network that can scale. Network borders are constrained by where people live, so going national means repeating that process city by city.

  Standing up on-demand networks takes serious money, people, tech, ops, and marketing. Trying to copy Meituan into 2,000-plus county-level networks nationwide might cost enough to just buy Meituan instead.

  On replacement cost alone, the network is worth a lot.

  High replacement cost doesn't mean easy profits. Push the network for thicker margins and the supply of orders, merchants, or couriers can tip over—and the whole thing can unravel. Keeping density on all three sides means constant spend. Per-order profit is measured in pennies.

  As a money-making asset, on-demand delivery isn't great.

  If Meituan were only delivery, I wouldn't bother watching it. But it keeps feeling like something else too. What? Looking at how AI broke down Meituan's net profit finally clicked something into place.

  Food delivery and instant retail riding on that network look wafer-thin. A soft stretch and they lose money. But the line-item profit is only part of the return. Each order carries benefits you can't fully book inside that one business.

  Order after order, people form a habit: nearby spending shows up on Meituan. So when they want something local, they search there. And every search with real intent pays Meituan in ads or a commission after the deal closes.

  Users, going by what they tap most, call it food delivery or bike share. The profit mix says that isn't the essence—because the highest-usage business isn't the biggest earner. Delivery isn't the top direct contributor; deals and lodging are.

  The extra payoff of each order on the on-demand network is Meituan's real foundation. That extra payoff is this: keeping the habit that Meituan is the door you open for local spending.

  What Meituan is actually building is the first place people go for local commerce.

  It started with group deals and spread into tickets, stays, food delivery, pharmacy, alcohol delivery, mobility, grocery, power banks—on and on. Some lines make money. Some mostly teach the brand. Lined up together in the app, they say the same thing: the fullest local catalog lives here.

  How much Meituan earns depends on how many people treat it as that first door. One person's local spending stretches across decades. The local entry that ranks first in people's minds will sit inside a huge number of future purchase decisions—and each time it shows up, it may take a cut.

  When you look at Meituan, these are the questions that matter:

  When people need something nearby, where do they search—and is Meituan the first place they decide? Holding that “first door” habit means plugging in as many local services as possible; are those new lines creating value or burning profit? And more carefully still: could discovery, decision, and checkout for local spending take a new shape?

  Food delivery itself looks settled. Another full-scale delivery war is unlikely. Delivery has already shown it can strengthen Meituan as the first local door, make money on its own, and—thanks to how expensive on-demand networks are to build and run—stand as the highest wall.

  Discovery and decision are where it gets harder.

  Douyin (ByteDance's short-video app in China) has already shown group deals can sell through short video. That won't be the main way people find and choose nearby services—but Douyin is also probing internal pages and even a standalone app to catch active search. Given how much traffic it can pour in, that ambition is hard to shrug off.

  Then there's a newer threat: AI that helps you decide what to buy nearby.

  ByteDance and Alibaba both have serious AI muscle, and both have wanted local commerce for years. The leapfrog intent is barely hidden. If that use case sticks, does Meituan win the largest share on the back of everything it already has locally—or do lighter rivals break through while Meituan's own businesses tangle each other in conflicting interests?
