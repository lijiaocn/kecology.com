title: "美团能否守住本地消费的心智份额？"
description: "一边记录一边整理：美团的即时配送网络、本地消费入口心智，以及短视频和 AI 带来的挑战。"
image: /assets/img/blog/meituan-local-consumption-mindshare/cover-zh-CN.jpg

body: |
  思路还不够清晰，想到哪写到哪，乱糟糟地一边记录一边整理思路。

  内心一直对美团嘀嘀咕咕，总感觉它有独特之处，但又说不清楚独特在哪。最开始留意美团，是为了找一个腾讯之外的选择，感觉它的配送网络已经成为线下消费的基础设施，隐约有点线下的腾讯的样子。

  美团的配送网络是即时配送，运转条件苛刻。
  
  需要在 3 公里的空间中、30 分钟的时间内，凑齐足够的消费订单、商家和配送人员，形成有利可图的小网格。然后将大量小网格组成一张可以规模化运营的即时配送网络。
  而网络边界受制于人群分布，要成为全国性的品牌，还需要在每个城市里再重复这个过程。
  

  新建即时配送网络，需要大量财力、人力，以及技术能力、管理能力和宣传运营能力。如果想仿照美团成为一个拥有2000多个县级配送网络的全国性品牌，需要投入的资源或许足以买下美团。

  从重建成本来看，即时配送网络的价值非常高。

  但是重建成本高却不意味着能稳稳赚钱。从即时配送网络中提取更高利润的尝试，可能会立即导致消费订单、商家或者配送人员的供应坍塌，继而导致网络崩溃。为了维持网络的运转，需要持续投入资源保证三方的供应密度，而每一单的利润却只能以一分一厘为单位计算。

  从赚钱的角度来说，即时配送网络不是很好的资产。

  如果美团=即时配送，那么美团不值得留意。可是呢，我总感觉美团似乎不仅仅是配送网络，它似乎还是一个别的什么东西。这个东西到底是什么呢？看到 AI 给出的美团净利润构成后，有点醒悟了。

  即时配送网络上承载的外卖、闪购等业务，表面看每一单只有微薄利润，稍微一波动就会变成亏损。但表面利润只是一部分收益，每一单还有无法在各自业务内计量的额外效益。

  在一次次外卖闪购消费中，用户会逐渐形成一个认识，美团上能找到附近的各种消费。于是有本地消费需求的时候，用户会想到通过美团查询，而带有消费意愿的每一次查询，都会为美团贡献广告或成交后的佣金收益。

  用户因为自身的使用频率，把美团看作外卖、看作共享单车。净利润构成却显示这不是美团的本质，因为用户使用量最大的业务并不是最赚钱的。外卖业务直接贡献的利润不是最多的，团购住宿才是利润大头。

  即时配送网络里每一笔订单带来额外效益才是美团的根基。这个额外效益就是：维持了美团是本地消费入口的用户心智。

  美团真正在做的事情是成为用户本地消费的第一入口。

  它从团购开始，扩展了票务、住宿、外卖、买药、送酒、出行、超市、充电宝等形形色色的业务。这些形形色色的业务相辅相成，有的贡献利润，有的强化认知，当它们紧挨着呈现在用户面前的时候，传达了同一个声音：这里有最全的本地消费。

  美团能赚多少钱，取决于有多少人把它当作本地消费的第一入口。一个人的本地消费行为是持续几十年的。在人们心智中排第一的本地消费入口，会在未来海量的消费决策中发挥作用，而每一次参与都可能带来利润。

  看待美团的时候，我们需要考虑：
  
  人们有本地消费需求的时候，会到哪里搜寻，美团是不是进行消费决策的第一入口？为了保持第一入口的认识，需要接入尽可能多的本地服务，这些新的业务是在贡献价值还是在消耗利润？更需要警惕，本地消费的发现、决策和完成过程，未来会不会有新的形式？

  外卖业务已经不是问题，发生新一轮外卖大战的概率极低。外卖已经证明不仅可以增强美团作为本地消费第一入口的认识，还能够独立创造利润，并且凭借即时配送网络极高的创建和维护成本，成为最高的壁垒。

  发现和决策方面临挑战。

  抖音已经证明团购可以用短视频的方式卖出，虽然这种方式不会成为本地消费发现和决策的主流方式，但抖音也在探索用内部页面以及独立 app 承接用户的主动搜寻，考虑到它的流量加持效用，抖音的企图无法小觑。

  同时还有一个新事物：AI 辅助本地消费决策。

  拥有强大 AI 能力的字节跳动和阿里巴巴，恰好对本地消费觊觎已久，超车的意图溢于言表。如果这个场景被证明成立，美团会依靠在本地消费的丰富积累夺得占比第一的份额，还是会因为左右手互搏的利益牵扯被轻装上阵的对手颠覆？
