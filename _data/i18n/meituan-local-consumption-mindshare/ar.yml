title: "هل تحافظ «ميتوان» الصينية على مكانتها الأولى في ذهن المستهلك المحلي؟"
description: "ملاحظات مبعثرة أفكّر فيها بصوت عالٍ: شبكة التوصيل الفوري لدى ميتوان الصينية، وعادة فتحها أولًا لأي شيء قريب، وضغط الفيديو القصير والذكاء الاصطناعي."
image: /assets/img/blog/meituan-local-consumption-mindshare/cover-ar.png

body: |
  أفكاري لم تتضح بعد. أكتب ما يخطر لي كما يخطر، وأرتّب الفكرة وأنا أكتبها.

  منذ مدة وأنا أدور حول ميتوان (Meituan)، المنصة الصينية للخدمات المحلية، وفي داخلي همهمة لا تهدأ. أشعر أن فيها شيئًا مختلفًا، لكني لا أعرف أين يكمن هذا الاختلاف. بدأ اهتمامي بها حين كنت أبحث عن خيار آخر غير تينسنت (Tencent). وبدت لي شبكة التوصيل عندها كأنها صارت بنية تحتية للاستهلاك على أرض الواقع، وفيها شيء من «تينسنت الواقع الفعلي» إن صح التعبير.

  شبكة ميتوان شبكة توصيل فوري، وشروط تشغيلها قاسية.

  في دائرة قطرها ثلاثة كيلومترات تقريبًا، وخلال ثلاثين دقيقة، لا بد أن تجتمع طلبات كافية وتجار كافون وسائقو توصيل كافون، حتى تتكوّن خلية صغيرة تُدرّ ربحًا. ثم تُضمّ آلاف الخلايا الصغيرة هذه إلى بعضها لتصير شبكة توصيل فوري يمكن تشغيلها على نطاق واسع. وحدود الشبكة يرسمها توزّع السكان، فمن أراد أن يصير علامة وطنية عليه أن يكرّر العملية نفسها في كل مدينة.

  بناء شبكة توصيل فوري جديدة يحتاج مالًا كثيرًا وأيدي عاملة وقدرة تقنية وإدارية وتسويقية. ولو أراد أحدهم أن يقلّد ميتوان بأكثر من ألفي شبكة على مستوى المحافظات، فالأرجح أن ما سينفقه يكفي لشراء ميتوان نفسها.

  فإذا نظرنا إلى تكلفة إعادة البناء، فقيمة الشبكة عالية جدًا.

  لكن غلاء البناء لا يعني أن الربح مضمون. لو حاولتَ أن تعصر الشبكة لتخرج منها هامشًا أعلى، فقد ينهار العرض فجأة في أحد الأضلاع الثلاثة (الطلبات أو التجار أو السائقين) وتنهار الشبكة كلها. وللإبقاء عليها حيّة لا بد من ضخّ موارد باستمرار للحفاظ على كثافة العرض في الأضلاع الثلاثة، بينما ربح الطلب الواحد يُحسب بالقروش.

  فإذا سألنا هل هي أصل جيد لكسب المال، فالجواب أن شبكة التوصيل الفوري ليست كذلك.

  ولو كانت ميتوان مجرد توصيل لما استحقت المتابعة. لكني أحسّ أنها شيء آخر أيضًا. ما هو؟ حين رأيت تفصيل صافي أرباح ميتوان الذي أعطاني إياه الذكاء الاصطناعي، تنبّهت أخيرًا.

  طلبات الطعام والتسوق السريع وأمثالها تمرّ عبر شبكة التوصيل، وتبدو في ظاهرها بالكاد رابحة: هامش ضئيل، وأي تذبذب بسيط في الحجم يحوّله إلى خسارة. لكن هذا الربح الظاهر ليس إلا جزءًا من العائد. فكل طلب يحمل معه منفعة إضافية لا يمكن قياسها داخل النشاط نفسه.

  مع كل طلب طعام أو تسوق سريع، يتكوّن عند المستخدم انطباع تدريجي: في ميتوان أجد كل ما حولي. فإذا احتاج بعدها إلى شيء قريب، خطر له أن يبحث هناك. وكل عملية بحث وراءها نية إنفاق تُدخل على ميتوان إعلانًا، أو عمولة بعد إتمام الصفقة.

  نحن المستخدمين نصنّف التطبيق بحسب ما نستخدمه أكثر: «تطبيق توصيل الطعام»، «الدراجات المشتركة». لكن صافي الأرباح يقول إن هذا ليس جوهر ميتوان، فالنشاط الأكثر استخدامًا ليس الأكثر ربحًا. توصيل الطعام ليس أكبر مساهم مباشر في الأرباح، بل العروض الجماعية (الكوبونات) وحجوزات الإقامة هي التي تحمل الجزء الأكبر.

  ما يقوم عليه أساس ميتوان هو المنفعة الإضافية التي يجلبها كل طلب على شبكة التوصيل. وهذه المنفعة هي: أن تبقى ميتوان في ذهن المستخدم باب الاستهلاك المحلي.

  ما تفعله ميتوان حقًا هو أن تكون أول ما يفتحه الناس حين يريدون أن ينفقوا شيئًا قريبًا منهم.

  بدأت بالعروض الجماعية، ثم أضافت التذاكر والإقامة والطعام والأدوية وتوصيل المشروبات والتنقل والسوبرماركت وشواحن الباور بنك… وأنشطة أخرى كثيرة. هذه الأنشطة يكمّل بعضها بعضًا: بعضها يجلب الربح وبعضها يرسّخ الفكرة. وحين تظهر متجاورة أمام المستخدم، تقول له الشيء نفسه: هنا أوسع ما يمكن أن تجده من الاستهلاك المحلي.

  كم ستربح ميتوان؟ يتوقف ذلك على عدد الناس الذين يعدّونها بابهم الأول إلى الاستهلاك المحلي. وسلوك الإنسان الاستهلاكي المحلي يمتد عقودًا. فالباب الذي يحتل المرتبة الأولى في ذهنه سيؤدي دورًا في كمٍّ هائل من قراراته المقبلة، وكل مرة قد تعني ربحًا.

  حين ننظر إلى ميتوان، علينا أن نسأل:

  حين يريد الناس أن ينفقوا شيئًا قريبًا، أين يبحثون؟ وهل ميتوان هي الباب الأول لاتخاذ قرارهم؟ وللحفاظ على هذه المكانة لا بد من ضم أكبر عدد ممكن من الخدمات المحلية، فهل تضيف هذه الأنشطة الجديدة قيمة أم تستنزف الأرباح؟ والأهم أن نحذر من أمر آخر: هل سيتخذ اكتشاف الاستهلاك المحلي واتخاذ القرار وإتمامه شكلًا جديدًا في المستقبل؟

  أما الطعام فلم يعد مشكلة. احتمال اندلاع حرب توصيل جديدة ضعيف جدًا. فقد أثبت التوصيل أنه لا يعزز فكرة «ميتوان هي الباب الأول للاستهلاك المحلي» فحسب، بل يخلق ربحًا بنفسه أيضًا، وبفضل الكلفة الهائلة لبناء شبكة التوصيل الفوري وصيانتها صار أعلى حاجز يحمي ميتوان.

  التحدي في الاكتشاف واتخاذ القرار.

  دويين (Douyin)، النسخة الصينية من تيك توك التابعة لبايت دانس (ByteDance)، أثبتت أن العروض الجماعية يمكن بيعها عبر الفيديو القصير. صحيح أن هذه الطريقة لن تصير الأسلوب السائد في اكتشاف الاستهلاك المحلي واتخاذ القرار، لكن دويين تجرّب أيضًا أن تلتقط عمليات البحث الفعلي للمستخدمين عبر صفحات داخل تطبيقها وعبر تطبيق مستقل. ومع ما يمنحه لها حجم حركة المرور من دفعة، لا يصح الاستهانة بطموحها.

  وهناك أيضًا شيء جديد: الذكاء الاصطناعي الذي يساعد على اتخاذ قرار الاستهلاك المحلي.

  بايت دانس وعلي بابا (Alibaba)، وكلتاهما تملك قدرات ذكاء اصطناعي قوية، تطمعان في الاستهلاك المحلي منذ زمن، ونيّتهما في تجاوز ميتوان واضحة لا تحتاج إلى شرح. فإذا ثبت أن هذا السيناريو ينجح، هل ستفوز ميتوان بأكبر حصة بفضل ما راكمته في الاستهلاك المحلي؟ أم ستعطّلها مصالح متشابكة بين يد تحارب اليد الأخرى، فيطيح بها خصم خفيف الحركة؟
