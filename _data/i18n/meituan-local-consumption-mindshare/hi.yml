title: "चीन की Meituan क्या लोकल खरीदारी में 'सबसे पहले याद आने वाला ऐप' बनी रह पाएगी?"
description: "Meituan चीन का बड़ा लोकल-सर्विस ऐप है। मैं इसे सिर्फ़ फ़ूड डिलीवरी कंपनी समझता था, पर असली कमाई कहीं और निकली। डिलीवरी नेटवर्क, मुनाफ़े की बनावट, Douyin और AI पर बिखरे हुए नोट्स।"
image: "/assets/img/blog/meituan-local-consumption-mindshare/cover-hi.png"
body: |
  सोच अभी साफ़ नहीं है। जो सूझ रहा है लिखता जा रहा हूँ, लिखते-लिखते दिमाग़ भी सुलझा रहा हूँ, तो थोड़ा उलझा-उलझा लगेगा।

  Meituan मेरे दिमाग़ में काफ़ी समय से अटकी हुई है। लगता है इसमें कुछ अलग है, पर बता नहीं पाता कि अलग क्या है। सबसे पहले मैंने इस पर ध्यान तब दिया जब Tencent के अलावा कोई और विकल्प ढूँढ रहा था। Meituan का डिलीवरी नेटवर्क अब चीन में ऑफ़लाइन ख़र्च का बुनियादी ढाँचा बन चुका है, और कुछ-कुछ "ऑफ़लाइन दुनिया के Tencent" जैसा लगता है।

  यह नेटवर्क इंस्टैंट डिलीवरी का है, और इसे चलाने की शर्तें बहुत कड़ी हैं।

  3 किलोमीटर के दायरे और 30 मिनट के भीतर, इतने ऑर्डर, दुकानें और डिलीवरी वाले जुटाने पड़ते हैं कि एक छोटा-सा मुनाफ़े वाला ग्रिड बन सके। फिर ऐसे ढेरों छोटे ग्रिड जोड़कर एक ऐसा इंस्टैंट डिलीवरी नेटवर्क बनता है जो बड़े पैमाने पर चल सके। नेटवर्क की सीमा आबादी के बँटवारे से तय होती है, इसलिए पूरे देश का ब्रांड बनना है तो यही प्रक्रिया हर शहर में दोबारा दोहरानी पड़ती है।

  ऐसा नेटवर्क नए सिरे से खड़ा करने में बहुत पैसा, लोग, टेक्नोलॉजी, मैनेजमेंट की क़ाबिलियत और प्रचार-संचालन की ताक़त लगती है। अगर कोई Meituan की नक़ल करके देश भर में 2,000 से ज़्यादा ज़िला-स्तर के नेटवर्क बनाने निकले, तो जितना ख़र्च होगा उतने में शायद Meituan को ही ख़रीदा जा सकता है।

  दोबारा बनाने की लागत देखें तो इंस्टैंट डिलीवरी नेटवर्क की क़ीमत बहुत ज़्यादा है।

  लेकिन दोबारा बनाना महँगा है, इसका मतलब यह नहीं कि उससे पक्का पैसा बनता है। इस नेटवर्क से ज़्यादा मुनाफ़ा निचोड़ने की कोशिश करो, तो ऑर्डर, दुकानों या डिलीवरी वालों में से किसी की भी सप्लाई एकदम धसक सकती है, और फिर पूरा नेटवर्क बिखर सकता है। नेटवर्क चलता रखने के लिए तीनों तरफ़ की सप्लाई की घनता बनाए रखने में लगातार पैसा झोंकना पड़ता है, जबकि हर ऑर्डर पर मुनाफ़ा पाई-पाई गिनने जितना होता है।

  पैसा कमाने के नज़रिए से इंस्टैंट डिलीवरी नेटवर्क कोई बढ़िया संपत्ति नहीं है।

  अगर Meituan बस डिलीवरी होती, तो इस पर नज़र टिकाने लायक कुछ नहीं था। पर मुझे लगता रहा कि यह सिर्फ़ डिलीवरी नेटवर्क नहीं, कुछ और भी है। तो क्या? AI ने Meituan के शुद्ध मुनाफ़े का जो ब्योरा बनाया, उसे देखकर आख़िरकार बात कुछ समझ आई।

  इस नेटवर्क पर चलने वाले फ़ूड डिलीवरी और इंस्टैंट रिटेल (闪购) जैसे काम ऊपर से देखने में हर ऑर्डर पर बहुत पतला मुनाफ़ा देते हैं, ज़रा-सा हिलने पर घाटे में चले जाते हैं। पर दिखने वाला मुनाफ़ा कमाई का सिर्फ़ एक हिस्सा है। हर ऑर्डर के साथ एक अतिरिक्त फ़ायदा भी जुड़ा होता है, जो उस कारोबार के अपने खाते में गिना ही नहीं जा सकता।

  बार-बार खाना और इंस्टैंट सामान मँगाते-मँगाते यूज़र के मन में धीरे-धीरे यह बैठ जाता है कि Meituan पर आस-पास की हर चीज़ मिल जाती है। इसलिए जब आस-पास कुछ ख़र्च करना हो, तो वह पहले Meituan पर खोजने की सोचता है। और ख़रीदने की नीयत से की गई हर खोज Meituan को विज्ञापन की कमाई देती है, या सौदा पूरा होने के बाद कमीशन।

  यूज़र अपने इस्तेमाल की बारंबारता देखकर Meituan को फ़ूड डिलीवरी ऐप या शेयर्ड साइकिल कह देते हैं। पर शुद्ध मुनाफ़े का ब्योरा बताता है कि यह इसकी असल पहचान नहीं है, क्योंकि जिस कारोबार का इस्तेमाल सबसे ज़्यादा होता है, वही सबसे ज़्यादा कमाऊ नहीं है। फ़ूड डिलीवरी सीधे सबसे ज़्यादा मुनाफ़ा नहीं देती, मुनाफ़े का बड़ा हिस्सा ग्रुप डील (团购) और ठहरने की बुकिंग से आता है।

  इंस्टैंट डिलीवरी नेटवर्क के हर ऑर्डर से मिलने वाला यही अतिरिक्त फ़ायदा Meituan की असली बुनियाद है। वह अतिरिक्त फ़ायदा है: यूज़र के मन में यह बात बनाए रखना कि लोकल ख़र्च का पहला दरवाज़ा Meituan है।

  Meituan असल में जो कर रही है, वह है लोकल ख़र्च के लिए यूज़र का पहला दरवाज़ा बनना।

  शुरुआत ग्रुप डील से हुई, फिर टिकट, ठहरने की बुकिंग, फ़ूड डिलीवरी, दवा, शराब की डिलीवरी, आना-जाना, सुपरमार्केट, किराए के पावर बैंक और तरह-तरह के कारोबार जुड़ते गए। ये कारोबार एक-दूसरे का सहारा हैं: कुछ मुनाफ़ा देते हैं, कुछ धारणा पक्की करते हैं। जब ये यूज़र के सामने एक साथ दिखते हैं, तो सबका संदेश एक ही होता है: लोकल ख़र्च की सबसे पूरी दुनिया यहीं है।

  Meituan कितना कमाएगी, यह इस पर टिका है कि कितने लोग इसे लोकल ख़र्च का पहला दरवाज़ा मानते हैं। एक इंसान का लोकल ख़र्च दशकों तक चलता है। लोगों के मन में जो दरवाज़ा नंबर एक पर बैठ गया, वह आगे के अनगिनत ख़र्च-फ़ैसलों में काम आएगा, और हर बार शामिल होने पर मुनाफ़ा बन सकता है।

  Meituan को देखते हुए ये सवाल सामने रखने होंगे:

  जब लोगों को आस-पास कुछ ख़र्च करना होता है, तो वे कहाँ खोजते हैं, और क्या Meituan वही पहला दरवाज़ा है जहाँ से फ़ैसला शुरू होता है? पहले दरवाज़े की धारणा बनाए रखने के लिए ज़्यादा से ज़्यादा लोकल सेवाएँ जोड़नी पड़ती हैं, तो क्या ये नए कारोबार क़ीमत जोड़ रहे हैं या मुनाफ़ा जला रहे हैं? और सबसे ज़्यादा चौकन्ना रहने की बात यह कि लोकल ख़र्च में खोजने, तय करने और पूरा करने का तरीक़ा आगे चलकर कोई नया रूप तो नहीं लेगा?

  फ़ूड डिलीवरी अब मसला नहीं रही। फ़ूड डिलीवरी की एक और बड़ी जंग छिड़ने की संभावना बहुत कम है। फ़ूड डिलीवरी ने साबित कर दिया है कि वह लोकल ख़र्च के पहले दरवाज़े वाली Meituan की छवि को मज़बूत करने के साथ-साथ अपने दम पर मुनाफ़ा भी बना सकती है, और इंस्टैंट डिलीवरी नेटवर्क को बनाने और चलाने की भारी लागत की वजह से यही सबसे ऊँची दीवार भी है।

  चुनौती खोजने और तय करने वाले हिस्से में है।

  Douyin (ByteDance का चीनी शॉर्ट-वीडियो ऐप) ने साबित कर दिया है कि ग्रुप डील शॉर्ट वीडियो के ज़रिए भी बिक सकती हैं। यह तरीक़ा लोकल ख़र्च को खोजने और तय करने का मुख्य रास्ता तो नहीं बनेगा, पर Douyin ऐप के भीतर के पन्नों और अलग ऐप के ज़रिए यूज़र की अपनी खोज को भी थामने की कोशिश कर रहा है। उसके पास ट्रैफ़िक का जो ज़ोर है, उसे देखते हुए Douyin के इरादे को हल्के में नहीं लिया जा सकता।

  साथ में एक नई चीज़ भी है: लोकल ख़र्च के फ़ैसलों में मदद करने वाला AI।

  AI में ज़बरदस्त ताक़त रखने वाली ByteDance और Alibaba, दोनों की नज़र बहुत पहले से लोकल ख़र्च पर है, और आगे निकलने का इरादा छिपा नहीं है। अगर यह तरीक़ा सचमुच चल निकला, तो क्या Meituan लोकल ख़र्च में अपनी जमा पूँजी के दम पर सबसे बड़ा हिस्सा हथिया लेगी, या अपने ही कारोबारों के बीच दाएँ-बाएँ हाथ की खींचतान और उलझे हुए हितों की वजह से हल्के-फुल्के प्रतिद्वंद्वी उसे पलट देंगे?
