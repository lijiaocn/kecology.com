title: "Kann Chinas Meituan der erste Griff für lokalen Konsum bleiben?"
description: "Unsortierte Notizen, laut gedacht: Meituans Netz für Sofortlieferungen, der Reflex, für alles in der Nähe zuerst diese App zu öffnen, und der Druck durch Kurzvideos und KI."
image: /assets/img/blog/meituan-local-consumption-mindshare/cover-de.jpg

body: |
  Ganz klar ist mir das alles noch nicht. Ich schreibe auf, was mir gerade einfällt, wild durcheinander, und sortiere beim Schreiben.

  Meituan, Chinas große Plattform für lokale Dienste, geht mir schon eine Weile nicht aus dem Kopf. Ich habe das Gefühl, dass da etwas Besonderes dran ist, kann aber nicht sagen, was. Aufmerksam geworden bin ich, weil ich eine Alternative zu Tencent suchte. Das Liefernetz wirkt inzwischen wie die Infrastruktur für den Konsum vor Ort in China, ein bisschen wie ein Tencent für die Offline-Welt.

  Dieses Netz ist ein Netz für Sofortlieferungen, und die Bedingungen, unter denen es läuft, sind hart.

  Im Umkreis von etwa 3 km und innerhalb von 30 Minuten müssen genug Bestellungen, Händler und Fahrer zusammenkommen, damit ein kleines Raster sich rechnet. Aus vielen solcher Raster entsteht dann ein Liefernetz, das sich skalieren lässt. Die Grenzen des Netzes setzt aber, wo die Leute wohnen. Wer landesweit eine Marke werden will, muss das Ganze also in jeder Stadt noch einmal von vorn machen.

  Ein neues Sofortliefernetz aufzubauen kostet enorm viel Geld und Personal, dazu Technik, Management, Marketing und Betrieb. Wer Meituan mit seinen über 2.000 Netzen auf Kreisebene nachbauen wollte, würde vielleicht so viel ausgeben, dass er Meituan gleich kaufen könnte.

  Gemessen an den Wiederaufbaukosten ist das Netz also extrem viel wert.

  Aber teuer im Wiederaufbau heißt nicht, dass es sicher Geld abwirft. Wer mehr Gewinn herausziehen will, riskiert, dass Bestellungen, Händler oder Fahrer plötzlich wegbrechen und das ganze Netz mitreißen. Damit es läuft, muss man laufend Geld nachschießen, um alle drei Seiten dicht genug zu halten, während jede einzelne Bestellung nur Cent-Beträge abwirft.

  Zum Geldverdienen ist ein Sofortliefernetz kein besonders gutes Asset.

  Wäre Meituan nur Lieferdienst, müsste man gar nicht hinschauen. Aber ich werde das Gefühl nicht los, dass es auch noch etwas anderes ist. Was? Als ich sah, wie eine KI Meituans Nettogewinn aufschlüsselte, fiel der Groschen.

  Essenslieferungen, Blitzeinkäufe und Ähnliches, die über dieses Netz laufen, sehen nach hauchdünner Marge aus: Pro Bestellung bleibt fast nichts hängen, und eine kleine Delle kippt alles ins Minus. Doch dieser sichtbare Gewinn ist nur ein Teil des Ertrags. Jede Bestellung bringt noch einen Zusatznutzen, den man in den einzelnen Geschäftsfeldern gar nicht verbuchen kann.

  Bestellung für Bestellung bildet sich bei den Nutzern eine Gewissheit: Auf Meituan findet man, was es in der Nähe gibt. Haben sie dann Lust, vor Ort Geld auszugeben, denken sie daran, dort nachzusehen. Und jede Suche mit Kaufabsicht bringt Meituan Werbeeinnahmen oder, nach Abschluss des Geschäfts, Provision.

  Als Nutzer sehen wir Meituan durch das, was wir am häufigsten benutzen: als Essenslieferdienst, als Leihfahrrad-App. Der Nettogewinn zeigt aber, dass das nicht ihr Wesen ist, denn das meistgenutzte Geschäft ist nicht das, das am meisten verdient. Die Essenslieferung steuert nicht den meisten Gewinn bei; den Löwenanteil bringen Gutschein-Deals und Unterkünfte.

  Was Meituan trägt, ist der Zusatznutzen, den jede Bestellung im Liefernetz abwirft. Und dieser Zusatznutzen ist: Meituan bleibt in den Köpfen der Nutzer das Eingangstor zum lokalen Konsum.

  Was Meituan wirklich tut: Es will das Erste sein, was man öffnet, wenn man in der Nähe Geld ausgeben will.

  Angefangen hat es mit Gruppen-Deals, dann kamen Tickets, Unterkünfte, Essenslieferung, Apotheke, Alkohollieferung, Mobilität, Supermarkt, Powerbanks dazu, ein Geschäftsfeld nach dem anderen. Manche bringen Gewinn, andere stärken vor allem das Bild im Kopf. Aber nebeneinander vor dem Nutzer sagen sie alle dasselbe: Hier gibt es das vollständigste Angebot für lokalen Konsum.

  Wie viel Meituan verdient, hängt davon ab, wie viele Leute es als erste Tür betrachten. Der lokale Konsum eines Menschen zieht sich über Jahrzehnte. Der Einstieg, der in den Köpfen auf Platz eins steht, wird bei einer riesigen Zahl künftiger Kaufentscheidungen mitmischen, und jedes Mal kann dabei etwas hängen bleiben.

  Wenn man auf Meituan schaut, sollte man sich fragen:

  Wo suchen Leute, wenn sie lokal etwas brauchen? Ist Meituan die erste Stelle, an der sie sich entscheiden? Um diese Rolle zu halten, muss man möglichst viele lokale Dienste andocken: Schaffen die neuen Geschäfte Wert oder fressen sie Gewinn? Und vor allem: Könnten Entdecken, Entscheiden und Abschließen beim lokalen Konsum künftig ganz anders ablaufen?

  Die Essenslieferung ist kein Problem mehr. Ein neuer großer Lieferkrieg ist sehr unwahrscheinlich. Sie hat bereits gezeigt, dass sie Meituans Rolle als erste Tür zum lokalen Konsum stärkt, selbst Gewinn erzeugt und, weil Aufbau und Pflege eines Sofortliefernetzes so teuer sind, der höchste Burggraben ist.

  Bei Entdecken und Entscheiden wird es heikel.

  Douyin (das chinesische TikTok) hat bereits bewiesen, dass sich Gruppen-Deals per Kurzvideo verkaufen lassen. Das wird nicht der Hauptweg, um lokalen Konsum zu entdecken und zu entscheiden, aber Douyin testet auch interne Seiten und sogar eine eigene App, um die aktive Suche der Nutzer aufzufangen. Bei dem Traffic, den es dafür mobilisieren kann, darf man diesen Ehrgeiz nicht unterschätzen.

  Dazu kommt etwas Neues: KI, die bei der Entscheidung für lokalen Konsum hilft.

  ByteDance und Alibaba haben starke KI und schielen schon lange auf den lokalen Konsum. Dass sie überholen wollen, ist nicht zu übersehen. Wenn sich dieses Szenario bewährt: Holt sich Meituan mit allem, was es lokal aufgebaut hat, den größten Anteil? Oder wird es von leichtfüßigeren Rivalen gestürzt, während sich die linke und die rechte Hand mit widerstreitenden Interessen gegenseitig ausbremsen?
