title: "A Meituan, gigante chinesa, vai continuar sendo o primeiro app que a gente abre para o consumo local?"
description: "Anotações bagunçadas, pensando alto: a rede de entregas imediatas da Meituan, o hábito de abri-la primeiro para qualquer coisa perto de casa e a pressão do vídeo curto e da IA."
image: /assets/img/blog/meituan-local-consumption-mindshare/cover-pt.png

body: |
  Ainda não está claro na minha cabeça. Vou anotando o que vem, tudo embolado, e organizando as ideias pelo caminho.

  Faz tempo que a Meituan, a plataforma chinesa de serviços locais, fica martelando na minha cabeça. Tenho a sensação de que ela tem algo de diferente, mas não sei dizer o quê. Comecei a prestar atenção nela porque queria uma opção fora da Tencent. A rede de entregas dela já me parece a infraestrutura do consumo presencial na China, meio que uma Tencent do mundo offline.

  Essa rede é de entrega imediata, e as condições para ela funcionar são duras.

  Num raio de uns 3 km e em 30 minutos, é preciso juntar pedidos, lojas e entregadores em quantidade suficiente para formar uma grade pequena que dê lucro. Depois, juntar um monte dessas grades numa rede de entrega que dê para operar em escala. Só que os limites da rede dependem de onde as pessoas moram, então, para virar marca nacional, é preciso repetir tudo isso em cada cidade.

  Montar uma rede de entrega imediata do zero exige muito dinheiro e muita gente, além de tecnologia, gestão e capacidade de divulgação e operação. Quem quisesse copiar a Meituan e chegar a mais de 2.000 redes em nível de condado provavelmente gastaria o bastante para comprar a própria Meituan.

  Pelo custo de reconstrução, a rede vale muito.

  Mas custar caro para refazer não quer dizer que dê dinheiro com segurança. Se você tenta extrair mais lucro dela, os pedidos, as lojas ou os entregadores podem de repente falhar, e a rede toda vai junto. Para manter a coisa de pé, é preciso continuar jogando recursos para garantir a densidade dos três lados, enquanto o lucro de cada pedido é contado em centavos.

  Como ativo para ganhar dinheiro, rede de entrega imediata não é lá grande coisa.

  Se a Meituan fosse só entrega, nem valeria a pena olhar. Mas continuo achando que ela é outra coisa também. O quê? Quando vi como uma IA decompunha o lucro líquido da Meituan, a ficha caiu.

  Delivery de comida, compras expressas e afins, que rodam nessa rede, parecem negócios de margem finíssima: cada pedido deixa quase nada, e uma pequena oscilação vira prejuízo. Só que esse lucro de superfície é apenas parte do retorno. Cada pedido traz também um ganho extra que não dá para medir dentro de cada negócio.

  Pedido após pedido, o usuário vai formando uma ideia: na Meituan dá para achar o que tem por perto. Aí, quando bate vontade de consumir algo na região, ele pensa em procurar lá. E cada busca feita com vontade de gastar rende à Meituan anúncio ou comissão quando o negócio fecha.

  A gente vê a Meituan pelo que mais usa: «o app de delivery», «a bike compartilhada». Mas o lucro líquido mostra que essa não é a essência dela, porque o negócio mais usado não é o que mais dá dinheiro. O delivery de comida não é o que mais contribui com lucro direto; o grosso vem dos cupons de grupo e das hospedagens.

  O que sustenta a Meituan é o ganho extra que cada pedido da rede de entrega traz. E esse ganho extra é este: manter, na cabeça do usuário, a Meituan como porta de entrada do consumo local.

  O que a Meituan realmente faz é ser a primeira coisa que você abre quando quer gastar perto de casa.

  Ela começou pelos cupons de grupo e foi se espalhando: ingressos, hospedagem, delivery de comida, farmácia, bebida, mobilidade, supermercado, power bank... um negócio atrás do outro. Uns dão lucro, outros servem mais para reforçar a marca, mas, enfileirados na frente do usuário, todos dizem a mesma coisa: aqui está o consumo local mais completo.

  Quanto a Meituan vai ganhar depende de quanta gente a trate como primeira porta. O consumo local de uma pessoa dura décadas. A entrada que ficar em primeiro lugar na cabeça das pessoas vai estar presente num volume enorme de decisões de compra no futuro, e cada vez que entrar em cena pode render algum lucro.

  Ao olhar para a Meituan, vale se perguntar:

  Quando alguém precisa de algo por perto, onde procura? A Meituan é o primeiro lugar onde essa decisão é tomada? Para manter esse posto, é preciso plugar o máximo de serviços locais possível: esses negócios novos estão criando valor ou queimando lucro? E, mais importante: será que descobrir, decidir e concluir um consumo local pode ganhar uma forma nova?

  O delivery de comida já não é o problema. Uma nova guerra das entregas é muito improvável. Ele já provou que não só reforça a Meituan como primeira porta do consumo local, como também gera lucro por conta própria e, pelo custo altíssimo de criar e manter uma rede de entrega imediata, é a barreira mais alta.

  O desafio está na descoberta e na decisão.

  O Douyin (o TikTok chinês) já provou que cupons de grupo dá para vender por vídeo curto. Isso não vai ser o jeito principal de descobrir e decidir consumo local, mas o Douyin também está testando páginas internas e até um app independente para pegar a busca ativa do usuário. Com o empurrão de tráfego que ele consegue dar, a ambição dele não pode ser subestimada.

  E tem outra novidade: a IA ajudando na decisão de consumo local.

  ByteDance e Alibaba, com uma IA poderosíssima, já estão de olho no consumo local há tempo, e a vontade de ultrapassar pela direita transparece. Se esse cenário se provar real, a Meituan vai levar a maior fatia apoiada em tudo o que acumulou no local, ou será derrubada por rivais mais leves enquanto a mão esquerda e a mão direita dela brigam por interesses cruzados?
