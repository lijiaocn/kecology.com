title: "Meituan của Trung Quốc có giữ được vị trí 'mở app này đầu tiên' khi người ta đi tiêu dùng quanh nhà?"
description: "Meituan, ứng dụng giao đồ ăn và dịch vụ đời sống lớn của Trung Quốc. Tưởng là công ty giao hàng, hóa ra chỗ kiếm tiền thật nằm ở chỗ khác. Ghi chép lộn xộn về mạng lưới giao hàng, cơ cấu lợi nhuận, Douyin và AI."
image: "/assets/img/blog/meituan-local-consumption-mindshare/cover-vi.jpg"
body: |
  Ý nghĩ còn chưa rõ ràng. Nghĩ đến đâu viết đến đó, vừa ghi vừa gỡ rối, nên bài này hơi lộn xộn.

  Tôi cứ lấn cấn mãi về Meituan. Có cảm giác nó khác biệt ở đâu đó, mà không nói ra được là khác chỗ nào. Hồi đầu tôi để mắt đến nó là vì đang tìm một lựa chọn ngoài Tencent. Mạng lưới giao hàng của Meituan giờ đã thành hạ tầng cho chuyện chi tiêu ngoài đời ở Trung Quốc, nhìn loáng thoáng giống một "Tencent của thế giới offline".

  Mạng lưới đó là giao hàng tức thời, và điều kiện để nó vận hành thì khắt khe vô cùng.

  Trong phạm vi 3 km, 30 phút, phải gom đủ đơn, đủ quán và đủ tài xế thì mới thành được một ô lưới nhỏ có lãi. Rồi phải ghép thật nhiều ô như thế lại mới ra một mạng lưới giao hàng tức thời chạy được ở quy mô lớn. Ranh giới của mạng lưới lại bị dân cư quyết định, nên muốn thành thương hiệu toàn quốc thì phải làm lại đúng quy trình đó ở từng thành phố.

  Dựng một mạng lưới như vậy từ đầu cần rất nhiều tiền, nhân lực, công nghệ, năng lực quản lý và cả khả năng truyền thông, vận hành. Muốn bắt chước Meituan để có hơn 2.000 mạng lưới cấp huyện trên cả nước, số vốn bỏ ra có khi đủ để mua luôn Meituan.

  Tính theo chi phí dựng lại, giá trị của mạng lưới giao hàng tức thời rất cao.

  Nhưng chi phí dựng lại cao không có nghĩa là chắc chắn kiếm được tiền. Cố vắt thêm lợi nhuận từ mạng lưới này, thì nguồn cung của đơn hàng, quán hay tài xế có thể sụp ngay, rồi kéo cả mạng lưới sập theo. Muốn nó chạy thì phải đổ tiền liên tục để giữ mật độ cung cả ba phía, trong khi lãi trên mỗi đơn chỉ tính bằng đồng lẻ.

  Xét về khả năng kiếm tiền, mạng lưới giao hàng tức thời không phải một tài sản hay ho.

  Nếu Meituan chỉ là giao hàng thì chẳng đáng để theo dõi. Nhưng tôi cứ có cảm giác nó còn là thứ gì khác. Thứ gì? Đến khi xem bảng cơ cấu lợi nhuận ròng của Meituan do AI tổng hợp, tôi mới thấy sáng ra.

  Đồ ăn giao tận nơi, bán lẻ tức thời (闪购) chạy trên mạng lưới đó, nhìn bề ngoài mỗi đơn lãi mỏng tang, chỉ cần chao đảo một chút là lỗ. Nhưng phần lãi hiện trên sổ sách mới chỉ là một phần lợi ích. Mỗi đơn còn mang theo một thứ lợi ích thêm mà không ngành nào tự đo đếm được.

  Qua từng lần đặt đồ ăn, đặt hàng tức thời, người dùng dần có một nhận thức: trên Meituan tìm được đủ thứ quanh nhà. Thế là khi có nhu cầu chi tiêu gần nhà, họ nghĩ đến chuyện tra trên Meituan, và mỗi lượt tìm kiếm có ý định mua đều mang lại cho Meituan tiền quảng cáo hoặc hoa hồng sau khi giao dịch thành công.

  Người dùng thì cứ theo tần suất mình dùng mà gọi Meituan là app giao đồ ăn, app xe đạp công cộng. Nhưng bảng lợi nhuận ròng cho thấy đó không phải bản chất, vì mảng được dùng nhiều nhất không phải mảng kiếm nhiều nhất. Giao đồ ăn không đem về lợi nhuận trực tiếp lớn nhất, phần lớn lãi đến từ ưu đãi mua chung (团购) và đặt phòng lưu trú.

  Lợi ích thêm đi kèm từng đơn trên mạng lưới giao hàng tức thời mới là gốc rễ của Meituan. Lợi ích thêm ấy là: giữ cho Meituan luôn là cánh cửa mà người ta nghĩ đến đầu tiên khi tiêu dùng quanh nhà.

  Việc Meituan thực sự đang làm là trở thành cửa ngõ số một cho tiêu dùng địa phương của người dùng.

  Nó khởi đầu từ mua chung, rồi mở rộng sang vé, lưu trú, giao đồ ăn, mua thuốc, giao rượu, di chuyển, siêu thị, sạc dự phòng và đủ thứ khác. Những mảng này bổ trợ cho nhau: có mảng đem lại lợi nhuận, có mảng củng cố nhận thức. Khi chúng nằm cạnh nhau trước mắt người dùng, chúng nói cùng một điều: ở đây có đủ dịch vụ quanh nhà nhất.

  Meituan kiếm được bao nhiêu phụ thuộc vào bao nhiêu người coi nó là cửa ngõ số một của chi tiêu địa phương. Chuyện tiêu dùng quanh nhà của một người kéo dài hàng chục năm. Cửa ngõ đứng đầu trong tâm trí sẽ có mặt trong vô số quyết định chi tiêu sau này, và lần nào góp mặt cũng có thể sinh lời.

  Khi nhìn Meituan, cần đặt ra mấy câu hỏi.

  Khi có nhu cầu chi tiêu gần nhà, người ta sẽ tìm ở đâu, và Meituan có phải cánh cửa đầu tiên họ bước vào để quyết định không? Để giữ vị trí đó thì phải cắm vào càng nhiều dịch vụ địa phương càng tốt; những mảng mới ấy đang tạo ra giá trị hay chỉ đốt tiền? Và đáng cảnh giác hơn cả: cách người ta khám phá, quyết định và hoàn tất chi tiêu địa phương, sau này liệu có hình thức mới nào không?

  Mảng giao đồ ăn thì không còn là vấn đề. Khả năng bùng lên một cuộc đại chiến giao đồ ăn nữa là rất thấp. Giao đồ ăn đã chứng minh nó không chỉ củng cố nhận thức Meituan là cửa ngõ số một cho tiêu dùng địa phương, mà còn tự tạo ra lợi nhuận, và nhờ chi phí xây dựng, duy trì mạng lưới giao hàng tức thời quá cao nên nó chính là bức tường thành cao nhất.

  Thử thách nằm ở khâu khám phá và quyết định.

  Douyin (TikTok bản Trung Quốc của ByteDance) đã chứng minh mua chung có thể bán qua video ngắn. Cách này sẽ không thành lối chính để người ta tìm và chọn dịch vụ quanh nhà, nhưng Douyin còn đang thử đón nhu cầu tìm kiếm chủ động bằng các trang trong app và cả một app riêng. Tính đến sức nặng lượng truy cập nó có thể đổ vào, tham vọng của Douyin không thể xem thường.

  Lại còn một thứ mới nữa: AI hỗ trợ quyết định chi tiêu địa phương.

  ByteDance và Alibaba, hai bên đều có sức mạnh AI lớn, và đều thèm khát mảng tiêu dùng địa phương từ lâu, ý định vượt mặt lộ rõ. Nếu kịch bản này được chứng minh là chạy được, Meituan sẽ dựa vào vốn liếng tích lũy ở mảng tiêu dùng địa phương để giữ phần lớn nhất, hay sẽ bị đối thủ gọn nhẹ lật đổ vì các mảng của chính mình vướng vào nhau, tay trái đấu tay phải, lợi ích chằng chéo?
