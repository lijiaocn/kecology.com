title: "美團能否守住本地消費的心智份額？"
description: "一邊記錄一邊整理：美團的即時配送網絡、本地消費入口心智，以及短視頻和 AI 帶來的挑戰。"
image: /assets/img/blog/meituan-local-consumption-mindshare/cover-zh-TW.png

body: |
  思路還不夠清晰，想到哪寫到哪，亂糟糟地一邊記錄一邊整理思路。

  內心一直對美團嘀嘀咕咕，總感覺它有獨特之處，但又說不清楚獨特在哪。最開始留意美團，是為了找一個騰訊之外的選擇，感覺它的配送網絡已經成為線下消費的基礎設施，隱約有點線下的騰訊的樣子。

  美團的配送網絡是即時配送，運轉條件苛刻。

  需要在 3 公里的空間中、30 分鐘的時間內，湊齊足夠的消費訂單、商家和配送人員，形成有利可圖的小網格。然後將大量小網格組成一張可以規模化運營的即時配送網絡。
  而網絡邊界受制於人群分布，要成為全國性的品牌，還需要在每個城市裡再重複這個過程。

  新建即時配送網絡，需要大量財力、人力，以及技術能力、管理能力和宣傳運營能力。如果想仿照美團成為一個擁有2000多個縣級配送網絡的全國性品牌，需要投入的資源或許足以買下美團。

  從重建成本來看，即時配送網絡的價值非常高。

  但是重建成本高卻不意味著能穩穩賺錢。從即時配送網絡中提取更高利潤的嘗試，可能會立即導致消費訂單、商家或者配送人員的供應坍塌，繼而導致網絡崩潰。為了維持網絡的運轉，需要持續投入資源保證三方的供應密度，而每一單的利潤卻只能以一分一釐為單位計算。

  從賺錢的角度來說，即時配送網絡不是很好的資產。

  如果美團=即時配送，那麼美團不值得留意。可是呢，我總感覺美團似乎不僅僅是配送網絡，它似乎還是一個別的什麼東西。這個東西到底是什麼呢？看到 AI 給出的美團淨利潤構成後，有點醒悟了。

  即時配送網絡上承載的外賣、閃購等業務，表面看每一單只有微薄利潤，稍微一波動就會變成虧損。但表面利潤只是一部分收益，每一單還有無法在各自業務內計量的額外效益。

  在一次次外賣閃購消費中，用戶會逐漸形成一個認識，美團上能找到附近的各種消費。於是有本地消費需求的時候，用戶會想到通過美團查詢，而帶有消費意願的每一次查詢，都會為美團貢獻廣告或成交後的佣金收益。

  用戶因為自身的使用頻率，把美團看作外賣、看作共享單車。淨利潤構成卻顯示這不是美團的本質，因為用戶使用量最大的業務並不是最賺錢的。外賣業務直接貢獻的利潤不是最多的，團購住宿才是利潤大頭。

  即時配送網絡裡每一筆訂單帶來額外效益才是美團的根基。這個額外效益就是：維持了美團是本地消費入口的用戶心智。

  美團真正在做的事情是成為用戶本地消費的第一入口。

  它從團購開始，擴展了票務、住宿、外賣、買藥、送酒、出行、超市、充電寶等形形色色的業務。這些形形色色的業務相輔相成，有的貢獻利潤，有的強化認知，當它們緊挨著呈現在用戶面前的時候，傳達了同一個聲音：這裡有最全的本地消費。

  美團能賺多少錢，取決於有多少人把它當作本地消費的第一入口。一個人的本地消費行為是持續幾十年的。在人們心智中排第一的本地消費入口，會在未來海量的消費決策中發揮作用，而每一次參與都可能帶來利潤。

  看待美團的時候，我們需要考慮：

  人們有本地消費需求的時候，會到哪裡搜尋，美團是不是進行消費決策的第一入口？為了保持第一入口的認識，需要接入盡可能多的本地服務，這些新的業務是在貢獻價值還是在消耗利潤？更需要警惕，本地消費的發現、決策和完成過程，未來會不會有新的形式？

  外賣業務已經不是問題，發生新一輪外賣大戰的機率極低。外賣已經證明不僅可以增強美團作為本地消費第一入口的認識，還能夠獨立創造利潤，並且憑藉即時配送網絡極高的創建和維護成本，成為最高的壁壘。

  發現和決策方面臨挑戰。

  抖音已經證明團購可以用短視頻的方式賣出，雖然這種方式不會成為本地消費發現和決策的主流方式，但抖音也在探索用內部頁面以及獨立 app 承接用戶的主動搜尋，考慮到它的流量加持效用，抖音的企圖無法小覷。

  同時還有一個新事物：AI 輔助本地消費決策。

  擁有強大 AI 能力的字節跳動和阿里巴巴，恰好對本地消費覬覦已久，超車的意圖溢於言表。如果這個場景被證明成立，美團會依靠在本地消費的豐富積累奪得佔比第一的份額，還是會因為左右手互搏的利益牽扯被輕裝上陣的對手顛覆？
