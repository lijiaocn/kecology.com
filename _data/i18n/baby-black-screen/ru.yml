section_how_it_works_title: "Как работает Baby Black Screen"
section_how_it_works_p1: "Многие дети младше 3 лет сразу хватают телефон, как только видят его в руках у взрослых: нажимают, листают и смотрят видео или мультики."
section_how_it_works_p2: "Когда Baby Black Screen включён, телефон одним касанием превращается в полностью чёрный экран «ложного выключения / разряда батареи». Ребёнок берёт его, нажимает и листает, но ничего не происходит, поэтому ему быстро становится скучно, и он откладывает телефон, что мягко снижает ежедневное время у экрана."

section_features_title: "Основные возможности"
feature_fullscreen_fake_shutdown: "Одно касание — и весь экран становится чёрным, как будто телефон выключен или разряжен."
feature_brightness_control: "Простой и стабильный чёрный экран без заметных кнопок, поэтому ребёнку сложнее случайно закрыть приложение."
feature_keep_screen_on: "Подходит для временного «обмана» малышей, которые постоянно забирают телефон, помогая родителям реже давать им устройство."
feature_no_ads_simple: "Минималистичный интерфейс без рекламы и лишних функций."

section_usage_tips_title: "Важная информация по использованию"
tip_adjust_brightness: "По сути Baby Black Screen — это «чёрный экран ложного выключения». Он лучше всего работает с совсем маленькими детьми, которые ещё не могут чётко отличить настоящее выключение от фиктивного, и обычно наиболее эффективен примерно до 3 лет."
tip_turn_on_airplane_mode: "Перед использованием можно уменьшить яркость экрана и включить режим «В самолёте» или режим фокусировки, чтобы ещё больше снизить уровень света и помех."
tip_lock_orientation: "Это лишь вспомогательный инструмент и он не заменяет родительский контроль над временем и содержимым использования гаджетов. Используйте его разумно."

