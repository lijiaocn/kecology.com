# Russian (ru)

title: "Baby Black Screen: экран «ложного выключения», чтобы сократить время у экрана у малышей"
description: "Baby Black Screen — это простое приложение для iOS, которое показывает полностью чёрный экран так, будто телефон выключен. Когда маленькие дети берут ваш телефон и нажимают везде подряд, ничего не происходит — это помогает уменьшить зависимость от телефона, случайные нажатия и возможную нагрузку на глаза из‑за слишком долгого времени перед экраном."

hero_title: "Baby Black Screen – экран ложного выключения для маленьких детей"
hero_subtitle: "Когда ребёнок забирает телефон и хаотично нажимает на экран, он видит только чёрный экран, как будто устройство выключено или разряжено, поэтому быстро теряет интерес к телефону."

