# Traditional Chinese (zh-TW)

title: "哄娃黑屏：一鍵假關機，降低幼兒玩手機時間"
description: "哄娃黑屏 (Baby Black Screen) 是一款極簡的 iOS 工具，一鍵把畫面變成「沒電關機」的黑螢幕，暫時騙過總愛搶手機的幼兒，幫助家長減少小孩玩手機的時間與次數，間接降低長時間盯著螢幕帶來的視力負擔。"

hero_title: "哄娃黑屏 —— 給幼兒看的「假關機」畫面"
hero_subtitle: "全螢幕假關機黑畫面，小小孩搶到手機、亂按亂滑都沒有反應，自然而然對手機覺得無聊、不那麼著迷。"

