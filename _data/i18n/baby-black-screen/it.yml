# i18n data for baby-black-screen post
# Italian (it)

title: "Baby Black Screen: schermata di finto spegnimento per ridurre il tempo davanti allo schermo dei bambini piccoli"
description: "Baby Black Screen è una semplice app per iOS che mostra una schermata nera come se l’iPhone fosse spento. Quando i bimbi piccoli afferrano il telefono e toccano ovunque, non succede nulla: questo aiuta a ridurre la dipendenza dal dispositivo, gli utilizzi accidentali e il possibile affaticamento visivo dovuto a troppo tempo davanti allo schermo."

hero_title: "Baby Black Screen – Schermata di finto spegnimento per i più piccoli"
hero_subtitle: "Quando il bambino prende il telefono e tocca a caso sullo schermo, vede solo una schermata nera come se il dispositivo fosse spento o con la batteria scarica; così si calma e, con il tempo, perde interesse per lo smartphone."

