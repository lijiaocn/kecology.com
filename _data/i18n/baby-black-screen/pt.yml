# i18n data for baby-black-screen post
# Portuguese (pt)

title: "Baby Black Screen: Tela de desligamento falso para reduzir o tempo de tela das crianças"
description: "Baby Black Screen é um app simples para iOS que mostra uma tela preta de desligamento falso. Quando as crianças pegam o celular e tocam em todos os lugares, nada acontece — ajudando a reduzir a obsessão pelo telefone, os toques acidentais e o possível cansaço visual causado por tempo excessivo de tela."

hero_title: "Baby Black Screen – Tela de desligamento falso para crianças pequenas"
hero_subtitle: "Quando a criança pega o celular e toca em tudo, ela vê apenas uma tela preta, como se o aparelho estivesse desligado ou sem bateria, o que a ajuda a se acalmar e, com o tempo, a perder o interesse pelo dispositivo."

