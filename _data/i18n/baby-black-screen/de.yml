# German (de)

title: "Baby Black Screen: Fake-Shutdown-Bildschirm zur Verringerung der Bildschirmzeit von Kleinkindern"
description: "Baby Black Screen ist eine einfache iOS-App, die einen komplett schwarzen Bildschirm anzeigt, als wäre das iPhone ausgeschaltet. Wenn Kleinkinder das Telefon nehmen und überall tippen, passiert nichts – so lässt sich die Faszination für das Smartphone, unbeabsichtigte Bedienung und mögliche Überanstrengung der Augen durch zu viel Bildschirmzeit verringern."

hero_title: "Baby Black Screen – Fake-Shutdown-Bildschirm für kleine Kinder"
hero_subtitle: "Wenn Ihr Kind das Telefon schnappt und wild auf dem Display herumtippt, sieht es nur einen schwarzen Bildschirm, als wäre das Gerät aus oder der Akku leer – so beruhigt es sich schneller und verliert nach und nach das Interesse am Smartphone."

