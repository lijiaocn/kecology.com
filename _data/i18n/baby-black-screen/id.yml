# Indonesian (id)

title: "Baby Black Screen: Layar mati palsu untuk mengurangi waktu layar anak kecil"
description: "Baby Black Screen adalah aplikasi iOS sederhana yang menampilkan layar hitam seolah‑olah ponsel mati. Saat balita mengambil ponsel dan mengetuk di mana‑mana, tidak ada yang terjadi—membantu mengurangi ketergantungan pada ponsel, sentuhan yang tidak disengaja, dan potensi kelelahan mata karena terlalu lama menatap layar."

hero_title: "Baby Black Screen – Layar mati palsu untuk balita"
hero_subtitle: "Ketika anak mengambil ponsel dan menekan ke mana‑mana, yang mereka lihat hanya layar hitam seperti ponsel kehabisan baterai, sehingga mereka lebih cepat tenang dan perlahan kehilangan minat pada perangkat."

