# i18n data for baby-black-screen post
# French (fr)

title: "Baby Black Screen : écran noir de faux arrêt pour réduire le temps d'écran des tout-petits"
description: "Baby Black Screen est une application iOS simple qui affiche un écran noir comme si le téléphone était éteint. Quand les tout-petits prennent votre téléphone et appuient partout, rien ne se passe — ce qui aide à réduire l'obsession pour le smartphone, les utilisations accidentelles et la fatigue oculaire potentielle liée à un temps d'écran excessif."

hero_title: "Baby Black Screen – Écran de faux arrêt pour les jeunes enfants"
hero_subtitle: "Quand l'enfant attrape le téléphone et appuie partout, il ne voit qu'un écran noir comme si l'appareil était éteint ou sans batterie, ce qui l'aide à se calmer et, peu à peu, à perdre de l'intérêt pour le téléphone."

