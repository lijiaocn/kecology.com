# Arabic (ar)

title: "شاشة سوداء وهمية: قلل من وقت استخدام طفلك للهاتف بلمسة واحدة"
description: "Baby Black Screen هو تطبيق بسيط لنظام iOS يحوّل شاشتك إلى شاشة سوداء تماماً بلمسة واحدة، مما يوحي بأن الهاتف مغلق. صُمم لـ «خداع» الأطفال الصغار الذين يحاولون دائماً الاستحواذ على هاتفك، مما يساعد في تقليل تعلقهم بالجهاز وتجنب الضغط غير المقصود أو إجهاد العين."

hero_title: "Baby Black Screen — أداة «الإغلاق الوهمي» للوالدين"
hero_subtitle: "شاشة إغلاق وهمية كاملة: عندما يمسك طفلك بالهاتف ويحاول النقر في كل مكان، لن يحدث شيء. سيساعده ذلك على الهدوء وفقدان الاهتمام بالجهاز تدريجياً."

