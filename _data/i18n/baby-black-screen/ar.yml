section_download_title: "تنزيل"
download_ios_label: "iOS · App Store (Baby Black Screen)"
download_android_label: "Android · تنزيل APK v1.0"
download_note: "على Android، اسمح بالتثبيت من مصادر غير معروفة عند الطلب. على iOS، ثبّت عبر App Store."
section_how_it_works_title: "كيف يعمل تطبيق Baby Black Screen؟"
section_how_it_works_p1: "يندفع العديد من الأطفال تحت سن الثالثة للإمساك بالهاتف بمجرد رؤية شخص بالغ يستخدمه، ويبدأون في النقر والتحريك لمشاهدة الفيديوهات أو الرسوم المتحركة."
section_how_it_works_p2: "عند تفعيل التطبيق، يتحول هاتفك فوراً إلى شاشة سوداء توحي بأنه «مغلق أو نفدت بطاريته». ومهما حاول طفلك النقر أو تمرير إصبعه، لن يستجيب الجهاز. سيشعر الطفل بالملل سريعاً ويضع الهاتف جانباً، مما يقلل وقت تعرضه للشاشات يومياً بشكل لطيف وتدريجي."

section_features_title: "الميزات الرئيسية"
feature_fullscreen_fake_shutdown: "تحويل الشاشة للون الأسود بلمسة واحدة — يبدو الهاتف وكأن بطاريته نفدت أو تم إيقاف تشغيله."
feature_brightness_control: "واجهة بسيطة ومستقرة بدون أزرار ظاهرة، مما يصعب على الأطفال الخروج من التطبيق عن طريق الخطأ."
feature_keep_screen_on: "مثالي لـ «خداع» الصغار الذين يرغبون دائماً في اللعب بالهاتف، مما يساعد الوالدين على تقليل مرات استخدام الطفل للجهاز."
feature_no_ads_simple: "تصميم بسيط جداً وخالٍ من الإعلانات — لا توجد ميزات معقدة أو مشتتة للانتباه."

section_usage_tips_title: "نصائح الاستخدام (هام)"
tip_adjust_brightness: "يعتمد التطبيق بشكل أساسي على فكرة «شاشة الإغلاق الوهمي». وهو يعمل بشكل أفضل مع الأطفال الصغار جداً الذين لا يستطيعون التمييز بين الإغلاق الحقيقي والوهمي (غالباً حتى سن الثالثة)."
tip_turn_on_airplane_mode: "قبل الاستخدام، يمكنك خفض سطوع النظام أو تفعيل «وضع الطيران» أو «وضع التركيز» لتقليل الضوء والتنبيهات المزعجة."
tip_lock_orientation: "هذا التطبيق هو مجرد أداة مساعدة ولا يغني عن إشراف الوالدين على وقت ومحتوى استخدام الشاشات. يرجى استخدامه بمسؤولية."

section_support_title: "الدعم والملاحظات"
support_intro: "إذا كان لديك أي أسئلة أو اقتراحات أو أفكار لتطبيق Baby Black Screen، يسعد المطور دائماً سماع رأيك."
support_how_to_contact: "يمكنك التواصل مع المطور عبر البريد الإلكتروني lijiaocn@foxmial.com لتقديم الملاحظات أو طلبات الميزات."
support_bug_report: "عند الإبلاغ عن مشكلة، يرجى تزويدنا بطراز الـ iPhone الخاص بك، وإصدار نظام iOS، والخطوات التي أدت لظهور المشكلة لتسهيل عملية الإصلاح."

section_privacy_title: "سياسة الخصوصية"
privacy_policy_content: "يتحرم تطبيق Baby Black Screen خصوصيتك. لا يقوم هذا التطبيق بجمع أو تخزين أو نقل أي معلومات شخصية أو بيانات مستخدم."

