# i18n data for baby-black-screen post
# Vietnamese (vi)

title: "Baby Black Screen: Màn hình tắt giả để giảm thời gian dùng điện thoại của trẻ nhỏ"
description: "Baby Black Screen là một ứng dụng iOS đơn giản hiển thị màn hình đen hoàn toàn như thể điện thoại đã tắt. Khi trẻ nhỏ giật điện thoại và bấm loạn khắp nơi, sẽ không có gì xảy ra – điều này giúp giảm sự ám ảnh với điện thoại, hạn chế thao tác nhầm và giảm nguy cơ mỏi mắt do nhìn màn hình quá lâu."

hero_title: "Baby Black Screen – Màn hình tắt giả cho trẻ nhỏ"
hero_subtitle: "Khi trẻ cầm điện thoại và bấm loạn, chúng chỉ thấy một màn hình đen giống như điện thoại tắt hoặc hết pin, nhờ đó dần bình tĩnh lại và bớt hứng thú với thiết bị."

