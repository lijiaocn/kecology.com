title: "哄娃黑屏：一键假关机，减少宝宝玩手机"
description: "哄娃黑屏（Baby Black Screen）是一款极简的 iOS 黑屏应用，一键把屏幕变成“没电关机”的黑屏，骗过总爱抢手机的宝宝，减少他们玩手机的时间和频率，间接降低视力疲劳等风险。"

hero_title: "哄娃黑屏 —— 哄娃用的“关机”黑屏"
hero_subtitle: "全屏假关机黑屏，宝宝抢到手机、随便乱按也没有反应，既能安抚情绪，又能慢慢降低他们对手机的兴趣。"
