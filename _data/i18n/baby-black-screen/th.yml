screenshot_zh_caption: "อินเทอร์เฟซภาษาจีน"

section_download_title: "ดาวน์โหลด"
download_ios_label: "iOS · App Store (Baby Black Screen)"
download_android_label: "Android · ดาวน์โหลด APK v1.0"
download_note: "บน Android อาจต้องอนุญาตการติดตั้งจากแหล่งที่ไม่รู้จัก บน iOS ติดตั้งผ่าน App Store"
section_how_it_works_title: "Baby Black Screen ทำงานอย่างไร"
section_how_it_works_p1: "เด็กอายุต่ำกว่า 3 ขวบจำนวนมากมักจะรีบคว้าโทรศัพท์ทันทีที่เห็นผู้ใหญ่ใช้งาน กดและปัดไปมาเพื่อดูวิดีโอหรือการ์ตูนอยู่ตลอดเวลา"
section_how_it_works_p2: "เมื่อเปิดใช้ Baby Black Screen โทรศัพท์จะกลายเป็นหน้าจอดำสนิทแบบ “หลอกปิดเครื่อง/แบตหมด” เพียงแตะครั้งเดียว เด็ก拿เครื่องไปกดหรือปัดยังไง หน้าจอก็ไม่ตอบสนอง ทำให้รู้สึกว่าไม่มีอะไรน่าสนใจและวางโทรศัพท์ลงในที่สุด ซึ่งช่วยลดเวลาอยู่หน้าจอในแต่ละวันอย่างค่อยเป็นค่อยไป"

section_features_title: "ฟีเจอร์หลัก"
feature_fullscreen_fake_shutdown: "แตะครั้งเดียว หน้าจอกลายเป็นสีดำเต็มจอ เหมือนโทรศัพท์ปิดหรือแบตหมด"
feature_brightness_control: "หน้าจอดำเรียบง่ายและนิ่ง ไม่มีปุ่มเด่น ๆ ให้เด็กเผลอกดออกจากแอปได้ง่าย ๆ"
feature_keep_screen_on: "เหมาะสำหรับใช้ “หลอก” เด็กเล็กที่ชอบคว้าโทรศัพท์อยู่เสมอ ช่วยให้ผู้ปกครองลดความถี่ในการให้เด็กเล่นโทรศัพท์"
feature_no_ads_simple: "อินเทอร์เฟซมินิมอล ไม่มีโฆษณา และไม่มีฟีเจอร์ซับซ้อนเกินจำเป็น"

section_usage_tips_title: "คำแนะนำการใช้งาน (สำคัญ)"
tip_adjust_brightness: "โดยพื้นฐานแล้ว Baby Black Screen คือ “หน้าจอดำหลอกปิดเครื่อง” เหมาะกับเด็กเล็กที่ยัง分不清การปิดเครื่องจริงกับหน้าจอจำลอง โดยมักเห็นผลมากกว่าในช่วงอายุประมาณไม่เกิน 3 ขวบ"
tip_turn_on_airplane_mode: "ก่อนใช้งาน คุณสามารถหรี่ความสว่างหน้าจอลง และเปิดโหมดเครื่องบินหรือโหมดโฟกัส เพื่อลดแสงและการรบกวนจากการแจ้งเตือน"
tip_lock_orientation: "แอปนี้เป็นเพียงเครื่องมือเสริมเล็ก ๆ ไม่สามารถทดแทนการดูแลของผู้ปกครองต่อระยะเวลาและเนื้อหาการใช้สื่ออิเล็กทรอนิกส์ได้ กรุณาใช้งานอย่างมีวิจารณญาณ"

section_support_title: "การสนับสนุนและติดต่อ"
support_intro: "หากคุณมีคำถาม ข้อเสนอแนะ หรือพบปัญหาใด ๆ ระหว่างใช้งาน Baby Black Screen นักพัฒนายินดีรับฟังความคิดเห็นของคุณเสมอ"
support_how_to_contact: "คุณสามารถส่งอีเมลไปที่ lijiaocn@foxmial.com เพื่อขอความช่วยเหลือ ส่งข้อเสนอแนะ หรือเสนอฟีเจอร์ใหม่ ๆ"
support_bug_report: "เมื่อรายงานบัก หากเป็นไปได้ โปรดระบุรุ่น iPhone เวอร์ชัน iOS และขั้นตอนคร่าว ๆ ก่อนเกิดปัญหา เพื่อช่วยให้แก้ไขได้รวดเร็วยิ่งขึ้น"

section_privacy_title: "นโยบายความเป็นส่วนตัว"
privacy_policy_content: "Baby Black Screen เคารพความเป็นส่วนตัวของคุณ แอปนี้ไม่มีการเก็บรวบรวม จัดเก็บ หรือส่งต่อข้อมูลส่วนบุคคลหรือข้อมูลผู้ใช้ใดๆ"

