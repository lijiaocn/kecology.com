title: "Baby Black Screen: Küçük çocukların ekran süresini azaltmak için sahte kapanma ekranı"
description: "Baby Black Screen, iPhone’da tamamen siyah bir ekran göstererek telefon kapalıymış gibi görünmesini sağlayan basit bir iOS uygulamasıdır. Küçük çocuklar telefonu alıp ekrana her yere dokunduğunda hiçbir şey olmaz — bu da telefona olan takıntının, yanlışlıkla kullanımın ve aşırı ekran süresine bağlı göz yorgunluğunun azaltılmasına yardımcı olur."

