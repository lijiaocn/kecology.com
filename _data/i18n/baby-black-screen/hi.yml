section_usage_tips_title: "उपयोग संबंधी सुझाव (महत्वपूर्ण)"
tip_adjust_brightness: "Baby Black Screen मूल रूप से एक \"नकली शटडाउन काली स्क्रीन\" है। यह उन बहुत छोटे बच्चों के लिए सबसे अधिक प्रभावी है जो अभी तक असली शटडाउन और नकली स्क्रीन के बीच साफ‑साफ अंतर नहीं कर पाते — आमतौर पर लगभग 3 साल से कम उम्र तक।"
tip_turn_on_airplane_mode: "उपयोग से पहले आप सिस्टम ब्राइटनेस कम कर सकते हैं और एअरप्लेन मोड या फोकस मोड ऑन कर सकते हैं ताकि रोशनी और नोटिफिकेशन से होने वाले व्यवधान को और कम किया जा सके।"
tip_lock_orientation: "यह ऐप सिर्फ एक छोटा सहायक टूल है, और बच्चों के स्क्रीन टाइम और सामग्री के प्रबंधन में माता‑पिता की भूमिका की जगह नहीं ले सकता। कृपया इसे सोच‑समझकर और जिम्मेदारी के साथ उपयोग करें।"

