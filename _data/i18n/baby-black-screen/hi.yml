section_how_it_works_title: "Baby Black Screen कैसे काम करता है?"
section_how_it_works_p1: "अक्सर 3 साल से कम उम्र के बच्चे जैसे ही देखते हैं कि बड़े लोग फोन का इस्तेमाल कर रहे हैं, तुरंत फोन छीन लेते हैं और वीडियो या कार्टून देखने के लिए लगातार टैप और स्वाइप करते रहते हैं।"
section_how_it_works_p2: "जब Baby Black Screen चालू होता है, तो आपका फोन सिर्फ एक टैप में पूरी तरह काली \"नकली शटडाउन / बैटरी खत्म\" स्क्रीन में बदल जाता है। बच्चा फोन लेकर टैप या स्वाइप करता है, लेकिन कुछ भी नहीं होता, जिससे वह जल्दी बोर हो जाता है और फोन नीचे रख देता है, जो रोजमर्रा की स्क्रीन टाइम को धीरे‑धीरे कम करने में मदद करता है।"

section_features_title: "मुख्य विशेषताएँ"
feature_fullscreen_fake_shutdown: "सिर्फ एक टैप से पूरा स्क्रीन काला हो जाता है, जैसे फोन बंद हो या बैटरी खत्म हो।"
feature_brightness_control: "सादा और स्थिर काली स्क्रीन, जिस पर कोई चमकदार बटन नहीं होते, इसलिए बच्चे के लिए गलती से ऐप से बाहर निकलना मुश्किल हो जाता है।"
feature_keep_screen_on: "ऐसे छोटे बच्चों को अस्थायी रूप से \"धोखा\" देने के लिए उपयुक्त जो हमेशा फोन छीन लेते हैं; इससे माता‑पिता बच्चों के फोन उपयोग की आवृत्ति को कम कर सकते हैं।"
