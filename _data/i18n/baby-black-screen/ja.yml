section_download_title: "ダウンロード"
download_ios_label: "iOS · App Store（Baby Black Screen）"
download_android_label: "Android · APK v1.0 をダウンロード"
download_note: "Android では必要に応じて不明なソースからのインストールを許可してください。iOS は App Store からインストールしてください。"
section_how_it_works_title: "Baby Black Screen の仕組み"
section_how_it_works_p1: "多くの 3 歳未満の子どもは、大人がスマホを触っているのを見るとすぐに取り上げて、タップやスワイプで動画やアニメを見続けようとします。"
section_how_it_works_p2: "Baby Black Screen をオンにすると、スマホはワンタップで真っ黒な「フェイク電源オフ／バッテリー切れ」画面になります。子どもがそれを持ってタップ／スワイプしても一切反応がないため、すぐにつまらなくなり、スマホを手放しやすくなります。こうして日常の中で、少しずつ画面を見る時間を減らすことができます。"

section_features_title: "主な機能"
feature_fullscreen_fake_shutdown: "ワンタップでフルスクリーンの黒画面にし、スマホの電源が切れた・バッテリーがないように見せます。"
feature_brightness_control: "シンプルで安定した黒画面で、目立つボタンもなく、子どもが誤ってアプリを終了しにくい設計です。"
feature_keep_screen_on: "いつもスマホを奪ってしまう幼児を一時的に「だます」用途に向いており、親が子どものスマホ使用頻度を減らすのに役立ちます。"
feature_no_ads_simple: "ミニマルなデザインで広告なし、余計な機能はありません。"

section_usage_tips_title: "使用上の注意（重要）"
tip_adjust_brightness: "Baby Black Screen は本質的に「フェイク電源オフ黒画面」です。本当に電源オフかどうかをまだはっきり区別できない小さな子ども向けで、おおよそ 3 歳くらいまでの幼児に特に効果的です。"
tip_turn_on_airplane_mode: "使用前に、必要に応じてシステムの画面輝度を下げたり、機内モードや集中モードをオンにしたりして、光や通知による刺激をさらに減らすことができます。"
tip_lock_orientation: "本アプリはあくまで補助的なツールであり、子どものスクリーンタイムやコンテンツを管理する保護者の役割に取って代わるものではありません。ルールを決めて、適切な範囲でご利用ください。"

section_support_title: "サポート・お問い合わせ"
