support_how_to_contact: "サポートやフィードバック、機能の提案については、lijiaocn@foxmial.com までメールをお送りください。"
support_bug_report: "不具合を報告する際は、お使いの iPhone モデル、iOS のバージョン、不具合が発生したときの操作手順などを可能な範囲で記載していただけると、原因調査と修正がスムーズになります。"

