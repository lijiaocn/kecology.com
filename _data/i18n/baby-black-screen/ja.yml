# Japanese (ja)

title: "Baby Black Screen：子どもの画面時間を減らすためのフェイク電源オフ画面"
description: "Baby Black Screen は、iPhone に電源オフのように見える真っ黒な画面を表示するシンプルなアプリです。幼い子どもがスマホを奪ってあちこちタップしても何も起こらないため、スマホへの執着や誤操作、長時間画面を見ることによる目の疲れをやわらげるのに役立ちます。"

hero_title: "Baby Black Screen – 幼児向けフェイク電源オフ画面"
hero_subtitle: "子どもがスマホを奪って適当にタップしても、電源が切れた・バッテリー切れのような真っ黒な画面しか表示されないので、次第に飽きてスマホから離れてくれます。"

