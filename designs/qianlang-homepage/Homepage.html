<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="design_doc_mode" content="canvas" />
  <title>前浪求知 · 公司首页三个方向</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body, #root { margin: 0; height: 100%; background: #f0eee9; }
    button, input, textarea { font-family: inherit; }

    .board, .board * { box-sizing: border-box; }
    .board a { color: inherit; text-decoration: none; }
    .board { overflow: hidden; }

    /* ——— A 登记册 ——— */
    .reg {
      width: 1280px; height: 1360px;
      background: #f3f0e8; color: #1b1916;
      font-family: "Noto Sans SC", "Songti SC", sans-serif;
      display: flex; flex-direction: column;
      border-top: 4px solid #1b1916;
    }
    .reg-head, .reg-hero, .reg-biz, .reg-tools, .reg-foot { padding-left: 72px; padding-right: 72px; }
    .reg-head {
      height: 68px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #d5cfc3;
    }
    .reg-brand { font-family: "Noto Serif SC", serif; font-weight: 600; font-size: 16px; letter-spacing: 0.08em; }
    .reg-nav { display: flex; gap: 28px; font-size: 14px; color: #5e584f; }
    .reg-nav a:hover { color: #1b1916; }
    .reg-hero { padding-top: 52px; padding-bottom: 36px; }
    .reg-kicker { margin: 0 0 18px; font-size: 12px; letter-spacing: 0.18em; color: #6e675d; }
    .reg h1 {
      margin: 0; font-family: "Noto Serif SC", serif; font-weight: 600;
      font-size: 44px; line-height: 1.25; letter-spacing: 0.02em;
    }
    .reg-en { margin: 14px 0 0; font-family: "Noto Serif SC", serif; font-size: 16px; font-weight: 500; color: #5e584f; }
    .reg-lede { margin: 26px 0 0; max-width: 36em; font-size: 16px; line-height: 1.7; color: #3a362f; }
    .reg-label {
      margin: 0 0 4px; font-size: 12px; letter-spacing: 0.16em; color: #6e675d;
    }
    .reg-row {
      display: grid; grid-template-columns: 64px 1fr 88px; gap: 12px;
      align-items: baseline; padding: 22px 0; border-top: 1px solid #d5cfc3;
    }
    .reg-row:last-child { border-bottom: 1px solid #d5cfc3; }
    .reg-no { font-family: "Noto Serif SC", serif; font-size: 22px; font-weight: 600; color: #8a8378; }
    .reg-name { font-size: 18px; font-weight: 600; }
    .reg-desc { margin: 6px 0 0; font-size: 14px; line-height: 1.6; color: #5e584f; }
    .reg-status { font-size: 13px; text-align: right; letter-spacing: 0.06em; }
    .reg-status.is-live { color: #1b1916; font-weight: 600; }
    .reg-status.is-hold { color: #8a8378; }
    .reg-tools { padding-top: 36px; flex: 1; }
    .reg-table { width: 100%; border-collapse: collapse; }
    .reg-table th {
      text-align: left; font-weight: 500; font-size: 12px; letter-spacing: 0.12em;
      color: #6e675d; padding: 0 12px 10px 0; border-bottom: 1px solid #1b1916;
    }
    .reg-table th:last-child { text-align: right; }
    .reg-table td {
      padding: 15px 16px 15px 0; border-bottom: 1px solid #e4dfd4;
      font-size: 15px; vertical-align: baseline;
    }
    .reg-table tr:hover td { background: #ebe6dc; }
    .reg-table .cat { color: #6e675d; width: 72px; font-size: 13px; }
    .reg-table .path {
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: #6e675d;
      text-align: right; width: 280px;
    }
    .reg-table a.tname:hover { text-decoration: underline; text-underline-offset: 3px; }
    .reg-foot {
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid #d5cfc3; font-size: 13px; color: #6e675d;
    }

    /* ——— B 公司主页 ——— */
    .prd {
      width: 1280px; height: 820px;
      background: #f7f4ee; color: #1c2430;
      font-family: "Noto Sans SC", sans-serif;
      display: flex; flex-direction: column;
      border-top: 3px solid #1b3a4b;
    }
    .prd-head {
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; border-bottom: 1px solid #e4ddd2;
    }
    .prd-brand { font-family: "Noto Serif SC", serif; font-weight: 600; font-size: 16px; letter-spacing: 0.08em; }
    .prd-nav { display: flex; gap: 28px; font-size: 14px; color: #5e6670; }
    .prd-nav a:hover { color: #1c2430; }
    .prd-top {
      padding: 40px 48px 32px;
      display: grid; grid-template-columns: 1.35fr 0.75fr; gap: 40px;
      align-items: end;
      border-bottom: 1px solid #e4ddd2;
    }
    .prd h1 {
      margin: 0; font-family: "Noto Serif SC", serif; font-weight: 600;
      font-size: 36px; line-height: 1.35; letter-spacing: 0.03em; color: #1c2430;
    }
    .prd-en { margin: 12px 0 0; font-family: "Noto Serif SC", serif; font-size: 15px; color: #5e6670; }
    .prd-catalog { border-left: 1px solid #e4ddd2; padding-left: 32px; }
    .prd-label { margin: 0; font-size: 12px; letter-spacing: 0.18em; color: #6b7280; }
    .prd-catalog-name {
      margin: 10px 0 0; font-family: "Noto Serif SC", serif; font-weight: 600;
      font-size: 28px; letter-spacing: 0.06em; color: #1b3a4b;
    }
    .prd-note { margin: 10px 0 0; font-size: 14px; line-height: 1.7; color: #5e6670; }
    .prd-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid #e4ddd2;
    }
    .prd-cell {
      padding: 22px 22px 18px; border-right: 1px solid #e4ddd2; border-bottom: 1px solid #e4ddd2;
      display: flex; flex-direction: column; background: #f7f4ee; min-height: 168px;
    }
    .prd-cell:nth-child(4n) { border-right: none; }
    .prd-cell:nth-child(n + 5) { border-bottom: none; }
    .prd-cell:hover { background: #fff; }
    .prd-cat { margin: 0; font-size: 12px; letter-spacing: 0.14em; color: #8a8378; }
    .prd-cell h2 { margin: 12px 0 0; font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
    .prd-cell p { margin: 8px 0 0; font-size: 13px; line-height: 1.65; color: #5c564c; }
    .prd-path {
      margin-top: auto; padding-top: 14px;
      font-family: "IBM Plex Mono", monospace; font-size: 12px; color: #1c2430;
    }
    .prd-cell:hover .prd-path { text-decoration: underline; text-underline-offset: 3px; }
    .prd-foot {
      height: 52px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; font-size: 13px; color: #6b7280;
    }
    .prd-foot nav { display: flex; gap: 22px; }
    .prd-foot a:hover { color: #1c2430; }

    /* ——— C 目录页 ——— */
    .idx {
      width: 1280px; height: 1220px;
      background: #f7f4ee; color: #1a1612;
      font-family: "Noto Serif SC", serif;
      display: flex; flex-direction: column;
      padding: 56px 88px 40px;
    }
    .idx-kicker { margin: 0; font-family: "Noto Sans SC", sans-serif; font-size: 12px; letter-spacing: 0.2em; color: #7a7368; }
    .idx h1 {
      margin: 22px 0 0; font-weight: 600; font-size: 56px; line-height: 1.2; letter-spacing: 0.03em;
    }
    .idx-en { margin: 12px 0 0; font-size: 16px; font-weight: 500; color: #5e584f; }
    .idx-rule { width: 36px; height: 3px; background: #8e2a24; margin: 28px 0 8px; border: 0; }
    .idx-lede { margin: 18px 0 8px; font-family: "Noto Sans SC", sans-serif; font-size: 15px; line-height: 1.7; color: #3c3832; max-width: 36em; }
    .idx-block { margin-top: 28px; }
    .idx-h {
      margin: 0; font-family: "Noto Sans SC", sans-serif; font-size: 12px; font-weight: 500;
      letter-spacing: 0.18em; color: #7a7368;
    }
    .idx-line {
      display: flex; align-items: baseline; gap: 16px;
      padding: 14px 0 12px; border-bottom: 1px solid #e4ddd2;
      font-size: 20px;
    }
    .idx-line .n { font-variant-numeric: tabular-nums; width: 36px; color: #8e2a24; font-size: 15px; font-family: "Noto Sans SC", sans-serif; }
    .idx-line .hold { margin-left: auto; font-family: "Noto Sans SC", sans-serif; font-size: 13px; color: #8a8378; letter-spacing: 0.08em; }
    .idx-line .live { margin-left: auto; font-family: "Noto Sans SC", sans-serif; font-size: 13px; letter-spacing: 0.08em; }
    .idx-sub {
      margin: 22px 0 0; font-family: "Noto Sans SC", sans-serif; font-size: 12px;
      letter-spacing: 0.16em; color: #7a7368;
    }
    .idx-tool {
      display: flex; align-items: baseline; gap: 12px;
      padding: 11px 0 10px; border-bottom: 1px solid #ece6dc;
      font-family: "Noto Sans SC", sans-serif; font-size: 15px;
    }
    .idx-tool .nm { flex: 0 0 auto; }
    .idx-tool .dots { flex: 1; border-bottom: 1px dotted #c8c0b4; transform: translateY(-4px); }
    .idx-tool .path { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: #6e675d; }
    .idx-tool:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
    .idx-tool:hover .path { color: #1a1612; }
    .idx-foot {
      margin-top: auto; padding-top: 28px;
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: "Noto Sans SC", sans-serif; font-size: 13px; color: #7a7368;
    }
    .idx-foot nav { display: flex; gap: 22px; }
    .idx-foot a:hover { color: #1a1612; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="boards.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
